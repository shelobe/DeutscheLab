<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Things We Keep — Jewelry Box 3D</title><style>body{margin:0;background:#17120f;color:#f2dfc5;font:16px system-ui}header,footer{padding:16px;background:#261c17}h1{font:30px Georgia;margin:0 0 6px}#scene{height:65vh;min-height:340px;touch-action:none;position:relative}button{background:#916c3d;color:white;border:1px solid #cda970;border-radius:9px;padding:13px;margin:4px;font-weight:bold}#status{display:inline-block;padding:8px}#error{display:none;padding:18px;color:#ffdbb9;background:#60362d}small{display:block;padding:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>The Things We Keep</h1>Victorian jewelry box · 3D prototype</header><div id="error"></div><div id="scene"></div><footer><button id="lid">Open lid</button><button id="brush">Cleaning brush: Off</button><button id="reset">Reset dust</button><span id="status">Dust remaining: 100%</span></footer><small>Drag to rotate · Pinch to zoom · Turn on brush to remove dust from lid.</small><script type="module">
try{
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const host=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#17120f');const camera=new THREE.PerspectiveCamera(43,host.clientWidth/host.clientHeight,.1,100);camera.position.set(5,3.5,6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=12;
scene.add(new THREE.HemisphereLight(0xffe9cf,0x33201c,2.4));const light=new THREE.DirectionalLight(0xffd8a4,3);light.position.set(3,7,5);light.castShadow=true;scene.add(light);
const wood=new THREE.MeshStandardMaterial({color:0x63301c,roughness:.38}),gold=new THREE.MeshStandardMaterial({color:0xc39a4b,metalness:.8,roughness:.24}),dark=new THREE.MeshStandardMaterial({color:0x281711}),velvet=new THREE.MeshStandardMaterial({color:0x591f34,roughness:1});
function block(parent,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function ball(parent,r,x,y,z,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat);m.position.set(x,y,z);parent.add(m)}
function rim(parent,w,d,y){for(const z of [-d/2,d/2])block(parent,w,.05,.055,0,y,z,gold);for(const x of [-w/2,w/2])block(parent,.055,.05,d,x,y,0,gold)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x332920}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const base=new THREE.Group();scene.add(base);block(base,3.4,.85,2.3,0,.75,0,wood);block(base,3.12,.06,2.04,0,1.2,0,velvet);rim(base,3.45,2.35,.34);rim(base,3.45,2.35,1.16);
for(const x of [-1.45,1.45])for(const z of [-.91,.91]){block(base,.25,.25,.25,x,.2,z,dark);ball(base,.13,x,.1,z,gold)}
block(base,.43,.34,.08,0,.76,1.19,gold);block(base,.22,.22,.1,0,.76,1.25,dark);ball(base,.075,0,.76,1.32,gold);
const hinge=new THREE.Group();hinge.position.set(0,1.2,-1.15);base.add(hinge);block(hinge,3.5,.42,2.35,0,.21,1.15,wood);rim(hinge,3.5,2.35,.43);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.45,.06,12,60),gold);ring.rotation.x=-Math.PI/2;ring.position.set(0,.446,1.15);hinge.add(ring);for(let i=0;i<12;i++){const a=i*Math.PI/6;ball(hinge,.06,Math.cos(a)*.35,.45,1.15+Math.sin(a)*.35,gold)}
for(const x of [-1.4,1.4])for(const z of [.27,2.02])ball(hinge,.12,x,.46,z,gold);
const canvas=document.createElement('canvas');canvas.width=512;canvas.height=384;const ctx=canvas.getContext('2d',{willReadFrequently:true}),texture=new THREE.CanvasTexture(canvas);const dust=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.05),new THREE.MeshStandardMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide}));dust.rotation.x=-Math.PI/2;dust.position.set(0,.462,1.15);hinge.add(dust);
function update(){texture.needsUpdate=true;const data=ctx.getImageData(0,0,512,384).data;let dirty=0,total=0;for(let i=3;i<data.length;i+=64){total++;if(data[i]>45)dirty++}document.querySelector('#status').textContent='Dust remaining: '+Math.round(dirty/total*100)+'%'}
function reset(){ctx.clearRect(0,0,512,384);ctx.fillStyle='rgba(125,112,96,.94)';ctx.fillRect(0,0,512,384);for(let i=0;i<1900;i++){ctx.fillStyle='rgba(195,177,145,'+(Math.random()*.4)+')';ctx.beginPath();ctx.arc(Math.random()*512,Math.random()*384,Math.random()*5+1,0,7);ctx.fill()}update()}reset();
let opened=false,brush=false,down=false;document.querySelector('#lid').onclick=()=>{opened=!opened;document.querySelector('#lid').textContent=opened?'Close lid':'Open lid'};document.querySelector('#brush').onclick=()=>{brush=!brush;controls.enabled=!brush;document.querySelector('#brush').textContent='Cleaning brush: '+(brush?'On':'Off')};document.querySelector('#reset').onclick=reset;
const ray=new THREE.Raycaster(),point=new THREE.Vector2();let ticks=0;function clean(e){if(!brush||!down)return;const r=renderer.domElement.getBoundingClientRect();point.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(point,camera);const hit=ray.intersectObject(dust)[0];if(!hit?.uv)return;const x=hit.uv.x*512,y=(1-hit.uv.y)*384;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,33,0,Math.PI*2);ctx.fill();ctx.restore();texture.needsUpdate=true;if(++ticks%3===0)update()}
renderer.domElement.addEventListener('pointerdown',e=>{down=true;if(brush){renderer.domElement.setPointerCapture(e.pointerId);clean(e)}});renderer.domElement.addEventListener('pointermove',clean);renderer.domElement.addEventListener('pointerup',()=>{down=false;if(brush)update()});renderer.domElement.addEventListener('pointercancel',()=>down=false);
function frame(){requestAnimationFrame(frame);hinge.rotation.x+=((opened?-.95:0)-hinge.rotation.x)*.12;controls.update();renderer.render(scene,camera)}frame();new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(host);
}catch(e){const el=document.querySelector('#error');el.style.display='block';el.textContent='3D renderer failed: '+e.message;console.error(e)}
</script></body></html>
