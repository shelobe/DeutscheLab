<script id="dl-fritzy-home-greeting-script">
(function(){
 const imagePath='./file_00000000a03881f59dcf8afaaf442a15.png';
 function updateGreeting(){
  const hero=document.querySelector('#app .dashboard-hero');
  if(!hero)return;
  const img=hero.querySelector('img');
  if(!img)return;
  if(!img.classList.contains('dl-fritzy-greeting'))img.classList.add('dl-fritzy-greeting');
  if(img.getAttribute('src')!==imagePath)img.setAttribute('src',imagePath);
  if(img.getAttribute('alt')!=='Fritzy waving hello')img.setAttribute('alt','Fritzy waving hello');
 }
 const app=document.getElementById('app');
 if(app)new MutationObserver(updateGreeting).observe(app,{childList:true,subtree:true});
 updateGreeting();
})();
</script></body></html>
