as Rauchen ist in diesem Gebäude verboten.”: A nominalized infinitive acts as a neuter noun and is capitalized: das Rauchen, beim Kochen."],["Beim ___ höre ich Musik.",["Kochen","kochen","gekocht"],0,"In “Beim Kochen höre ich Musik.”: A nominalized infinitive acts as a neuter noun and is capitalized: das Rauchen, beim Kochen."]],"37":[["Die ___ Gäste warten draußen.",["ankommenden","angekommene","ankommen"],0,"In “Die ankommenden Gäste warten draußen.”: Present participles describe ongoing actions; past participles describe completed states. Attributive participles also take adjective endings."],["Das ___ Fenster muss repariert werden.",["zerbrochene","zerbrechende","zerbrechen"],0,"In “Das zerbrochene Fenster muss repariert werden.”: Present participles describe ongoing actions; past participles describe completed states. Attributive participles also take adjective endings."]],"38":[["Die Rechnung muss heute ___ werden.",["bezahlt","bezahlen","bezahlt sein"],0,"In “Die Rechnung muss heute bezahlt werden.”: The passive with a modal verb uses a past participle + werden at the end of the clause."],["Die Daten dürfen nicht ___ werden.",["gelöscht","löschen","gelöscht sein"],0,"In “Die Daten dürfen nicht gelöscht werden.”: The passive with a modal verb uses a past participle + werden at the end of the clause."]],"39":[["Der Kunde, ___ Anfrage wir bearbeiten, wartet.",["dessen","deren","dem"],0,"In “Der Kunde, dessen Anfrage wir bearbeiten, wartet.”: Dessen/deren mark possession in relative clauses; other relative pronouns take the case required by the relative-clause verb."],["Die Kollegin, ___ wir vertrauen, leitet das Team.",["der","die","den"],0,"In “Die Kollegin, der wir vertrauen, leitet das Team.”: Dessen/deren mark possession in relative clauses; other relative pronouns take the case required by the relative-clause verb."]],"40":[["___ die Lösung teuer ist, könnte sie sinnvoll sein.",["Obwohl","Damit","Weil"],0,"In “Obwohl die Lösung teuer ist, könnte sie sinnvoll sein.”: Obwohl introduces a contrastive subordinate clause; dennoch connects contrasting main clauses."],["Die Nachfrage steigt; ___ bleibt das Angebot begrenzt.",["dennoch","folglich","deshalb"],0,"In “Die Nachfrage steigt; dennoch bleibt das Angebot begrenzt.”: Obwohl introduces a contrastive subordinate clause; dennoch connects contrasting main clauses."]],"41":[["Der Zeuge erklärt, er ___ nichts gesehen.",["habe","hat","hätte"],0,"In “Der Zeuge erklärt, er habe nichts gesehen.”: Konjunktiv I is commonly used for reported speech: er habe and sie sei mark someone else’s statement."],["Der Bericht behauptet, die Ursache ___ unbekannt.",["sei","ist","wäre"],0,"In “Der Bericht behauptet, die Ursache sei unbekannt.”: Konjunktiv I is commonly used for reported speech: er habe and sie sei mark someone else’s statement."]],"42":[["Könnten Sie mir mitteilen, wann die Sitzung ___?",["beginnt","beginnen","beginne"],0,"In “Könnten Sie mir mitteilen, wann die Sitzung beginnt?”: Indirect questions use a subordinate clause with the finite verb at the end; modal verbs take an infinitive."],["Ich wäre Ihnen dankbar, wenn Sie mir ___ könnten.",["helfen","helft","geholfen"],0,"In “Ich wäre Ihnen dankbar, wenn Sie mir helfen könnten.”: Indirect questions use a subordinate clause with the finite verb at the end; modal verbs take an infinitive."]],"43":[["Die Kosten sind gesunken; ___ ist die Nachfrage gestiegen.",["gleichzeitig","dagegen","trotz"],0,"In “Die Kosten sind gesunken; gleichzeitig ist die Nachfrage gestiegen.”: Connectors show relationships: gleichzeitig means at the same time, dagegen contrasts, daher gives a consequence."],["Das Ergebnis ist unklar. ___ brauchen wir weitere Daten.",["Daher","Dennoch","Obwohl"],0,"In “Das Ergebnis ist unklar. Daher brauchen wir weitere Daten.”: Connectors show relationships: gleichzeitig means at the same time, dagegen contrasts, daher gives a consequence."]],"44":[["Die Brücke ___ letztes Jahr gebaut.",["wurde","wird","würde"],0,"In “Die Brücke wurde letztes Jahr gebaut.”: Past passive uses wurde + past participle. Perfect passive uses sein + past participle + worden."],["Die Dokumente sind bereits verschickt ___.",["worden","werden","geworden"],0,"In “Die Dokumente sind bereits verschickt worden.”: Past passive uses wurde + past participle. Perfect passive uses sein + past participle + worden."]],"45":[["___ er müde war, arbeitete er weiter.",["Obwohl","Damit","Weil"],0,"In “Obwohl er müde war, arbeitete er weiter.”: Obwohl means although; damit expresses purpose. Both introduce subordinate clauses."],["Sie lernt viel, ___ sie die Prüfung besteht.",["damit","obwohl","trotzdem"],0,"In “Sie lernt viel, damit sie die Prüfung besteht.”: Obwohl means although; damit expresses purpose. Both introduce subordinate clauses."]],"46":[["Die Ärztin sagt, der Patient ___ stabil.",["sei","ist","wäre"],0,"In “Die Ärztin sagt, der Patient sei stabil.”: Reported speech commonly uses Konjunktiv I, such as sei and habe."],["Er erklärte, er ___ die Unterlagen erhalten.",["habe","hat","hätte"],0,"In “Er erklärte, er habe die Unterlagen erhalten.”: Reported speech commonly uses Konjunktiv I, such as sei and habe."]],"47":[["Sie war gut vorbereitet; ___ war sie nervös.",["dennoch","deshalb","folglich"],0,"In “Sie war gut vorbereitet; dennoch war sie nervös.”: Dennoch signals contrast despite expectations; eher makes a comparative assessment."],["Im Gegensatz zu Paul ist Mia ___ zurückhaltend.",["eher","durchaus","allerdings"],0,"In “Im Gegensatz zu Paul ist Mia eher zurückhaltend.”: Dennoch signals contrast despite expectations; eher makes a comparative assessment."]]};
const shuffle=(arr)=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
fullQuestions=function(unit){
 const id=FULL_UNITS.indexOf(unit),rows=freshBank[id]||[];
 return shuffle(rows).map(([prompt,options,correct,why])=>{
  const right=options[correct],opts=shuffle(options);
  return {type:'grammar',prompt,options:opts,answer:opts.indexOf(right),why};
 });
};
const startOriginal=fullBegin;
fullBegin=function(id){
 fullSession={id,idx:0,score:0,picks:[],results:[],questions:fullQuestions(FULL_UNITS[id])};
 fullRender();
};
// The original renderer and handlers call fullQuestions on each interaction.
// Keep one stable question set per attempt, preventing reshuffles while answering.
const freshQuestions=fullQuestions;
fullQuestions=function(unit){
 if(fullSession&&fullSession.id===FULL_UNITS.indexOf(unit)&&fullSession.questions)return fullSession.questions;
 return freshQuestions(unit);
};
const originalRender=fullRender;
fullRender=function(){
 let session=fullSession;if(!session)return;
 if(session.idx>=session.questions.length){fullFinish();return}
 originalRender();
 let counter=app.querySelector('.hero p');if(counter)counter.textContent=counter.textContent.replace(/\d+\/7/,`${session.idx+1}/${session.questions.length}`);
};
const originalNext=fullNext;
fullNext=function(){if(!fullSession)return;fullSession.idx++;fullRender()};
fullMark=function(ok,answer,why){
 let session=fullSession;if(!session||session.results.length!==session.idx)return;
 session.results.push(ok);if(ok)session.score++;
 app.querySelectorAll('.unit-choice,.unit-chip').forEach(b=>b.disabled=true);
 const last=session.idx===session.questions.length-1;
 document.getElementById('fullFeedback').innerHTML=`<div class="unit-explain"><strong>${ok?'Correct':'Not quite'}</strong><p>Answer: ${safeText(answer)}</p><p>Why: ${safeText(why)}</p></div><button onclick="fullNext()">${last?'See results':'Continue'}</button>`;
};
fullFinish=function(){
 const session=fullSession;if(!session)return;
 const unit=FULL_UNITS[session.id],total=session.questions.length,passed=session.score>=Math.ceil(total*.8);
 ensureLearning();state.learning.fullScores??={};const old=state.learning.fullScores[session.id];
 state.learning.fullScores[session.id]={best:Math.max(old?.best||0,session.score),passed:passed||!!old?.passed,last:session.score,date:new Date().toISOString()};
 state.learning.fullMistakes??=[];session.results.forEach((ok,i)=>{if(!ok)state.learning.fullMistakes.push({unit:session.id,question:i,date:Date.now()})});
 state.learning.fullMistakes=state.learning.fullMistakes.slice(-250);save();
 app.innerHTML=illustratedHero('Lesson results',unit.title,'village','hund.png')+`<section class="card"><h2>${session.score}/${total} correct</h2><p>${passed?'Lesson passed.':'Review the rule and try again.'}</p><button onclick="fullStudy(${session.id})">Review lesson</button><button onclick="fullBegin(${session.id})">Try new questions</button><button class="secondary" onclick="fullMenu('${unit.level}')">All lessons</button></section>`;
 fullSession=null;
};
})();

<script>
/* Ordered progression: foundational skills precede dependent grammar. Existing lesson IDs,
   question banks, progress, and all standalone practice activities are preserved. */
const STRUCTURED_PATH={
 A1:[
 {title:'Getting started',goal:'Introduce yourself and ask simple questions.',ids:[8,9,10],context:'Meet someone new. Learn greetings, noun articles, and present-tense verbs.'},
 {title:'Build your first sentences',goal:'Make statements, questions, and negative sentences.',ids:[11,4,5],context:'Talk about what you have, want, and do.'},
 {title:'People and everyday life',goal:'Talk about family, ages, and daily routines.',ids:[1,0,6],context:'Describe your family and a typical day.'},
 {title:'Everyday conversations',goal:'Order food, make plans, and find your way.',ids:[2,3,7],context:'Use German in cafés, appointments, and around town.'}
 ],
 A2:[
 {title:'Objects and recipients',goal:'Use accusative and dative in practical sentences.',ids:[20,21,12],context:'Describe where objects are and where they go.'},
 {title:'Actions and requests',goal:'Express ability, obligation, and instructions.',ids:[13,23,16],context:'Ask for help and explain what needs doing.'},
 {title:'Tell stories and make plans',goal:'Talk about yesterday, tomorrow, and travel.',ids:[22,18,19],context:'Describe a trip and make arrangements.'},
 {title:'Describe things more precisely',goal:'Use comparisons, adjectives, and reflexive verbs.',ids:[14,17,15],context:'Compare options and describe your preferences.'}
 ],
 B1:[
 {title:'Connect your ideas',goal:'Explain reasons, conditions, and consequences.',ids:[32,27,29],context:'Go beyond short sentences and explain why.'},
 {title:'Describe people and events',goal:'Talk about experiences and tell detailed stories.',ids:[28,26,33],context:'Describe something that happened and who was involved.'},
 {title:'Express yourself clearly',goal:'Give opinions, discuss work, and make polite requests.',ids:[30,31,34],context:'Handle realistic discussions and situations.'},
 {title:'Use more complex structures',goal:'Practice cases, genitive, and infinitive clauses.',ids:[35,24,25],context:'Refine your writing and speech with longer sentences.'}
 ]
};
let curriculumSelected='A1';
function curriculumStats(level){
 let groups=STRUCTURED_PATH[level]||[],scores=state.learning?.fullScores||{};
 let all=groups.flatMap(g=>g.ids);
 return {groups,all,done:all.filter(id=>scores[id]?.passed).length,scores};
}
function curriculumNext(level){
 let st=curriculumStats(level);return st.all.find(id=>!st.scores[id]?.passed)??st.all[st.all.length-1];
}
function curriculumView(level){
 ensureLearning();curriculumSelected=STRUCTURED_PATH[level]?level:'A1';
 const st=curriculumStats(curriculumSelected);
 const firstUnfinished=st.groups.findIndex(g=>g.ids.some(id=>!st.scores[id]?.passed));
 const openIndex=firstUnfinished<0?st.groups.length-1:firstUnfinished;
 const next=curriculumNext(curriculumSelected);
 const total=st.all.length;
 app.innerHTML=`
 <section class="curriculum-summary curriculum-path-summary">
  <div class="curriculum-pill">YOUR LEARNING PATH</div>
  <h2>${curriculumSelected} · ${curriculumSelected==='A1'?'Beginner':curriculumSelected==='A2'?'Elementary':'Intermediate'}</h2>
  <p>Choose a level, then work through the numbered lessons in each module.</p>
  <div class="curriculum-levels">${['A1','A2','B1'].map(l=>`<button class="${l===curriculumSelected?'':'secondary'}" onclick="curriculumView('${l}')" aria-pressed="${l===curriculumSelected}">${l}</button>`).join('')}</div>
  <p><strong>${st.done} of ${total} lessons completed</strong></p>
  <div class="unit-progress" role="progressbar" aria-valuenow="${st.done}" aria-valuemin="0" aria-valuemax="${total}"><div style="width:${total?Math.round(st.done/total*100):0}%"></div></div>
  <button onclick="curriculumLesson(${next})">${st.done===total?'Review lessons':'Continue: '+safeText(FULL_UNITS[next]?.title||'next lesson')}</button>
 </section>
 <div class="curriculum-path-label">MODULES &amp; LESSONS</div>
 ${st.groups.map((g,n)=>{
  const done=g.ids.filter(id=>st.scores[id]?.passed).length;
  const complete=done===g.ids.length;
  return `<details class="curriculum-module curriculum-path-module" ${n===openIndex?'open':''}>
   <summary><div class="curriculum-module-heading"><span class="curriculum-module-number">${n+1}</span><div><div class="curriculum-pill">MODULE ${n+1} · ${done}/${g.ids.length} LESSONS</div><h3>${safeText(g.title)}</h3><p>${safeText(g.goal)}</p></div></div><span class="curriculum-chevron" aria-hidden="true">${complete?'✓':'⌄'}</span></summary>
   <div class="curriculum-module-content">
   ${g.ids.map((id,j)=>{const passed=!!st.scores[id]?.passed;const isNext=id===next&&!passed;return `<div class="curriculum-lesson curriculum-path-lesson ${isNext?'curriculum-next-lesson':''}"><div class="curriculum-lesson-number" aria-label="Lesson ${j+1}">${j+1}</div><div class="text"><strong>Lesson ${j+1} · ${safeText(FULL_UNITS[id].title)}</strong><small>${passed?'✓ Completed':isNext?'Up next':'Not completed'}</small></div><button class="${passed?'secondary':''}" onclick="curriculumLesson(${id})">${passed?'Review':'Start'}</button></div>`}).join('')}
   <div class="curriculum-check"><strong>Module ${n+1} review</strong><p>Practice material from this module.</p><button class="secondary" onclick="curriculumReview('${curriculumSelected}',${n})">Practice module</button></div>
   </div>
  </details>`}).join('')}
 <section class="card"><p>Modules organize related lessons. Complete the lessons in order, then use the module review to reinforce what you've learned.</p><button class="secondary" onclick="home()">Home</button></section>`;
 window.scrollTo(0,0);
}
function curriculumModuleIntro(level,n){
 let g=STRUCTURED_PATH[level]?.[n];if(!g)return;
 app.innerHTML=illustratedHero(g.title,level+' · Module '+(n+1),'village','hund.png')+
 `<section class="card"><h2>What you'll learn</h2><p>${safeText(g.context)}</p><h3>Your goal</h3><p>${safeText(g.goal)}</p><h3>Lessons in this module</h3>
 <ol>${g.ids.map(id=>`<li>${safeText(FULL_UNITS[id].title)}</li>`).join('')}</ol>
 <button onclick="curriculumLesson(${g.ids[0]})">Start first lesson</button><button class="secondary" onclick="curriculumView('${level}')">Back</button></section>`;
 window.scrollTo(0,0);
}
function curriculumLesson(id){
 const level=FULL_UNITS[id]?.level;
 if(!level)return;
 curriculumSelected=level;
 fullStudy(id);
}
let moduleSession=null;
function curriculumReview(level,n){
 let g=STRUCTURED_PATH[level]?.[n];if(!g)return;
 let questions=[];
 g.ids.forEach(id=>{
  let q=fullQuestions(FULL_UNITS[id]).filter(x=>x.options&&x.type!=='listen');
  q.slice(0,3).forEach(x=>questions.push({...x,unitId:id}));
 });
 for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}
 moduleSession={level,n,questions:questions.slice(0,9),idx:0,score:0};

<script>
/* Small synthesized feedback tones. No audio files or network connection required. */
let feedbackAudioContext;
function feedbackEnabled(){return localStorage.getItem('deutschlab-feedback-sounds')!=='off'}
function feedbackSound(correct){
 if(!feedbackEnabled())return;
 try{
  const AudioContextType=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextType)return;
  feedbackAudioContext??=new AudioContextType();
  if(feedbackAudioContext.state==='suspended')feedbackAudioContext.resume();
  const now=feedbackAudioContext.currentTime+.015;
  const notes=correct?[[523.25,0,.11],[659.25,.115,.11],[783.99,.23,.19]]:[[330,0,.13],[261.63,.15,.22]];
  notes.forEach(([freq,delay,duration])=>{
   let osc=feedbackAudioContext.createOscillator(),gain=feedbackAudioContext.createGain();
   osc.type=correct?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+delay);
   gain.gain.setValueAtTime(.0001,now+delay);
   gain.gain.exponentialRampToValueAtTime(correct?.12:.075,now+delay+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
   osc.connect(gain);gain.connect(feedbackAudioContext.destination);
   osc.start(now+delay);osc.stop(now+delay+duration+.02);
  });
 }catch(e){/* Silent fallback if audio is unavailable. */}
}

<script>
/* Session recovery: preserve the actual rendered activity, question and in-progress answers.
   Progress data remains in the existing deutschlab localStorage record. */
(function(){
 const KEY='deutschlab-active-screen-v2';
 const screen=document.getElementById('app');
 if(!screen)return;
 let restoring=false,savePending=false;
 function store(){
  if(restoring)return;
  try{
   const inputs=[...screen.querySelectorAll('input,textarea,select')].map((el,i)=>({i,value:el.type==='password'?'':el.value,checked:el.checked}));
   const session={version:2,html:screen.innerHTML,inputs,
    full:typeof fullSession!=='undefined'?fullSession:null,
    picture:typeof pictureSession!=='undefined'?pictureSession:null,
    game:typeof gameSession!=='undefined'?gameSession:null,
    module:typeof moduleSession!=='undefined'?moduleSession:null,
    dlSelected:typeof dlSelected!=='undefined'?dlSelected:null,
    dlAnswered:typeof dlAnswered!=='undefined'?dlAnswered:false,
    curriculum:typeof curriculumSelected!=='undefined'?curriculumSelected:'A1',
    scrollY:window.scrollY,updated:Date.now()};
   localStorage.setItem(KEY,JSON.stringify(session));
  }catch(e){console.warn('Session save unavailable',e)}
 }
 function schedule(){if(restoring||savePending)return;savePending=true;setTimeout(()=>{savePending=false;store()},40)}
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&saved.version===2&&typeof saved.html==='string'&&saved.html.length>20){
   restoring=true;
   if(typeof fullSession!=='undefined')fullSession=saved.full;
   if(typeof pictureSession!=='undefined')pictureSession=saved.picture;
   if(typeof gameSession!=='undefined')gameSession=saved.game;
   if(typeof moduleSession!=='undefined')moduleSession=saved.module;
   if(typeof dlSelected!=='undefined')dlSelected=saved.dlSelected;
   if(typeof dlAnswered!=='undefined')dlAnswered=saved.dlAnswered;
   if(typeof curriculumSelected!=='undefined')curriculumSelected=saved.curriculum;
   screen.innerHTML=saved.html;
   (saved.inputs||[]).forEach(({i,value,checked})=>{let el=screen.querySelectorAll('input,textarea,select')[i];if(el){if(el.type!=='password')el.value=value;el.checked=checked}});
   // Update the back button for the recovered activity, where supported.
   if(typeof navSync==='function')try{navSync()}catch(e){}
   requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,saved.scrollY||0)));
   restoring=false;
   const aiField=document.getElementById('aiKey');if(aiField)aiField.value=savedAIKey();
  }
 }catch(e){restoring=false;console.warn('Session restore unavailable',e)}
 new MutationObserver(schedule).observe(screen,{childList:true,subtree:true,attributes:true,characterData:true});
 document.addEventListener('click',e=>{if(screen.contains(e.target))setTimeout(store,80)},true);
 document.addEventListener('input',e=>{if(screen.contains(e.target))schedule()},true);
 document.addEventListener('change',e=>{if(screen.contains(e.target))schedule()},true);
 window.addEventListener('pagehide',store);
 window.addEventListener('scroll',()=>{if(!savePending)schedule()},{passive:true});
 if(!localStorage.getItem(KEY))store();
})();
</script>

<script>
/* Minimum six varied questions in each guided lesson; keep original bank and progress. */
(function(){
 const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
 const previousQuestions=fullQuestions;
 const focused={
  8:[
   ['Wie ___ du?',['heißt','heiße','heißen'],0,'With du, heißen becomes heißt.'],
   ['Ich ___ Lena.',['heiße','heißt','heißen'],0,'With ich, heißen becomes heiße.'],
   ['___ Morgen!',['Guten','Gute','Gutes'],0,'The standard morning greeting is Guten Morgen.'],
   ['Wie geht ___ dir?',['es','du','ich'],0,'The expression is Wie geht es dir? (How are you?)'],
   ['Ich ___ aus Deutschland.',['komme','kommt','kommen'],0,'With ich, kommen becomes komme.'],
   ['Which phrase means “Goodbye”?',['Auf Wiedersehen','Guten Morgen','Bitte'],0,'Auf Wiedersehen means goodbye.']
  ],
  9:[
   ['___ Buch liegt auf dem Tisch.',['Das','Der','Die'],0,'Buch is neuter: das Buch.'],
   ['___ Lampe ist hell.',['Die','Das','Der'],0,'Lampe is feminine: die Lampe.'],
   ['___ Tisch ist groß.',['Der','Die','Das'],0,'Tisch is masculine: der Tisch.'],
   ['___ Kind spielt.',['Das','Die','Der'],0,'Kind is neuter: das Kind.'],
   ['___ Katze schläft.',['Die','Der','Das'],0,'Katze is feminine: die Katze.'],
   ['___ Hund bellt.',['Der','Das','Die'],0,'Hund is masculine: der Hund.'],
   ['Which article is used with most plural nouns in the nominative?',['die','der','das'],0,'The nominative plural definite article is die, regardless of singular gender.']
  ]
 };
 function toQuestion(row){const [prompt,options,answer,why]=row;const correct=options[answer];const shuffled=shuffle(options);return {type:'grammar',prompt,options:shuffled,answer:shuffled.indexOf(correct),why};}
 fullQuestions=function(unit){
  const original=previousQuestions(unit),id=FULL_UNITS.indexOf(unit);
  if(fullSession?.id===id&&fullSession.questions)return fullSession.questions;
  const result=[...original],seen=new Set(result.map(q=>q.prompt));
  const extras=focused[id]||[];
  for(const row of shuffle(extras)){if(!seen.has(row[0])){result.push(toQuestion(row));seen.add(row[0]);}}
  if(result.length<6){
   const examples=unit.examples||[];
   for(let i=0;i<examples.length&&result.length<6;i++){
    const [de,en]=examples[i];
    const alternatives=examples.filter((_,j)=>j!==i).map(x=>x[1]);
    if(alternatives.length<2)continue;
    const prompt='What does “'+de+'” mean?';
    if(!seen.has(prompt)){
     result.push(toQuestion([prompt,[en,...alternatives.slice(0,2)],0,'“'+de+'” means “'+en+'”.']));seen.add(prompt);
    }
   }
   if(result.length<6&&examples.length>=3){
    for(let i=0;i<examples.length&&result.length<6;i++){
     const [de,en]=examples[i],prompt='Choose the German for “'+en+'”.';
     if(seen.has(prompt))continue;
     result.push(toQuestion([prompt,[de,...examples.filter((_,j)=>j!==i).map(x=>x[0]).slice(0,2)],0,'The German expression is “'+de+'”.']));seen.add(prompt);
    }
   }
  }
  return shuffle(result);
 };
 FULL_UNITS[9].rule='German nouns have three grammatical genders: der (masculine), die (feminine), and das (neuter). Learn each noun together with its article. In the nominative plural, the definite article is die.';

 review=function(){

<script>
/* Feedback de-duplication: explanations must teach, not restate translations. */
(function(){
  function current(){const s=fullSession;return s?.questions?.[s.idx]||null;}
  function clean(v){return String(v||'').replace(/[“”"'‘’]/g,'').replace(/\s+/g,' ').trim().toLowerCase().replace(/[.!?]+$/,'');}
  function isTranslationOnly(q){
    const why=clean(q?.why),de=clean(q?.german),en=clean(q?.english);
    if(!why)return true;
    if(de&&en&&(why.includes(de)&&why.includes(en)))return true;
    if(/^the correct sentence is\b|^the correct answer is\b|^the sentence means\b|^this means\b|^.+ means .+$/i.test(why))return true;
    return false;
  }
  function explanation(q){
    if(!q)return '';
    const de=String(q.german||'');
    if(/\bnicht\b/i.test(de)){
      if(/\bkomme nicht\b/i.test(de))return 'Nicht negates the action here. In this short main clause it follows the conjugated verb komme.';
      return 'Nicht negates a verb, adjective, or phrase. Its position depends on which part of the sentence is being negated.';
    }
    return isTranslationOnly(q)?'':String(q.why||'').trim();
  }
  function updateHelp(){
    const q=current(),tip=document.getElementById('dl-tip'),btn=document.getElementById('dl-help-btn');
    if(!tip||!btn||!q)return;
    const detail=explanation(q);
    if(!detail){tip.hidden=true;btn.hidden=true;return;}
    btn.hidden=false;
    const paragraph=tip.querySelector('p');if(paragraph)paragraph.textContent=detail;
  }
  const previousRender=fullRender;
  fullRender=function(){const result=previousRender.apply(this,arguments);updateHelp();return result;};
  const previousCheck=dlCheck;
  dlCheck=function(){
    const q=current(),answer=q?.options?.[q.answer];
    const result=previousCheck.apply(this,arguments);
    if(!q||!dlAnswered)return result;
    const box=document.querySelector('#dl-result .dl-flow-feedback');
    if(!box)return result;
    const paragraphs=[...box.querySelectorAll(':scope > p')];
    // Correct choice is already highlighted above; do not repeat it.
    if(paragraphs[0]&&clean(paragraphs[0].textContent)===clean(answer))paragraphs[0].remove();
    // Translation-only 'why' is redundant; reserve explanation for actual grammar.
    if(paragraphs[1]){
      const detail=explanation(q);
      if(detail)paragraphs[1].textContent=detail;
      else paragraphs[1].remove();
    }
    const prompt=clean(q.prompt),options=(q.options||[]).map(clean);
    const hasGerman=!!q.german&&(prompt.includes(clean(q.german))||options.includes(clean(q.german)));
    const hasEnglish=!!q.english&&(prompt.includes(clean(q.english))||options.includes(clean(q.english)));
    // Only display a translation when it supplies a language missing from the exercise.
    box.querySelectorAll('.dl-a1-translation,.dl-article-translation').forEach(block=>{
      if(hasGerman&&hasEnglish){block.remove();return;}
      const lines=[...block.querySelectorAll('p')];
      for(const line of lines){
        const label=line.querySelector('strong')?.textContent?.toLowerCase()||'';
        if((hasGerman&&/german/.test(label))||(hasEnglish&&/english/.test(label)))line.remove();
      }
      if(!block.querySelector('p'))block.remove();
    });
    updateHelp();
    return result;
  };
})();
</script>
<script>
/* Guard against incomplete learning-path rendering during asynchronous initialization. */
(function(){
 const renderPath=curriculumView;
 let generation=0;
 curriculumView=function(level){
  const token=++generation;
  try{
   renderPath(level);
  }catch(error){
   console.error('Learning path rendering failed',error);
   const root=document.getElementById('app');
   if(root)root.innerHTML='<section class="card"><h2>Lessons could not load</h2><p>Please try opening the learning path again.</p><button onclick="curriculumView(&quot;A1&quot;)">Retry lessons</button></section>';
   return;
  }
  const root=document.getElementById('app');
  if(root&&!root.querySelector('.curriculum-path-module')){
   requestAnimationFrame(()=>{
    if(token!==generation)return;
    try{renderPath(level)}catch(error){console.error('Learning path retry failed',error)}
   });
  }
 };
})();

  const total=xp(),a=current(),r=ranks.filter(x=>total>=x[1]).at(-1),next=ranks.find(x=>x[1]>total),pct=next?Math.round((total-r[1])/(next[1]-r[1])*100):100;

  window.scrollTo(0,0);
 };
 window.dlChooseAvatar=function(id){const a=animals.find(x=>x.id===id);if(!a||xp()<a.min)return;profile().avatar=id;save();updateMenuAvatar();dlProfile()};
 // Add profile to the navigation without changing existing navigation handlers.
 const menu=document.getElementById('sideMenu');
 function updateMenuAvatar(){
  if(!menu)return;
  const a=current();
  const image=menu.querySelector('.dl-menu-avatar');
  if(image){image.src='avatar_'+a.id+'.webp';image.alt=a.name;}
  const name=menu.querySelector('.dl-menu-avatar-name');
  if(name)name.textContent=a.name;
 }
 if(menu){
  const heading=menu.querySelector('.menu-heading');
  if(heading && !heading.querySelector('.dl-menu-avatar')){
   const headerAvatar=document.createElement('img');
   headerAvatar.className='dl-menu-avatar';
   headerAvatar.alt='Current animal avatar';
   heading.prepend(headerAvatar);
  }

  const btn=document.createElement('button');
  btn.className='dl-menu-profile-link';
  btn.innerHTML='<span class="dl-menu-avatar-name">My profile</span><span class="dl-menu-profile-sub">Profile & rewards</span>';
  btn.onclick=function(){toggleMenu(false);dlProfile()};
  const placementButton=[...menu.querySelectorAll('button')].find(b=>b.textContent.includes('Placement test'));
  if(placementButton)menu.insertBefore(btn,placementButton);else menu.appendChild(btn);
  updateMenuAvatar();
  const previousToggle=toggleMenu;
  toggleMenu=function(open){if(open)updateMenuAvatar();return previousToggle(open)};
 }
 const oldHub=practiceHub;practiceHub=function(){oldHub();const card=app.querySelector('.card');if(card){const a=current();const b=document.createElement('button');b.className='secondary dl-profile-button';b.innerHTML=avatarSVG(a)+' My profile, ranks & rewards';b.querySelector('img').style.cssText='height:36px;width:36px;object-fit:cover;border-radius:9px;vertical-align:middle;margin-right:8px';b.onclick=dlProfile;card.appendChild(b)}};
 const oldLog=practiceLog;practiceLog=function(points){const before=xp();oldLog(points);const after=xp();if(ranks.some(r=>r[1]>before&&r[1]<=after)||animals.some(a=>a.min>before&&a.min<=after)){profile().newUnlock=true;save()}};
 // Count unique completed dialogues and record perfect attempts for badges.
 const oldStart=window.startDialogue;window.startDialogue=function(id){window.dlDialogueStarted=id;window.dlDialogueMissed=false;return oldStart(id)};
 const oldAnswer=window.answerDialogue;window.answerDialogue=function(i){const before=document.getElementById('dialogue-feedback');const old=before?.textContent||'';oldAnswer(i);const now=document.getElementById('dialogue-feedback')?.textContent||'';if(now.includes('Not quite')&&now!==old)window.dlDialogueMissed=true};
 const oldNext=window.nextDialogueStep;window.nextDialogueStep=function(){oldNext();if(app.textContent.includes('Conversation complete')&&window.dlDialogueStarted){const p=profile();p.dialogues??={};p.dialogues[window.dlDialogueStarted]=true;if(!window.dlDialogueMissed)p.perfectDialogue=true;save();window.dlDialogueStarted=null}};
})();
</script></body></html>
