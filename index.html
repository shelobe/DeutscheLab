let state=JSON.parse(localStorage.getItem('deutschlab')||'{"completed":[],"mistakes":[],"placement":null}');let app=document.getElementById('app');function save(){localStorage.setItem('deutschlab',JSON.stringify(state))}function home(){app.innerHTML=`<section class="card"><h2>Welcome back</h2><p>${state.completed.length} of ${lessons.length} lessons completed</p><div id="progress"><div id="bar" style="width:${state.completed.length/lessons.length*100}%"></div></div><p>Placement: ${state.placement===null?'Not taken':state.placement+'/5 correct'}</p><button onclick="placement()">Take placement test</button><button onclick="lessonMenu()">Start learning</button><button onclick="articleHome()">Practice noun articles</button></section>`}function placement(){runQuiz(placementQs,'Placement check',score=>{state.placement=score;save();app.innerHTML=`<div class="card"><h2>Placement result: ${score}/5</h2><p>${score<=1?'Start with greetings and everyday sentences.':score<=3?'You know some fundamentals. Try the verbs lesson and build from there.':'Strong foundation on this short check. Start with the later lessons.'}</p><p class="muted">This is a short orientation check, not a certified CEFR assessment.</p><button onclick="lessonMenu()">Choose lesson</button></div>`})}function lessonMenu(){app.innerHTML='<h2>Lessons</h2>'+lessons.map((l,i)=>`<div class="card"><h3>${i+1}. ${l.title} ${state.completed.includes(i)?'✓':''}</h3><button onclick="openLesson(${i})">Study</button></div>`).join('')}function openLesson(i){

function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}function runQuiz(qs,title,done){let n=0,score=0;function show(){if(n===qs.length){done(score);return}let q=qs[n];app.innerHTML=`<div class="card"><h2>${title}</h2><p class="muted">Question ${n+1}/${qs.length}</p><h3>${q[0]}</h3>${q[1].map((a,i)=>`<button class="secondary" onclick="answer(${i})">${a}</button>`).join('')}<div id="feedback"></div></div>`}window.answer=function(i){let q=qs[n],ok=i===q[2];if(ok)score++;else{state.mistakes.push({question:q[0],options:q[1],correct:q[2]});save()}document.querySelectorAll('.card button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct answer: '+q[1][q[2]]}</p><button onclick="nextQuestion()">Next</button>`};window.nextQuestion=function(){n++;show()};show()}function review(){if(!state.mistakes.length){app.innerHTML='<div class="card"><h2>Review</h2><p>No missed questions yet. Complete a quiz first.</p></div>';return}let unique=[...new Map(state.mistakes.map(x=>[x.question,x])).values()];runQuiz(unique.map(x=>[x.question,x.options,x.correct]),'Review missed questions',score=>{if(score===unique.length){state.mistakes=[];save()}app.innerHTML=`<div class="card"><h2>Review: ${score}/${unique.length}</h2><p>${score===unique.length?'Excellent—missed-question list cleared.':'Try again to clear the review list.'}</p><button onclick="review()">Review again</button></div>`})}let turn=0;let dialogue=[{de:'Hallo! Wie heißt du?',en:'Hello! What is your name?',answers:['Ich heiße Alex.','Ich bin Wasser.'],correct:0},{de:'Freut mich! Wie geht es dir?',en:'Nice to meet you! How are you?',answers:['Mir geht es gut, danke.','Ich heiße Kaffee.'],correct:0},{de:'Möchtest du einen Kaffee?',en:'Would you like a coffee?',answers:['Ja, gerne!','Ich bin gestern.'],correct:0}];function conversation(){turn=0;dialogueStep()}function dialogueStep(){if(turn>=dialogue.length){app.innerHTML='<div class="card"><h2>Dialogue complete!</h2><button onclick="conversation()">Replay</button></div>';return}let d=dialogue[turn];app.innerHTML=`<div class="card"><h2>Conversation practice</h2><p><strong>Partner:</strong> ${d.de} <button class="secondary" onclick="speak('${d.de}')">🔊</button></p><p class="muted">${d.en}</p>${d.answers.map((a,i)=>`<button class="secondary" onclick="dialogueAnswer(${i})">${a}</button>`).join('')}<p id="feedback"></p></div>`}function dialogueAnswer(i){let d=dialogue[turn];if(i===d.correct){turn++;dialogueStep()}else document.getElementById('feedback').textContent='Not quite. Try the other response.'}

function articleHome(){const due=articleWords.filter(articleDue).length;app.innerHTML=`<section class="card"><h2>🎨 Noun Articles · der / die / das</h2><p>Learn each noun <strong>with its article and plural</strong>, not by itself.</p><p class="muted">${articleWords.length} nouns · ${due} due for review · ${articleState.attempts?Math.round(articleState.correct/articleState.attempts*100)+'% accuracy':'No answers yet'}</p><button onclick="articleFlash(0)">🖼️ Picture flashcards</button><button onclick="articleQuiz('gender')">🎯 Article quiz</button><button onclick="articleQuiz('plural')">🔤 Plural quiz</button><button onclick="articleQuiz('acc')">Accusative</button><button onclick="articleQuiz('dat')">Dative</button><button onclick="articleQuiz('review')">🔁 Due review (${due})</button></section><section class="card"><h3>Article patterns</h3><p><span style="color:${genderColor.der}">● der</span> masculine · <span style="color:${genderColor.die}">● die</span> feminine · <span style="color:${genderColor.das}">● das</span> neuter</p><p><strong>Often feminine:</strong> -ung (die Zeitung), -heit, -keit, -schaft, -ion, -in (die Lehrerin).</p><p><strong>Often neuter:</strong> -chen (das Mädchen, das Brötchen), -ment, -um.</p><p><strong>Often masculine:</strong> days, months, seasons; many nouns ending -er, but there are exceptions.</p><p>Patterns are clues, not universal rules. Memorize the article with the noun.</p><h3>Case changes</h3><p>Nominative: <b>der / die / das / die</b> (plural)</p><p>Accusative: <b>den / die / das / die</b> (only masculine changes)</p><p>Dative: <b>dem / der / dem / den</b> (plural often adds -n)</p><p class="muted">Example: der Hund → Ich sehe <b>den Hund</b> → Ich helfe <b>dem Hund</b>.</p></section>`;}

else if(mode==='acc'||mode==='dat'){let g=w[2],map=mode==='acc'?{der:'den',die:'die',das:'das'}:{der:'dem',die:'der',das:'dem'};answer=map[g];question=(mode==='acc'?'Ich sehe ___ ':'Ich helfe ___ ')+w[0]+'. (Choose the article; '+(mode==='acc'?'accusative':'dative')+')';opts=mode==='acc'?['den','die','das','der']:['dem','der','den','das'];}
else{question=`${w[4]} ${w[0]} (${w[1]}) — which article?`;answer=w[2];opts=['der','die','das'];}
opts=[...new Set(opts)];if(!opts.includes(answer))opts.unshift(answer);
app.innerHTML=`<section class="card"><p class="muted">${x.mode.toUpperCase()} · ${x.i+1}/${x.pool.length} · Score ${x.score}</p><h2>${esc(question)}</h2>${opts.map(o=>`<button class="secondary" style="border-bottom:4px solid ${genderColor[o]||'#6bcdbb'}" onclick="articleAnswer('${esc(o)}','${esc(answer)}')">${esc(o)}</button>`).join('')}<div id="articleFeedback" aria-live="polite"></div></section>`;}
function articleAnswer(chosen,correct){let x=articleSession,w=x.pool[x.i],ok=chosen===correct;articleState.attempts++;if(ok){x.score++;articleState.correct++;}let card=articleState.cards[w[0]]||{streak:0};card.streak=ok?card.streak+1:0;const days=ok?[1,3,7,14,30][Math.min(card.streak-1,4)]:0;card.due=Date.now()+(ok?days*86400000:0);articleState.cards[w[0]]=card;articleSave();document.querySelectorAll('.card button').forEach(b=>b.disabled=true);document.getElementById('articleFeedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct: '+esc(correct)}</p><p>${w[2]} ${w[0]} · ${w[1]} · plural: die ${w[3]}</p><button onclick="articleNext()">Next</button>`;}

const AI_KEY_STORAGE='deutschlab-ai-api-key-v1';
function savedAIKey(){try{return localStorage.getItem(AI_KEY_STORAGE)||''}catch(e){return ''}}

on depends on your browser and may require HTTPS hosting; audio may be processed by your browser’s speech service.</p></details><button class="secondary ai-new-conversation" onclick="aiHistory=[];drawAI()">New conversation</button><p id="aiStatus" class="status"></p></section>`;

async function sendAI(){
 const box=document.getElementById('aiInput');const message=box.value.trim();if(!message)return;
 aiHistory.push({role:'user',content:message});drawAI();const send=document.getElementById('aiSend');send.disabled=true;document.getElementById('aiStatus').textContent='Thinking…';
 const system=`You are a patient, engaging German language tutor. Student level: ${window.aiLevel}. Scenario: ${window.aiScene}. Converse naturally in German appropriate to level. Start with one or two short German sentences including ONE natural follow-up question. If correction is needed, append a separate section labeled "Correction:" in English, with one or two brief tips. Pay special attention to noun gender and definite articles (der/die/das) and correct incorrect articles with a short explanation, including accusative/dative when relevant. Never mix English into the German portion. If student asks in English, answer helpfully in English then return to German. Do not claim to hear audio. Keep replies concise.`;
 try{

 }catch(e){aiHistory.pop();drawAI();document.getElementById('aiStatus').textContent='Request failed: '+e.message;}
}
let recognition=null,recording=false,voiceRate=1;window.ttsMode="ai";window.ttsVoice="nova";let currentAudio=null;
function sayTutor(text){

 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
 u.lang='de-DE';u.rate=voiceRate;
 const voices=speechSynthesis.getVoices();const german=voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(german)u.voice=german;
 speechSynthesis.speak(u);
}
async function replayTutor(){
 const last=[...aiHistory].reverse().find(m=>m.role==='assistant');if(!last){document.getElementById('aiStatus').textContent='No tutor reply to replay yet.';return;}
 const speech=last.content.split(/(?:Correction|English note|Grammar tip|Korrektur)\s*:/i)[0].replace(/\*\*/g,'').trim()||last.content;
 if(window.ttsMode==='device'){sayTutor(speech);return;}
 const status=document.getElementById('aiStatus');status.textContent='Generating natural German speech…';
 try{
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const response=await fetch('https://api.openai.com/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window.aiKey},body:JSON.stringify({model:'tts-1',voice:window.ttsVoice||'nova',input:speech.slice(0,3000),response_format:'mp3',speed:Math.max(.5,Math.min(2,window.voiceRate||1))})});
  if(!response.ok){let detail='';try{detail=(await response.json()).error?.message||''}catch{}throw Error(detail||'HTTP '+response.status)}
  const url=URL.createObjectURL(await response.blob());currentAudio=new Audio(url);
  currentAudio.onended=()=>{URL.revokeObjectURL(url);status.textContent='';};
  currentAudio.onerror=()=>{URL.revokeObjectURL(url);status.textContent='Audio playback failed.';};
  await currentAudio.play();status.textContent='Playing natural German voice…';

}
function toggleMic(){

<script>
const GUIDE={
'A1|Greetings and introductions':['German greetings change with context. Hallo is informal; Guten Tag works in more formal settings. Auf Wiedersehen means goodbye.','Hallo, ich heiße Mia.','Hello, my name is Mia.'],
'A1|Nouns and articles':['German nouns have grammatical gender: der (masculine), die (feminine), das (neuter). Always memorize the article together with the noun. Plural nouns generally use die in the nominative.','der Tisch · die Lampe · das Buch','the table · the lamp · the book'],
'A1|Present-tense verbs':['Regular verbs change endings with the subject: ich -e, du -st, er/sie/es -t, wir/sie/Sie -en, ihr -t. The stem of lernen is lern-.','Ich lerne. Du lernst. Wir lernen.','I learn. You learn. We learn.'],
'A1|Basic word order':['In a German main clause, the conjugated verb is in position TWO. A time expression can come first, but the verb must still come next.','Heute gehe ich einkaufen.','Today I am going shopping.'],
'A2|Accusative articles':['The accusative marks the direct object. Only masculine definite articles change: der → den; die and das stay the same. Masculine ein → einen.','Der Hund schläft. Ich sehe den Hund.','The dog sleeps. I see the dog.'],
'A2|Dative articles':['Dative often marks the recipient or follows verbs such as helfen. Articles change: der → dem, die → der, das → dem; plural die → den.','Ich helfe der Frau.','I help the woman.'],
'A2|Perfect tense':['The spoken past (Perfekt) usually uses haben or sein plus a past participle. Many motion/change-of-state verbs use sein; most other verbs use haben.','Ich habe gekocht. Ich bin gegangen.','I cooked. I went.'],
'A2|Separable verbs':['Some verbs split in a main clause: the conjugated verb goes second and the prefix goes at the end. In an infinitive, the prefix stays attached.','Ich stehe um sieben Uhr auf.','I get up at seven o’clock.'],
'B1|Subordinate clauses':['After subordinating conjunctions like weil, dass and ob, the conjugated verb normally moves to the end of its clause.','Ich bleibe zu Hause, weil ich krank bin.','I stay home because I am sick.'],
'B1|Relative clauses':['A relative pronoun agrees in gender/number with the noun it refers to, but its case depends on its job within the relative clause.','Das ist der Mann, der hier arbeitet.','That is the man who works here.'],
'B1|Konjunktiv II':['Use Konjunktiv II to express wishes, hypotheticals and polite requests. Würde + infinitive is common for many verbs.','Wenn ich Zeit hätte, würde ich reisen.','If I had time, I would travel.'],
'B1|Prepositions and cases':['Certain verbs require a fixed preposition and case. Learn them as chunks: sich interessieren für + accusative; sprechen mit + dative.','Ich interessiere mich für Musik.','I am interested in music.'],
'B2|Passive voice':['The process passive uses werden + past participle. Change werden into the appropriate tense: wird (present), wurde (simple past).','Der Brief wurde gestern geschrieben.','The letter was written yesterday.'],
'B2|Advanced connectors':['Obwohl means although and introduces a subordinate clause with the verb at the end. Dennoch means nevertheless and begins a main clause.','Obwohl es regnete, gingen wir spazieren.','Although it rained, we went for a walk.'],
'B2|Reported speech':['Konjunktiv I is often used in formal reported speech to mark that a statement is being reported, not directly asserted.','Er sagt, er habe keine Zeit.','He says he has no time.'],
'B2|Nuanced vocabulary':['Allerdings can mean indeed (emphasis) or however (contrast), depending on context. Read the surrounding sentence to decide.','Das ist allerdings schwierig.','That is indeed difficult.']
};
function guideHtml(m){
 let g=GUIDE[m.level+'|'+m.title]||['Read the example, identify the pattern, then try the question.',m.q,m.why];
 return `<div class="explain-box"><h3>Why this works</h3><p>${safeText(g[0])}</p><div class="explain-example"><strong>${safeText(g[1])}</strong><br><span class="muted">${safeText(g[2])}</span></div><button class="secondary" onclick="speak(${JSON.stringify(g[1]).replace(/"/g,'&quot;')})">🔊 Hear example</button></div>`;
}
courseLesson=function(id){
 let m=COURSE[id];if(!m||!m.words.length)return courseMenu();
 app.innerHTML=illustratedHero(m.title,`${m.level} · ${m.skill}`,m.skill==='cases'?'cafe':'village',id%2?'katze.png':'hund.png')+`<section class="card"><h3>Learn the rule</h3>${guideHtml(m)}<h3>Vocabulary and examples</h3>${m.words.map(w=>`<div class="vocab-row"><div class="vocab-copy"><strong>${safeText(w[0])}</strong><span>${safeText(w[1])}</span></div><button class="secondary" onclick="speak(${JSON.stringify(w[0]).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}<button onclick="courseQuiz(${id})">Practice</button><button class="secondary" onclick="courseMenu('${m.level}')">Back to lessons</button></section>`;
};
courseAnswer=function(id,i){
 let m=COURSE[id],ok=i===m.ans;
 app.querySelectorAll('.card button').forEach(b=>b.disabled=true);
 if(ok){ensureLearning();if(!state.learning.completed.includes(id))state.learning.completed.push(id);save()}
 if(typeof recordQuestion==='function')recordQuestion(m,ok);
 document.getElementById('courseFeedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Not quite. Correct answer: '+safeText(m.opts[m.ans])}</p><div class="explain-box"><h3>Answer explained</h3><p>${safeText(m.why)}</p><p><strong>Complete answer:</strong> ${safeText(m.q.replace('___',m.opts[m.ans]))}</p></div><button onclick="courseMenu('${m.level}')">Back to lessons</button><button class="secondary" onclick="courseQuiz(${id})">Try again</button>`;
};
const previousPracticeAnswer=practiceAnswer;
practiceAnswer=function(id,i,mode){
 previousPracticeAnswer(id,i,mode);
 let m=COURSE[id],box=document.getElementById('practiceFeedback');
 if(box&&m.words.length)box.insertAdjacentHTML('beforeend',guideHtml(m));
};
const previousListeningAnswer=listeningAnswer;
listeningAnswer=function(choice,answer,german){
 previousListeningAnswer(choice,answer,german);
 document.getElementById('listenFeedback').insertAdjacentHTML('beforeend',`<div class="explain-box"><h3>Listen and compare</h3><p><strong>German:</strong> ${safeText(german)}</p><p><strong>Meaning:</strong> ${safeText(answer)}</p><p>Listen again and connect each word to its meaning.</p><button class="secondary" onclick="speak(${JSON.stringify(german).replace(/"/g,'&quot;')})">🔊 Replay</button></div>`);
};
const previousArticleAnswer=articleAnswer;
articleAnswer=function(chosen,correct){
 previousArticleAnswer(chosen,correct);
 let x=articleSession,w=x.pool[x.i],mode=x.mode==='review'?'gender':x.mode;
 let reason=mode==='gender'?`This noun is ${w[2]} ${w[0]}. Learn the article with the noun; endings can provide clues, but not every noun follows a rule.`:mode==='plural'?`The plural is die ${w[3]}. Plural nouns use die in nominative; the noun itself may also change.`:mode==='acc'?`The accusative marks a direct object. Masculine der becomes den; feminine die and neuter das do not change.`:`The dative often marks the recipient or follows certain verbs and prepositions. The definite articles are dem (masculine), der (feminine), dem (neuter).`;
 let target=document.getElementById('articleFeedback');if(target)target.insertAdjacentHTML('afterbegin',`<div class="explain-box"><h3>Why?</h3><p>${safeText(reason)}</p></div>`);
};
const previousSentenceWord=chooseSentenceWord;
chooseSentenceWord=function(i,w){
 previousSentenceWord(i,w);
 if(sentenceChosen.length===sentenceTarget.length){let box=document.getElementById('sentenceFeedback');if(box)box.insertAdjacentHTML('beforeend',`<div class="explain-box"><h3>Sentence structure</h3><p>In a standard German main clause, the conjugated verb takes the second position. Look for the subject, verb and any time expressions.</p></div>`)}
};
</script>

<script>
const DEEP_EXERCISES=[[{"type": "choice", "prompt": "Which greeting is appropriate in a formal office?", "options": ["Guten Tag", "Tschüss", "Na?"], "answer": 0, "why": "Guten Tag is suitable in formal and informal daytime settings."}, {"type": "fill", "prompt": "Complete: Ich ___ Anna.", "options": ["heiße", "heißt", "heißen"], "answer": 0, "why": "Ich heiße is the first-person form of heißen."}, {"type": "order", "prompt": "Arrange: My name is Mia.", "options": ["heiße", "Ich", "Mia"], "answer": ["Ich", "heiße", "Mia"], "why": "In a statement, the conjugated verb comes second."}, {"type": "listen", "prompt": "Guten Morgen", "options": ["Good morning", "Good evening", "Good night"], "answer": 0, "why": "Morgen means morning; guten is an adjective ending."}], [{"type": "choice", "prompt": "Which noun is neuter?", "options": ["das Mädchen", "die Zeitung", "der Garten"], "answer": 0, "why": "The diminutive suffix -chen always makes a noun neuter."}, {"type": "fill", "prompt": "Complete: ___ Zeitung ist interessant.", "options": ["Die", "Der", "Das"], "answer": 0, "why": "Zeitung is feminine; many nouns ending in -ung are feminine."}, {"type": "order", "prompt": "Arrange: The dog is sleeping.", "options": ["schläft", "Hund", "Der"], "answer": ["Der", "Hund", "schläft"], "why": "Der Hund is the subject; schläft is the verb."}, {"type": "listen", "prompt": "das Buch", "options": ["the book", "the table", "the lamp"], "answer": 0, "why": "Buch is neuter: das Buch."}], [{"type": "choice", "prompt": "Choose the correct form: Er ___ Deutsch.", "options": ["lernt", "lerne", "lernen"], "answer": 0, "why": "Er uses the -t ending for regular verbs."}, {"type": "fill", "prompt": "Complete: Ihr ___ in Berlin.", "options": ["wohnt", "wohnen", "wohnst"], "answer": 0, "why": "Ihr takes -t."}, {"type": "order", "prompt": "Arrange: We are learning German.", "options": ["Deutsch", "lernen", "Wir"], "answer": ["Wir", "lernen", "Deutsch"], "why": "Wir takes the infinitive-like ending -en."}, {"type": "listen", "prompt": "Du lernst Deutsch", "options": ["You learn German", "We learn German", "He learns German"], "answer": 0, "why": "Du is informal singular you; lernst ends in -st."}], [{"type": "choice", "prompt": "Which is correct?", "options": ["Morgen fahre ich nach Berlin.", "Morgen ich fahre nach Berlin.", "Morgen nach Berlin ich fahre."], "answer": 0, "why": "A time expression can come first, but the verb remains in position two."}, {"type": "fill", "prompt": "Complete: Heute ___ wir Pizza.", "options": ["essen", "esst", "isst"], "answer": 0, "why": "Wir essen is the plural form."}, {"type": "order", "prompt": "Arrange: Today I drink tea.", "options": ["Tee", "trinke", "Heute", "ich"], "answer": ["Heute", "trinke", "ich", "Tee"], "why": "The verb trinke is the second constituent."}, {"type": "listen", "prompt": "Heute gehe ich nach Hause", "options": ["Today I go home", "Tomorrow I go home", "Today I stay home"], "answer": 0, "why": "Heute means today; nach Hause means homeward."}], [{"type": "choice", "prompt": "Choose the accusative: Ich habe ___ Hund.", "options": ["den", "dem", "der"], "answer": 0, "why": "Masculine der becomes den as a direct object."}, {"type": "fill", "prompt": "Complete: Sie kauft ___ Apfel.", "options": ["einen", "ein", "einem"], "answer": 0, "why": "Masculine indefinite accusative is einen."}, {"type": "order", "prompt": "Arrange: I see the cat.", "options": ["Katze", "die", "sehe", "Ich"], "answer": ["Ich", "sehe", "die", "Katze"], "why": "Feminine die does not change in the accusative."}, {"type": "listen", "prompt": "Ich sehe den Hund", "options": ["I see the dog", "The dog sees me", "I help the dog"], "answer": 0, "why": "Sehen takes a direct object, here den Hund."}], [{"type": "choice", "prompt": "Which follows mit?", "options": ["dem", "den (singular masculine)", "der (masculine)"], "answer": 0, "why": "Mit always takes dative; masculine der → dem."}, {"type": "fill", "prompt": "Complete: Ich danke ___ Lehrerin.", "options": ["der", "die", "den"], "answer": 0, "why": "Danken takes dative; feminine die → der."}, {"type": "order", "prompt": "Arrange: I speak with the woman.", "options": ["Frau", "mit", "spreche", "Ich", "der"], "answer": ["Ich", "spreche", "mit", "der", "Frau"], "why": "Mit takes dative; feminine die Frau becomes der Frau."}, {"type": "listen", "prompt": "Ich helfe dem Kind", "options": ["I help the child", "I see the child", "The child helps me"], "answer": 0, "why": "Helfen governs dative; das Kind → dem Kind."}], [{"type": "choice", "prompt": "Which auxiliary fits: Ich ___ nach Hause gegangen.", "options": ["bin", "habe", "werde"], "answer": 0, "why": "Gehen usually forms Perfekt with sein."}, {"type": "fill", "prompt": "Complete: Sie ___ ein Buch gelesen.", "options": ["hat", "ist", "wird"], "answer": 0, "why": "Lesen forms Perfekt with haben."}, {"type": "order", "prompt": "Arrange: We cooked yesterday.", "options": ["gekocht", "Wir", "gestern", "haben"], "answer": ["Wir", "haben", "gestern", "gekocht"], "why": "The participle goes at the end of the main clause."}, {"type": "listen", "prompt": "Ich habe Kaffee getrunken", "options": ["I drank coffee", "I am drinking coffee", "I will drink coffee"], "answer": 0, "why": "Habe + getrunken is Perfekt."}], [{"type": "choice", "prompt": "Where does auf go? Ich stehe früh ___.", "options": ["auf", "an", "mit"], "answer": 0, "why": "The prefix auf separates and moves to the end."}, {"type": "fill", "prompt": "Complete: Ich ___ meine Mutter an.", "options": ["rufe", "anrufe", "rufen"], "answer": 0, "why": "Anrufen separates: ich rufe ... an."}, {"type": "order", "prompt": "Arrange: I get up at seven.", "options": ["um", "auf", "Ich", "sieben", "stehe"], "answer": ["Ich", "stehe", "um", "sieben", "auf"], "why": "Conjugated stem second; prefix at the end."}, {"type": "listen", "prompt": "Ich kaufe heute ein", "options": ["I shop today", "I cook today", "I call today"], "answer": 0, "why": "Einkaufen separates into kaufe ... ein."}], [{"type": "choice", "prompt": "Which is correct?", "options": ["weil ich müde bin", "weil ich bin müde", "weil bin ich müde"], "answer": 0, "why": "Weil introduces a subordinate clause; finite verb goes last."}, {"type": "fill", "prompt": "Complete: Ich glaube, dass er morgen ___.", "options": ["kommt", "kommen", "komme"], "answer": 0, "why": "Dass-clause verb goes at the end."}, {"type": "order", "prompt": "Arrange: because I am tired", "options": ["bin", "weil", "müde", "ich"], "answer": ["weil", "ich", "müde", "bin"], "why": "Subordinating weil sends bin to the end."}, {"type": "listen", "prompt": "Ich bleibe zu Hause, weil es regnet", "options": ["I stay home because it rains", "I leave because it rains", "I stay home although it rains"], "answer": 0, "why": "Weil introduces a reason."}], [{"type": "choice", "prompt": "Which relative pronoun? Die Frau, ___ hier wohnt.", "options": ["die", "der", "den"], "answer": 0, "why": "Die Frau is feminine and the pronoun is the relative-clause subject."}, {"type": "fill", "prompt": "Complete: Das Kind, ___ spielt, ist müde.", "options": ["das", "dem", "den"], "answer": 0, "why": "Neuter nominative relative pronoun is das."}, {"type": "order", "prompt": "Arrange: the man who works here", "options": ["hier", "der", "arbeitet", "Mann,", "der"], "answer": ["der", "Mann,", "der", "hier", "arbeitet"], "why": "Relative clauses end with the finite verb."}, {"type": "listen", "prompt": "Das ist die Frau, die hier arbeitet", "options": ["That is the woman who works here", "That is the woman who lived here", "That is the man who works here"], "answer": 0, "why": "Die refers back to die Frau."}], [{"type": "choice", "prompt": "Which is a polite request?", "options": ["Könnten Sie mir helfen?", "Sie helfen mir!", "Sie geholfen mir?"], "answer": 0, "why": "Könnten is Konjunktiv II, often used for polite requests."}, {"type": "fill", "prompt": "Complete: Wenn ich Geld hätte, ___ ich reisen.", "options": ["würde", "werde", "habe"], "answer": 0, "why": "Würde + infinitive expresses a hypothetical."}, {"type": "order", "prompt": "Arrange: I would like a tea.", "options": ["Tee", "gern", "hätte", "Ich", "einen"], "answer": ["Ich", "hätte", "gern", "einen", "Tee"], "why": "Hätte is Konjunktiv II of haben."}, {"type": "listen", "prompt": "Ich würde gern nach Berlin fahren", "options": ["I would like to go to Berlin", "I went to Berlin", "I must go to Berlin"], "answer": 0, "why": "Würde gern expresses a wish."}], [{"type": "choice", "prompt": "Which phrase is correct?", "options": ["warten auf den Bus", "warten mit den Bus", "warten bei den Bus"], "answer": 0, "why": "Warten auf + accusative."}, {"type": "fill", "prompt": "Complete: Ich spreche ___ meinem Bruder.", "options": ["mit", "für", "auf"], "answer": 0, "why": "Sprechen mit takes dative."}, {"type": "order", "prompt": "Arrange: I am waiting for the bus.", "options": ["Bus", "warte", "Ich", "auf", "den"], "answer": ["Ich", "warte", "auf", "den", "Bus"], "why": "Warten auf + accusative, der Bus → den Bus."}, {"type": "listen", "prompt": "Ich interessiere mich für Musik", "options": ["I am interested in music", "I am waiting for music", "I speak about music"], "answer": 0, "why": "Sich interessieren für means to be interested in."}], [{"type": "choice", "prompt": "Present passive: Der Brief ___ geschrieben.", "options": ["wird", "wurde", "würde"], "answer": 0, "why": "Wird + participle is present process passive."}, {"type": "fill", "prompt": "Complete: Das Auto ___ gestern repariert.", "options": ["wurde", "wird", "werden"], "answer": 0, "why": "Gestern indicates past; wurde is preterite passive."}, {"type": "order", "prompt": "Arrange: The house is being built.", "options": ["gebaut", "wird", "Das", "Haus"], "answer": ["Das", "Haus", "wird", "gebaut"], "why": "Passive: werden + participle."}, {"type": "listen", "prompt": "Das Fenster wurde geöffnet", "options": ["The window was opened", "The window is open", "The window will open"], "answer": 0, "why": "Wurde geöffnet is past passive."}], [{"type": "choice", "prompt": "Which connector means although?", "options": ["obwohl", "weil", "damit"], "answer": 0, "why": "Obwohl introduces a concession."}, {"type": "fill", "prompt": "Complete: ___ er krank ist, arbeitet er.", "options": ["Obwohl", "Weil", "Damit"], "answer": 0, "why": "The contrast is working despite illness."}, {"type": "order", "prompt": "Arrange: although it is cold", "options": ["ist", "obwohl", "kalt", "es"], "answer": ["obwohl", "es", "kalt", "ist"], "why": "Obwohl sends the finite verb to the end."}, {"type": "listen", "prompt": "Es regnet, dennoch gehen wir spazieren", "options": ["It rains; nevertheless we walk", "It rains because we walk", "It rains while we walk"], "answer": 0, "why": "Dennoch signals contrast and introduces a main clause."}], [{"type": "choice", "prompt": "Reported speech: Er sagt, er ___ krank.", "options": ["sei", "ist", "wäre"], "answer": 0, "why": "Sei is Konjunktiv I of sein."}, {"type": "fill", "prompt": "Complete: Sie sagt, sie ___ keine Zeit.", "options": ["habe", "hatte", "hätte"], "answer": 0, "why": "Habe is Konjunktiv I in reported speech."}, {"type": "order", "prompt": "Arrange: He says he has no time.", "options": ["Zeit.", "habe", "er", "Er", "sagt,", "keine"], "answer": ["Er", "sagt,", "er", "habe", "keine", "Zeit."], "why": "Reported speech may use Konjunktiv I."}, {"type": "listen", "prompt": "Er sagt, er sei krank", "options": ["He says he is sick", "He says he was late", "He asks if he is sick"], "answer": 0, "why": "Sei signals reported speech."}], [{"type": "choice", "prompt": "Here 'allerdings' means: Das ist allerdings teuer.", "options": ["indeed", "maybe", "never"], "answer": 0, "why": "Allerdings intensifies teuer here."}, {"type": "fill", "prompt": "Complete: Ich möchte kommen, ___ habe ich keine Zeit.", "options": ["allerdings", "damit", "weil"], "answer": 0, "why": "Allerdings here introduces a contrast: however."}, {"type": "order", "prompt": "Arrange: It is expensive; nevertheless I will buy it.", "options": ["kaufe", "dennoch", "Ich", "es"], "answer": ["Ich", "kaufe", "es", "dennoch"], "why": "Dennoch can appear later in a main clause."}, {"type": "listen", "prompt": "Das ist durchaus möglich", "options": ["That is entirely possible", "That is impossible", "That is probably late"], "answer": 0, "why": "Durchaus adds emphasis: entirely/quite."}]];
let lessonRun=null;
function deepStart(id){
 let m=COURSE[id];if(!m||!m.words.length)return courseMenu();
 lessonRun={id,index:0,correct:0,answers:[],orderPicked:[]};
 deepRender();
}
function deepRender(){
 if(!lessonRun)return;
 let r=lessonRun,m=COURSE[r.id],q=DEEP_EXERCISES[r.id]?.[r.index];
 if(!q)return deepFinish();
 let total=DEEP_EXERCISES[r.id].length;
 let html=illustratedHero('Practice · '+m.title,`${m.level} · Exercise ${r.index+1} of ${total}`,'cafe',r.index%2?'katze.png':'hund.png')
 +`<section class="card"><div class="lesson-progress"><div style="width:${r.index/total*100}%"></div></div><p class="muted">${{choice:'Choose the answer',fill:'Fill in the blank',order:'Build the sentence',listen:'Listen and understand'}[q.type]}</p><h3>${safeText(q.prompt)}</h3>`;
 if(q.type==='listen')html+=`<button onclick="speak(${JSON.stringify(q.prompt).replace(/"/g,'&quot;')})">🔊 Play German audio</button><p class="muted">Listen, then choose the English meaning.</p>`;
 if(q.type==='order'){
   html+=`<div class="lesson-note"><strong>Your sentence:</strong> <span id="deepBuilt">—</span></div><div id="deepChoices">${q.options.map((x,i)=>`<button class="word-chip" id="deepChip${i}" onclick="deepPick(${i})">${safeText(x)}</button>`).join('')}</div><button class="secondary" onclick="deepReset()">Reset words</button><button onclick="deepCheckOrder()">Check sentence</button>`;
 }else html+=q.options.map((x,i)=>`<button class="secondary exercise-option" onclick="deepAnswer(${i})">${safeText(x)}</button>`).join('');
 html+=`<div id="deepFeedback" aria-live="polite"></div><button class="secondary" onclick="courseLesson(${r.id})">Review explanation</button></section>`;
 app.innerHTML=html;
}
function deepPick(i){
 if(!lessonRun)return;
 if(lessonRun.orderPicked.includes(i))return;
 lessonRun.orderPicked.push(i);
 document.getElementById('deepChip'+i).disabled=true;
 document.getElementById('deepBuilt').textContent=lessonRun.orderPicked.map(n=>DEEP_EXERCISES[lessonRun.id][lessonRun.index].options[n]).join(' ');
}
function deepReset(){lessonRun.orderPicked=[];deepRender()}
function deepCheckOrder(){
 let q=DEEP_EXERCISES[lessonRun.id][lessonRun.index],chosen=lessonRun.orderPicked.map(n=>q.options[n]);
 if(chosen.length!==q.answer.length){document.getElementById('deepFeedback').textContent='Use all the words before checking.';return}
 deepResult(JSON.stringify(chosen)===JSON.stringify(q.answer),q.answer.join(' '),q.why);
}
function deepAnswer(i){
 let q=DEEP_EXERCISES[lessonRun.id][lessonRun.index];
 deepResult(i===q.answer,q.options[q.answer],q.why);
}
function deepResult(ok,correct,why){
 let r=lessonRun;if(!r)return;
 r.answers.push(ok);if(ok)r.correct++;
 let m=COURSE[r.id];
 if(typeof recordQuestion==='function')recordQuestion(m,ok);
 app.querySelectorAll('.exercise-option,.word-chip').forEach(b=>b.disabled=true);
 let box=document.getElementById('deepFeedback');
 box.innerHTML=`<div class="explain-box"><h3>${ok?'Correct!':'Not quite'}</h3><p><strong>Correct answer:</strong> ${safeText(correct)}</p><p><strong>Why:</strong> ${safeText(why)}</p></div><button onclick="deepNext()">Next exercise</button>`;
}
function deepNext(){if(!lessonRun)return;lessonRun.index++;deepRender()}
function deepFinish(){
 let r=lessonRun,m=COURSE[r.id],total=DEEP_EXERCISES[r.id].length,pct=r.correct/total;
 ensureLearning();state.learning.lessonScores??={};
 state.learning.lessonScores[r.id]={score:r.correct,total,date:new Date().toISOString()};
 if(pct>=.75&&!state.learning.completed.includes(r.id))state.learning.completed.push(r.id);
 save();
 app.innerHTML=illustratedHero('Lesson complete!',m.title,'village','hund.png')+`<section class="card"><h2>${r.correct}/${total} correct</h2><p>${pct>=.75?'You passed this lesson.':'Review the rule and try again to reach 75%.'}</p><p>Every question includes an explanation. Incorrect answers are saved for review.</p><button onclick="courseLesson(${r.id})">Review lesson</button><button onclick="deepStart(${r.id})">Practice again</button><button class="secondary" onclick="courseMenu('${m.level}')">Learning path</button></section>`;
 lessonRun=null;
}
courseQuiz=deepStart;
const deeperCourseMenu=courseMenu;
courseMenu=function(level){deeperCourseMenu(level);ensureLearning();document.querySelectorAll('.card').forEach(card=>{let b=card.querySelector('button[onclick^="courseLesson("]');if(!b)return;let id=Number((b.getAttribute('onclick').match(/\d+/)||[])[0]);let score=state.learning.lessonScores?.[id];if(score)card.insertAdjacentHTML('beforeend',`<p class="muted">Last score: ${score.score}/${score.total} · ${score.score/score.total>=.75?'Passed':'Needs practice'}</p>`);});};
</script>

<style>.unit-grid{display:grid;gap:10px}.unit-card{padding:16px;border-radius:15px;background:#1c3449;margin:10px 0}.unit-badge{font-size:12px;opacity:.8}.unit-progress{height:9px;background:#314b61;border-radius:9px;overflow:hidden}.unit-progress div{height:100%;background:#78d6bc}.unit-choice{display:block;width:100%;margin:8px 0;text-align:left}.unit-chip{margin:4px;padding:10px;background:#31516c;color:white;border-radius:10px}.unit-chip:disabled{opacity:.35}.unit-explain{border-left:4px solid #78d6bc;padding:12px;background:#1b3a4b;margin:12px 0;border-radius:10px}</style>
<script>
const FULL_UNITS=[{"level":"A1","title":"Numbers and ages","rule":"Numbers combine into larger numbers; in 21–99, say the ones before the tens. Age uses sein: Ich bin zwanzig Jahre alt.","examples":[["eins","one"],["zwölf","twelve"],["einundzwanzig","twenty-one"]],"checkpoint":{"prompt":"Ich bin ___ Jahre alt.","options":["zwanzig","zwanziger","zwanzigsten"],"answer":0,"why":"Age uses sein plus the cardinal number."}},{"level":"A1","title":"Family and possessives","rule":"Mein, dein, sein and ihr show possession. Their endings depend on the noun’s gender and case.","examples":[["meine Mutter","my mother"],["mein Vater","my father"],["mein Bruder","my brother"]],"checkpoint":{"prompt":"Das ist ___ Mutter.","options":["meine","mein","meinen"],"answer":0,"why":"Mutter is feminine nominative, so mein takes -e."}},{"level":"A1","title":"Food and ordering","rule":"Use ich möchte for polite requests. In cafés, nouns usually function as direct objects.","examples":[["Ich möchte Wasser.","I would like water."],["Ein Kaffee, bitte.","A coffee, please."],["Die Rechnung, bitte.","The bill, please."]],"checkpoint":{"prompt":"Ich ___ einen Tee, bitte.","options":["möchte","möchten","möchtest"],"answer":0,"why":"Ich takes möchte."}},{"level":"A1","title":"Days, dates and time","rule":"Days take am; clock times take um. The verb stays in second position.","examples":[["am Montag","on Monday"],["um acht Uhr","at eight o’clock"],["heute Abend","this evening"]],"checkpoint":{"prompt":"Wir treffen uns ___ Montag.","options":["am","um","im"],"answer":0,"why":"Use am for days of the week."}},{"level":"A1","title":"Questions and answers","rule":"W-questions begin with a question word, then the finite verb. Yes/no questions begin with the verb.","examples":[["Wo wohnst du?","Where do you live?"],["Wie heißt du?","What is your name?"],["Hast du Zeit?","Do you have time?"]],"checkpoint":{"prompt":"___ kommst du?","options":["Woher","Wohin","Wannher"],"answer":0,"why":"Woher asks about origin."}},{"level":"A1","title":"Negation: nicht and kein","rule":"Use kein to negate indefinite nouns; nicht to negate verbs, adjectives, or specific parts of a sentence.","examples":[["Ich habe kein Auto.","I have no car."],["Ich komme nicht.","I am not coming."],["Das ist nicht teuer.","That is not expensive."]],"checkpoint":{"prompt":"Ich habe ___ Hund.","options":["keinen","nicht","kein"],"answer":0,"why":"Hund is masculine accusative: keinen Hund."}},{"level":"A1","title":"Daily routines","rule":"Describe habitual actions with present tense. Time can lead a sentence, with the finite verb second.","examples":[["Ich frühstücke um acht.","I have breakfast at eight."],["Ich arbeite heute.","I work today."],["Abends lese ich.","In the evening I read."]],"checkpoint":{"prompt":"Morgens ___ ich Kaffee.","options":["trinke","trinkst","trinkt"],"answer":0,"why":"Ich requires trinke."}},{"level":"A1","title":"Places and directions","rule":"Use nach with most cities/countries without articles; zu with people or destinations; in with locations.","examples":[["Ich fahre nach Berlin.","I travel to Berlin."],["Wo ist der Bahnhof?","Where is the train station?"],["Gehen Sie geradeaus.","Go straight ahead."]],"checkpoint":{"prompt":"Ich fahre ___ München.","options":["nach","zu dem","in dem"],"answer":0,"why":"Nach is used with cities as destinations."}},{"level":"A1","title":"Greetings and introductions","rule":"Hallo is a greeting.","examples":[["Hallo","Hello"],["Guten Tag","Good day"],["Auf Wiedersehen","Goodbye"]],"checkpoint":{"prompt":"Hallo means…","options":["Hello","Goodbye","Please"],"answer":0,"why":"Hallo is a greeting."}},{"level":"A1","title":"Nouns and articles","rule":"Tisch is masculine: der Tisch.","examples":[["der Tisch","table"],["die Lampe","lamp"],["das Buch","book"]],"checkpoint":{"prompt":"Choose the correct article: ___ Tisch","options":["die","das","der"],"answer":2,"why":"Tisch is masculine: der Tisch."}},{"level":"A1","title":"Present-tense verbs","rule":"Wir takes the -en ending.","examples":[["ich lerne","I learn"],["du lernst","you learn"],["wir lernen","we learn"]],"checkpoint":{"prompt":"Wir ___ Deutsch.","options":["lernen","lernt","lerne"],"answer":0,"why":"Wir takes the -en ending."}},{"level":"A1","title":"Basic word order","rule":"In statements, the conjugated verb stays second.","examples":[["Heute gehe ich.","Today I go."],["Ich gehe heute.","I go today."],["Wo wohnst du?","Where do you live?"]],"checkpoint":{"prompt":"Which sentence is correct?","options":["Heute ich gehe einkaufen.","Heute gehe ich einkaufen.","Heute einkaufen ich gehe."],"answer":1,"why":"In statements, the conjugated verb stays second."}},{"level":"A2","title":"Two-way prepositions","rule":"In, an, auf and other two-way prepositions use accusative for direction and dative for location.","examples":[["Ich gehe in die Küche.","I go into the kitchen."],["Ich bin in der Küche.","I am in the kitchen."],["Das Buch liegt auf dem Tisch.","The book lies on the table."]],"checkpoint":{"prompt":"Ich lege das Buch auf ___ Tisch.","options":["den","dem","der"],"answer":0,"why":"Direction onto a masculine noun uses accusative den."}},{"level":"A2","title":"Modal verbs","rule":"Modal verbs change form with the subject and push the main infinitive to the end.","examples":[["Ich muss arbeiten.","I have to work."],["Du kannst kommen.","You can come."],["Wir dürfen gehen.","We may leave."]],"checkpoint":{"prompt":"Wir ___ heute arbeiten.","options":["müssen","muss","musst"],"answer":0,"why":"Wir takes müssen."}},{"level":"A2","title":"Comparatives and superlatives","rule":"Use -er to compare; am ...-sten for adverbial superlatives. Some forms are irregular.","examples":[["größer als","bigger than"],["besser als","better than"],["am schnellsten","the fastest"]],"checkpoint":{"prompt":"Dieses Auto ist ___ als das andere.","options":["schneller","schnellsten","am schnell"],"answer":0,"why":"Comparative of schnell is schneller."}},{"level":"A2","title":"Reflexive verbs","rule":"Reflexive pronouns refer back to the subject; their case depends on the verb.","examples":[["Ich freue mich.","I am happy."],["Du erinnerst dich.","You remember."],["Wir beeilen uns.","We hurry."]],"checkpoint":{"prompt":"Ich interessiere ___.","options":["mich","mir","dich"],"answer":0,"why":"Sich interessieren takes an accusative reflexive pronoun."}},{"level":"A2","title":"Imperatives and requests","rule":"Commands use different forms for du, ihr and Sie. The polite imperative uses infinitive + Sie.","examples":[["Komm bitte!","Come, please!"],["Kommt bitte!","Come, everyone!"],["Kommen Sie bitte!","Please come!"]],"checkpoint":{"prompt":"___ Sie bitte langsam.","options":["Sprechen","Sprich","Sprecht"],"answer":0,"why":"Formal Sie imperative uses infinitive + Sie."}},{"level":"A2","title":"Adjective endings","rule":"Adjective endings depend on case, gender, and preceding article. After der in nominative masculine, use -e.","examples":[["der kleine Hund","the small dog"],["ein kleiner Hund","a small dog"],["mit dem kleinen Hund","with the small dog"]],"checkpoint":{"prompt":"Das ist der ___ Hund.","options":["kleine","kleiner","kleinen"],"answer":0,"why":"After der in nominative masculine, adjective ends -e."}},{"level":"A2","title":"Future plans","rule":"Present tense with a future time word often expresses plans; werden + infinitive explicitly marks future.","examples":[["Morgen fahre ich weg.","I am leaving tomorrow."],["Ich werde lernen.","I will study."],["Nächste Woche habe ich frei.","I am off next week."]],"checkpoint":{"prompt":"Ich ___ morgen anrufen.","options":["werde","wurde","worden"],"answer":0,"why":"Werden + infinitive forms future tense."}},{"level":"A2","title":"Travel and hotels","rule":"Use polite requests and practical questions when checking in or traveling.","examples":[["Ich habe reserviert.","I have a reservation."],["Wo ist Gleis drei?","Where is platform three?"],["Ein Zimmer für zwei Nächte.","A room for two nights."]],"checkpoint":{"prompt":"Ich habe ein Zimmer ___.","options":["reserviert","reservieren","reserviere"],"answer":0,"why":"Perfekt uses habe + past participle reserviert."}},{"level":"A2","title":"Accusative articles","rule":"The masculine nominative article der changes to den when the noun is a direct object: der Hund → den Hund.","examples":[["den Hund","the dog (object)"],["einen Apfel","an apple (object)"],["die Katze","the cat (object)"]],"checkpoint":{"prompt":"Ich sehe ___ Hund.","options":["den","dem","der"],"answer":0,"why":"Masculine der becomes den in accusative."}},{"level":"A2","title":"Dative articles","rule":"Helfen takes dative; die Frau becomes der Frau.","examples":[["mit dem Hund","with the dog"],["bei der Frau","at the woman's"],["mit einem Kind","with a child"]],"checkpoint":{"prompt":"Ich helfe ___ Frau.","options":["die","der","den"],"answer":1,"why":"Helfen takes dative; die Frau becomes der Frau."}},{"level":"A2","title":"Perfect tense","rule":"Kochen forms Perfekt with haben.","examples":[["ich habe gelernt","I learned"],["sie ist gefahren","she traveled"],["wir haben gekocht","we cooked"]],"checkpoint":{"prompt":"Gestern ___ ich gekocht.","options":["bin","habe","werde"],"answer":1,"why":"Kochen forms Perfekt with haben."}},{"level":"A2","title":"Separable verbs","rule":"Aufstehen separates in a main clause.","examples":[["ich stehe auf","I get up"],["ich kaufe ein","I shop"],["ich rufe an","I call"]],"checkpoint":{"prompt":"Ich ___ um sieben Uhr ___.","options":["stehe … auf","aufstehe … —","stehe … an"],"answer":0,"why":"Aufstehen separates in a main clause."}},{"level":"B1","title":"Genitive case","rule":"Genitive shows relationships and possession; masculine and neuter articles use des and many nouns take -s/-es.","examples":[["das Auto meines Bruders","my brother’s car"],["wegen des Wetters","because of the weather"],["die Tür des Hauses","the door of the house"]],"checkpoint":{"prompt":"Wegen ___ Wetters bleiben wir zu Hause.","options":["des schlechten","dem schlechten","den schlechten"],"answer":0,"why":"Wegen often takes genitive in formal German."}},{"level":"B1","title":"Infinitive with zu","rule":"Infinitive clauses use zu; with separable verbs, zu goes between prefix and stem.","examples":[["Ich versuche zu lernen.","I try to study."],["Es ist wichtig, pünktlich zu sein.","It is important to be on time."],["Ich plane aufzustehen.","I plan to get up."]],"checkpoint":{"prompt":"Ich versuche, früher ___ gehen.","options":["zu","um","bei"],"answer":0,"why":"Infinitive construction uses zu + infinitive."}},{"level":"B1","title":"Past narratives: Präteritum","rule":"Präteritum is common in writing and with sein, haben and modal verbs in speech.","examples":[["Ich war müde.","I was tired."],["Wir hatten Zeit.","We had time."],["Er ging nach Hause.","He went home."]],"checkpoint":{"prompt":"Gestern ___ ich krank.","options":["war","bin","wäre"],"answer":0,"why":"War is Präteritum of sein."}},{"level":"B1","title":"Giving reasons and consequences","rule":"Weil introduces a subordinate reason clause; deshalb introduces a main clause with inversion.","examples":[["Ich bin müde, weil ich arbeite.","I am tired because I work."],["Es regnet, deshalb bleibe ich hier.","It rains, so I stay here."],["Da es spät ist, gehen wir.","Since it is late, we leave."]],"checkpoint":{"prompt":"Es regnet. Deshalb ___ ich zu Hause.","options":["bleibe","ich bleibe","bleiben"],"answer":0,"why":"After deshalb in first position, the finite verb comes next."}},{"level":"B1","title":"Describing experiences","rule":"Use Perfekt for events and descriptive phrases for reactions. Explain when and why things happened.","examples":[["Ich habe viel gelernt.","I learned a lot."],["Es hat mir gefallen.","I liked it."],["Ich habe mich geärgert.","I was annoyed."]],"checkpoint":{"prompt":"Der Film hat mir ___.","options":["gefallen","gefällt","gefallt"],"answer":0,"why":"Gefallen forms Perfekt with hat + gefallen."}},{"level":"B1","title":"Conditional sentences","rule":"Use wenn + verb-final clause for conditions. Konjunktiv II marks unreal or hypothetical conditions.","examples":[["Wenn ich Zeit habe, komme ich.","If I have time, I will come."],["Wenn ich reich wäre, reiste ich.","If I were rich, I would travel."],["Ich würde gern helfen.","I would like to help."]],"checkpoint":{"prompt":"Wenn ich Zeit hätte, ___ ich kommen.","options":["würde","werde","bin"],"answer":0,"why":"Hypothetical conditional uses würde."}},{"level":"B1","title":"Opinions and discussion","rule":"Support opinions with reasons and contrasting views; achten Sie auf the verb position after dass.","examples":[["Meiner Meinung nach…","In my opinion…"],["Ich stimme dir zu.","I agree with you."],["Ich denke, dass das stimmt.","I think that is correct."]],"checkpoint":{"prompt":"Ich glaube, dass er recht ___.","options":["hat","haben","habe"],"answer":0,"why":"Dass sends the finite verb to the end."}},{"level":"B1","title":"Work and appointments","rule":"Discuss scheduling, workplace requests, and obligations using polite structures.","examples":[["Können wir den Termin verschieben?","Can we reschedule the appointment?"],["Ich bewerbe mich um eine Stelle.","I am applying for a job."],["Ich bin für das Projekt zuständig.","I am responsible for the project."]],"checkpoint":{"prompt":"Ich bewerbe mich ___ die Stelle.","options":["um","für","mit"],"answer":0,"why":"Sich bewerben um + accusative is the fixed phrase."}},{"level":"B1","title":"Subordinate clauses","rule":"After weil, the conjugated verb goes to the end.","examples":[["weil ich müde bin","because I am tired"],["dass er kommt","that he is coming"],["ob sie Zeit hat","whether she has time"]],"checkpoint":{"prompt":"Ich bleibe zu Hause, weil ich krank ___.","options":["bin","sein","ist"],"answer":0,"why":"After weil, the conjugated verb goes to the end."}},{"level":"B1","title":"Relative clauses","rule":"The subject of the relative clause is nominative masculine: der.","examples":[["der Mann, der…","the man who…"],["die Frau, die…","the woman who…"],["das Kind, das…","the child that…"]],"checkpoint":{"prompt":"Das ist der Mann, ___ hier arbeitet.","options":["den","der","dem"],"answer":1,"why":"The subject of the relative clause is nominative masculine: der."}},{"level":"B1","title":"Konjunktiv II","rule":"Hypothetical statements often use würde + infinitive.","examples":[["ich würde gern…","I would like to…"],["wenn ich könnte…","if I could…"],["ich hätte gern…","I would like to have…"]],"checkpoint":{"prompt":"Wenn ich mehr Zeit hätte, ___ ich reisen.","options":["werde","würde","habe"],"answer":1,"why":"Hypothetical statements often use würde + infinitive."}},{"level":"B1","title":"Prepositions and cases","rule":"Sich interessieren für takes accusative.","examples":[["sich interessieren für","to be interested in"],["warten auf","to wait for"],["sprechen mit","to speak with"]],"checkpoint":{"prompt":"Ich interessiere mich ___ Musik.","options":["an","für","mit"],"answer":1,"why":"Sich interessieren für takes accusative."}},{"level":"B2","title":"Nominalization","rule":"Nominalization turns verbs/adjectives into nouns, common in formal German. Infinitive nouns are neuter and capitalized.","examples":[["das Lernen","learning"],["beim Lesen","while reading"],["die Entscheidung","the decision"]],"checkpoint":{"prompt":"___ fällt mir leicht.","options":["Das Lesen","Der Lesen","Die Lesen"],"answer":0,"why":"Nominalized infinitives are neuter."}},{"level":"B2","title":"Participial adjectives","rule":"Present participles describe ongoing action; past participles often describe results. Adjective endings still apply.","examples":[["der wartende Mann","the waiting man"],["die geschlossene Tür","the closed door"],["ein geschriebenes Buch","a written book"]],"checkpoint":{"prompt":"Die ___ Tür ist zu.","options":["geschlossene","schließende","geschlossenes"],"answer":0,"why":"Past participle geschlossen describes a closed state; feminine definite adjective ends -e."}},{"level":"B2","title":"Passive with modal verbs","rule":"Modal passive uses modal verb + past participle + werden; the modal verb is finite.","examples":[["Der Vertrag muss unterschrieben werden.","The contract must be signed."],["Das kann erklärt werden.","That can be explained."],["Die Aufgabe soll erledigt werden.","The task should be completed."]],"checkpoint":{"prompt":"Der Brief muss heute ___ werden.","options":["geschrieben","schreiben","schreibt"],"answer":0,"why":"Passive with modal uses past participle + werden."}},{"level":"B2","title":"Advanced relative clauses","rule":"Relative clauses may use prepositions and genitive pronouns. Prepositions determine the pronoun’s case.","examples":[["der Mann, mit dem ich spreche","the man I speak with"],["die Frau, deren Auto…","the woman whose car…"],["das Thema, über das wir sprechen","the topic we discuss"]],"checkpoint":{"prompt":"Die Frau, mit ___ ich spreche, ist nett.","options":["der","die","den"],"answer":0,"why":"Mit requires dative; feminine relative pronoun is der."}},{"level":"B2","title":"Complex argumentation","rule":"Use concessive and contrasting connectors to organize arguments. Mind verb placement.","examples":[["einerseits … andererseits","on the one hand … on the other"],["im Gegensatz dazu","in contrast"],["dennoch","nevertheless"]],"checkpoint":{"prompt":"___ die Kosten hoch sind, lohnt es sich.","options":["Obwohl","Weil","Damit"],"answer":0,"why":"Obwohl expresses concession, despite high costs."}},{"level":"B2","title":"Konjunktiv I and sources","rule":"Use Konjunktiv I in formal reporting to distinguish a source’s claim from your own assertion.","examples":[["Er sagte, er sei müde.","He said he was tired."],["Sie erklärte, sie habe Zeit.","She stated she had time."],["laut dem Bericht","according to the report"]],"checkpoint":{"prompt":"Die Sprecherin sagt, die Lage ___ stabil.","options":["sei","ist","wäre"],"answer":0,"why":"Konjunktiv I of sein for third-person singular is sei."}},{"level":"B2","title":"Register and politeness","rule":"Choose formal or informal register based on context; indirect questions are more polite and use verb-final order.","examples":[["Könnten Sie mir sagen…?","Could you tell me…?"],["Wäre es möglich…?","Would it be possible…?"],["Ich würde mich freuen.","I would be pleased."]],"checkpoint":{"prompt":"Wissen Sie, wann der Zug ___?","options":["kommt","kommen","komme"],"answer":0,"why":"Indirect question uses verb-final clause."}},{"level":"B2","title":"Text cohesion and precision","rule":"Use references, paraphrases and cohesive adverbs to avoid repetition and show relationships between claims.","examples":[["darüber hinaus","furthermore"],["folglich","consequently"],["hingegen","by contrast"]],"checkpoint":{"prompt":"Er hat wenig gelernt; ___ hat er bestanden.","options":["dennoch","deshalb","folglich"],"answer":0,"why":"Dennoch signals an unexpected result despite little study."}},{"level":"B2","title":"Passive voice","rule":"Past passive uses wurde + past participle.","examples":[["wird gemacht","is being done"],["wurde gemacht","was done"],["ist gemacht worden","has been done"]],"checkpoint":{"prompt":"Der Brief ___ gestern geschrieben.","options":["wird","wurde","würde"],"answer":1,"why":"Past passive uses wurde + past participle."}},{"level":"B2","title":"Advanced connectors","rule":"Obwohl introduces a concession: although.","examples":[["obwohl","although"],["dennoch","nevertheless"],["während","while"]],"checkpoint":{"prompt":"___ es regnete, gingen wir spazieren.","options":["Obwohl","Weil","Damit"],"answer":0,"why":"Obwohl introduces a concession: although."}},{"level":"B2","title":"Reported speech","rule":"Konjunktiv I (er habe) is used for reported speech.","examples":[["er habe gesagt","he reportedly said"],["sie sei gekommen","she reportedly came"],["laut Bericht","according to the report"]],"checkpoint":{"prompt":"Er sagt, er ___ keine Zeit.","options":["habe","hatte","hätte"],"answer":0,"why":"Konjunktiv I (er habe) is used for reported speech."}},{"level":"B2","title":"Nuanced vocabulary","rule":"Here allerdings emphasizes the statement: indeed.","examples":[["allerdings","indeed / however"],["hingegen","by contrast"],["durchaus","certainly / quite"]],"checkpoint":{"prompt":"Was bedeutet „allerdings“ hier: „Das ist allerdings schwierig“?","options":["however","indeed","possibly"],"answer":1,"why":"Here allerdings emphasizes the statement: indeed."}}];
let fullSession=null;
function fullMenu(level){ensureLearning();level=LEVELS.includes(level)?level:(state.learning.placement?.recommended||'A1');let list=FULL_UNITS.map((u,i)=>({...u,id:i})).filter(u=>u.level===level);let completed=state.learning.fullScores||{};app.innerHTML=illustratedHero('Complete '+level+' course','Structured units with teaching, listening, grammar and review.','village','hund.png')+`<section class="card"><label>Level <select onchange="fullMenu(this.value)">${LEVELS.map(l=>`<option ${l===level?'selected':''}>${l}</option>`).join('')}</select></label><p>${list.filter(u=>completed[u.id]?.passed).length}/${list.length} units passed · 75% to pass each unit</p><button class="secondary" onclick="placementResults()">Placement results</button></section>`+list.map((u,i)=>`<section class="unit-card"><div class="unit-badge">${level} · Unit ${i+1} of ${list.length}</div><h3>${safeText(u.title)} ${completed[u.id]?.passed?'✓':''}</h3><p>${safeText(u.rule.slice(0,115))}${u.rule.length>115?'…':''}</p><p class="muted">${completed[u.id]?'Best: '+completed[u.id].best+'/7':''}</p><button onclick="fullStudy(${u.id})">Study unit</button></section>`).join('');}
function fullStudy(id){let u=FULL_UNITS[id];if(!u)return;app.innerHTML=illustratedHero(u.title,`${u.level} · Guided lesson`,'forest',id%2?'katze.png':'hund.png')+`<section class="card"><h2>Understand the rule</h2><div class="unit-explain">${safeText(u.rule)}</div><h3>Examples</h3>${u.examples.map(([de,en])=>`<div class="vocab-row"><div class="vocab-copy"><strong>${safeText(de)}</strong><span>${safeText(en)}</span></div><button class="secondary" onclick="speak(${JSON.stringify(dlAudioExample(de)).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}<h3>Notice the pattern</h3><p>${safeText(u.checkpoint.why)}</p><button onclick="fullBegin(${id})">Start 7 exercises</button><button class="secondary" onclick="fullMenu('${u.level}')">Back to course</button></section>`;}
function fullQuestions(u){let es=u.examples;let q=[];for(let i=0;i<3;i++){let wrong=[es[(i+1)%3][1],es[(i+2)%3][1]];q.push({type:'translate',prompt:es[i][0],options:[es[i][1],...wrong],answer:0,why:`“${es[i][0]}” means “${es[i][1]}”. ${u.rule}`});}q.push({type:'grammar',prompt:u.checkpoint.prompt,options:u.checkpoint.options,answer:0,why:u.checkpoint.why});q.push({type:'listen',prompt:es[1][0],options:[es[1][1],es[0][1],es[2][1]],answer:0,why:`Listen for the complete phrase: ${es[1][0]} — ${es[1][1]}.`});let tokens=es[0][0].replace(/[.!?]$/,'').split(/\s+/);q.push({type:'order',prompt:es[0][1],tokens,answer:tokens,why:`The model sentence is “${es[0][0]}”. ${u.rule}`});q.push({type:'recall',prompt:'Which German phrase means: '+es[2][1]+'?',options:[es[2][0],es[0][0],es[1][0]],answer:0,why:`The phrase is “${es[2][0]}”.`});return q;}
function fullBegin(id){fullSession={id,idx:0,score:0,picks:[],results:[]};fullRender()}
function fullRender(){let s=fullSession;if(!s)return;let u=FULL_UNITS[s.id],qs=fullQuestions(u),q=qs[s.idx];if(!q)return fullFinish();s.picks=[];let type={translate:'Translate to English',grammar:'Grammar checkpoint',listen:'Listening comprehension',order:'Build the German sentence',recall:'Recall the German'}[q.type];let html=illustratedHero(u.title,`${type} · ${s.idx+1}/7`,'cafe',s.idx%2?'katze.png':'hund.png')+`<section class="card"><div class="unit-progress"><div style="width:${s.idx/7*100}%"></div></div><p class="muted">${type}</p><h3>${safeText(q.prompt)}</h3>`;if(q.type==='listen')html+=`<button onclick="speak(${JSON.stringify(q.prompt).replace(/"/g,'&quot;')})">🔊 Listen again</button>`;if(q.type==='order'){html+=`<p id="fullBuilt">Your sentence: —</p>`+q.tokens.map((t,i)=>`<button class="unit-chip" id="fullChip${i}" onclick="fullPick(${i})">${safeText(t)}</button>`).join('')+`<br><button class="secondary" onclick="fullRender()">Reset</button><button onclick="fullOrderCheck()">Check</button>`;}else html+=q.options.map((x,i)=>`<button class="secondary unit-choice" onclick="fullAnswer(${i})">${safeText(x)}</button>`).join('');html+=`<div id="fullFeedback" aria-live="polite"></div><button class="secondary" onclick="fullStudy(${s.id})">Review explanation</button></section>`;app.innerHTML=html;if(q.type==='listen')speak(q.prompt)}
function fullPick(i){let s=fullSession,q=fullQuestions(FULL_UNITS[s.id])[s.idx];if(s.picks.includes(i))return;s.picks.push(i);document.getElementById('fullChip'+i).disabled=true;document.getElementById('fullBuilt').textContent='Your sentence: '+s.picks.map(n=>q.tokens[n]).join(' ')}
function fullOrderCheck(){let s=fullSession,q=fullQuestions(FULL_UNITS[s.id])[s.idx];if(s.picks.length!==q.tokens.length){document.getElementById('fullFeedback').textContent='Use every word before checking.';return}fullMark(s.picks.map(n=>q.tokens[n]).join(' ')===q.answer.join(' '),q.answer.join(' '),q.why)}

<script>
(function(){
 const happy=['Sehr gut! Great job!','Wunderbar!','Richtig! You got it!','Weiter so! Keep going!'];
 const retry=['Almost! Check the explanation.','Try again—you can do it.','Look at the grammar rule.'];
 const greetings=['Hallo! Ready to learn?','Übung macht den Meister!','Tap me anytime!','Los geht’s!'];
 let timer=null,lastFeedback='',lastScene=null;
 function react(kind, message){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');if(!mascot)return;
  mascot.classList.remove('companion-happy','companion-think','companion-wave');
  void mascot.offsetWidth;
  mascot.classList.add(kind==='happy'?'companion-happy':kind==='think'?'companion-think':'companion-wave');
  hero.querySelector('.companion-bubble')?.remove();
  const bubble=document.createElement('div');bubble.className='companion-bubble';bubble.setAttribute('role','status');bubble.textContent=message;hero.appendChild(bubble);
  clearTimeout(timer);timer=setTimeout(()=>{bubble.remove();mascot.classList.remove('companion-happy','companion-think','companion-wave')},2600);
 }
 function check(){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');
  if(mascot&&!mascot.dataset.animated){mascot.dataset.animated='1';mascot.setAttribute('title','Tap for encouragement');mascot.setAttribute('role','button');mascot.setAttribute('tabindex','0');mascot.setAttribute('aria-label','Hear encouragement from your companion');const say=()=>react('wave',greetings[Math.floor(Math.random()*greetings.length)]);mascot.addEventListener('click',say);mascot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say()}})}
  if(hero!==lastScene){lastScene=hero;lastFeedback=''}
  const feedback=document.querySelector('#fullFeedback,#deepFeedback,#courseFeedback,#practiceFeedback,#listenFeedback,#articleFeedback,#sentenceFeedback,#placeFeedback');
  if(!feedback||!feedback.textContent.trim())return;
  const signature=feedback.textContent.trim();if(signature===lastFeedback)return;lastFeedback=signature;
  if(/^(correct|richtig)|correct!|unit passed/i.test(signature)||/Correct answer/i.test(signature)&&/Correct!/i.test(signature))react('happy',happy[Math.floor(Math.random()*happy.length)]);
  else if(/not quite|incorrect|try again|wrong/i.test(signature))react('think',retry[Math.floor(Math.random()*retry.length)]);
 }
 const observer=new MutationObserver(check);observer.observe(document.getElementById('app')||document.body,{subtree:true,childList:true,characterData:true});check();
})();
</script>

<script>

const NEW_QUESTIONS={"0": [["Meine Schwester ist ___ Jahre alt.", ["zwanzig", "zwanzigste", "zwanziger"], 0, "A person's age uses a cardinal number: zwanzig Jahre alt."], ["Wie alt ___ dein Bruder?", ["ist", "sind", "bist"], 0, "Dein Bruder is third-person singular, so use ist."]], "1": [["Das ist ___ Vater.", ["mein", "meine", "meinen"], 0, "Vater is masculine nominative; use mein."], ["Anna besucht ___ Schwester.", ["ihre", "ihr", "ihren"], 0, "Schwester is feminine accusative, so use ihre."]], "2": [["Ich hätte gern ___ Wasser.", ["ein", "einen", "eine"], 0, "Wasser is neuter: ein Wasser."], ["___ kostet der Kaffee?", ["Wie viel", "Wie viele", "Wo"], 0, "Wie viel asks about a price."]], "3": [["Der Termin ist ___ Montag.", ["am", "um", "im"], 0, "Use am with days of the week."], ["Der Zug fährt ___ acht Uhr.", ["um", "am", "in"], 0, "Use um with a clock time."]], "4": [["___ wohnst du?", ["Wo", "Wer", "Wann"], 0, "Wo asks about location."], ["___ heißt deine Lehrerin?", ["Wie", "Was", "Wohin"], 0, "Wie heißt ... asks for a name."]], "5": [["Ich habe ___ Auto.", ["kein", "nicht", "keine"], 0, "Kein negates an indefinite neuter noun: kein Auto."], ["Heute komme ich ___.", ["nicht", "kein", "keine"], 0, "Nicht negates the action of coming."]], "6": [["Jeden Morgen ___ ich Kaffee.", ["trinke", "trinkst", "trinkt"], 0, "Ich takes the -e verb ending."], ["Sie ___ um sechs Uhr auf.", ["steht", "stehen", "stehe"], 0, "Aufstehen is separable: sie steht ... auf."]], "7": [["Entschuldigung, wo ist ___ Bahnhof?", ["der", "die", "das"], 0, "Bahnhof is masculine: der Bahnhof."], ["Gehen Sie ___ links.", ["nach", "in", "zu"], 0, "Nach links means to the left."]], "8": [["___ Abend, Frau Müller!", ["Guten", "Gute", "Gut"], 0, "The greeting is Guten Abend."], ["Ich ___ aus Kanada.", ["komme", "kommt", "kommen"], 0, "With ich, the verb kommen takes the -e ending: ich komme. Ich komme aus Kanada means I come from Canada."]], "9": [["___ Fenster ist offen.", ["Das", "Der", "Die"], 0, "Fenster is neuter."], ["___ Zeitung liegt hier.", ["Die", "Das", "Der"], 0, "Zeitung is feminine; -ung is a common feminine ending."]], "10": [["Meine Freunde ___ in Hamburg.", ["wohnen", "wohnt", "wohnst"], 0, "Plural Freunde uses wohnen."], ["Du ___ gern Musik.", ["hörst", "hört", "höre"], 0, "Du takes -st."]], "11": [["Morgen ___ wir ins Kino.", ["gehen", "wir gehen", "geht"], 0, "After Morgen, the finite verb must come second."], ["Which sentence is correct?", ["Am Sonntag besuche ich Oma.", "Am Sonntag ich besuche Oma.", "Am Sonntag Oma ich besuche."], 0, "A main-clause finite verb is in second position."]], "12": [["Ich stelle die Tasse auf ___ Tisch.", ["den", "dem", "der"], 0, "Placing the cup answers wohin?; masculine accusative is den."], ["Die Jacke hängt an ___ Tür.", ["der", "die", "den"], 0, "A fixed location answers wo?; feminine dative is der."], ["Wir fahren in ___ Stadt.", ["die", "der", "den"], 0, "Movement toward a destination takes accusative: in die Stadt."]], "13": [["Du ___ hier nicht rauchen.", ["darfst", "dürfen", "darf"], 0, "Du darfst expresses permission/prohibition."], ["Wir ___ morgen früh aufstehen.", ["müssen", "muss", "musst"], 0, "Wir uses müssen."]], "14": [["Dieser Film ist ___ als der andere.", ["spannender", "spannendste", "spannend"], 0, "Comparisons with als use the comparative."], ["Von allen ist Lara ___ .", ["am schnellsten", "schneller", "schnell"], 0, "Am ... -sten expresses the superlative."]], "15": [["Ich ___ mich auf den Urlaub.", ["freue", "freut", "freuen"], 0, "Sich freuen is reflexive; ich freue mich."], ["Er wäscht ___ die Hände.", ["sich", "ihn", "ihm"], 0, "Sich die Hände waschen uses reflexive sich."]], "16": [["___ bitte die Tür!", ["Öffne", "Öffnest", "Öffnen"], 0, "Informal singular imperative: Öffne!"], ["___ Sie bitte hier.", ["Warten", "Wartet", "Warte"], 0, "Formal imperative uses infinitive + Sie."]], "17": [["Ich trage einen ___ Mantel.", ["roten", "roter", "rotes"], 0, "After einen, masculine accusative adjective ends -en."], ["Das ist ein ___ Haus.", ["kleines", "kleine", "kleinen"], 0, "After ein, neuter nominative adjective ends -es."]], "18": [["Nächste Woche ___ ich nach Köln fahren.", ["werde", "wirst", "wird"], 0, "Ich werde + infinitive expresses future."], ["Morgen ___ wir unsere Freunde.", ["besuchen", "besucht", "besuche"], 0, "Present tense can describe a planned future event."]], "19": [["Ich möchte ein Zimmer ___ zwei Nächte.", ["für", "mit", "nach"], 0, "Für introduces a duration or purpose."], ["Wo kann ich ___ einchecken?", ["mich", "mir", "mein"], 0, "Einchecken is often used reflexively: mich einchecken."]], "20": [["Ich sehe ___ Lehrer.", ["den", "dem", "der"], 0, "Lehrer is masculine; direct object takes den."], ["Wir kaufen ___ Banane.", ["eine", "einen", "ein"], 0, "Banane is feminine; accusative eine."]], "21": [["Ich fahre mit ___ Fahrrad.", ["dem", "das", "den"], 0, "Mit always takes dative; das Fahrrad → dem Fahrrad."], ["Sie gibt ___ Kind ein Geschenk.", ["dem", "das", "den"], 0, "Recipient is dative: dem Kind."]], "22": [["Gestern ___ wir viel gelernt.", ["haben", "sind", "werden"], 0, "Lernen forms Perfekt with haben."], ["Sie ist nach München ___.", ["gefahren", "gefährt", "fahren"], 0, "Fahren's past participle is gefahren."]], "23": [["Ich ___ meine Freundin heute ___.", ["rufe ... an", "anrufe ...", "rufe ... auf"], 0, "Anrufen splits: rufe ... an."], ["Wann ___ der Film ___?", ["fängt ... an", "anfängt ...", "fängt ... auf"], 0, "Anfangen splits in a main clause: fängt ... an."]]};
const originalQuestions=fullQuestions;
const seeded=(arr,seed)=>{let copy=[...arr];for(let i=copy.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
fullQuestions=function(u){
 let id=FULL_UNITS.indexOf(u),fresh=NEW_QUESTIONS[id];
 if(!fresh)return originalQuestions(u);
 let n=(state.learning?.fullAttempts?.[id]||0),base=originalQuestions(u);
 let newItems=fresh.map((row,i)=>{
  let [prompt,opts,answer,why]=row,correct=opts[answer],shuffled=seeded(opts,(id+1)*101+(n+1)*67+i*31);
  return {type:'grammar',prompt,options:shuffled,answer:shuffled.indexOf(correct),why};
 });
 // Mix unseen sentences with previously taught material; repeat attempts rotate question order.
 let mixed=[...newItems,...base.filter(q=>q.type==='grammar'||q.type==='order'),...base.filter(q=>q.type==='translate'||q.type==='listen'||q.type==='recall')];
 return seeded(mixed,(id+7)*1231+(n+1)*79).slice(0,7);
};
const originalBegin=fullBegin;
fullBegin=function(id){
 ensureLearning();state.learning.fullAttempts??={};state.learning.fullAttempts[id]=(state.learning.fullAttempts[id]||0)+1;save();
 originalBegin(id);
};
const originalRender=fullRender;
fullRender=function(){
 originalRender();
 if(!fullSession)return;
 let title=app.querySelector('.card .muted');
 if(title)title.insertAdjacentHTML('beforebegin',`<p class="dynamic-progress">Practice new sentences — not just the lesson examples.</p>`);
};
const originalMark=fullMark;
fullMark=function(ok,answer,why){
 originalMark(ok,answer,why);
 let box=document.querySelector('#fullFeedback .unit-explain');
 if(box)box.insertAdjacentHTML('beforeend',`<p class="muted">Focus on the grammar pattern so you can use it in sentences you haven't seen before.</p>`);
};
function fixBack(){
 let b=document.getElementById('screenBack');
 if(!b||b.dataset.fixed)return;
 b.dataset.fixed='yes';
 b.onclick=(e)=>{
  e.preventDefault();e.stopImmediatePropagation();
  let id=fullSession?.id;
  if(id!==undefined&&id!==null){fullStudy(id)}
  else if(app.querySelector('.lesson-welcome')){let title=app.querySelector('.lesson-welcome h2')?.textContent||'';let level=state.learning?.placement?.recommended||'A1';let u=FULL_UNITS.find(x=>title.includes(x.title));friendlyCourse(u?.level||level)}
  else home();
  window.scrollTo(0,0);
 };
}
new MutationObserver(fixBack).observe(app,{childList:true,subtree:false});fixBack();
})();
</script>

<script>

function pictureHome(){

 app.innerHTML=illustratedHero('Picture practice','See it. Name it. Remember the article.','forest','katze.png')
 +`<section class="card"><h2>What do you see?</h2><p>Look at a picture and choose the German word or type it yourself. Practice the article with every noun.</p><p class="muted">${saved.attempts} answers · ${saved.correct} correct</p><div class="picture-tabs"><button onclick="pictureStart('choice')">Choose the word</button><button onclick="pictureStart('type')">Type the word</button></div><p class="muted">32 everyday objects · German nouns with der, die and das.</p></section>`;

<script>

 }

const shuffle=(arr)=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
fullQuestions=function(unit){
 const id=FULL_UNITS.indexOf(unit),rows=freshBank[id]||[];
 return shuffle(rows).map(([prompt,options,correct,why])=>{
  const right=options[correct],opts=shuffle(options);
  return {type:'grammar',prompt,options:opts,answer:opts.indexOf(right),why};
 });
};
const startOriginal=fullBegin;
fullBegin=function(id){
 fullSession={id,idx:0,score:0,picks:[],results:[],questions:fullQuestions(FULL_UNITS[id])};
 fullRender();
};
// The original renderer and handlers call fullQuestions on each interaction.
// Keep one stable question set per attempt, preventing reshuffles while answering.
const freshQuestions=fullQuestions;
fullQuestions=function(unit){
 if(fullSession&&fullSession.id===FULL_UNITS.indexOf(unit)&&fullSession.questions)return fullSession.questions;
 return freshQuestions(unit);
};
const originalRender=fullRender;
fullRender=function(){
 let session=fullSession;if(!session)return;
 if(session.idx>=session.questions.length){fullFinish();return}
 originalRender();
 let counter=app.querySelector('.hero p');if(counter)counter.textContent=counter.textContent.replace(/\d+\/7/,`${session.idx+1}/${session.questions.length}`);
};
const originalNext=fullNext;
fullNext=function(){if(!fullSession)return;fullSession.idx++;fullRender()};

 let session=fullSession;if(!session||session.results.length!==session.idx)return;
 session.results.push(ok);if(ok)session.score++;
 app.querySelectorAll('.unit-choice,.unit-chip').forEach(b=>b.disabled=true);
 const last=session.idx===session.questions.length-1;
 document.getElementById('fullFeedback').innerHTML=`<div class="unit-explain"><strong>${ok?'Correct':'Not quite'}</strong><p>Answer: ${safeText(answer)}</p><p>Why: ${safeText(why)}</p></div><button onclick="fullNext()">${last?'See results':'Continue'}</button>`;
};
fullFinish=function(){

 const unit=FULL_UNITS[session.id],total=session.questions.length,passed=session.score>=Math.ceil(total*.8);
 ensureLearning();state.learning.fullScores??={};const old=state.learning.fullScores[session.id];
 state.learning.fullScores[session.id]={best:Math.max(old?.best||0,session.score),passed:passed||!!old?.passed,last:session.score,date:new Date().toISOString()};
 state.learning.fullMistakes??=[];session.results.forEach((ok,i)=>{if(!ok)state.learning.fullMistakes.push({unit:session.id,question:i,date:Date.now()})});
 state.learning.fullMistakes=state.learning.fullMistakes.slice(-250);save();
 app.innerHTML=illustratedHero('Lesson results',unit.title,'village','hund.png')+`<section class="card"><h2>${session.score}/${total} correct</h2><p>${passed?'Lesson passed.':'Review the rule and try again.'}</p><button onclick="fullStudy(${session.id})">Review lesson</button><button onclick="fullBegin(${session.id})">Try new questions</button><button class="secondary" onclick="fullMenu('${unit.level}')">All lessons</button></section>`;
 fullSession=null;
};

 ]

 app.innerHTML=`

<script>
/* Small synthesized feedback tones. No audio files or network connection required. */
let feedbackAudioContext;
function feedbackEnabled(){return localStorage.getItem('deutschlab-feedback-sounds')!=='off'}
function feedbackSound(correct){
 if(!feedbackEnabled())return;
 try{
  const AudioContextType=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextType)return;
  feedbackAudioContext??=new AudioContextType();
  if(feedbackAudioContext.state==='suspended')feedbackAudioContext.resume();
  const now=feedbackAudioContext.currentTime+.015;
  const notes=correct?[[523.25,0,.11],[659.25,.115,.11],[783.99,.23,.19]]:[[330,0,.13],[261.63,.15,.22]];
  notes.forEach(([freq,delay,duration])=>{
   let osc=feedbackAudioContext.createOscillator(),gain=feedbackAudioContext.createGain();
   osc.type=correct?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+delay);
   gain.gain.setValueAtTime(.0001,now+delay);
   gain.gain.exponentialRampToValueAtTime(correct?.12:.075,now+delay+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
   osc.connect(gain);gain.connect(feedbackAudioContext.destination);
   osc.start(now+delay);osc.stop(now+delay+duration+.02);
  });
 }catch(e){/* Silent fallback if audio is unavailable. */}
}
