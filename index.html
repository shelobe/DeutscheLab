<script>
/* Keep course navigation and individual lesson activities in distinct views. */
let activeLessonScreen=null;
function lessonScreenHeading(){
 if(activeLessonScreen===null)return;
 const u=FULL_UNITS[activeLessonScreen];if(!u)return;
 if(app.querySelector('.lesson-screen-heading'))return;
 const header=document.createElement('div');header.className='lesson-screen-heading';
 header.innerHTML=`<button class="secondary" onclick="leaveLessonScreen()">Back</button><div><strong>${safeText(u.title)}</strong><small>${u.level} · Lesson</small></div>`;
 app.prepend(header);
}
function leaveLessonScreen(){const go=()=>{let id=activeLessonScreen;activeLessonScreen=null;document.body.classList.remove('lesson-screen');curriculumView(FULL_UNITS[id]?.level||curriculumSelected)};if(activeLessonScreen!==null)dlAppConfirm({title:'Leave this lesson?',message:'Your current lesson progress will be lost.',cancelText:'Stay in Lesson',confirmText:'Leave Lesson',onConfirm:go});else go()}
const lessonOriginalStudy=fullStudy;
fullStudy=function(id){activeLessonScreen=id;document.body.classList.add('lesson-screen');lessonOriginalStudy(id);lessonScreenHeading();window.scrollTo(0,0)};
const lessonOriginalRender=fullRender;
fullRender=function(){lessonOriginalRender();if(activeLessonScreen!==null){document.body.classList.add('lesson-screen');lessonScreenHeading();window.scrollTo(0,0)}};
const lessonOriginalFinish=fullFinish;
fullFinish=function(){
 const session=fullSession;
 if(!session)return lessonOriginalFinish();
 const id=session.id,score=session.score,total=session.questions.length;
 lessonOriginalFinish();
 if(activeLessonScreen!==null){
  activeLessonScreen=null;document.body.classList.remove('lesson-screen');
  curriculumView(FULL_UNITS[id].level);
  const notice=document.createElement('section');notice.className='card';notice.setAttribute('role','status');
  notice.innerHTML=`<h2>Lesson complete</h2><p>${safeText(FULL_UNITS[id].title)} · ${score}/${total} correct</p><p>${score>=Math.ceil(total*.8)?'Lesson passed.':'Review the lesson and try again when ready.'}</p>`;
  app.prepend(notice);
  // Keep the next unfinished lesson visible after returning to the learning path.
  const nextRow=app.querySelector('.curriculum-next-lesson');
  if(nextRow){
    const module=nextRow.closest('details');
    if(module)module.open=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const header=document.querySelector('header');
      const headerHeight=header?Math.min(header.getBoundingClientRect().height,160):0;
      const top=Math.max(0,window.scrollY+nextRow.getBoundingClientRect().top-headerHeight-20);
      window.scrollTo({top,behavior:'instant'});
    }));
  }else window.scrollTo(0,0);
 }
};
const lessonOriginalMenu=curriculumView;
curriculumView=function(level){activeLessonScreen=null;document.body.classList.remove('lesson-screen');lessonOriginalMenu(level)};
const lessonOriginalHome=home;
home=function(){activeLessonScreen=null;document.body.classList.remove('lesson-screen');lessonOriginalHome()};
</script>

<script>
// Picture practice must use the bundled emoji bank, never absent SVG files or remote photos.
function reliablePictureMenu(){
 pictureSession=null;

function dlLessonIntro(id){

 <section class="dl-flow-card"><div class="dl-flow-label">${dlEscape(u.level)} · ${dlEscape(u.title)}</div><h2>What you'll learn</h2>
 ${u.title==='Everyday conversations: Understanding in context'?
 '<div class="dl-conversation-cards">'+[
  ['When you need help','These phrases help you ask for clarification politely.'],
  ['Ich verstehe die Frage nicht.','I do not understand the question.','ich — I','verstehe — understand','die Frage — the question','nicht — not','Swap die Frage for das Wort (the word) or den Satz (the sentence).'],
  ['Können Sie mir helfen?','Can you help me?','können — can','Sie — formal you','mir — me','helfen — help'],

 ].map((part,i)=>'<section class="dl-conversation-card"><h3>'+dlEscape(part[0])+'</h3><p>'+dlEscape(part[1])+'</p>'+(i?'<ul>'+part.slice(2).map(t=>'<li>'+dlEscape(t)+'</li>').join('')+'</ul>':'')+'</section>').join('')+'</div>':
 (u.level==='A2'&&u.title==='Accusative articles'?
 '<div class="dl-accusative-guide">'+
 '<section class="dl-accusative-intro"><h3>What is the accusative?</h3><p><strong>The accusative identifies the direct object</strong> — the person or thing receiving the action.</p><div class="dl-accusative-example"><span>Example</span><strong>Ich sehe <em>den Hund</em>.</strong><small>I see the dog.</small><p><strong>Ich</strong> is the subject (the person seeing). <strong>Den Hund</strong> is the direct object (the dog being seen), so it is in the <strong>accusative case</strong>. Because Hund is masculine, <strong>der</strong> changes to <strong>den</strong>.</p></div></section>'+
 '<section class="dl-accusative-panel"><h3>Definite articles <small>(the)</small></h3><table class="dl-article-table"><thead><tr><th>Gender</th><th>Before</th><th>Accusative</th></tr></thead><tbody><tr><td>Masculine</td><td>der</td><td><strong>den</strong></td></tr><tr><td>Feminine</td><td>die</td><td>die</td></tr><tr><td>Neuter</td><td>das</td><td>das</td></tr><tr><td>Plural</td><td>die</td><td>die</td></tr></tbody></table></section>'+
 '<section class="dl-accusative-panel"><h3>Indefinite articles <small>(a/an)</small></h3><table class="dl-article-table"><thead><tr><th>Gender</th><th>Before</th><th>Accusative</th></tr></thead><tbody><tr><td>Masculine</td><td>ein</td><td><strong>einen</strong></td></tr><tr><td>Feminine</td><td>eine</td><td>eine</td></tr><tr><td>Neuter</td><td>ein</td><td>ein</td></tr></tbody></table></section>'+
 '<section class="dl-accusative-tip"><strong>Remember:</strong> Only masculine articles change. <span>der → den · ein → einen</span></section>'+
 '</div>':
 (u.level==='A2'&&u.title==='Dative articles'?
 '<div class="dl-accusative-guide">'+
 '<section class="dl-accusative-intro"><h3>What is the dative?</h3><p>The <strong>dative case</strong> often identifies the indirect object — the person receiving something. Certain verbs and prepositions also require dative.</p><div class="dl-accusative-example"><span>Example</span><strong>Ich gebe <em>dem Mann</em> ein Buch.</strong><small>I give the man a book.</small><p><strong>Ich</strong> is the subject (who gives). <strong>Ein Buch</strong> is the direct object (what is given). <strong>Dem Mann</strong> is the indirect object (who receives it), so <strong>der Mann</strong> changes to <strong>dem Mann</strong>.</p></div></section>'+
 '<section class="dl-accusative-panel"><h3>Definite articles <small>(the)</small></h3><table class="dl-article-table"><thead><tr><th>Gender</th><th>Before</th><th>Dative</th></tr></thead><tbody><tr><td>Masculine</td><td>der</td><td><strong>dem</strong></td></tr><tr><td>Feminine</td><td>die</td><td><strong>der</strong></td></tr><tr><td>Neuter</td><td>das</td><td><strong>dem</strong></td></tr><tr><td>Plural</td><td>die</td><td><strong>den</strong></td></tr></tbody></table><p>Plural nouns usually add <strong>-n</strong>: die Kinder → den Kindern. Nouns already ending in -n or -s do not add another -n.</p></section>'+
 '<section class="dl-accusative-panel"><h3>Indefinite articles <small>(a/an)</small></h3><table class="dl-article-table"><thead><tr><th>Gender</th><th>Before</th><th>Dative</th></tr></thead><tbody><tr><td>Masculine</td><td>ein</td><td><strong>einem</strong></td></tr><tr><td>Feminine</td><td>eine</td><td><strong>einer</strong></td></tr><tr><td>Neuter</td><td>ein</td><td><strong>einem</strong></td></tr></tbody></table></section>'+
 '<section class="dl-accusative-panel"><h3>When do you use dative?</h3><p><strong>Common verbs:</strong> helfen (help), danken (thank), gefallen (be pleasing to).</p><p><strong>Common prepositions:</strong> mit (with), bei (at/near), nach (after/to), aus (out of/from), von (from/of), zu (to), seit (since/for).</p><div class="dl-accusative-example"><span>Examples</span><strong>Ich helfe der Frau.</strong><small>I help the woman. (helfen requires dative)</small><strong>Ich spreche mit dem Kind.</strong><small>I speak with the child. (mit requires dative)</small></div></section>'+
 '</div>':
 '<p>'+dlEscape(u.rule)+'</p>'))}<h3>See it in German</h3>
 ${u.examples.map(([de,en])=>`<div class="vocab-row"><div class="vocab-copy"><strong>${dlEscape(de)}</strong><span>${dlEscape(en)}</span></div><button class="secondary" onclick='speak(${JSON.stringify(dlAudioExample(de))})'>Listen</button></div>`).join('')}
 <button class="dl-flow-action" onclick="fullBegin(${id})">Start practice</button></section></div>`;
 window.scrollTo(0,0);
}

fullRender=function(){

 dlSelected=null;dlAnswered=false;dlShowTip=false;s.picks=[];
 activeLessonScreen=s.id;document.body.classList.add('lesson-screen');
 const pct=Math.round(100*s.idx/s.questions.length);
 app.innerHTML=`<div class="dl-flow"><div class="dl-flow-top"><button class="secondary" onclick="leaveLessonScreen()">Back</button><div class="dl-flow-progress" role="progressbar" aria-valuenow="${s.idx}" aria-valuemax="${s.questions.length}"><span style="width:${pct}%"></span></div></div>
 <div class="dl-flow-stats"><span>${dlEscape(u.level)} · ${dlEscape(u.title)}</span><span>${s.idx+1} of ${s.questions.length}</span></div>
 <section class="dl-flow-card"><div class="dl-flow-label">${q.type==='listen'?'LISTEN AND CHOOSE':'CHOOSE THE CORRECT ANSWER'}</div>
 <h2>${dlEscape(q.prompt)}</h2>

 <div class="dl-flow-options">${q.options.map((o,i)=>`<button id="dl-option-${i}" class="secondary" onclick="dlChoose(${i})">${dlEscape(o)}</button>`).join('')}</div>
 <div id="dl-result" aria-live="polite"></div>
 <button id="dl-check" class="dl-flow-action" disabled onclick="dlCheck()">Check answer</button>

 <button class="secondary" id="dl-help-btn" onclick="dlToggleTip()">Show grammar help</button>

};

function dlCheck(){

 const q=s.questions[s.idx],ok=dlSelected===q.answer;dlAnswered=true;
 s.results.push(ok);if(ok)s.score++;
 if(typeof feedbackSound==='function')feedbackSound(ok);
 app.querySelectorAll('.dl-flow-options button').forEach((b,i)=>{b.disabled=true;b.classList.remove('dl-selected');if(i===q.answer)b.classList.add('dl-correct');else if(i===dlSelected)b.classList.add('dl-wrong')});

const dlArticleTranslations = {

<script>
/* Session recovery: preserve the actual rendered activity, question and in-progress answers.
   Progress data remains in the existing deutschlab localStorage record. */
(function(){
 const KEY='deutschlab-active-screen-v3';
 const screen=document.getElementById('app');
 if(!screen)return;
 let restoring=false,savePending=false;
 function store(){
  if(restoring)return;
  try{
   const inputs=[...screen.querySelectorAll('input,textarea,select')].map((el,i)=>({i,value:el.type==='password'?'':el.value,checked:el.checked}));
   const session={version:2,html:screen.innerHTML,inputs,
    full:typeof fullSession!=='undefined'?fullSession:null,
    picture:typeof pictureSession!=='undefined'?pictureSession:null,
    game:typeof gameSession!=='undefined'?gameSession:null,
    module:typeof moduleSession!=='undefined'?moduleSession:null,
    dlSelected:typeof dlSelected!=='undefined'?dlSelected:null,
    dlAnswered:typeof dlAnswered!=='undefined'?dlAnswered:false,
    curriculum:typeof curriculumSelected!=='undefined'?curriculumSelected:'A1',
    scrollY:window.scrollY,updated:Date.now()};
   localStorage.setItem(KEY,JSON.stringify(session));
  }catch(e){console.warn('Session save unavailable',e)}
 }
 function schedule(){if(restoring||savePending)return;savePending=true;setTimeout(()=>{savePending=false;store()},40)}
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&saved.version===2&&typeof saved.html==='string'&&saved.html.length>20){
   restoring=true;
   if(typeof fullSession!=='undefined')fullSession=saved.full;
   if(typeof pictureSession!=='undefined')pictureSession=saved.picture;
   if(typeof gameSession!=='undefined')gameSession=saved.game;
   if(typeof moduleSession!=='undefined')moduleSession=saved.module;
   if(typeof dlSelected!=='undefined')dlSelected=saved.dlSelected;
   if(typeof dlAnswered!=='undefined')dlAnswered=saved.dlAnswered;
   if(typeof curriculumSelected!=='undefined')curriculumSelected=saved.curriculum;
   screen.innerHTML=saved.html;
   (saved.inputs||[]).forEach(({i,value,checked})=>{let el=screen.querySelectorAll('input,textarea,select')[i];if(el){if(el.type!=='password')el.value=value;el.checked=checked}});
   // Update the back button for the recovered activity, where supported.
   if(typeof navSync==='function')try{navSync()}catch(e){}
   requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,saved.scrollY||0)));
   restoring=false;
   const aiField=document.getElementById('aiKey');if(aiField)aiField.value=savedAIKey();
  }
 }catch(e){restoring=false;console.warn('Session restore unavailable',e)}
 new MutationObserver(schedule).observe(screen,{childList:true,subtree:true,attributes:true,characterData:true});
 document.addEventListener('click',e=>{if(screen.contains(e.target))setTimeout(store,80)},true);
 document.addEventListener('input',e=>{if(screen.contains(e.target))schedule()},true);
 document.addEventListener('change',e=>{if(screen.contains(e.target))schedule()},true);
 window.addEventListener('pagehide',store);
 window.addEventListener('scroll',()=>{if(!savePending)schedule()},{passive:true});
 if(!localStorage.getItem(KEY))store();
})();
</script>

<script>
/* Minimum six varied questions in each guided lesson; keep original bank and progress. */
(function(){
 const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
 const previousQuestions=fullQuestions;
 const focused={
  8:[
   ['Wie ___ du?',['heißt','heiße','heißen'],0,'With du, heißen becomes heißt.'],
   ['Ich ___ Lena.',['heiße','heißt','heißen'],0,'With ich, heißen becomes heiße.'],
   ['___ Morgen!',['Guten','Gute','Gutes'],0,'The standard morning greeting is Guten Morgen.'],
   ['Wie geht ___ dir?',['es','du','ich'],0,'The expression is Wie geht es dir? (How are you?)'],
   ['Ich ___ aus Deutschland.',['komme','kommt','kommen'],0,'With ich, kommen becomes komme.'],
   ['Which phrase means “Goodbye”?',['Auf Wiedersehen','Guten Morgen','Bitte'],0,'Auf Wiedersehen means goodbye.']
  ],
  9:[
   ['___ Buch liegt auf dem Tisch.',['Das','Der','Die'],0,'Buch is neuter: das Buch.'],
   ['___ Lampe ist hell.',['Die','Das','Der'],0,'Lampe is feminine: die Lampe.'],
   ['___ Tisch ist groß.',['Der','Die','Das'],0,'Tisch is masculine: der Tisch.'],
   ['___ Kind spielt.',['Das','Die','Der'],0,'Kind is neuter: das Kind.'],
   ['___ Katze schläft.',['Die','Der','Das'],0,'Katze is feminine: die Katze.'],
   ['___ Hund bellt.',['Der','Das','Die'],0,'Hund is masculine: der Hund.'],
   ['Which article is used with most plural nouns in the nominative?',['die','der','das'],0,'The nominative plural definite article is die, regardless of singular gender.']
  ]
 };
 function toQuestion(row){const [prompt,options,answer,why]=row;const correct=options[answer];const shuffled=shuffle(options);return {type:'grammar',prompt,options:shuffled,answer:shuffled.indexOf(correct),why};}
 fullQuestions=function(unit){
  const original=previousQuestions(unit),id=FULL_UNITS.indexOf(unit);
  if(fullSession?.id===id&&fullSession.questions)return fullSession.questions;
  const result=[...original],seen=new Set(result.map(q=>q.prompt));
  const extras=focused[id]||[];
  for(const row of shuffle(extras)){if(!seen.has(row[0])){result.push(toQuestion(row));seen.add(row[0]);}}
  if(result.length<6){
   const examples=unit.examples||[];
   for(let i=0;i<examples.length&&result.length<6;i++){
    const [de,en]=examples[i];
    const alternatives=examples.filter((_,j)=>j!==i).map(x=>x[1]);
    if(alternatives.length<2)continue;
    const prompt='What does “'+de+'” mean?';
    if(!seen.has(prompt)){
     result.push(toQuestion([prompt,[en,...alternatives.slice(0,2)],0,'“'+de+'” means “'+en+'”.']));seen.add(prompt);
    }
   }
   if(result.length<6&&examples.length>=3){
    for(let i=0;i<examples.length&&result.length<6;i++){
     const [de,en]=examples[i],prompt='Choose the German for “'+en+'”.';
     if(seen.has(prompt))continue;
     result.push(toQuestion([prompt,[de,...examples.filter((_,j)=>j!==i).map(x=>x[0]).slice(0,2)],0,'The German expression is “'+de+'”.']));seen.add(prompt);
    }
   }
  }
  return shuffle(result);
 };
 FULL_UNITS[9].rule='German nouns have three grammatical genders: der (masculine), die (feminine), and das (neuter). Learn each noun together with its article. In the nominative plural, the definite article is die.';
 FULL_UNITS[9].checkpoint.why='Tisch is masculine, so its nominative article is der. Compare die Lampe (feminine) and das Buch (neuter).';
 FULL_UNITS[8].rule='Use Hallo for an informal hello, Guten Morgen in the morning, Guten Tag during the day, and Auf Wiedersehen to say goodbye. To introduce yourself, say Ich heiße ... or Ich komme aus ... .';
})();
</script>

<script>
const dlSentenceGrammar = {
 'Die Katze schläft auf dem Bett.':'Die Katze is the subject. Schläft is the conjugated verb in second position. Auf dem Bett describes where the cat sleeps.',
 'Ich trinke morgens Wasser.':'Ich is the subject and trinke is the verb in second position. Morgens tells when; Wasser is the object.',
 'Wir gehen zum Bahnhof.':'Wir is the subject, followed by the conjugated verb gehen. Zum means zu dem (to the).',
 'Mein Bruder hat ein Fahrrad.':'Mein Bruder is the subject. Hat is the third-person singular form of haben (to have).',
 'Morgen kaufe ich Äpfel.':'Morgen comes first for emphasis, so the verb kaufe remains in second position, before ich.',
 'Sie liest ein Buch.':'Sie is the subject. Liest is the third-person singular form of lesen (to read).',
 'Die Kinder spielen draußen.':'Die Kinder is plural, so the verb is spielen. Draußen means outside.',
 'Ich suche meine Schlüssel.':'Ich takes the verb form suche. Meine Schlüssel is the plural object.',
 'Wir essen Brot und Käse.':'Wir takes essen. Und connects the two foods, Brot and Käse.',
 'Der Hund sitzt unter dem Tisch.':'Der Hund is the subject. Unter dem Tisch uses dative to describe a fixed location.',
 'Ich habe einen Hund':'Ich takes habe. Einen Hund is accusative because Hund is the direct object.',
 'Heute gehe ich einkaufen':'Heute occupies first position, so gehe comes second, before ich. Einkaufen stays at the end.',
 'Wir lernen Deutsch':'Wir is plural, so the verb is lernen. Deutsch is what we are learning.',
 'Die Katze schläft auf dem Sofa':'Die Katze is the subject, followed by schläft. Auf dem Sofa uses dative for a location.',
 'Morgen rufe ich dich an':'Morgen is first, rufe is second, and the separable prefix an goes at the end.'
};
function dlSentenceHelpToggle(){

 const explanation=dlSentenceGrammar[key] || (
  /\b(weil|dass|obwohl|wenn|damit)\b/i.test(key) ? 'This sentence includes a subordinate clause. In German, the conjugated verb normally moves to the end of that clause.' :
  /\b(habe|hat|haben|bin|ist|sind)\b.*\b(ge\w+|\w+t)\b/i.test(key) ? 'The perfect tense combines a form of haben or sein with a past participle, usually placed at the end.' :
  /\b(würde|wäre|hätte|könnte)\b/i.test(key) ? 'These are subjunctive forms used for hypothetical situations, wishes, or polite requests.' :
  /\b(muss|müssen|kann|können|will|möchte|soll)\b/i.test(key) ? 'With a modal verb, the modal is conjugated and the main verb stays in the infinitive at the end.' :
  /\b(heute|morgen|gestern|danach|trotzdem)\b/i.test(key) ? 'When a time word or adverb begins the main clause, the conjugated verb still stays in second position, before the subject.' :
  level==='B2' ? 'Look at how the clauses connect and how the verb forms express the relationship between events.' :
  level==='B1' ? 'Pay attention to clause order, the conjugated verb, and any prepositions or case endings.' :
  level==='A2' ? 'In a main clause, the conjugated verb takes second position. Check the verb ending and word order.' :
  'In a German main clause, the conjugated verb normally takes second position. Check that the subject and verb agree.'
 );
 box.textContent=explanation;

const dlOriginalGameRenderReverse = gameRender;
gameRender = function(){
  const g=gameSession;

  if(g.idx>=g.seq.length)return dlOriginalGameRenderReverse();
  g.answered=false;g.picked=[];g.matches=[];g.selected=null;

  g.reverseWords=item.en.replace(/[.!?]+$/,'').split(/\s+/);
  const correctSet=new Set(g.reverseWords.map(w=>w.toLowerCase()));
  const pool=['a','an','the','this','that','these','those','my','your','his','her','our','their','is','are','was','were','do','does','did','have','has','had','will','can','not','very','always','often','today','tomorrow','yesterday','here','there','with','for','from','to','at','in','on','and','but','because','book','books','house','school','work','like','likes','liked','learn','learning','learns','German','English','she','he','they','we','I','you'];
  const distractors=pool.filter(w=>!correctSet.has(w.toLowerCase()));
  for(let i=distractors.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[distractors[i],distractors[j]]=[distractors[j],distractors[i]];}
  g.bankWords=[...g.reverseWords,...distractors.slice(0,Math.min(3,Math.max(2,Math.ceil(g.reverseWords.length/3))))];
  g.order=g.bankWords.map((_,i)=>i);

  window.scrollTo(0,0);
};
function dlReversePick(i){

 const guess=g.picked.map(i=>g.bankWords[g.order[i]]).join(' ');

 gameMark(guess===expected,GAME_ITEMS[g.seq[g.idx]].en);
}

(function(){

 ['Ihr ___ am Samstag Fußball.',['spielt','spielen','spielst'],0,'With ihr, spielen becomes spielt.','You all play soccer on Saturday.'],

 ];

<script>
/* A1 foundations data pack. Keep the rest of the app and existing lesson IDs unchanged. */
const dlA1Pack = {loaded:false, promise:null, byTitle:new Map()};
async function dlLoadA1Pack(){
 if(dlA1Pack.loaded)return true;
 if(!dlA1Pack.promise)dlA1Pack.promise=fetch('./a1_foundations.json',{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
  .then(data=>{
    if(data.schemaVersion!==1||data.level!=='A1'||!Array.isArray(data.lessons))throw Error('Invalid A1 course data');
    for(const lesson of data.lessons){
      if(!lesson.title||!Array.isArray(lesson.questions)||lesson.questions.length<10)throw Error('Incomplete lesson '+lesson.title);
      for(const q of lesson.questions){if(!Array.isArray(q.options)||q.options.length!==3||!Number.isInteger(q.answer)||q.answer<0||q.answer>2||!q.german||!q.english)throw Error('Invalid question in '+lesson.title)}
      dlA1Pack.byTitle.set(lesson.title,lesson.questions);
    }
    dlA1Pack.loaded=true;return true;
  }).catch(e=>{console.error('A1 data pack failed to load:',e);dlA1Pack.promise=null;return false});
 return dlA1Pack.promise;
}
const dlA1PreviousQuestions=fullQuestions;
fullQuestions=function(unit){
 const bank=unit?.level==='A1'?dlA1Pack.byTitle.get(unit.title):null;
 if(!bank)return dlA1PreviousQuestions(unit);
 const questions=bank.map(q=>{
   const options=[...q.options];
   for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
   return {...q,options,answer:options.indexOf(q.options[q.answer])};
 });
 for(let i=questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}
 return questions.slice(0,12);
};
const dlA1PreviousBegin=fullBegin;
fullBegin=async function(id){
 const unit=FULL_UNITS[id];
 if(unit?.level==='A1' && ['Greetings and introductions','Nouns and articles','Present-tense verbs','Basic word order'].includes(unit.title)){

 }
 return dlA1PreviousBegin(id);
};

<script>
/* Review snapshots: persist the question, never an unstable shuffled index. */
(function(){
 const previousCheck=dlCheck;
 const stableKey=q=> 'snap:'+encodeURIComponent([q.prompt||'',(q.options||[])[q.answer]||''].join('|'));
 const snapshot=q=>({prompt:q.prompt,options:[...q.options],answer:q.answer,why:q.why||'',german:q.german||'',english:q.english||'',type:q.type||'',dlAudioWords:q.dlAudioWords||null,dlTarget:q.dlTarget||''});
 function pruneLegacy(p){
   // Legacy full:id:index records cannot be mapped reliably after randomization.
   for(const k of new Set([...Object.keys(p.mistakes||{}),...Object.keys(p.reviews||{})])){
     if(/^full:\d+:\d+$/.test(k)){delete p.mistakes[k];delete p.reviews[k];}
   }
 }
 dlCheck=function(){
   const s=fullSession,q=s?.questions?.[s.idx];
   if(q&&!dlAnswered&&dlSelected!==null){
     const p=practiceState();p.snapshots??={};p.mistakes??={};p.reviews??={};
     pruneLegacy(p);
     const key=stableKey(q),ok=dlSelected===q.answer;
     p.snapshots[key]=snapshot(q);
     if(ok){
       delete p.mistakes[key];
       const step=Math.min((p.reviews[key]?.step||0)+1,5);
       p.reviews[key]={step,due:Date.now()+[0,1,3,7,14,30][step]*86400000};
     }else{
       p.mistakes[key]=(p.mistakes[key]||0)+1;
       p.reviews[key]={step:0,due:Date.now()};
     }
     practiceLog(ok?10:2);
   }
   return previousCheck();
 };
 const oldHub=practiceHub,oldQuiz=practiceQuiz;
 function validKeys(p,mode){return (mode==='mistakes'?Object.keys(p.mistakes):Object.keys(p.reviews).filter(k=>p.reviews[k]?.due<=Date.now())).filter(k=>!k.startsWith('full:'));}
 practiceHub=function(){const p=practiceState();pruneLegacy(p);save();return oldHub();};
 let reviewSession=null;
 practiceQuiz=function(mode){
   const p=practiceState();pruneLegacy(p);save();
   const keys=validKeys(p,mode),key=keys.find(k=>k.startsWith('snap:')&&p.snapshots?.[k]);
   if(!key)return oldQuiz(mode);
   const q=p.snapshots[key];reviewSession={key,mode,q};
   const isAudio=q.type==='sound-choice'||(/^Which audio says /i.test(q.prompt)&&q.options?.every(o=>/^Audio \d+$/i.test(o)));
   if(isAudio){
    let words=q.dlAudioWords;
    if(!Array.isArray(words)||words.length!==q.options.length){
     const target=q.dlTarget||q.prompt.match(/[“"]([^”"]+)[”"]/)?.[1];
     const entry=(window.dlReviewSoundSets||[]).find(e=>e.words[e.target]===target);
     if(entry){
      const shift=(entry.target-q.answer+entry.words.length)%entry.words.length;
      words=entry.words.map((_,i)=>entry.words[(i+shift)%entry.words.length]);
     }
    }
    if(!Array.isArray(words)||words.length!==q.options.length){
     app.innerHTML=illustratedHero('Review a lesson question','Audio choices unavailable for this saved question','forest','katze.png')+`<section class="card"><p>This older question did not save enough audio information.</p><button onclick="practiceQuiz('${mode}')">Next review</button><button class="secondary" onclick="practiceHub()">Back</button></section>`;
     return;
    }
    reviewSession.audioWords=words;
   }
   app.innerHTML=illustratedHero('Review a lesson question','Practice the exact question you missed','forest','katze.png')+

<script>
/* Feedback de-duplication: explanations must teach, not restate translations. */
(function(){
  function current(){const s=fullSession;return s?.questions?.[s.idx]||null;}
  function clean(v){return String(v||'').replace(/[“”"'‘’]/g,'').replace(/\s+/g,' ').trim().toLowerCase().replace(/[.!?]+$/,'');}
  function isTranslationOnly(q){
    const why=clean(q?.why),de=clean(q?.german),en=clean(q?.english);
    if(!why)return true;
    if(de&&en&&(why.includes(de)&&why.includes(en)))return true;
    if(/^the correct sentence is\b|^the correct answer is\b|^the sentence means\b|^this means\b|^.+ means .+$/i.test(why))return true;
    return false;
  }
  function explanation(q){
    if(!q)return '';
    const de=String(q.german||'');
    if(/\bnicht\b/i.test(de)){
      if(/\bkomme nicht\b/i.test(de))return 'Nicht negates the action here. In this short main clause it follows the conjugated verb komme.';
      return 'Nicht negates a verb, adjective, or phrase. Its position depends on which part of the sentence is being negated.';
    }
    return isTranslationOnly(q)?'':String(q.why||'').trim();
  }
  function teachingHint(q){
    const prompt=String(q?.prompt||'');
    const options=(q?.options||[]).map(String);
    const all=(prompt+' '+options.join(' ')).toLowerCase();
    // A question asking for the meaning of a German word is vocabulary recognition,
    // not a German question-formation exercise. Inspect the quoted target first.
    const meaningMatch=prompt.match(/what does\s+[“"']([^”"']+)[”"']\s+mean/i);
    if(meaningMatch){
      const term=meaningMatch[1].trim().toLowerCase();
      if(['ich','du','er','sie','es','wir','ihr','sie (plural)','sie (formal)'].includes(term))
        return 'This lesson is about personal pronouns, which replace names. First person refers to the speaker, second person to the listener, and third person to someone else. German also distinguishes talking to one person (singular) from talking to several people (plural). Compare: du lernst (one person) and ihr lernt (several people).';
      if(['wer','was','wo','wann','warum','wie','woher','wohin'].includes(term))
        return 'This is question-word vocabulary. German has different words for asking about a person, a thing, a location, a time, a reason, or a manner. Think about what kind of information the word requests, rather than German sentence order.';
      if(/^(?:\d+|null|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|dreizehn|vierzehn|fünfzehn|sechzehn|siebzehn|achtzehn|neunzehn|zwanzig)$/.test(term))
        return 'This is a number-recognition exercise. Recall the counting sequence and compare nearby numbers; you do not need a sentence grammar rule.';
      return 'This asks for the meaning of a German vocabulary word. Recall where you learned it and compare the meanings of the options; verb endings and question word order are not relevant.';
    }
    // Hints describe transferable grammar, never reveal the selected answer.
    // Classify the actual task before inspecting distractor answers.
    // Vocabulary recognition should not trigger conjugation rules merely because
    // a distractor contains a pronoun or a verb.
    if(/choose the german for|what is the german for|translate (?:the word|\")/i.test(prompt)){
      if(/\b(i|you|he|she|it|we|they)\b[”"'.?! ]*$/i.test(prompt))return 'This is a personal-pronoun question. Pronouns stand in for people or things. German distinguishes the speaker (first person), the person being addressed (second person), and someone being talked about (third person). Match the English pronoun by person and number; no verb ending is needed here.';
      if(/\b(who|what|where|when|why|how)\b[”"'.?! ]*$/i.test(prompt))return 'This is a question-word vocabulary question. Decide whether the English word asks about a person, thing, place, time, reason, or manner. Then choose the corresponding German question word; you do not need to conjugate a verb.';
      if(/\b(?:zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|[0-9]+)\b/i.test(prompt))return 'This is a number-recognition question. Focus on the number itself rather than sentence grammar. German numbers from 13–19 often combine a unit with -zehn; from 21 onward, many numbers place the unit before und and the tens.';
      return 'This is a vocabulary question. Identify what the English word means and compare the meanings of the German choices. No verb conjugation or sentence word-order rule is needed.';
    }
    if(/where do you live|wo wohnst|wo wohnen/i.test(all))return 'Question-word questions use: question word + conjugated verb + subject. Wohnen means “to live.” With du (informal you), regular verbs usually end in -st; with Sie (formal you), they use the infinitive form. Compare: Wo arbeitest du? (Where do you work?)';
    if(/wie heißt|what is your name|heiße|heißen/i.test(all))return 'Heißen means “to be called.” Verb endings change with the subject: ich commonly takes -e, du commonly takes -st (with spelling adjustments), and wir/Sie take -en. In a question, the verb usually comes before the subject.';
    if(/nicht|kein/i.test(all))return 'Nicht negates verbs, adjectives, or a whole statement; kein negates nouns that would otherwise use ein/eine or no article. Compare: Ich komme nicht. (I am not coming.) / Ich habe kein Auto. (I have no car.)';
    if(/\b(der|die|das|ein|eine)\b/i.test(all)&&/___|article|choose/i.test(prompt))return 'German nouns have grammatical gender: der (masculine), die (feminine), das (neuter). The article also changes with grammatical case. Learn the article together with each noun rather than guessing from its English meaning.';
    if(/\b(ich|du|er|sie|wir|ihr)\b/i.test(all)&&/___|correct|choose/i.test(prompt))return 'Look at the subject first, then choose the matching verb ending. For most regular present-tense verbs: ich → -e, du → -st, er/sie/es → -t, wir/sie/Sie → -en. Example: ich lerne, du lernst, er lernt.';
    if(/where|when|what|who|why|how|\bwo\b|\bwann\b|\bwer\b|\bwarum\b/i.test(all))return 'For a German question with a question word, use question word + conjugated verb + subject. For yes/no questions, put the conjugated verb first. Example: Wann kommst du? / Kommst du morgen?';
    if(/word order|sentence|___/i.test(prompt))return 'In a normal German main clause, the conjugated verb takes the second position. If a time expression comes first, the subject moves after the verb: Heute lerne ich Deutsch. (Today I study German.)';
    return 'Look for the grammatical subject and the verb, then check their agreement and word order. In German main clauses, the conjugated verb normally occupies the second position; in yes/no questions, it comes first.';
  }
  function updateHelp(){
    const q=current(),tip=document.getElementById('dl-tip'),btn=document.getElementById('dl-help-btn');
    if(!tip||!btn||!q)return;
    const prompt=String(q.prompt||'');
    const target=(prompt.match(/what does\s+[“"']([^”"']+)[”"']\s+mean/i)||[])[1]||'';
    // Vocabulary recognition and straightforward phrase translation do not need grammar help.
    // Only show an explanation when the task tests a grammatical choice.
    const isRecall=/what does\s+[“"']|choose the german for|what is the german for|what is the english for|translate (?:this|the|into|to)|what does .* mean|match the (?:word|meaning)|which word means/i.test(prompt);
    const isGrammar=/\b(?:article|accusative|dative|nominative|plural form|possessive|conjugat|verb form|word order|correct sentence|correct ending|negat|separable|modal verb|fill in the blank)\b/i.test(prompt)
      || /_{2,}/.test(prompt)
      || /\b(?:der|die|das|den|dem|des|ein|eine|einen|einem|kein|keine|nicht)\b/i.test(prompt) && /\b(?:choose|correct|complete|fill)\b/i.test(prompt);
    const show=!isRecall && isGrammar;
    btn.hidden=!show;
    tip.hidden=true;
    btn.textContent='Show grammar explanation';
    const heading=tip.querySelector('strong');if(heading)heading.textContent='Grammar explanation';
    const paragraph=tip.querySelector('p');if(paragraph&&show)paragraph.textContent=teachingHint(q);
  }
  const previousRender=fullRender;
  fullRender=function(){const result=previousRender.apply(this,arguments);updateHelp();return result;};
  const previousCheck=dlCheck;
  dlCheck=function(){
    const q=current(),answer=q?.options?.[q.answer];
    const result=previousCheck.apply(this,arguments);
    if(!q||!dlAnswered)return result;
    const box=document.querySelector('#dl-result .dl-flow-feedback');
    if(!box)return result;
    const paragraphs=[...box.querySelectorAll(':scope > p')];
    // Correct choice is already highlighted above; do not repeat it.
    if(paragraphs[0]&&clean(paragraphs[0].textContent)===clean(answer))paragraphs[0].remove();
    // Translation-only 'why' is redundant; reserve explanation for actual grammar.
    if(paragraphs[1]){
      const detail=explanation(q);
      if(detail)paragraphs[1].textContent=detail;
      else paragraphs[1].remove();
    }
    const prompt=clean(q.prompt),options=(q.options||[]).map(clean);
    const hasGerman=!!q.german&&(prompt.includes(clean(q.german))||options.includes(clean(q.german)));
    const hasEnglish=!!q.english&&(prompt.includes(clean(q.english))||options.includes(clean(q.english)));
    // Only display a translation when it supplies a language missing from the exercise.
    box.querySelectorAll('.dl-a1-translation,.dl-article-translation').forEach(block=>{
      if(hasGerman&&hasEnglish){block.remove();return;}
      const lines=[...block.querySelectorAll('p')];
      for(const line of lines){
        const label=line.querySelector('strong')?.textContent?.toLowerCase()||'';
        if((hasGerman&&/german/.test(label))||(hasEnglish&&/english/.test(label)))line.remove();
      }
      if(!block.querySelector('p'))block.remove();
    });
    // After checking, the feedback card already provides the grammar explanation.
    // Do not show the same explanation a second time below it.
    const grammarTip=document.getElementById('dl-tip');
    const grammarButton=document.getElementById('dl-help-btn');
    if(grammarTip)grammarTip.hidden=true;
    if(grammarButton)grammarButton.hidden=true;
    return result;
  };
})();
</script>

   });
  }
 };
})();

ld like ...) when ordering.", "examples": [["das Brot", "bread"], ["das Wasser", "water"], ["der Apfel", "apple"], ["die Milch", "milk"], ["Ich möchte Wasser.", "I would like water."]], "checkpoint": {"prompt": "What does das Brot mean?", "options": ["water", "bread", "milk"], "answer": 1, "why": "Das Brot means bread."}}, {"level": "A1", "title": "Places around town", "rule": "Useful destinations include der Bahnhof, die Schule, der Supermarkt, das Café, das Krankenhaus. Ask Wo ist ...? to find a place.", "examples": [["der Bahnhof", "train station"], ["die Schule", "school"], ["der Supermarkt", "supermarket"], ["das Café", "café"], ["Wo ist der Bahnhof?", "Where is the train station?"]], "checkpoint": {"prompt": "What does der Bahnhof mean?", "options": ["school", "train station", "café"], "answer": 1, "why": "Der Bahnhof is the train station."}}];

<script>
(function(){
 const contrasts=[
  {words:['schon','schön','Sohn'],target:'schön',why:'The ö in schön is a rounded front vowel. Compare it with the plain o in schon and Sohn.'},
  {words:['Mutter','Mütter','Meter'],target:'Mütter',why:'ü is different from u: round your lips while keeping your tongue forward. Compare Mutter and Mütter.'},
  {words:['Kuchen','Küche','Kirche'],target:'Küche',why:'Küche has ü, while Kuchen has u. Listen to how the vowel changes.'},
  {words:['Straße','Strauß','Stress'],target:'Straße',why:'At the start of Straße, str sounds like shtr. The letter ß makes a sharp s sound.'},
  {words:['ich','ach','auch'],target:'ich',why:'The ch in ich is a soft sound made near the front of the mouth, unlike the back-of-the-mouth ch in ach.'},
  {words:['mein','Miene','Mann'],target:'mein',why:'ei sounds like English eye, while ie makes a long ee sound. Listen to mein and Miene.'},
  {words:['neun','nein','nun'],target:'neun',why:'eu sounds similar to oy in English boy; ei sounds like eye.'},
  {words:['zwei','drei','frei'],target:'zwei',why:'German z begins with a ts sound, as in zwei.'}
 ];
 const priorBegin=fullBegin;
 fullBegin=function(id){

  if(!session||!unit||unit.level!=='A1'||!/(umlaut|pronunc|sounds? of|alphabet|spelling)/i.test(String(unit.title||'')))return;

   if(!/(choose the german for|what does|which word means|what is the meaning|translate|means “|means ")/i.test(String(q.prompt||'')))return q;
   const c=contrasts[(i+changed)%contrasts.length];changed++;
   const rotation=(i+changed)%3;

   return {type:'sound-choice',prompt:'Which audio says “'+c.target+'”?',options:['Audio 1','Audio 2','Audio 3'],answer:words.indexOf(c.target),why:c.why,dlAudioWords:words,dlTarget:c.target};

<!-- Native-speaker audio pilot: Mutter/Mütter. The single audio file is stored beside index.html. -->
<script>
(function(){
 const clips={Mutter:[0,1.46], 'Mütter':[1.96,3.44]};
 // Two clips separated by 0.5 seconds of silence.
 const sprite='deutschlab-native-audio.ogg';
 let active=null;
 const oldSpeak=speak;
 speak=function(text,rate=1){
  const word=String(text||'').trim();
  const range=clips[word];
  if(!range){if(rate===1)return oldSpeak(text);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='de-DE';u.rate=rate;speechSynthesis.speak(u);return}catch(e){return oldSpeak(text)}}
  try{
   if(active){active.pause();active=null;}
   if('speechSynthesis' in window)speechSynthesis.cancel();
   const player=new Audio(sprite);player.playbackRate=rate;active=player;
   player.preload='auto';
   const start=range[0],end=range[1];
   const begin=()=>{player.currentTime=start;player.play().catch(()=>oldSpeak(text));};
   player.addEventListener('loadedmetadata',begin,{once:true});
   player.addEventListener('timeupdate',()=>{if(player.currentTime>=end){player.pause();if(active===player)active=null;}});
   player.addEventListener('error',()=>{if(active===player)active=null;oldSpeak(text);},{once:true});
   player.load();
  }catch(e){oldSpeak(text);}
 };
})();
</script>

<script>
/* Reviews assess taught skills. Transfer questions reuse a taught grammar rule, never next-module vocabulary. */
(function(){
 const prior=curriculumReview;
 function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 function isSoundGloss(x){return /\([^)]*(sounds? like|pronounced|letter|vowel|different from|compare|unlike)[^)]*\)/i.test(String(x));}

  const make=(prompt,options,correct,why,audio)=>{const opts=shuffle(options.slice());return {type:'grammar',unitId:id,prompt,options:opts,answer:opts.indexOf(correct),why,...(audio?{dlReviewAudio:audio}:{})};};

   make('Listen to the first sound. Which German letter makes it?',['J','W','V'],'J','Junge begins with J, pronounced like English Y.','Junge'),
   make('You encounter “Wolke” (cloud) for the first time. How is W pronounced?',['Like English V','Like English W','Like English F'],'Like English V','German W sounds like English V.'),
   make('Listen to the vowel sound. Which German letter produces it?',['ö','o','ü'],'ö','Schön uses ö, a rounded front vowel.','schön'),
   make('In the new word “Vogel” (bird), how is the initial V usually pronounced?',['Like English F','Like English V','Like English Y'],'Like English F','Vogel begins with an F sound.'),
   make('Listen to the vowel sound. Which German letter produces it?',['ü','u','ö'],'ü','Fünf contains the vowel ü.','fünf'),
   make('What changes when you write schon as schön?',['The pronunciation and meaning','Only the capitalization','Nothing; they are interchangeable'],'The pronunciation and meaning','Schon means already; schön means beautiful.'),
   make('Listen to the first vowel sound. Which German letter produces it?',['ä','a','ö'],'ä','Mädchen contains ä.','Mädchen'),
   make('You see the unfamiliar word “Fuß” (foot). What sound does ß represent?',['An s sound','A b sound','A z sound'],'An s sound','ß represents a voiceless s sound.'),
   make('Listen to the first sound. Which German letter makes it?',['W','V','J'],'W','Wasser begins with W, pronounced like English V.','Wasser'),
   make('Listen to the German word. Which vowel sound do you hear?',['ü','u','ö'],'ü','The word grün contains the German ü vowel.','grün')

 }
 curriculumReview=function(level,n){
  prior(level,n);
  const s=moduleSession,g=STRUCTURED_PATH[level]?.[n];
  if(!s||!g||level!=='A1')return;
  // A module review must never draw its bonus from the following module.
  s.questions=s.questions.filter(q=>!q.dlStretch);
  const clean=[];
  const seen=new Set();

   const u=FULL_UNITS[id];if(!u)continue;

    if(opts.some(x=>!x)||new Set(opts.map(x=>x.toLowerCase())).size!==opts.length)continue;
    clean.push({...q,options:opts,unitId:id});
   }
  }

  const taughtRule=g.ids.some(id=>/regular (?:present|verb)|present.tense (?:verb|ending)|verb endings|conjugat(?:e|ion|ing)/i.test(FULL_UNITS[id]?.rule||''));
  if(taughtRule){
   const choices=shuffle([{subject:'du',form:'spielst',stem:'spiel',ending:'-st'}, {subject:'er',form:'spielt',stem:'spiel',ending:'-t'}, {subject:'ich',form:'spiele',stem:'spiel',ending:'-e'}]);
   const target=choices[0];
   const opts=shuffle(['spiele','spielst','spielt']);
   clean.push({type:'grammar',unitId:g.ids[0],prompt:`Apply the verb ending you learned: ${target.subject} ___ (spielen = to play)`,options:opts,answer:opts.indexOf(target.form),why:`Spielen means “to play.” The subject ${target.subject} takes the regular present-tense ending ${target.ending}, so spiel- becomes ${target.form}.`,dlTransfer:true});
  }

   const isAlphabet=n===0&&/alphabet|spelling/i.test(g.title||'');
   const candidates=isAlphabet?soundReview(g.ids[0]):clean;

   const buckets=new Map();
   for(const q of shuffle(candidates)){
    const kind=q.type==='grammar'?'grammar':/what does|translate|mean\?/i.test(q.prompt)?'translation':/which|choose|select/i.test(q.prompt)?'recognition':'other';
    if(!buckets.has(kind))buckets.set(kind,[]);
    buckets.get(kind).push(q);
   }
   const mixed=[];
   while(mixed.length<10&&[...buckets.values()].some(a=>a.length)){
    for(const bucket of buckets.values())if(bucket.length&&mixed.length<10)mixed.push(bucket.shift());
   }

   s.idx=0;s.score=0;s.answered=false;s.dlCoreScore=0;s.dlCoreCount=s.questions.length;s.dlMissed=[];

<script id="dl-a1-alphabet-lesson-one-scope-fix">
(function(){
 const lesson=FULL_UNITS.find(u=>u.level==='A1'&&u.title==='Alphabet and spelling');
 if(!lesson)return;
 lesson.rule='German uses the same 26 basic letters as English, but some are pronounced differently. German J sounds like English Y in yes; W sounds like English V; and V often sounds like English F. Listen to Januar, Wasser and Vater, then practice recognizing those sounds. German also has additional letters, which you will learn in Lesson 2.';
 lesson.examples=[['Januar','January — J sounds like English Y'],['Wasser','water — W sounds like English V'],['Vater','father — V often sounds like English F']];
 lesson.checkpoint={prompt:'In the German word Wasser, which letter makes the English V sound?',options:['W','J','V'],answer:0,why:'German W is pronounced like English V, as in Wasser.'};
 const questions=[
  ['Which letter in German usually sounds like English Y?', ['J','W','V'],0,'German J sounds like English Y, as in Jahr (year).'],
  ['In the new word Jahr (year), how does the first letter sound?', ['Like English Y','Like English J','Like English V'],0,'J in Jahr sounds like English Y.'],
  ['Which German letter usually sounds like English V?', ['W','J','V'],0,'German W sounds like English V.'],
  ['In Winter (winter), how is the first letter pronounced?', ['Like English V','Like English W','Like English F'],0,'W in Winter sounds like English V.'],
  ['Which German letter often sounds like English F?', ['V','W','J'],0,'German V often sounds like English F, as in Vogel (bird).'],
  ['In Vogel (bird), which English sound begins the word?', ['F','V','Y'],0,'The V in Vogel is usually pronounced like English F.'],
  ['Which pair starts with the same German letter sound?', ['Wasser and Winter','Vater and Jahr','Jahr and Wasser'],0,'Wasser and Winter both begin with German W, which sounds like English V.']
 ];
 const speaking=[
  ['Jahr','year','German J sounds like English Y. Listen to Jahr, then say it aloud.'],
  ['Winter','winter','German W sounds like English V. Listen to Winter, then say it aloud.'],
  ['Vogel','bird','German V often sounds like English F. Listen to Vogel, then say it aloud.']
 ];
 const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
 const oldBegin=fullBegin;
 fullBegin=function(id){
  const result=oldBegin.apply(this,arguments);
  if(FULL_UNITS[id]!==lesson||!fullSession)return result;
  const knowledge=shuffle(questions).map(([prompt,choices,right,why])=>{
   const correct=choices[right],options=shuffle(choices);
   return {type:'grammar',prompt,options,answer:options.indexOf(correct),why};
  });
  const speakingChecks=speaking.map(([word,meaning,why])=>({type:'speak-word',prompt:'Listen, then say this German word aloud',options:['Recognized','Try again'],answer:0,dlSpeakWord:word,dlSpeakMeaning:meaning,why}));
  // Alternate recognition and spoken production, with each new word introduced by its meaning.
  fullSession.questions=[...knowledge.slice(0,2),speakingChecks[0],...knowledge.slice(2,4),speakingChecks[1],...knowledge.slice(4,6),speakingChecks[2],...knowledge.slice(6)];
  fullSession.idx=0;fullSession.score=0;fullSession.results=[];
  fullRender();
  return result;
 };
 const oldStudy=fullStudy;
 fullStudy=function(id){
  const result=oldStudy.apply(this,arguments);
  if(FULL_UNITS[id]===lesson){
   document.querySelectorAll('.dl-alphabet-audio,.dl-letters-intro').forEach(el=>el.remove());
  }
  return result;
 };
})();
</script>

 u.examples=[['Ich verstehe die Frage nicht.','I do not understand the question.'],['Ich verstehe das Wort nicht.','I do not understand the word.'],['Können Sie mir helfen?','Can you help me?'],['Sprechen Sie bitte langsam.','Please speak slowly.'],['Ich verstehe den Satz nicht.','I do not understand the sentence.'],['Können Sie das bitte wiederholen?','Could you please repeat that?']];

 };

 if(module){const pos=module.ids.indexOf(83);module.ids.splice(pos,0,id);module.context='Build your own sentences first, then use practical phrases to ask for help and clarification.';}

<script id="dl-a1-foundations-and-dialogues">
(function(){
 const specs=[
  {title:'Personal pronouns and verb endings',module:'Getting started',at:2,rule:'The subject tells who acts: ich (I), du (you), er/sie/es (he/she/it), wir (we), ihr (you plural), sie/Sie (they/formal you). Regular verbs change endings: ich lerne, du lernst, er lernt, wir lernen, ihr lernt, sie lernen.',examples:[['Ich lerne Deutsch.','I learn German.'],['Du lernst Deutsch.','You learn German.'],['Wir lernen zusammen.','We learn together.']],questions:[['Choose the correct form: Du ___ Deutsch.',['lernst','lerne','lernen'],0,'Du takes -st.'],['Which pronoun means “we”?',['wir','ihr','sie'],0,'Wir means we.'],['Choose: Er ___ heute.',['arbeitet','arbeiten','arbeite'],0,'Er takes -t.'],['Choose: Wir ___ Deutsch.',['lernen','lernt','lernst'],0,'Wir takes -en.'],['Which is formal “you”?',['Sie','du','ihr'],0,'Capitalized Sie is formal you.'],['Choose: Ich ___ hier.',['wohne','wohnt','wohnen'],0,'Ich takes -e.'],['Choose: Ihr ___ zusammen.',['lernt','lernen','lernst'],0,'Ihr takes -t.']]},
  {title:'Sein and haben in everyday sentences',module:'Getting started',at:3,rule:'Sein means to be: ich bin, du bist, er/sie ist, wir sind, ihr seid, sie/Sie sind. Haben means to have: ich habe, du hast, er/sie hat, wir haben, ihr habt, sie/Sie haben. These are irregular and must be learned as patterns.',examples:[['Ich bin müde.','I am tired.'],['Du hast Zeit.','You have time.'],['Wir sind zu Hause.','We are at home.']],questions:[['Ich ___ müde.',['bin','bist','ist'],0,'Ich bin means I am.'],['Du ___ Zeit.',['hast','hat','habe'],0,'Du hast means you have.'],['Wir ___ zu Hause.',['sind','seid','ist'],0,'Wir sind means we are.'],['Er ___ einen Hund.',['hat','hast','haben'],0,'Er hat means he has.'],['Ihr ___ freundlich.',['seid','sind','bist'],0,'Ihr seid means you all are.'],['Sie (formal) ___ Zeit.',['haben','hat','hast'],0,'Formal Sie uses haben.'],['Ich ___ eine Katze.',['habe','hat','hast'],0,'Ich habe means I have.']]},
  {title:'Direct objects: der, den and einen',module:'Where you’re from and first sentences',at:3,rule:'A subject does the action; a direct object receives it. Masculine articles change in the accusative: der → den and ein → einen. Feminine die/eine and neuter das/ein stay the same. Example: Der Mann kauft einen Apfel.',examples:[['Ich sehe den Hund.','I see the dog.'],['Ich kaufe einen Apfel.','I buy an apple.'],['Sie hat eine Katze.','She has a cat.']],questions:[['Ich sehe ___ Hund.',['den','der','das'],0,'Hund is masculine and the direct object, so use den.'],['Ich kaufe ___ Apfel.',['einen','ein','eine'],0,'Apfel is masculine: ein changes to einen.'],['Sie hat ___ Katze.',['eine','einen','ein'],0,'Katze is feminine: eine remains eine.'],['___ Hund schläft.',['Der','Den','Einen'],0,'The dog is the subject, so der.'],['Ich brauche ___ Buch.',['ein','einen','eine'],0,'Buch is neuter: ein remains ein.'],['Wir besuchen ___ Mann.',['den','der','die'],0,'Mann is a masculine direct object.'],['Which word is the object in “Ich trinke Wasser”?',['Wasser','Ich','trinke'],0,'Wasser is what is being drunk.']]},
  {title:'Modal verbs and polite requests',module:'Everyday conversations',at:0,rule:'Modal verbs express ability, necessity and wishes. Können = can, müssen = must, wollen = want. Möchten is the polite way to say would like. Conjugate the modal in position two and place the second verb in its infinitive form at the end: Ich kann Deutsch sprechen.',examples:[['Ich kann Deutsch sprechen.','I can speak German.'],['Ich muss heute arbeiten.','I must work today.'],['Ich möchte einen Tee.','I would like a tea.']],questions:[['Ich ___ Deutsch sprechen.',['kann','können','kannst'],0,'Ich kann; sprechen stays at the end.'],['Du ___ gehen.',['musst','muss','müssen'],0,'Du musst means you must.'],['Which is the polite request?',['Ich möchte Wasser.','Ich wollen Wasser.','Ich muss Wasser.'],0,'Möchte expresses would like.'],['Wir ___ heute lernen.',['wollen','will','wollt'],0,'Wir wollen; lernen stays at the end.'],['Where does sprechen go in “Ich kann Deutsch sprechen”?',['At the end','Before ich','Immediately after ich'],0,'With a modal verb, the second verb is an infinitive at the end.'],['Er ___ heute arbeiten.',['muss','musst','müssen'],0,'Er muss means he must.'],['___ Sie mir helfen?',['Können','Kann','Kannst'],0,'Formal Sie takes können.']]},
  {title:'Separable verbs for daily routines',module:'People and everyday life',at:2,rule:'Some German verbs have a separable prefix. In a main-clause statement, conjugate the verb stem in second position and move the prefix to the end: aufstehen → Ich stehe um sieben Uhr auf. With a modal, the whole infinitive stays together: Ich muss früh aufstehen.',examples:[['Ich stehe um sieben Uhr auf.','I get up at seven.'],['Wir kaufen heute ein.','We shop today.'],['Ich muss früh aufstehen.','I must get up early.']],questions:[['Ich ___ um sieben Uhr ___.',['stehe / auf','auf / stehe','stehen / auf'],0,'Stehe is second and auf goes at the end.'],['Wir ___ heute ___.',['kaufen / ein','ein / kaufen','kauft / ein'],0,'Wir kaufen ... ein.'],['Choose the correct sentence.',['Ich rufe dich an.','Ich anrufe dich.','Ich rufe an dich.'],0,'The prefix an moves to the end.'],['With a modal: Ich muss früh ___.',['aufstehen','stehe auf','auf stehe'],0,'After muss, the complete infinitive stays together.'],['What is the infinitive of “ich stehe auf”?',['aufstehen','stehenauf','steheauf'],0,'The prefix is attached in the infinitive.'],['Er ___ seine Mutter ___.',['ruft / an','rufen / an','an / ruft'],0,'Er ruft ... an.'],['Choose the correct sentence.',['Heute kaufe ich ein.','Heute ich kaufe ein.','Heute ein kaufe ich.'],0,'The conjugated verb stays second; prefix goes last.']]},
  {title:'Prepositions for places and movement',module:'Getting around',at:0,rule:'Prepositions connect places and movement. In = in; auf = on; mit = with/by; nach = to (most cities and countries); zu = to (people and destinations); aus = from. Some require a particular case: mit dem Bus, zu der Schule (zur Schule). Learn each phrase as a unit.',examples:[['Ich fahre mit dem Bus.','I travel by bus.'],['Wir fahren nach Berlin.','We travel to Berlin.'],['Ich gehe zur Schule.','I go to school.']],questions:[['Ich fahre ___ Berlin.',['nach','mit','aus'],0,'Nach is used for most cities.'],['Ich fahre ___ dem Bus.',['mit','nach','zu'],0,'Mit dem Bus means by bus.'],['Ich komme ___ Deutschland.',['aus','nach','mit'],0,'Aus means from.'],['Ich gehe ___ Schule.',['zur','nach','mit'],0,'Zur Schule means to school.'],['Das Buch liegt ___ dem Tisch.',['auf','nach','aus'],0,'Auf means on.'],['Ich wohne ___ Berlin.',['in','nach','mit'],0,'In Berlin means in Berlin.'],['Ich gehe ___ meiner Freundin.',['zu','nach','aus'],0,'Zu indicates going to a person.']]}
 ];

 fullStudy=function(id){

 };
 // Brief, reusable character dialogues inside the existing course lessons.
 const dialogues={
  'Greetings and introductions':[['Katze','Hallo! Wie heißt du?'],['Hund','Ich heiße Fritzi. Und du?'],['Katze','Ich heiße Minka. Freut mich!']],

  'Daily routines':[['Katze','Wann stehst du auf?'],['Hund','Ich stehe um sieben Uhr auf.'],['Katze','Und wann arbeitest du?'],['Hund','Um acht Uhr.']],
  'Everyday conversations: Understanding in context':[['Katze','Können Sie mir helfen?'],['Hund','Ja, natürlich.'],['Katze','Sprechen Sie bitte langsam.'],['Hund','Ja, gern.']]
 };
 const previousStudy=fullStudy;
 fullStudy=function(id){

<script id="dl-umlauts-sharp-s-balanced-questions">
(function(){
 const umlautUnit=FULL_UNITS.find(u=>u.title==='Umlauts and ß');
 if(umlautUnit){
  umlautUnit.rule='German has three umlaut vowels: ä, ö and ü. Ä can sound similar to the e in English “bed” (as in Mädchen, girl, or Käse, cheese). Ö is a rounded front vowel, as in schön (beautiful). Ü is another rounded front vowel, as in fünf (five). ß, called Eszett, represents a sharp s sound, as in Straße (street); it is not the letter B.';
  umlautUnit.examples=[
   ['Mädchen','girl — ä'],
   ['schön','beautiful — ö'],
   ['fünf','five — ü'],
   ['Straße','street — ß'],
   ['schon / schön','already / beautiful — different vowels']
  ];
 }
 const oldBegin=fullBegin;
 fullBegin=function(id){
  oldBegin.apply(this,arguments);
  const session=fullSession,unit=FULL_UNITS[id];
  if(!session||unit?.title!=='Umlauts and ß')return;
  // One varied ten-question sequence: vowels, spelling, meaning, and ß.
  session.questions=[
   {type:'grammar',prompt:'Which letter is used in the German word for “five”?',options:['ü','u','ö'],answer:0,why:'Fünf is spelled with ü, which has a distinct vowel sound.'},
   {type:'sound-choice',prompt:'Which audio says “schön”?',options:['Audio 1','Audio 2','Audio 3'],answer:1,dlAudioWords:['schon','schön','Sohn'],dlTarget:'schön',why:'Schön has ö; schon and Sohn have an o sound.'},
   {type:'grammar',prompt:'What sound does ß represent in Straße?',options:['An s sound','A b sound','A z sound'],answer:0,why:'ß is called Eszett or sharp S. It represents an unvoiced s sound, not a b sound.'},
   {type:'grammar',prompt:'Choose the correctly spelled German word for “street.”',options:['Straße','StraBe','Sträße'],answer:0,why:'Straße uses ß after a long vowel. The letter ß is not the letter B.'},
   {type:'sound-choice',prompt:'Which audio says “Mütter”?',options:['Audio 1','Audio 2','Audio 3'],answer:2,dlAudioWords:['Mutter','Meter','Mütter'],dlTarget:'Mütter',why:'Mütter has ü; Mutter has u.'},
   {type:'sound-choice',prompt:'Which audio says “Mädchen”?',options:['Audio 1','Audio 2','Audio 3'],answer:1,dlAudioWords:['Machen','Mädchen','Möchten'],dlTarget:'Mädchen',why:'Mädchen (girl) contains ä. Listen for the different vowel compared with machen.'},
   {type:'grammar',prompt:'In Mädchen, which English vowel is ä closest to?',options:['The e in “bed”','The oo in “moon”','The ee in “see”'],answer:0,why:'The ä in Mädchen is similar to the short e in English bed. The German sound can vary by word and accent.'},
   {type:'grammar',prompt:'Which pair changes meaning when an umlaut is added?',options:['schon → schön','Haus → Haus','und → und'],answer:0,why:'Schon means already; schön means beautiful or nice.'},
   {type:'grammar',prompt:'Which spelling uses ß correctly?',options:['groß','groB','gröss'],answer:0,why:'Groß means big; ß represents the s sound after the long o.'},
   {type:'grammar',prompt:'Which statement about German ß is correct?',options:['It is a distinct letter, not a capital B','It is pronounced like English B','It always makes a sh sound'],answer:0,why:'ß is a separate German letter called Eszett; it typically represents a sharp s sound.'}
  ];
  session.idx=0;session.score=0;session.results=[];
  fullRender();
 };
})();

<script>
(function(){
 let bypass=false,dialogOpen=false;
 function unfinished(){
  const root=document.getElementById('app');
  if(!root)return false;
  if(root.querySelector('.findit-scene'))return true;
  if(document.body.classList.contains('lesson-screen'))return true;
  return false;
 }
 function confirmExit(action){
  if(bypass||!unfinished()){action();return}
  if(dialogOpen)return;
  dialogOpen=true;
  const overlay=document.createElement('div');
  overlay.id='dl-exit-overlay';
  overlay.innerHTML='<div id="dl-exit-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dl-exit-title" aria-describedby="dl-exit-text"><h2 id="dl-exit-title">Leave this lesson?</h2><p id="dl-exit-text">You haven\'t finished yet. Your progress in this activity may be lost.</p><div class="dl-exit-actions"><button class="secondary" id="dl-stay">Keep Learning</button><button id="dl-leave">Leave Lesson</button></div></div>';
  document.body.appendChild(overlay);
  const close=()=>{overlay.remove();dialogOpen=false};
  overlay.querySelector('#dl-stay').onclick=close;
  overlay.querySelector('#dl-leave').onclick=()=>{close();bypass=true;try{action()}finally{bypass=false}};
  overlay.querySelector('#dl-stay').focus();
 }
 const originalNavigate=navigateTo;
 navigateTo=function(destination){confirmExit(()=>originalNavigate(destination))};
 const originalHome=home;
 home=function(){confirmExit(()=>originalHome.apply(this,arguments))};
 if(typeof leaveLessonScreen==='function'){
  const originalLeave=leaveLessonScreen;
  leaveLessonScreen=function(){confirmExit(()=>originalLeave.apply(this,arguments))};
 }
 document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&dialogOpen){e.stopImmediatePropagation();e.preventDefault();document.getElementById('dl-stay')?.click()}
 },true);
})();
</script>

(function(){

 const feedbackIds=new Set(['feedback','courseFeedback','deepFeedback','fullFeedback','gameFeedback','pictureFeedback','moduleFeedback','dl-result','dialogue-feedback','iFeedback','articleFeedback','practiceFeedback','a12Feedback','reviewFeedback']);

<script id="dl-android-back-navigation">
/* Make Android/browser Back navigate app screens, never quiz questions. */
(function(){
 const views=[];let restoring=false;
 const tracked=['home','friendlyCourse','curriculumView','practiceHub','gameHub','articleHome','photoMenu','aiTutor','placementResults','review','fullStudy','dlLessonIntro','fullBegin','gameStart','startSentenceRound','listeningPractice','quickRandomPractice','dlShowSettings','dlShowBetaFeedback'];
 function capture(){return {name:'home',args:[]}}
 for(const name of tracked){
  const original=window[name];if(typeof original!=='function')continue;
  window[name]=function(...args){
   if(!restoring){
    const lesson=['fullStudy','dlLessonIntro','fullBegin'].includes(name);
    const view=lesson?{name:name==='fullBegin'?'fullStudy':name,args}: {name,args};
    views.push(view);
    try{sessionStorage.setItem('dl-current-view',JSON.stringify(view))}catch(e){}
    history.pushState({dlNav:true,step:views.length},'','#dl-screen-'+views.length);
   }
   return original.apply(this,args);
  };
 }
 /* One initial browser history entry anchors the in-app Back behavior. */
 if(!history.state?.dlNav){history.replaceState({dlNav:true,step:0},'',location.pathname+location.search);}
 window.addEventListener('popstate',()=>{\n  if(document.querySelector('#app .market-v2')&&typeof window.supermarktLeave==='function'){
   // Restore the history entry immediately so cancelling keeps the game active.
   history.pushState({dlNav:true,step:views.length},'','#dl-screen-'+views.length);
   window.supermarktLeave(()=>{
    restoring=true;
    try{
     views.length=0;
     window.practiceHub();
    }finally{restoring=false}
   });
   return;
  }
  const lesson=!!(document.body.classList.contains('lesson-screen')||window.fullSession&&document.querySelector('.dl-flow'));
  const previous=lesson?capture():(views.length>1?views[views.length-2]:capture());
  if(views.length)views.pop();
  restoring=true;
  try{
   if(lesson){
    if(typeof leaveLessonScreen==='function'){
     // Use the existing confirmation before discarding in-progress work.
     leaveLessonScreen();
    }else home();
   }else{
    const fn=window[previous.name];
    if(typeof fn==='function')fn(...previous.args);else home();
    try{sessionStorage.setItem('dl-current-view',JSON.stringify(previous))}catch(e){}
   }
  }finally{restoring=false;history.pushState({dlNav:true,step:views.length},'','#dl-screen-'+views.length)}
 });
 window.addEventListener('load',()=>{
  // Restore the exact lesson introduction instead of resetting to Home.
  let saved=null;
  try{saved=JSON.parse(sessionStorage.getItem('dl-current-view')||'null')}catch(e){}
  if(!saved||saved.name==='home'||!tracked.includes(saved.name))return;
  const fn=window[saved.name];
  if(typeof fn!=='function')return;
  restoring=true;
  try{fn(...(Array.isArray(saved.args)?saved.args:[]))}catch(e){console.warn('Unable to restore DeutschLab view',e)}
  finally{restoring=false}
 });
})();
</script>

<script id="dl-dialogue-answer-exit-fix-script">
(function(){
 const root=document.getElementById('app');if(!root)return;
 function sync(){
  const feedback=root.querySelector('#dialogue-feedback');
  const complete=[...root.querySelectorAll('.card h2')].some(h=>h.textContent.trim()==='Conversation complete');
  let bar=document.getElementById('dlDialogueExitBar');
  if(!feedback&&!complete){bar?.remove();return}
  const card=feedback?.closest('.card');
  if(card){
   const choices=[...card.querySelectorAll('button[onclick^="answerDialogue("]')];
   choices.forEach(el=>el.classList.add('dl-dialogue-answer-choice'));
   const label=choices[0]?.previousElementSibling;
   if(label?.tagName==='P'&&/choose your response/i.test(label.textContent))label.classList.add('dl-dialogue-choose-label');
   const wrong=!!feedback.querySelector('.wrong,.dl-result-bad');
   const correct=!!feedback.querySelector('.correct,.dl-result-good');
   card.classList.toggle('dl-dialogue-answered',wrong||correct);
   if(wrong&&!feedback.querySelector('.dl-dialogue-retry')){
    const retry=document.createElement('button');retry.className='secondary dl-dialogue-retry';retry.textContent='Try again';
    retry.onclick=()=>{feedback.replaceChildren();card.classList.remove('dl-dialogue-answered');choices.forEach(el=>el.disabled=false)};
    feedback.appendChild(retry);
   }
   // During exchanges, never anchor Back to dialogues; anchor Continue only after a correct answer.
   if(!correct){bar?.remove();return}
   const next=feedback.querySelector('button[onclick="nextDialogueStep()"],button[onclick="conversation()"]')||bar?.querySelector('button[onclick="nextDialogueStep()"],button[onclick="conversation()"]');
   if(!next)return;
   if(!bar){bar=document.createElement('div');bar.id='dlDialogueExitBar';document.body.appendChild(bar)}
   if(next.parentNode!==bar)bar.replaceChildren(next);
   return;
  }
  // Only on the conversation-complete screen anchor All dialogues.
  const all=root.querySelector('button[onclick="conversation()"]');
  if(!all){bar?.remove();return}
  if(!bar){bar=document.createElement('div');bar.id='dlDialogueExitBar';document.body.appendChild(bar)}
  bar.replaceChildren(all);
 }
 let pending=false;
 new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;sync()})}).observe(root,{childList:true,subtree:true});sync();
})();
</script>

(function(){

 for(const name of safe){
  const original=window[name];
  if(typeof original!=='function')continue;
  window[name]=function(...args){
   const result=original.apply(this,args);
   if(!restoring){
    try{sessionStorage.setItem(key,JSON.stringify({name,args}))}catch(e){}
   }
   return result;
  };
 }
 // Preserve the supermarket's own in-progress restoration.
 if(document.querySelector('#app .market-v2'))return;
 try{
  const saved=JSON.parse(sessionStorage.getItem(key)||'null');
  if(!saved||!safe.includes(saved.name)||!Array.isArray(saved.args))return;
  const courseScreen=saved.name==='friendlyCourse'||saved.name==='curriculumView';
  const destination=window[courseScreen?'curriculumView':saved.name];
  if(typeof destination!=='function')return;
  const args=courseScreen?[STRUCTURED_PATH[saved.args[0]]?saved.args[0]:'A1']:saved.args;
  restoring=true;
  destination(...args);
  if(courseScreen){
   sessionStorage.setItem(key,JSON.stringify({name:'curriculumView',args}));
   sessionStorage.setItem('dl-current-view',JSON.stringify({name:'curriculumView',args}));
  }
 }catch(e){}finally{restoring=false}
})();

<script id="dl-beta-feedback">
(function(){
 const endpoint='https://api.web3forms.com/submit';
 // Replace this value with the Web3Forms access key issued for the receiving inbox.
 const accessKey='43637b95-3d3c-49e7-9551-07cce39724d0';
 function install(){
  const nav=document.getElementById('sideMenu');
  if(!nav||nav.querySelector('.dl-feedback-menu-entry'))return;
  const button=document.createElement('button');
  button.type='button';button.className='dl-feedback-menu-entry';
  button.textContent='✉ Send Feedback';
  button.addEventListener('click',function(){window.dlShowBetaFeedback()});
  nav.appendChild(button);
  const settings=nav.querySelector('.dl-settings-menu-entry');
  if(settings)settings.after(button);
 }
 window.dlShowBetaFeedback=function(){
  if(typeof window.toggleMenu==='function')window.toggleMenu(false);
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML='<section class="card dl-beta-feedback"><h2>Send Feedback</h2><p>Found a bug or have an idea? Send it to the DeutschLab developer. No account or email required.</p>'+
   '<form id="dlBetaFeedbackForm">'+
   '<label for="dlFeedbackType">Feedback type</label><select id="dlFeedbackType" name="Feedback type" required><option value="Bug report">Bug report</option><option value="Suggestion">Suggestion</option><option value="Other">Other</option></select>'+
   '<label for="dlFeedbackArea">Where did it happen?</label><input id="dlFeedbackArea" name="Screen or lesson" maxlength="150" placeholder="e.g. Supermarkt, A1 Lesson 3">'+
   '<label for="dlFeedbackMessage">What happened, or what would you suggest?</label><textarea id="dlFeedbackMessage" name="Message" minlength="5" maxlength="5000" required placeholder="Describe the issue or suggestion"></textarea>'+
   '<p class="muted">Do not include passwords or API keys.</p>'+
   '<p id="dlFeedbackStatus" role="status" aria-live="polite"></p>'+
   '<div class="dl-feedback-actions"><button id="dlFeedbackSend" type="submit">Send Feedback</button><button type="button" class="secondary" onclick="home()">Back to Home</button></div></form></section>';
  const form=document.getElementById('dlBetaFeedbackForm');
  const status=document.getElementById('dlFeedbackStatus');
  const send=document.getElementById('dlFeedbackSend');
  if(!accessKey){send.disabled=true;status.textContent='Feedback is temporarily unavailable while the new service is being configured.';}
  form.addEventListener('submit',async function(event){
   event.preventDefault();
   if(!accessKey)return;
   send.disabled=true;status.textContent='Sending feedback…';
   const payload=new FormData(form);
   payload.append('access_key',accessKey);
   payload.append('subject','DeutschLab beta feedback');
   payload.append('from_name','DeutschLab Tester');
   try{
    const response=await fetch(endpoint,{method:'POST',body:payload,headers:{Accept:'application/json'}});
    const result=await response.json();
    if(!response.ok||!result.success)throw new Error('Submission failed');
    form.reset();status.textContent='Feedback sent successfully. Thank you!';
   }catch(error){status.textContent='Feedback could not be sent. Please try again later.';}
   finally{send.disabled=false;}
  });
  window.scrollTo(0,0);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
</script>

 unit.examples=[['Ich sehe den Hund.','I see the dog. (masculine: der → den)'],['Sie kauft eine Banane.','She buys a banana. (feminine: eine stays eine)'],['Wir lesen das Buch.','We read the book. (neuter: das stays das)']];
 unit.checkpoint={prompt:'Ich kaufe ___ Apfel.',options:['einen','ein','eine'],answer:0,why:'Apfel is masculine and the direct object, so ein changes to einen.'};

/* Curriculum-only sequencing: preserve all lesson IDs, scores, exercises and games. */
(function(){
 const groups=STRUCTURED_PATH.A1;
 if(!Array.isArray(groups)||!groups.length)return;
 const original=groups.flatMap(g=>g.ids);
 const find=title=>groups.find(g=>g.title===title);
 const move=(id,targetTitle,position)=>{
   const target=find(targetTitle);
   if(!target||!original.includes(id))return;
   for(const g of groups)g.ids=g.ids.filter(x=>x!==id);
   target.ids.splice(Math.min(position,target.ids.length),0,id);
 };
 const moveTitle=(title,targetTitle,position)=>{
   const id=FULL_UNITS.findIndex(u=>u.title===title);
   if(id>=0)move(id,targetTitle,position);
 };
 // Introduce sentence patterns alongside essential verbs, before long vocabulary units.
 const sentences=find('Building German sentences');
 const verbs=find('Essential verbs: be, have, live');
 if(sentences&&verbs){
   const idx=groups.indexOf(sentences);
   const target=groups.indexOf(verbs);
   if(idx>target+1){groups.splice(idx,1);groups.splice(target+1,0,sentences);}
 }
 // Teach noun gender before possessive endings and family descriptions.
 const objects=find('Everyday objects and articles');
 const family=find('People and family');
 if(objects&&family&&groups.indexOf(objects)>groups.indexOf(family)){
   groups.splice(groups.indexOf(objects),1);
   groups.splice(groups.indexOf(family),0,objects);
 }
 // Build basic questions immediately after sentence structure.
 const questions=find('Questions and answers');
 const sentenceGroup=find('Building German sentences');
 if(questions&&sentenceGroup&&groups.indexOf(questions)>groups.indexOf(sentenceGroup)+1){
   groups.splice(groups.indexOf(questions),1);
   groups.splice(groups.indexOf(sentenceGroup)+1,0,questions);
 }
 // Introduce cases in a progression before applied movement/preposition lessons.
 moveTitle('Accusative: direct objects','Building German sentences',99);
 moveTitle('Accusative pronouns','Building German sentences',99);
 moveTitle('Dative: with and to','Places and directions',0);
 moveTitle('Dative pronouns: to me and you','Places and directions',1);
 // Keep consolidated formal-address lesson early, rather than buried in conversations.
 moveTitle('Personal pronouns: ich, du, and Sie','I, you, we: personal pronouns',0);
 // Leave all other lessons, stable IDs and completion data untouched.
 const after=groups.flatMap(g=>g.ids);
 if(after.length!==original.length||new Set(after).size!==after.length||
    original.some(id=>!after.includes(id)))console.warn('A1 sequence integrity check failed');
})();
</script>

<script id="dl-pronoun-varied-practice">
(function(){
 const target='Personal pronouns: he, she, it';
 const pool=[
  ['Anna ist hier. ___ lernt Deutsch.',['Sie','Er','Es'],0,'Anna is referred to with sie (she).'],
  ['Paul wohnt in Berlin. ___ spricht Deutsch.',['Es','Er','Sie'],1,'Paul is referred to with er (he).'],
  ['Maria arbeitet heute. ___ ist beschäftigt.',['Er','Sie','Es'],1,'Use sie for Maria.'],
  ['Max ist müde. ___ schläft jetzt.',['Er','Es','Sie'],0,'Use er for Max.'],
  ['Lisa spricht Deutsch. ___ lernt Englisch.',['Es','Er','Sie'],2,'Use sie for Lisa.'],
  ['Tom und Anna lernen. ___ sprechen Deutsch.',['Sie','Er','Es'],0,'Plural sie refers to both people.'],
  ['Which pronoun means “he”?',['sie','es','er'],2,'Er means he.'],
  ['Which pronoun means “she”?',['er','sie','es'],1,'Sie means she.'],
  ['Which sentence means “She is here”?',['Sie ist hier.','Er ist hier.','Es ist hier.'],0,'Sie ist hier means She is here.'],
  ['Which sentence means “He is learning German”?',['Sie lernt Deutsch.','Es lernt Deutsch.','Er lernt Deutsch.'],2,'Er is he, and lernt means learns.'],
  ['Anna und Paul sind hier. Which means “They are here”?',['Sie sind hier.','Sie ist hier.','Er ist hier.'],0,'Plural sie uses sind; singular sie uses ist.'],
 ];
 const prior=fullQuestions;
 fullQuestions=function(unit){

   // Mix recognition, contextual substitution and short sentence comprehension.
   const shuffled=pool.map((row,i)=>({row,i})).sort(()=>Math.random()-.5).slice(0,7);

   });
 };
