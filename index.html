<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeutschLab Voice</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{font-family:system-ui;background:#101827;color:#f4f7fb;margin:0}main{max-width:760px;margin:auto;padding:24px}h1{color:#8edbd0}.card{background:#1e2b3e;border-radius:15px;padding:20px;margin:16px 0}button{background:#6bcdbb;color:#10202a;border:0;border-radius:9px;padding:12px 16px;margin:5px;font-weight:700;cursor:pointer}button.secondary{background:#34475f;color:white}input{padding:12px;border-radius:8px;border:1px solid #728298;background:#101827;color:white;width:90%;font-size:16px}.muted{color:#b7c5d8}.correct{color:#8de2a6}.wrong{color:#ffb3b3}nav button{margin:3px}#progress{height:9px;background:#34475f;border-radius:8px}#bar{height:100%;background:#6bcdbb;width:0;border-radius:8px}textarea,select{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #728298;background:#101827;color:white;font:inherit}textarea{min-height:95px} .bubble{padding:12px;border-radius:10px;background:#30415a;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.me{background:#23564f}.status{color:#b7c5d8;font-size:.9em}</style></head><body><main><h1>DeutschLab 🇩🇪</h1><p class="muted">A small German practice studio • saved on this device</p><nav><button onclick="home()">Home</button><button onclick="placement()">Placement</button><button onclick="lessonMenu()">Lessons</button><button onclick="review()">Review</button><button onclick="conversation()">Dialogue</button><button onclick="aiTutor()">AI Tutor</button></nav><div id="app"></div></main><script>
const lessons=[{title:'Greetings & introductions',words:[['Hallo','Hello'],['Guten Morgen','Good morning'],['Wie heißt du?','What is your name?'],['Ich heiße…','My name is…'],['Danke','Thank you']],quiz:[['What does “Wie heißt du?” mean?',['Where are you?','What is your name?','How are you?'],1],['Choose “Thank you”',['Bitte','Hallo','Danke'],2],['Translate “Good morning”',['Gute Nacht','Guten Morgen','Guten Tag'],1]]},{title:'Everyday sentences',words:[['Ich habe','I have'],['Ich möchte','I would like'],['Ich brauche','I need'],['Wo ist…?','Where is…?'],['Wie viel kostet das?','How much does that cost?']],quiz:[['“Ich möchte Wasser” means…',['I have water','I would like water','I need water'],1],['How do you ask “Where is…?”',['Wo ist…?','Wer ist…?','Was ist…?'],0],['“Ich brauche” means…',['I know','I need','I buy'],1]]},{title:'Verbs in the present tense',words:[['ich bin','I am'],['du bist','you are (informal)'],['er/sie ist','he/she is'],['wir sind','we are'],['sie sind','they are']],quiz:[['Fill in: “Du ___ müde.”',['bin','bist','sind'],1],['“Wir sind” means…',['We are','They are','We have'],0],['Fill in: “Ich ___ hier.”',['ist','bist','bin'],2]]},{title:'Food & ordering',words:[['das Wasser','water'],['der Kaffee','coffee'],['die Rechnung','the bill'],['ohne','without'],['mit','with']],quiz:[['“Kaffee ohne Milch” means…',['Coffee with milk','Coffee without milk','Cold coffee'],1],['“Die Rechnung, bitte” asks for…',['The menu','The bill','Water'],1],['“mit” means…',['with','without','more'],0]]}];
const placementQs=[['“Ich bin müde” means…',['I am tired','I am hungry','I am late'],0],['Choose the correct form: “Wir ___ Deutsch.”',['lernt','lernen','lerne'],1],['“Gestern” means…',['Tomorrow','Today','Yesterday'],2],['Which is correct?',['Ich habe einen Hund.','Ich habe ein Hund.','Ich habe eine Hund.'],0],['“Wenn ich Zeit hätte, würde ich reisen” means…',['When I have time I travel','If I had time I would travel','I traveled yesterday'],1]];
let state=JSON.parse(localStorage.getItem('deutschlab')||'{"completed":[],"mistakes":[],"placement":null}');let app=document.getElementById('app');function save(){localStorage.setItem('deutschlab',JSON.stringify(state))}function home(){app.innerHTML=`<section class="card"><h2>Welcome back</h2><p>${state.completed.length} of ${lessons.length} lessons completed</p><div id="progress"><div id="bar" style="width:${state.completed.length/lessons.length*100}%"></div></div><p>Placement: ${state.placement===null?'Not taken':state.placement+'/5 correct'}</p><button onclick="placement()">Take placement test</button><button onclick="lessonMenu()">Start learning</button></section>`}function placement(){runQuiz(placementQs,'Placement check',score=>{state.placement=score;save();app.innerHTML=`<div class="card"><h2>Placement result: ${score}/5</h2><p>${score<=1?'Start with greetings and everyday sentences.':score<=3?'You know some fundamentals. Try the verbs lesson and build from there.':'Strong foundation on this short check. Start with the later lessons.'}</p><p class="muted">This is a short orientation check, not a certified CEFR assessment.</p><button onclick="lessonMenu()">Choose lesson</button></div>`})}function lessonMenu(){app.innerHTML='<h2>Lessons</h2>'+lessons.map((l,i)=>`<div class="card"><h3>${i+1}. ${l.title} ${state.completed.includes(i)?'✓':''}</h3><button onclick="openLesson(${i})">Study</button></div>`).join('')}function openLesson(i){
  const l=lessons[i];
  app.innerHTML=`<div class="card"><h2>${l.title}</h2>
    ${l.words.map((w,j)=>`<p><strong>${w[0]}</strong> — ${w[1]} <button class="secondary" onclick="speak(lessons[${i}].words[${j}][0])">🔊</button></p>`).join('')}
    <button onclick="startLessonQuiz(${i})">Practice</button></div>`;
}
function startLessonQuiz(i){
  runQuiz(lessons[i].quiz,lessons[i].title,score=>{
    if(score===lessons[i].quiz.length&&!state.completed.includes(i))state.completed.push(i);
    save();
    app.innerHTML=`<div class="card"><h2>Score: ${score}/${lessons[i].quiz.length}</h2>
      <p>Complete all questions correctly to mark this lesson complete.</p>
      <button onclick="openLesson(${i})">Try again</button>
      <button onclick="lessonMenu()">Lessons</button></div>`;
  });
}
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}function runQuiz(qs,title,done){let n=0,score=0;function show(){if(n===qs.length){done(score);return}let q=qs[n];app.innerHTML=`<div class="card"><h2>${title}</h2><p class="muted">Question ${n+1}/${qs.length}</p><h3>${q[0]}</h3>${q[1].map((a,i)=>`<button class="secondary" onclick="answer(${i})">${a}</button>`).join('')}<div id="feedback"></div></div>`}window.answer=function(i){let q=qs[n],ok=i===q[2];if(ok)score++;else{state.mistakes.push({question:q[0],options:q[1],correct:q[2]});save()}document.querySelectorAll('.card button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct answer: '+q[1][q[2]]}</p><button onclick="nextQuestion()">Next →</button>`};window.nextQuestion=function(){n++;show()};show()}function review(){if(!state.mistakes.length){app.innerHTML='<div class="card"><h2>Review</h2><p>No missed questions yet. Complete a quiz first.</p></div>';return}let unique=[...new Map(state.mistakes.map(x=>[x.question,x])).values()];runQuiz(unique.map(x=>[x.question,x.options,x.correct]),'Review missed questions',score=>{if(score===unique.length){state.mistakes=[];save()}app.innerHTML=`<div class="card"><h2>Review: ${score}/${unique.length}</h2><p>${score===unique.length?'Excellent—missed-question list cleared.':'Try again to clear the review list.'}</p><button onclick="review()">Review again</button></div>`})}let turn=0;let dialogue=[{de:'Hallo! Wie heißt du?',en:'Hello! What is your name?',answers:['Ich heiße Alex.','Ich bin Wasser.'],correct:0},{de:'Freut mich! Wie geht es dir?',en:'Nice to meet you! How are you?',answers:['Mir geht es gut, danke.','Ich heiße Kaffee.'],correct:0},{de:'Möchtest du einen Kaffee?',en:'Would you like a coffee?',answers:['Ja, gerne!','Ich bin gestern.'],correct:0}];function conversation(){turn=0;dialogueStep()}function dialogueStep(){if(turn>=dialogue.length){app.innerHTML='<div class="card"><h2>Dialogue complete!</h2><button onclick="conversation()">Replay</button></div>';return}let d=dialogue[turn];app.innerHTML=`<div class="card"><h2>Conversation practice</h2><p><strong>Partner:</strong> ${d.de} <button class="secondary" onclick="speak('${d.de}')">🔊</button></p><p class="muted">${d.en}</p>${d.answers.map((a,i)=>`<button class="secondary" onclick="dialogueAnswer(${i})">${a}</button>`).join('')}<p id="feedback"></p></div>`}function dialogueAnswer(i){let d=dialogue[turn];if(i===d.correct){turn++;dialogueStep()}else document.getElementById('feedback').textContent='Not quite. Try the other response.'}
let aiHistory=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function aiTutor(){
 app.innerHTML=`<section class="card"><h2>AI German tutor · Voice</h2><p class="muted">Real AI responses require an internet connection and an OpenAI API key. API use is billed separately from ChatGPT subscriptions. Your key stays in this browser tab and is not saved. Voice recognition uses browser speech services.</p><label>API key (not stored)<input type="password" id="aiKey" placeholder="sk-..."></label><p><label>Level<select id="aiLevel"><option>A1 beginner</option><option>A2 elementary</option><option>B1 intermediate</option><option>B2 upper intermediate</option></select></label></p><p><label>Scenario<select id="aiScene"><option>Everyday conversation</option><option>At a café</option><option>Travel in Germany</option><option>Job interview</option><option>Free conversation</option></select></label></p><button onclick="startAI()">Start conversation</button><p class="status">Privacy: messages are sent to OpenAI when you press Send. Do not use a shared or public device with your API key.</p></section>`;
}
function startAI(){
 const key=document.getElementById('aiKey').value.trim();if(!key){alert('Enter your API key first.');return}
 window.aiKey=key;window.aiLevel=document.getElementById('aiLevel').value;window.aiScene=document.getElementById('aiScene').value;
 aiHistory=[];drawAI();
}
function drawAI(){
 app.innerHTML=`<section class="card"><h2>AI conversation · ${esc(window.aiLevel)}</h2><p class="muted">${esc(window.aiScene)} — type or speak German. Ask for a hint in English if needed.</p><div id="aiChat" aria-live="polite">${aiHistory.map(m=>`<div class="bubble ${m.role==='user'?'me':''}"><strong>${m.role==='user'?'You':'Tutor'}</strong><br>${esc(m.content)}</div>`).join('')}</div><textarea id="aiInput" placeholder="Schreib auf Deutsch…"></textarea><button id="aiSend" onclick="sendAI()">Send</button><button class="secondary" id="micBtn" onclick="toggleMic()">🎤 Start speaking</button><button class="secondary" onclick="replayTutor()">🔊 Replay tutor</button><label style="display:block;margin:12px 0">Speech speed <select id="voiceSpeed" onchange="window.voiceRate=Number(this.value)"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.15">Fast</option></select></label><label><input type="checkbox" id="autoSpeak" checked style="width:auto"> Read tutor replies aloud</label><p class="status">Tap microphone to speak, then tap again to finish. Voice recognition depends on your browser and may require HTTPS hosting; audio may be processed by your browser’s speech service.</p><button class="secondary" onclick="aiHistory=[];drawAI()">New conversation</button><p id="aiStatus" class="status"></p></section>`;
}
async function sendAI(){
 const box=document.getElementById('aiInput');const message=box.value.trim();if(!message)return;
 aiHistory.push({role:'user',content:message});drawAI();const send=document.getElementById('aiSend');send.disabled=true;document.getElementById('aiStatus').textContent='Thinking…';
 const system=`You are a patient, engaging German language tutor. Student level: ${window.aiLevel}. Scenario: ${window.aiScene}. Converse naturally in German appropriate to level. After each student reply, give a short English correction only if needed, explaining one or two key mistakes, then continue the German conversation with ONE question. If student asks in English, answer helpfully in English then return to German. Do not claim to hear audio. Keep replies concise.`;
 try{
  const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window.aiKey},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:system},...aiHistory],max_tokens:350})});
  const data=await res.json();if(!res.ok)throw Error(data.error?.message||'HTTP '+res.status);
  const answer=data.choices?.[0]?.message?.content;if(!answer)throw Error('No response returned');const autoSpeak=document.getElementById('autoSpeak')?.checked;aiHistory.push({role:'assistant',content:answer});drawAI();if(autoSpeak)replayTutor();
 }catch(e){aiHistory.pop();drawAI();document.getElementById('aiStatus').textContent='Request failed: '+e.message;}
}
let recognition=null,recording=false,voiceRate=1;
function sayTutor(text){
 if(!('speechSynthesis' in window)){document.getElementById('aiStatus').textContent='Speech playback is unavailable in this browser.';return;}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
 u.lang='de-DE';u.rate=voiceRate;
 const voices=speechSynthesis.getVoices();const german=voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(german)u.voice=german;
 speechSynthesis.speak(u);
}
function replayTutor(){const last=[...aiHistory].reverse().find(m=>m.role==='assistant');if(last)sayTutor(last.content);else document.getElementById('aiStatus').textContent='No tutor reply to replay yet.';}
function toggleMic(){
 if(recording){recognition?.stop();return;}
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){document.getElementById('aiStatus').textContent='Speech recognition is not available here. Try Chrome with the app hosted on HTTPS, or type instead.';return;}
 recognition=new Recognition();recognition.lang='de-DE';recognition.interimResults=true;recognition.continuous=false;
 let finalText='';const box=document.getElementById('aiInput');
 recognition.onstart=()=>{recording=true;document.getElementById('micBtn').textContent='⏹ Stop speaking';document.getElementById('aiStatus').textContent='Listening…';};
 recognition.onresult=e=>{let interim='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript;}box.value=(finalText+interim).trim();};
 recognition.onerror=e=>{document.getElementById('aiStatus').textContent='Microphone error: '+e.error+'. Check microphone permissions and browser support.';};
 recognition.onend=()=>{recording=false;const b=document.getElementById('micBtn');if(b)b.textContent='🎤 Start speaking';const status=document.getElementById('aiStatus');if(status&&finalText.trim())status.textContent='Speech captured. Check the transcription, then press Send.';};
 try{recognition.start()}catch(e){document.getElementById('aiStatus').textContent='Could not start microphone: '+e.message;}
}
home();</script><script>if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));</script></body></html>
