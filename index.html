<script>
const GUIDE={
'A1|Greetings and introductions':['German greetings change with context. Hallo is informal; Guten Tag works in more formal settings. Auf Wiedersehen means goodbye.','Hallo, ich heiße Mia.','Hello, my name is Mia.'],
'A1|Nouns and articles':['German nouns have grammatical gender: der (masculine), die (feminine), das (neuter). Always memorize the article together with the noun. Plural nouns generally use die in the nominative.','der Tisch · die Lampe · das Buch','the table · the lamp · the book'],
'A1|Present-tense verbs':['Regular verbs change endings with the subject: ich -e, du -st, er/sie/es -t, wir/sie/Sie -en, ihr -t. The stem of lernen is lern-.','Ich lerne. Du lernst. Wir lernen.','I learn. You learn. We learn.'],
'A1|Basic word order':['In a German main clause, the conjugated verb is in position TWO. A time expression can come first, but the verb must still come next.','Heute gehe ich einkaufen.','Today I am going shopping.'],
'A2|Accusative articles':['The accusative marks the direct object. Only masculine definite articles change: der → den; die and das stay the same. Masculine ein → einen.','Der Hund schläft. Ich sehe den Hund.','The dog sleeps. I see the dog.'],
'A2|Dative articles':['Dative often marks the recipient or follows verbs such as helfen. Articles change: der → dem, die → der, das → dem; plural die → den.','Ich helfe der Frau.','I help the woman.'],
'A2|Perfect tense':['The spoken past (Perfekt) usually uses haben or sein plus a past participle. Many motion/change-of-state verbs use sein; most other verbs use haben.','Ich habe gekocht. Ich bin gegangen.','I cooked. I went.'],
'A2|Separable verbs':['Some verbs split in a main clause: the conjugated verb goes second and the prefix goes at the end. In an infinitive, the prefix stays attached.','Ich stehe um sieben Uhr auf.','I get up at seven o’clock.'],
'B1|Subordinate clauses':['After subordinating conjunctions like weil, dass and ob, the conjugated verb normally moves to the end of its clause.','Ich bleibe zu Hause, weil ich krank bin.','I stay home because I am sick.'],
'B1|Relative clauses':['A relative pronoun agrees in gender/number with the noun it refers to, but its case depends on its job within the relative clause.','Das ist der Mann, der hier arbeitet.','That is the man who works here.'],
'B1|Konjunktiv II':['Use Konjunktiv II to express wishes, hypotheticals and polite requests. Würde + infinitive is common for many verbs.','Wenn ich Zeit hätte, würde ich reisen.','If I had time, I would travel.'],
'B1|Prepositions and cases':['Certain verbs require a fixed preposition and case. Learn them as chunks: sich interessieren für + accusative; sprechen mit + dative.','Ich interessiere mich für Musik.','I am interested in music.'],
'B2|Passive voice':['The process passive uses werden + past participle. Change werden into the appropriate tense: wird (present), wurde (simple past).','Der Brief wurde gestern geschrieben.','The letter was written yesterday.'],
'B2|Advanced connectors':['Obwohl means although and introduces a subordinate clause with the verb at the end. Dennoch means nevertheless and begins a main clause.','Obwohl es regnete, gingen wir spazieren.','Although it rained, we went for a walk.'],
'B2|Reported speech':['Konjunktiv I is often used in formal reported speech to mark that a statement is being reported, not directly asserted.','Er sagt, er habe keine Zeit.','He says he has no time.'],
'B2|Nuanced vocabulary':['Allerdings can mean indeed (emphasis) or however (contrast), depending on context. Read the surrounding sentence to decide.','Das ist allerdings schwierig.','That is indeed difficult.']
};
function guideHtml(m){
 let g=GUIDE[m.level+'|'+m.title]||['Read the example, identify the pattern, then try the question.',m.q,m.why];
 return `<div class="explain-box"><h3>Why this works</h3><p>${safeText(g[0])}</p><div class="explain-example"><strong>${safeText(g[1])}</strong><br><span class="muted">${safeText(g[2])}</span></div><button class="secondary" onclick="speak(${JSON.stringify(g[1]).replace(/"/g,'&quot;')})">🔊 Hear example</button></div>`;
}
courseLesson=function(id){
 let m=COURSE[id];if(!m||!m.words.length)return courseMenu();
 app.innerHTML=illustratedHero(m.title,`${m.level} · ${m.skill}`,m.skill==='cases'?'cafe':'village',id%2?'katze.png':'hund.png')+`<section class="card"><h3>Learn the rule</h3>${guideHtml(m)}<h3>Vocabulary and examples</h3>${m.words.map(w=>`<div class="vocab-row"><div class="vocab-copy"><strong>${safeText(w[0])}</strong><span>${safeText(w[1])}</span></div><button class="secondary" onclick="speak(${JSON.stringify(w[0]).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}<button onclick="courseQuiz(${id})">Practice</button><button class="secondary" onclick="courseMenu('${m.level}')">Back to lessons</button></section>`;
};
courseAnswer=function(id,i){
 let m=COURSE[id],ok=i===m.ans;
 app.querySelectorAll('.card button').forEach(b=>b.disabled=true);
 if(ok){ensureLearning();if(!state.learning.completed.includes(id))state.learning.completed.push(id);save()}
 if(typeof recordQuestion==='function')recordQuestion(m,ok);
 document.getElementById('courseFeedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Not quite. Correct answer: '+safeText(m.opts[m.ans])}</p><div class="explain-box"><h3>Answer explained</h3><p>${safeText(m.why)}</p><p><strong>Complete answer:</strong> ${safeText(m.q.replace('___',m.opts[m.ans]))}</p></div><button onclick="courseMenu('${m.level}')">Back to lessons</button><button class="secondary" onclick="courseQuiz(${id})">Try again</button>`;
};
const previousPracticeAnswer=practiceAnswer;
practiceAnswer=function(id,i,mode){
 previousPracticeAnswer(id,i,mode);
 let m=COURSE[id],box=document.getElementById('practiceFeedback');
 if(box&&m.words.length)box.insertAdjacentHTML('beforeend',guideHtml(m));

const previousListeningAnswer=listeningAnswer;
listeningAnswer=function(choice,answer,german){

 document.getElementById('listenFeedback').insertAdjacentHTML('beforeend',`<div class="explain-box"><h3>Listen and compare</h3><p><strong>German:</strong> ${safeText(german)}</p><p><strong>Meaning:</strong> ${safeText(answer)}</p><p>Listen again and connect each word to its meaning.</p><button class="secondary" onclick="speak(${JSON.stringify(german).replace(/"/g,'&quot;')})">🔊 Replay</button></div>`);
};
const previousArticleAnswer=articleAnswer;
articleAnswer=function(chosen,correct){
 previousArticleAnswer(chosen,correct);
 let x=articleSession,w=x.pool[x.i],mode=x.mode==='review'?'gender':x.mode;
 let reason=mode==='gender'?`This noun is ${w[2]} ${w[0]}. Learn the article with the noun; endings can provide clues, but not every noun follows a rule.`:mode==='plural'?`The plural is die ${w[3]}. Plural nouns use die in nominative; the noun itself may also change.`:mode==='acc'?`The accusative marks a direct object. Masculine der becomes den; feminine die and neuter das do not change.`:`The dative often marks the recipient or follows certain verbs and prepositions. The definite articles are dem (masculine), der (feminine), dem (neuter).`;
 let target=document.getElementById('articleFeedback');if(target)target.insertAdjacentHTML('afterbegin',`<div class="explain-box"><h3>Why?</h3><p>${safeText(reason)}</p></div>`);
};
const previousSentenceWord=chooseSentenceWord;
chooseSentenceWord=function(i,w){
 previousSentenceWord(i,w);
 if(sentenceChosen.length===sentenceTarget.length){let box=document.getElementById('sentenceFeedback');if(box)box.insertAdjacentHTML('beforeend',`<div class="explain-box"><h3>Sentence structure</h3><p>In a standard German main clause, the conjugated verb takes the second position. Look for the subject, verb and any time expressions.</p></div>`)}
};

<script>
(function(){
 const happy=['Sehr gut! Great job!','Wunderbar!','Richtig! You got it!','Weiter so! Keep going!'];
 const retry=['Almost! Check the explanation.','Try again—you can do it.','Look at the grammar rule.'];
 const greetings=['Hallo! Ready to learn?','Übung macht den Meister!','Tap me anytime!','Los geht’s!'];
 let timer=null,lastFeedback='',lastScene=null;
 function react(kind, message){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');if(!mascot)return;
  mascot.classList.remove('companion-happy','companion-think','companion-wave');
  void mascot.offsetWidth;
  mascot.classList.add(kind==='happy'?'companion-happy':kind==='think'?'companion-think':'companion-wave');
  hero.querySelector('.companion-bubble')?.remove();
  const bubble=document.createElement('div');bubble.className='companion-bubble';bubble.setAttribute('role','status');bubble.textContent=message;hero.appendChild(bubble);
  clearTimeout(timer);timer=setTimeout(()=>{bubble.remove();mascot.classList.remove('companion-happy','companion-think','companion-wave')},2600);
 }
 function check(){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');
  if(mascot&&!mascot.dataset.animated){mascot.dataset.animated='1';mascot.setAttribute('title','Tap for encouragement');mascot.setAttribute('role','button');mascot.setAttribute('tabindex','0');mascot.setAttribute('aria-label','Hear encouragement from your companion');const say=()=>react('wave',greetings[Math.floor(Math.random()*greetings.length)]);mascot.addEventListener('click',say);mascot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say()}})}
  if(hero!==lastScene){lastScene=hero;lastFeedback=''}
  const feedback=document.querySelector('#fullFeedback,#deepFeedback,#courseFeedback,#practiceFeedback,#listenFeedback,#articleFeedback,#sentenceFeedback,#placeFeedback');
  if(!feedback||!feedback.textContent.trim())return;
  const signature=feedback.textContent.trim();if(signature===lastFeedback)return;lastFeedback=signature;
  if(/^(correct|richtig)|correct!|unit passed/i.test(signature)||/Correct answer/i.test(signature)&&/Correct!/i.test(signature))react('happy',happy[Math.floor(Math.random()*happy.length)]);
  else if(/not quite|incorrect|try again|wrong/i.test(signature))react('think',retry[Math.floor(Math.random()*retry.length)]);
 }
 const observer=new MutationObserver(check);observer.observe(document.getElementById('app')||document.body,{subtree:true,childList:true,characterData:true});check();
})();
</script>

<script>
/* Additional open-response practice for every one of the 48 existing course units.
   Exact-answer prompts use supplied examples so feedback remains deterministic offline. */
let intensive=null;
function deepNormalize(t){return String(t).toLocaleLowerCase('de-DE').normalize('NFC').replace(/[.,!?;:„“"'’]/g,'').replace(/\s+/g,' ').trim()}
function intensiveStart(id){if(!FULL_UNITS[id])return;intensive={id,idx:0,correct:0,answers:[],shownHint:false};intensiveRender()}
function intensiveTasks(u){let e=u.examples;return [
 {type:'reading',label:'Reading comprehension',prompt:'Read this German phrase and write its English meaning:',source:e[0][0],expected:e[0][1],explain:'This phrase means “'+e[0][1]+'”. '+u.rule},
 {type:'dictation',label:'Listening dictation',prompt:'Listen and type exactly what you hear in German:',source:e[1][0],expected:e[1][0],explain:'You heard “'+e[1][0]+'”, meaning “'+e[1][1]+'”.'},
 {type:'translation',label:'Write in German',prompt:'Translate this into German:',source:e[2][1],expected:e[2][0],explain:'A model answer is “'+e[2][0]+'”. '+u.rule},
 {type:'grammar',label:'Explain the grammar',prompt:u.checkpoint.prompt,source:'Choose the best completion:',expected:u.checkpoint.options[u.checkpoint.answer],options:u.checkpoint.options,explain:u.checkpoint.why}
]}
function intensiveRender(){let r=intensive;if(!r)return;let u=FULL_UNITS[r.id],q=intensiveTasks(u)[r.idx];if(!q){intensiveFinish();return}
 let body=illustratedHero(u.title,'Extended practice · '+(r.idx+1)+' of 4','forest',r.idx%2?'katze.png':'hund.png')+`<section class="card"><p class="deep-pill">${safeText(q.label)}</p><h3>${safeText(q.prompt)}</h3>`;
 if(q.type==='dictation')body+=`<button onclick="speak(${JSON.stringify(q.source).replace(/"/g,'&quot;')})">🔊 Play audio</button><p class="muted">You can replay as often as needed.</p>`;
 else body+=`<div class="deep-hint">${safeText(q.source)}</div>`;
 if(q.options)body+=q.options.map((o,i)=>`<button class="secondary intensive-choice" onclick="intensiveCheck(${i})">${safeText(o)}</button>`).join('');
 else body+=`<label for="intensiveEntry">Your answer</label><input id="intensiveEntry" class="deep-input" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Type your answer"><button onclick="intensiveCheck()">Check answer</button>`;
 body+=`<div id="intensiveFeedback" aria-live="polite"></div><button class="secondary" onclick="fullStudy(${r.id})">Review lesson</button></section>`;app.innerHTML=body;
 let entry=document.getElementById('intensiveEntry');if(entry)entry.addEventListener('keydown',e=>{if(e.key==='Enter')intensiveCheck()});
}
function intensiveCheck(choice){let r=intensive;if(!r||r.answers.length!==r.idx)return;let q=intensiveTasks(FULL_UNITS[r.id])[r.idx],actual=q.options?q.options[choice]:document.getElementById('intensiveEntry').value;
 if(!actual||!actual.trim()){document.getElementById('intensiveFeedback').textContent='Enter an answer first.';return}
 let ok=deepNormalize(actual)===deepNormalize(q.expected);feedbackSound(ok);r.answers.push(ok);if(ok)r.correct++;
 document.querySelectorAll('.intensive-choice').forEach(b=>b.disabled=true);let entry=document.getElementById('intensiveEntry');if(entry)entry.disabled=true;
 let explanation=`<div class="unit-explain"><h3>${ok?'Correct!':'Review the model answer'}</h3><p><strong>Your answer:</strong> ${safeText(actual)}</p><p><strong>Model answer:</strong> ${safeText(q.expected)}</p><p>${safeText(q.explain)}</p>${q.type==='dictation'?`<button class="secondary" onclick="speak(${JSON.stringify(q.expected).replace(/"/g,'&quot;')})">🔊 Listen again</button>`:''}<p class="muted">Typed answers are compared with the model answer. Other valid translations may be marked incorrect.</p></div><button onclick="intensiveNext()">${r.idx===3?'See results':'Continue'}</button>`;
 document.getElementById('intensiveFeedback').innerHTML=explanation;
}
function intensiveNext(){if(!intensive)return;intensive.idx++;intensiveRender()}
function intensiveFinish(){let r=intensive,u=FULL_UNITS[r.id];ensureLearning();state.learning.intensiveScores??={};let prev=state.learning.intensiveScores[r.id];state.learning.intensiveScores[r.id]={last:r.correct,best:Math.max(prev?.best||0,r.correct),date:new Date().toISOString()};state.learning.intensiveMisses??=[];r.answers.forEach((ok,i)=>{if(!ok)state.learning.intensiveMisses.push({id:r.id,exercise:i,date:Date.now()})});state.learning.intensiveMisses=state.learning.intensiveMisses.slice(-300);save();app.innerHTML=illustratedHero('Extended practice complete',u.title,'village','hund.png')+`<section class="card"><h2>${r.correct}/4 correct</h2><p>You've practiced reading, listening, writing and grammar. Typed answers use strict matching; review the model responses for alternative wording.</p><button onclick="intensiveStart(${r.id})">Try again</button><button class="secondary" onclick="fullStudy(${r.id})">Review lesson</button><button class="secondary" onclick="fullMenu('${u.level}')">Back to units</button></section>`;intensive=null}
const priorFullStudyIntensive=fullStudy;
fullStudy=function(id){priorFullStudyIntensive(id);let target=app.querySelector('.card');if(target)target.insertAdjacentHTML('beforeend',`<div class="unit-explain"><h3>Extended skill practice</h3><p>Four additional activities: reading comprehension, listening dictation, German writing and grammar, each with an explanation.</p><button onclick="intensiveStart(${id})">Start extended practice</button></div>`)};
const priorFullMenuIntensive=fullMenu;
fullMenu=function(level){priorFullMenuIntensive(level);let list=app.querySelectorAll('.unit-card');let lv=LEVELS.includes(level)?level:(state.learning?.placement?.recommended||'A1');let ids=FULL_UNITS.map((u,i)=>u.level===lv?i:null).filter(x=>x!==null);list.forEach((card,n)=>{let id=ids[n],score=state.learning?.intensiveScores?.[id];card.insertAdjacentHTML('beforeend',`<p class="muted">Extended practice: ${score?'best '+score.best+'/4':'not attempted'}</p><button class="secondary" onclick="intensiveStart(${id})">Extended practice</button>`);});};
</script>

// Keep track of the screen the user actually visited, including inline onclick navigation.
const screenHistory=[];
let lastScreenHTML='',screenGuard=false;
function appScreenChanged(){

 // Do not remove/reinsert Back on every mutation: doing so creates

<script>
/* Small synthesized feedback tones. No audio files or network connection required. */
let feedbackAudioContext;
function feedbackEnabled(){return localStorage.getItem('deutschlab-feedback-sounds')!=='off'}
function feedbackSound(correct){
 if(!feedbackEnabled())return;
 try{
  const AudioContextType=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextType)return;
  feedbackAudioContext??=new AudioContextType();
  if(feedbackAudioContext.state==='suspended')feedbackAudioContext.resume();
  const now=feedbackAudioContext.currentTime+.015;
  const notes=correct?[[523.25,0,.11],[659.25,.115,.11],[783.99,.23,.19]]:[[330,0,.13],[261.63,.15,.22]];
  notes.forEach(([freq,delay,duration])=>{
   let osc=feedbackAudioContext.createOscillator(),gain=feedbackAudioContext.createGain();
   osc.type=correct?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+delay);
   gain.gain.setValueAtTime(.0001,now+delay);
   gain.gain.exponentialRampToValueAtTime(correct?.12:.075,now+delay+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
   osc.connect(gain);gain.connect(feedbackAudioContext.destination);
   osc.start(now+delay);osc.stop(now+delay+duration+.02);
  });
 }catch(e){/* Silent fallback if audio is unavailable. */}
}
function soundSettingHTML(){return `<div class="sound-setting"><span>Answer sounds</span><button class="secondary" onclick="toggleFeedbackSound()">${feedbackEnabled()?'On':'Off'}</button></div>`}
function toggleFeedbackSound(){localStorage.setItem('deutschlab-feedback-sounds',feedbackEnabled()?'off':'on');document.querySelectorAll('.sound-setting').forEach(el=>el.outerHTML=soundSettingHTML());if(feedbackEnabled())feedbackSound(true)}
const soundOldFullMark=fullMark;
fullMark=function(ok,answer,why){let s=fullSession;if(!s||s.results.length!==s.idx)return;feedbackSound(ok);return soundOldFullMark(ok,answer,why)};
const soundOldGameMark=gameMark;
gameMark=function(ok,answer){let s=gameSession;if(!s||s.answered)return;feedbackSound(ok);return soundOldGameMark(ok,answer)};
const soundOldPhotoGrade=photoGrade;
photoGrade=function(id,choice){let s=pictureSession;if(!s||s.answered)return;let w=PHOTO_WORDS[id],answer=choice===null?document.getElementById('photoInput')?.value:PHOTO_WORDS[choice]?.[0];if(answer!==undefined)feedbackSound(answer.toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' ')===w[0].toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' '));return soundOldPhotoGrade(id,choice)};
const soundOldPictureGrade=pictureGrade;
pictureGrade=function(...args){let s=pictureSession;if(s?.photo)return soundOldPictureGrade(...args);let before=s?.answered;if(!before){let correct=args[0],chosen=args[1];feedbackSound(String(PICTURE_WORDS[correct]?.[0]||'').toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' ')===String(chosen||'').toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' '))}return soundOldPictureGrade(...args)};
const soundOldReviewAnswer=curriculumReviewAnswer;
curriculumReviewAnswer=function(i){let s=moduleSession;if(s&&!s.answered)feedbackSound(i===s.questions[s.idx].answer);return soundOldReviewAnswer(i)};

/* Keep course navigation and individual lesson activities in distinct views. */
let activeLessonScreen=null;
function lessonScreenHeading(){

 if(app.querySelector('.lesson-screen-heading'))return;

function leaveLessonScreen(){const go=()=>{let id=activeLessonScreen;activeLessonScreen=null;document.body.classList.remove('lesson-screen');curriculumView(FULL_UNITS[id]?.level||curriculumSelected)};if(activeLessonScreen!==null)dlAppConfirm({title:'Leave this lesson?',message:'Your current lesson progress will be lost.',cancelText:'Stay in Lesson',confirmText:'Leave Lesson',onConfirm:go});else go()}
const lessonOriginalStudy=fullStudy;

const lessonOriginalRender=fullRender;

const lessonOriginalFinish=fullFinish;

 const session=fullSession;
 if(!session)return lessonOriginalFinish();
 const id=session.id,score=session.score,total=session.questions.length;
 lessonOriginalFinish();

  app.prepend(notice);
  // Keep the next unfinished lesson visible after returning to the learning path.
  const nextRow=app.querySelector('.curriculum-next-lesson');
  if(nextRow){
    const module=nextRow.closest('details');
    if(module)module.open=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{

      window.scrollTo({top,behavior:'instant'});

  }else window.scrollTo(0,0);
 }
};

<script>
/* Session recovery: preserve the actual rendered activity, question and in-progress answers.
   Progress data remains in the existing deutschlab localStorage record. */
(function(){
 const KEY='deutschlab-active-screen-v3';
 const screen=document.getElementById('app');
 if(!screen)return;
 let restoring=false,savePending=false;
 function store(){
  if(restoring)return;
  try{
   const inputs=[...screen.querySelectorAll('input,textarea,select')].map((el,i)=>({i,value:el.type==='password'?'':el.value,checked:el.checked}));
   const session={version:2,html:screen.innerHTML,inputs,
    full:typeof fullSession!=='undefined'?fullSession:null,
    picture:typeof pictureSession!=='undefined'?pictureSession:null,
    game:typeof gameSession!=='undefined'?gameSession:null,
    module:typeof moduleSession!=='undefined'?moduleSession:null,
    dlSelected:typeof dlSelected!=='undefined'?dlSelected:null,
    dlAnswered:typeof dlAnswered!=='undefined'?dlAnswered:false,
    curriculum:typeof curriculumSelected!=='undefined'?curriculumSelected:'A1',
    scrollY:window.scrollY,updated:Date.now()};
   localStorage.setItem(KEY,JSON.stringify(session));
  }catch(e){console.warn('Session save unavailable',e)}
 }
 function schedule(){if(restoring||savePending)return;savePending=true;setTimeout(()=>{savePending=false;store()},40)}
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&saved.version===2&&typeof saved.html==='string'&&saved.html.length>20){
   restoring=true;
   if(typeof fullSession!=='undefined')fullSession=saved.full;
   if(typeof pictureSession!=='undefined')pictureSession=saved.picture;
   if(typeof gameSession!=='undefined')gameSession=saved.game;
   if(typeof moduleSession!=='undefined')moduleSession=saved.module;
   if(typeof dlSelected!=='undefined')dlSelected=saved.dlSelected;
   if(typeof dlAnswered!=='undefined')dlAnswered=saved.dlAnswered;
   if(typeof curriculumSelected!=='undefined')curriculumSelected=saved.curriculum;
   screen.innerHTML=saved.html;
   (saved.inputs||[]).forEach(({i,value,checked})=>{let el=screen.querySelectorAll('input,textarea,select')[i];if(el){if(el.type!=='password')el.value=value;el.checked=checked}});
   // Update the back button for the recovered activity, where supported.
   if(typeof navSync==='function')try{navSync()}catch(e){}
   requestAnimationFrame(()=>window.scrollTo(0,Math.max(0,saved.scrollY||0)));
   restoring=false;
   const aiField=document.getElementById('aiKey');if(aiField)aiField.value=savedAIKey();
  }
 }catch(e){restoring=false;console.warn('Session restore unavailable',e)}
 new MutationObserver(schedule).observe(screen,{childList:true,subtree:true,attributes:true,characterData:true});
 document.addEventListener('click',e=>{if(screen.contains(e.target))setTimeout(store,80)},true);
 document.addEventListener('input',e=>{if(screen.contains(e.target))schedule()},true);
 document.addEventListener('change',e=>{if(screen.contains(e.target))schedule()},true);
 window.addEventListener('pagehide',store);
 window.addEventListener('scroll',()=>{if(!savePending)schedule()},{passive:true});
 if(!localStorage.getItem(KEY))store();
})();
</script>

<script>
/* Minimum six varied questions in each guided lesson; keep original bank and progress. */
(function(){
 const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
 const previousQuestions=fullQuestions;
 const focused={
  8:[
   ['Wie ___ du?',['heißt','heiße','heißen'],0,'With du, heißen becomes heißt.'],
   ['Ich ___ Lena.',['heiße','heißt','heißen'],0,'With ich, heißen becomes heiße.'],
   ['___ Morgen!',['Guten','Gute','Gutes'],0,'The standard morning greeting is Guten Morgen.'],
   ['Wie geht ___ dir?',['es','du','ich'],0,'The expression is Wie geht es dir? (How are you?)'],
   ['Ich ___ aus Deutschland.',['komme','kommt','kommen'],0,'With ich, kommen becomes komme.'],
   ['Which phrase means “Goodbye”?',['Auf Wiedersehen','Guten Morgen','Bitte'],0,'Auf Wiedersehen means goodbye.']
  ],
  9:[
   ['___ Buch liegt auf dem Tisch.',['Das','Der','Die'],0,'Buch is neuter: das Buch.'],
   ['___ Lampe ist hell.',['Die','Das','Der'],0,'Lampe is feminine: die Lampe.'],
   ['___ Tisch ist groß.',['Der','Die','Das'],0,'Tisch is masculine: der Tisch.'],
   ['___ Kind spielt.',['Das','Die','Der'],0,'Kind is neuter: das Kind.'],
   ['___ Katze schläft.',['Die','Der','Das'],0,'Katze is feminine: die Katze.'],
   ['___ Hund bellt.',['Der','Das','Die'],0,'Hund is masculine: der Hund.'],
   ['Which article is used with most plural nouns in the nominative?',['die','der','das'],0,'The nominative plural definite article is die, regardless of singular gender.']
  ]
 };
 function toQuestion(row){const [prompt,options,answer,why]=row;const correct=options[answer];const shuffled=shuffle(options);return {type:'grammar',prompt,options:shuffled,answer:shuffled.indexOf(correct),why};}
 fullQuestions=function(unit){
  const original=previousQuestions(unit),id=FULL_UNITS.indexOf(unit);
  if(fullSession?.id===id&&fullSession.questions)return fullSession.questions;
  const result=[...original],seen=new Set(result.map(q=>q.prompt));
  const extras=focused[id]||[];
  for(const row of shuffle(extras)){if(!seen.has(row[0])){result.push(toQuestion(row));seen.add(row[0]);}}
  if(result.length<6){
   const examples=unit.examples||[];
   for(let i=0;i<examples.length&&result.length<6;i++){
    const [de,en]=examples[i];
    const alternatives=examples.filter((_,j)=>j!==i).map(x=>x[1]);
    if(alternatives.length<2)continue;
    const prompt='What does “'+de+'” mean?';
    if(!seen.has(prompt)){
     result.push(toQuestion([prompt,[en,...alternatives.slice(0,2)],0,'“'+de+'” means “'+en+'”.']));seen.add(prompt);
    }
   }
   if(result.length<6&&examples.length>=3){
    for(let i=0;i<examples.length&&result.length<6;i++){
     const [de,en]=examples[i],prompt='Choose the German for “'+en+'”.';
     if(seen.has(prompt))continue;

    }
   }
  }
  return shuffle(result);
 };

<script>
const dlSentenceGrammar = {
 'Die Katze schläft auf dem Bett.':'Die Katze is the subject. Schläft is the conjugated verb in second position. Auf dem Bett describes where the cat sleeps.',
 'Ich trinke morgens Wasser.':'Ich is the subject and trinke is the verb in second position. Morgens tells when; Wasser is the object.',
 'Wir gehen zum Bahnhof.':'Wir is the subject, followed by the conjugated verb gehen. Zum means zu dem (to the).',
 'Mein Bruder hat ein Fahrrad.':'Mein Bruder is the subject. Hat is the third-person singular form of haben (to have).',
 'Morgen kaufe ich Äpfel.':'Morgen comes first for emphasis, so the verb kaufe remains in second position, before ich.',
 'Sie liest ein Buch.':'Sie is the subject. Liest is the third-person singular form of lesen (to read).',
 'Die Kinder spielen draußen.':'Die Kinder is plural, so the verb is spielen. Draußen means outside.',
 'Ich suche meine Schlüssel.':'Ich takes the verb form suche. Meine Schlüssel is the plural object.',
 'Wir essen Brot und Käse.':'Wir takes essen. Und connects the two foods, Brot and Käse.',
 'Der Hund sitzt unter dem Tisch.':'Der Hund is the subject. Unter dem Tisch uses dative to describe a fixed location.',
 'Ich habe einen Hund':'Ich takes habe. Einen Hund is accusative because Hund is the direct object.',
 'Heute gehe ich einkaufen':'Heute occupies first position, so gehe comes second, before ich. Einkaufen stays at the end.',
 'Wir lernen Deutsch':'Wir is plural, so the verb is lernen. Deutsch is what we are learning.',
 'Die Katze schläft auf dem Sofa':'Die Katze is the subject, followed by schläft. Auf dem Sofa uses dative for a location.',
 'Morgen rufe ich dich an':'Morgen is first, rufe is second, and the separable prefix an goes at the end.'
};

  /\b(heute|morgen|gestern|danach|trotzdem)\b/i.test(key) ? 'When a time word or adverb begins the main clause, the conjugated verb still stays in second position, before the subject.' :
  level==='B2' ? 'Look at how the clauses connect and how the verb forms express the relationship between events.' :

 );
 box.textContent=explanation;
 box.hidden=!box.hidden;

<script>

const dlA1Pack = {loaded:false, promise:null, byTitle:new Map()};
async function dlLoadA1Pack(){
 if(dlA1Pack.loaded)return true;
 if(!dlA1Pack.promise)dlA1Pack.promise=fetch('./a1_foundations.json',{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})

<script>
(function(){
 const clips={Mutter:[0,1.46], 'Mütter':[1.96,3.44]};
 // Two clips separated by 0.5 seconds of silence.
 const sprite='deutschlab-native-audio.ogg';
 let active=null;
 const oldSpeak=speak;
 speak=function(text,rate=1){
  const word=String(text||'').trim();
  const range=clips[word];
  if(!range){if(rate===1)return oldSpeak(text);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='de-DE';u.rate=rate;speechSynthesis.speak(u);return}catch(e){return oldSpeak(text)}}
  try{
   if(active){active.pause();active=null;}
   if('speechSynthesis' in window)speechSynthesis.cancel();
   const player=new Audio(sprite);player.playbackRate=rate;active=player;
   player.preload='auto';
   const start=range[0],end=range[1];
   const begin=()=>{player.currentTime=start;player.play().catch(()=>oldSpeak(text));};
   player.addEventListener('loadedmetadata',begin,{once:true});
   player.addEventListener('timeupdate',()=>{if(player.currentTime>=end){player.pause();if(active===player)active=null;}});
   player.addEventListener('error',()=>{if(active===player)active=null;oldSpeak(text);},{once:true});
   player.load();
  }catch(e){oldSpeak(text);}
 };

<script>

(function(){

 function cleanAnswer(x){return String(x).replace(/\s*\([^)]*\)/g,'').trim();}

   make('Listen to the vowel sound. Which German letter produces it?',['ö','o','ü'],'ö','Schön uses ö, a rounded front vowel.','schön'),
   make('In the new word “Vogel” (bird), how is the initial V usually pronounced?',['Like English F','Like English V','Like English Y'],'Like English F','Vogel begins with an F sound.'),
   make('Listen to the vowel sound. Which German letter produces it?',['ü','u','ö'],'ü','Fünf contains the vowel ü.','fünf'),
   make('What changes when you write schon as schön?',['The pronunciation and meaning','Only the capitalization','Nothing; they are interchangeable'],'The pronunciation and meaning','Schon means already; schön means beautiful.'),

 curriculumReview=function(level,n){

  if(!s||!g||level!=='A1')return;
  // A module review must never draw its bonus from the following module.

   const u=FULL_UNITS[id];if(!u)continue;

 const genderQuestions=[

  {type:'grammar',prompt:'A new noun ends in -chen: ___ Häuschen (little house). Choose the article.',options:['das','die','der'],answer:0,why:'The diminutive ending -chen makes a noun neuter, even when the original noun has another gender: das Häuschen.'},
  {type:'grammar',prompt:'Choose the article for ___ Freiheit (freedom). Use the noun ending.',options:['der','die','das'],answer:1,why:'Nouns ending in -heit are feminine: die Freiheit.'},
  {type:'grammar',prompt:'Which article goes with ___ Museum? Use the -um pattern.',options:['das','der','die'],answer:0,why:'Many German nouns ending in -um are neuter, including das Museum.'},
  {type:'grammar',prompt:'Choose the article for ___ Freundschaft (friendship).',options:['die','das','der'],answer:0,why:'The suffix -schaft forms feminine nouns: die Freundschaft.'},
  {type:'grammar',prompt:'Choose the article for ___ Brötchen (bread roll).',options:['der','das','die'],answer:1,why:'The ending -chen makes a noun neuter: das Brötchen.'},
  {type:'grammar',prompt:'Choose the article for ___ Möglichkeit (possibility).',options:['die','der','das'],answer:0,why:'The ending -keit forms feminine nouns: die Möglichkeit.'},
  {type:'grammar',prompt:'Choose the article for ___ Instrument (instrument).',options:['der','die','das'],answer:2,why:'Many nouns ending in -ment are neuter, including das Instrument. This ending is a clue, not a guarantee.'}
 ];

  const questions=[...chosen,...existing.slice(0,3)];
  return questions.map(q=>{
   const choices=q.options.map((label,i)=>({label,correct:i===q.answer}));
   for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}

   '<p><strong>Try the pattern:</strong> You will see unfamiliar nouns with these endings. Choose der, die or das using the ending, then read the explanation.</p>'+
   '<p>These are clues, not universal rules. Learn each noun together with its article.</p>';
  const first=card.querySelector('.unit-explain');

 u.examples=[['Ich verstehe die Frage nicht.','I do not understand the question.'],['Ich verstehe das Wort nicht.','I do not understand the word.'],['Können Sie mir helfen?','Can you help me?'],['Sprechen Sie bitte langsam.','Please speak slowly.'],['Ich verstehe den Satz nicht.','I do not understand the sentence.'],['Können Sie das bitte wiederholen?','Could you please repeat that?']];
 u.checkpoint={prompt:'Which phrase asks someone to speak more slowly?',options:['Sprechen Sie bitte langsam.','Ich verstehe die Frage nicht.','Können Sie mir helfen?'],answer:0,why:'Sprechen Sie bitte langsam is a polite request. Sie is the formal you; bitte means please; langsam means slowly.'};
 const previous=fullQuestions;

   {type:'grammar',prompt:'Someone speaks too quickly. What would you say?',options:['Sprechen Sie bitte langsam.','Ich verstehe das Wort nicht.','Können Sie mir helfen?'],answer:0,why:'Sprechen Sie bitte langsam asks a person to speak slowly. Bitte softens the request.'},

<script id="dl-sentence-building-lesson">
(function(){
 const unit={
  level:'A1',title:'Building German sentences: Subject, verb and details',
  rule:'Start with WHO is doing something (the subject), then the conjugated verb, then the rest of the sentence. In ordinary German statements, the conjugated verb is in position two. A time word can go first, but the verb must still be second. Objects answer what or whom; places tell us where.',
  examples:[
   ['Ich lerne Deutsch.','I am learning German.'],
   ['Ich trinke heute Kaffee.','I am drinking coffee today.'],
   ['Heute trinke ich Kaffee.','Today I am drinking coffee.'],
   ['Wir lernen Deutsch zu Hause.','We are learning German at home.'],
   ['Morgen kaufe ich Brot.','Tomorrow I am buying bread.']
  ],
  checkpoint:{prompt:'Which sentence keeps the verb in second position?',options:['Heute lerne ich Deutsch.','Heute ich lerne Deutsch.','Heute Deutsch ich lerne.'],answer:0,why:'Heute occupies the first position, so lerne must come next.'}
 };
 const id=FULL_UNITS.length;FULL_UNITS.push(unit);
 const module=STRUCTURED_PATH.A1.find(m=>m.title==='Everyday conversations'&&m.ids.includes(83));
 if(module){const pos=module.ids.indexOf(83);module.ids.splice(pos,0,id);module.context='Build your own sentences first, then use practical phrases to ask for help and clarification.';}
 const priorQuestions=fullQuestions;
 fullQuestions=function(u){
  if(u!==unit)return priorQuestions(u);
  return [
   {type:'grammar',prompt:'Choose the correct basic statement.',options:['Ich lerne Deutsch.','Ich Deutsch lerne.','Lerne Deutsch ich.'],answer:0,why:'The subject Ich comes first and the conjugated verb lerne comes second.'},
   {type:'grammar',prompt:'Start with Heute (today). Which sentence is correct?',options:['Heute trinke ich Kaffee.','Heute ich trinke Kaffee.','Heute Kaffee trinke ich.'],answer:0,why:'Heute takes position one, trinke stays in position two, and ich follows the verb.'},
   {type:'grammar',prompt:'In “Wir lernen Deutsch zu Hause,” which word is the subject?',options:['Wir','lernen','Deutsch'],answer:0,why:'Wir means we: it tells who performs the action.'},
   {type:'grammar',prompt:'In “Ich kaufe Brot,” which word is the conjugated verb?',options:['kaufe','Ich','Brot'],answer:0,why:'Kaufe expresses the action and changes to agree with ich.'},
   {type:'grammar',prompt:'Which sentence adds a place naturally?',options:['Ich lerne Deutsch zu Hause.','Ich zu Hause lerne Deutsch.','Ich Deutsch zu Hause lerne.'],answer:0,why:'Ich is the subject, lerne is the second-position verb, and zu Hause adds where.'},
   {type:'grammar',prompt:'Which sentence begins with a time expression correctly?',options:['Morgen kaufe ich Brot.','Morgen ich kaufe Brot.','Morgen Brot ich kaufe.'],answer:0,why:'Morgen is first, so kaufe must immediately follow.'},
   {type:'grammar',prompt:'In “Ich trinke heute Kaffee,” what is Kaffee?',options:['What is being drunk','Who is drinking','The conjugated verb'],answer:0,why:'Kaffee is the object: it tells what the subject drinks.'}
  ];
 };
 const priorStudy=fullStudy;
 fullStudy=function(lessonId){
  const result=priorStudy.apply(this,arguments);
  if(lessonId!==id)return result;
  const h=Array.from(app.querySelectorAll('h2')).find(el=>el.textContent.includes("What you'll learn"));
  const p=h?.nextElementSibling;
  if(p?.tagName==='P'){
   p.outerHTML='<div class="dl-conversation-cards">'+[
    ['1. Subject — who?','Ich = I; wir = we. Start by identifying who is acting.'],
    ['2. Verb — what action?','Ich lerne Deutsch. The conjugated verb lerne takes the second position.'],
    ['3. Add an object','Ich trinke Kaffee. Kaffee tells us what is being drunk.'],
    ['4. Add time and place','Ich lerne heute zu Hause. Heute says when; zu Hause says where.'],
    ['5. Move time to the front','Heute lerne ich zu Hause. The verb stays second, so the subject moves after it.']
   ].map(x=>'<section class="dl-conversation-card"><h3>'+safeText(x[0])+'</h3><p>'+safeText(x[1])+'</p></section>').join('')+'</div>';
  }
  return result;
 };
})();
</script>

<script id="dl-umlauts-sharp-s-balanced-questions">
(function(){
 const umlautUnit=FULL_UNITS.find(u=>u.title==='Umlauts and ß');
 if(umlautUnit){
  umlautUnit.rule='German has three umlaut vowels: ä, ö and ü. Ä can sound similar to the e in English “bed” (as in Mädchen, girl, or Käse, cheese). Ö is a rounded front vowel, as in schön (beautiful). Ü is another rounded front vowel, as in fünf (five). ß, called Eszett, represents a sharp s sound, as in Straße (street); it is not the letter B.';
  umlautUnit.examples=[
   ['Mädchen','girl — ä'],
   ['schön','beautiful — ö'],
   ['fünf','five — ü'],
   ['Straße','street — ß'],
   ['schon / schön','already / beautiful — different vowels']
  ];
 }
 const oldBegin=fullBegin;
 fullBegin=function(id){
  oldBegin.apply(this,arguments);
  const session=fullSession,unit=FULL_UNITS[id];
  if(!session||unit?.title!=='Umlauts and ß')return;
  // One varied ten-question sequence: vowels, spelling, meaning, and ß.
  session.questions=[
   {type:'grammar',prompt:'Which letter is used in the German word for “five”?',options:['ü','u','ö'],answer:0,why:'Fünf is spelled with ü, which has a distinct vowel sound.'},
   {type:'sound-choice',prompt:'Which audio says “schön”?',options:['Audio 1','Audio 2','Audio 3'],answer:1,dlAudioWords:['schon','schön','Sohn'],dlTarget:'schön',why:'Schön has ö; schon and Sohn have an o sound.'},
   {type:'grammar',prompt:'What sound does ß represent in Straße?',options:['An s sound','A b sound','A z sound'],answer:0,why:'ß is called Eszett or sharp S. It represents an unvoiced s sound, not a b sound.'},
   {type:'grammar',prompt:'Choose the correctly spelled German word for “street.”',options:['Straße','StraBe','Sträße'],answer:0,why:'Straße uses ß after a long vowel. The letter ß is not the letter B.'},
   {type:'sound-choice',prompt:'Which audio says “Mütter”?',options:['Audio 1','Audio 2','Audio 3'],answer:2,dlAudioWords:['Mutter','Meter','Mütter'],dlTarget:'Mütter',why:'Mütter has ü; Mutter has u.'},
   {type:'sound-choice',prompt:'Which audio says “Mädchen”?',options:['Audio 1','Audio 2','Audio 3'],answer:1,dlAudioWords:['Machen','Mädchen','Möchten'],dlTarget:'Mädchen',why:'Mädchen (girl) contains ä. Listen for the different vowel compared with machen.'},
   {type:'grammar',prompt:'In Mädchen, which English vowel is ä closest to?',options:['The e in “bed”','The oo in “moon”','The ee in “see”'],answer:0,why:'The ä in Mädchen is similar to the short e in English bed. The German sound can vary by word and accent.'},
   {type:'grammar',prompt:'Which pair changes meaning when an umlaut is added?',options:['schon → schön','Haus → Haus','und → und'],answer:0,why:'Schon means already; schön means beautiful or nice.'},
   {type:'grammar',prompt:'Which spelling uses ß correctly?',options:['groß','groB','gröss'],answer:0,why:'Groß means big; ß represents the s sound after the long o.'},
   {type:'grammar',prompt:'Which statement about German ß is correct?',options:['It is a distinct letter, not a capital B','It is pronounced like English B','It always makes a sh sound'],answer:0,why:'ß is a separate German letter called Eszett; it typically represents a sharp s sound.'}
  ];
  session.idx=0;session.score=0;session.results=[];
  fullRender();
 };
})();

<script>
/* Consistent short haptic feedback for incorrect answers in lessons and games.
   Observe answer feedback, not generic text elsewhere on the page. */
(function(){
 if(!navigator.vibrate)return;
 const feedbackIds=new Set(['feedback','courseFeedback','deepFeedback','fullFeedback','gameFeedback','pictureFeedback','moduleFeedback','dl-result','dialogue-feedback','iFeedback','articleFeedback','practiceFeedback','a12Feedback','reviewFeedback']);
 let lastBuzz=0;
 function check(){
  // Find It already vibrates in its own tap handler.
  const root=document.getElementById('app');if(!root)return;
  for(const el of root.querySelectorAll('[id],.game-feedback,.picture-answer,.dl-flow-feedback')){
   if(!feedbackIds.has(el.id)&&!el.matches('.game-feedback,.picture-answer,.dl-flow-feedback'))continue;
   const msg=(el.textContent||'').trim();
   if(!msg||msg.length>650)continue;
   const bad=/^(?:not quite|incorrect|wrong|fast!|try again|almost!)/i.test(msg)||
    !!el.querySelector('.wrong,.incorrect')||
    /^(?:correct answer:|answer:)/i.test(msg)&&/not quite|incorrect|wrong/i.test(msg);
   if(bad){const now=Date.now();if(now-lastBuzz>220){lastBuzz=now;try{navigator.vibrate(110)}catch(e){}}return}
  }
 }
 let queued=false;
 const observer=new MutationObserver(()=>{
  if(queued)return;queued=true;
  queueMicrotask(()=>{queued=false;check()});
 });
 const root=document.getElementById('app');
 if(root)observer.observe(root,{childList:true,subtree:true,characterData:true});
})();
</script>

 dock.append(back,next);document.body.appendChild(dock);
 let backTarget=null,nextTarget=null,backAction=null,lastFeedback='',lastChime=0,ctx=null;
 const nextRx=/^(next(?:\s+(?:question|word|item|sentence|exercise|round|picture|sound))?|continue|finish|finish (?:lesson|practice|review)|see results|show results)$/i;

  const feedback=[...app.querySelectorAll(feedbackSelector)].filter(e=>e.getClientRects().length&&/correct!|well done|great job|not quite|incorrect|correct answer|try again/i.test(e.textContent||''));

  const key=latest?((latest.textContent||'').trim().slice(0,180)+'|'+(app.querySelector('h2,h3')?.textContent||'')):'';
  if(positive&&key&&key!==lastFeedback&&Date.now()-lastChime>450){lastChime=Date.now();chime()}

  const buttons=[...app.querySelectorAll('button')].filter(b=>b.getClientRects().length&&!b.disabled&&!b.closest('nav,#sideMenu,[hidden]'));

  backTarget=nextTarget?find(backRx):null;

<script id="dl-android-back-navigation">
/* Make Android/browser Back navigate app screens, never quiz questions. */
(function(){
 const views=[];let restoring=false;
 const tracked=['home','friendlyCourse','curriculumView','practiceHub','gameHub','articleHome','photoMenu','aiTutor','placementResults','review','fullStudy','dlLessonIntro','fullBegin','gameStart','startSentenceRound','listeningPractice','quickRandomPractice','dlShowSettings','dlShowBetaFeedback'];
 function capture(){return {name:'home',args:[]}}
 for(const name of tracked){
  const original=window[name];if(typeof original!=='function')continue;
  window[name]=function(...args){
   if(!restoring){
    const lesson=['fullStudy','dlLessonIntro','fullBegin'].includes(name);
    const view=lesson?{name:name==='fullBegin'?'fullStudy':name,args}: {name,args};
    views.push(view);
    try{sessionStorage.setItem('dl-current-view',JSON.stringify(view))}catch(e){}
    history.pushState({dlNav:true,step:views.length},'','#dl-screen-'+views.length);
   }
   return original.apply(this,args);
  };
 }
 /* One initial browser history entry anchors the in-app Back behavior. */
 if(!history.state?.dlNav){history.replaceState({dlNav:true,step:0},'',location.pathname+location.search);}
 window.addEventListener('popstate',()=>{\n  if(document.querySelector('#app .market-v2')&&typeof window.supermarktLeave==='function'){
   // Restore the history entry immediately so cancelling keeps the game active.
   history.pushState({dlNav:true,step:views.length},'','#dl-screen-'+views.length);
   window.supermarktLeave(()=>{
    restoring=true;
    try{
     views.length=0;
     window.practiceHub();
    }finally{restoring=false}
   });
   return;
  }
  const lesson=!!(document.body.classList.contains('lesson-screen')||window.fullSession&&document.querySelector('.dl-flow'));
  const previous=lesson?capture():(views.length>1?views[views.length-2]:capture());
  if(views.length)views.pop();
  restoring=true;
  try{
   if(lesson){
    if(typeof leaveLessonScreen==='function'){
     // Use the existing confirmation before discarding in-progress work.
     leaveLessonScreen();
    }else home();
   }else{
    const fn=window[previous.name];
    if(typeof fn==='function')fn(...previous.args);else home();
    try{sessionStorage.setItem('dl-current-view',JSON.stringify(previous))}catch(e){}
   }
  }finally{restoring=false;history.pushState({dlNav:true,step:views.length},'','#dl-screen-'+views.length)}
 });
 window.addEventListener('load',()=>{
  // Restore the exact lesson introduction instead of resetting to Home.
  let saved=null;
  try{saved=JSON.parse(sessionStorage.getItem('dl-current-view')||'null')}catch(e){}
  if(!saved||saved.name==='home'||!tracked.includes(saved.name))return;
  const fn=window[saved.name];
  if(typeof fn!=='function')return;
  restoring=true;
  try{fn(...(Array.isArray(saved.args)?saved.args:[]))}catch(e){console.warn('Unable to restore DeutschLab view',e)}
  finally{restoring=false}
 });
})();
</script>

<script id="dl-dialogue-answer-exit-fix-script">
(function(){
 const root=document.getElementById('app');if(!root)return;
 function sync(){
  const feedback=root.querySelector('#dialogue-feedback');
  const complete=[...root.querySelectorAll('.card h2')].some(h=>h.textContent.trim()==='Conversation complete');
  let bar=document.getElementById('dlDialogueExitBar');
  if(!feedback&&!complete){bar?.remove();return}
  const card=feedback?.closest('.card');
  if(card){
   const choices=[...card.querySelectorAll('button[onclick^="answerDialogue("]')];
   choices.forEach(el=>el.classList.add('dl-dialogue-answer-choice'));
   const label=choices[0]?.previousElementSibling;
   if(label?.tagName==='P'&&/choose your response/i.test(label.textContent))label.classList.add('dl-dialogue-choose-label');
   const wrong=!!feedback.querySelector('.wrong,.dl-result-bad');
   const correct=!!feedback.querySelector('.correct,.dl-result-good');
   card.classList.toggle('dl-dialogue-answered',wrong||correct);
   if(wrong&&!feedback.querySelector('.dl-dialogue-retry')){
    const retry=document.createElement('button');retry.className='secondary dl-dialogue-retry';retry.textContent='Try again';
    retry.onclick=()=>{feedback.replaceChildren();card.classList.remove('dl-dialogue-answered');choices.forEach(el=>el.disabled=false)};
    feedback.appendChild(retry);
   }
   // During exchanges, never anchor Back to dialogues; anchor Continue only after a correct answer.
   if(!correct){bar?.remove();return}
   const next=feedback.querySelector('button[onclick="nextDialogueStep()"],button[onclick="conversation()"]')||bar?.querySelector('button[onclick="nextDialogueStep()"],button[onclick="conversation()"]');
   if(!next)return;
   if(!bar){bar=document.createElement('div');bar.id='dlDialogueExitBar';document.body.appendChild(bar)}
   if(next.parentNode!==bar)bar.replaceChildren(next);
   return;
  }
  // Only on the conversation-complete screen anchor All dialogues.
  const all=root.querySelector('button[onclick="conversation()"]');
  if(!all){bar?.remove();return}
  if(!bar){bar=document.createElement('div');bar.id='dlDialogueExitBar';document.body.appendChild(bar)}
  bar.replaceChildren(all);
 }
 let pending=false;
 new MutationObserver(()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;sync()})}).observe(root,{childList:true,subtree:true});sync();
})();
</script>

 for(const name of safe){

   if(!restoring){

   }

   sessionStorage.setItem(key,JSON.stringify({name:'curriculumView',args}));

  }
 }catch(e){}finally{restoring=false}
})();

<script id="dl-beta-feedback">
(function(){
 const endpoint='https://api.web3forms.com/submit';
 // Replace this value with the Web3Forms access key issued for the receiving inbox.
 const accessKey='43637b95-3d3c-49e7-9551-07cce39724d0';
 function install(){
  const nav=document.getElementById('sideMenu');
  if(!nav||nav.querySelector('.dl-feedback-menu-entry'))return;
  const button=document.createElement('button');
  button.type='button';button.className='dl-feedback-menu-entry';
  button.textContent='✉ Send Feedback';
  button.addEventListener('click',function(){window.dlShowBetaFeedback()});
  nav.appendChild(button);
  const settings=nav.querySelector('.dl-settings-menu-entry');
  if(settings)settings.after(button);
 }
 window.dlShowBetaFeedback=function(){
  if(typeof window.toggleMenu==='function')window.toggleMenu(false);
  const app=document.getElementById('app');if(!app)return;
  app.innerHTML='<section class="card dl-beta-feedback"><h2>Send Feedback</h2><p>Found a bug or have an idea? Send it to the DeutschLab developer. No account or email required.</p>'+
   '<form id="dlBetaFeedbackForm">'+
   '<label for="dlFeedbackType">Feedback type</label><select id="dlFeedbackType" name="Feedback type" required><option value="Bug report">Bug report</option><option value="Suggestion">Suggestion</option><option value="Other">Other</option></select>'+
   '<label for="dlFeedbackArea">Where did it happen?</label><input id="dlFeedbackArea" name="Screen or lesson" maxlength="150" placeholder="e.g. Supermarkt, A1 Lesson 3">'+
   '<label for="dlFeedbackMessage">What happened, or what would you suggest?</label><textarea id="dlFeedbackMessage" name="Message" minlength="5" maxlength="5000" required placeholder="Describe the issue or suggestion"></textarea>'+
   '<p class="muted">Do not include passwords or API keys.</p>'+
   '<p id="dlFeedbackStatus" role="status" aria-live="polite"></p>'+
   '<div class="dl-feedback-actions"><button id="dlFeedbackSend" type="submit">Send Feedback</button><button type="button" class="secondary" onclick="home()">Back to Home</button></div></form></section>';
  const form=document.getElementById('dlBetaFeedbackForm');
  const status=document.getElementById('dlFeedbackStatus');
  const send=document.getElementById('dlFeedbackSend');
  if(!accessKey){send.disabled=true;status.textContent='Feedback is temporarily unavailable while the new service is being configured.';}
  form.addEventListener('submit',async function(event){
   event.preventDefault();
   if(!accessKey)return;
   send.disabled=true;status.textContent='Sending feedback…';
   const payload=new FormData(form);
   payload.append('access_key',accessKey);
   payload.append('subject','DeutschLab beta feedback');
   payload.append('from_name','DeutschLab Tester');
   try{
    const response=await fetch(endpoint,{method:'POST',body:payload,headers:{Accept:'application/json'}});
    const result=await response.json();
    if(!response.ok||!result.success)throw new Error('Submission failed');
    form.reset();status.textContent='Feedback sent successfully. Thank you!';
   }catch(error){status.textContent='Feedback could not be sent. Please try again later.';}
   finally{send.disabled=false;}
  });
  window.scrollTo(0,0);
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();

   if(fullSession?.id===FULL_UNITS.indexOf(unit)&&fullSession.questions)return fullSession.questions;
   // Mix recognition, contextual substitution and short sentence comprehension.
   const shuffled=pool.map((row,i)=>({row,i})).sort(()=>Math.random()-.5).slice(0,7);
   return shuffled.map(({row})=>{
     const [prompt,options,correct,why]=row;
     const shuffledOptions=options.map((label,i)=>({label,correct:i===correct})).sort(()=>Math.random()-.5);
     return {type:'grammar',prompt,options:shuffledOptions.map(o=>o.label),answer:shuffledOptions.findIndex(o=>o.correct),why};
   });
 };
})();
</script>
<script id="dl-refresh-always-home">
(function(){
  // Refresh starts at Home; normal in-app navigation still retains its history.
  // Clear only transient screen routing, never saved lesson progress.
  try{
    sessionStorage.removeItem('dl-current-view');
    sessionStorage.removeItem('dl-current-navigation');
  }catch(e){}
  window.addEventListener('load',function(){
    try{
      sessionStorage.removeItem('dl-current-view');
      sessionStorage.removeItem('dl-current-navigation');
    }catch(e){}
    if(typeof home==='function')home();
  });
})();

(function(){
  // Keep the full lesson list for menu navigation, but send Continue Learning
  // directly to the next actual lesson instead of a scrolled module card.
  curriculumContinueFromHome=function(){
    const level='A1';

(function(){
  const previousHome=home;
  home=function(){
    const result=previousHome.apply(this,arguments);
    // Later Home decorators can replace the dashboard; bind the visible
    // Continue Learning control after all existing Home rendering completes.
    const buttons=Array.from(app.querySelectorAll('button'));
    for(const button of buttons){
      if(button.textContent.trim().toLowerCase()==='continue learning'){
        button.setAttribute('onclick','curriculumContinueFromHome()');
      }
    }
    return result;
  };
})();
</script><script id="dl-module-review-exit-guard">
(function(){
 // A review can only award mastery after every question has been answered.
 // Leaving an unfinished review discards its session without changing saved mastery.
 const oldView=curriculumView;
 curriculumView=function(level){
  const session=moduleSession;
  if(session && session.idx<session.questions.length){
   const destination=level||session.level;
   dlConfirmReviewExit(function(){
    moduleSession=null;
    oldView(destination);
   });
   return;
  }
  return oldView.apply(this,arguments);
 };
 const oldHome=home;
 home=function(){
  const session=moduleSession;
  if(session && session.idx<session.questions.length){
   const args=arguments,ctx=this;
   dlConfirmReviewExit(function(){moduleSession=null;oldHome.apply(ctx,args)});
   return;
  }
  return oldHome.apply(this,arguments);
 };
})();
