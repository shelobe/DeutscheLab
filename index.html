const sentences=[['Ich habe einen Hund','I have a dog'],['Heute gehe ich einkaufen','Today I am going shopping'],['Wir lernen Deutsch','We are learning German'],['Die Katze schläft auf dem Sofa','The cat sleeps on the sofa'],['Morgen rufe ich dich an','Tomorrow I will call you']];let sentenceTarget=[],sentenceChosen=[],sentenceChosenIds=[];

function startSentenceRound(){

 for(let i=seq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}

function sentencePractice(){
 let pair;
 if(sentenceRound){
  if(sentenceRound.idx>=sentenceRound.seq.length){
   const score=sentenceRound.correct,total=sentenceRound.seq.length;
   sentenceRound=null;
   app.innerHTML=illustratedHero('Round complete!',score+' of '+total+' correct.','forest','hund.png')+`<section class="card"><h2>${score}/${total} correct</h2><button onclick="startSentenceRound()">Try another round</button><button class="secondary" onclick="gameHub()">All practice games</button></section>`;

 }else{

 window.scrollTo(0,0);

const SENTENCE_VALID_ALTERNATIVES={

function normalizeSentenceAnswer(words){
 return words.join(' ').replace(/[.!?]+$/,'').replace(/\\s+/g,' ').trim().toLocaleLowerCase('de-DE');
}
function sentenceAnswerIsCorrect(chosen,target){
 const canonical=target.join(' ').replace(/[.!?]+$/,'').trim();
 const actual=normalizeSentenceAnswer(chosen);
 return [canonical,...(SENTENCE_VALID_ALTERNATIVES[canonical]||[])].some(candidate=>normalizeSentenceAnswer([candidate])===actual);
}
function chooseSentenceWord(i,w){
 if(sentenceChosenIds.includes(i)||document.getElementById('sentenceFeedback')?.innerHTML)return;
 sentenceChosen.push(w);sentenceChosenIds.push(i);
 try{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(w.replace(/[.!?]+$/,''));utterance.lang='de-DE';utterance.rate=0.84;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('de'));if(voice)utterance.voice=voice;speechSynthesis.speak(utterance)}catch(e){}
 document.getElementById('word'+i).disabled=true;updateSentenceBuilt();

  if(sentenceRound&&ok)sentenceRound.correct++;
  document.getElementById('sentenceFeedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct order: '+safeText(sentenceTarget.join(' '))}</p>`;
  document.getElementById('dl-sentence-next-button').hidden=false;
  if(ok){
   // Start the chime directly from the word-tap gesture, rather than waiting on speech synthesis.
   try{
    const C=window.AudioContext||window.webkitAudioContext;

     if(ctx.state==='suspended')ctx.resume();
     const start=ctx.currentTime+.025;
     [[523.25,0,.12],[659.25,.14,.2]].forEach(([hz,offset,duration])=>{

      gain.gain.setValueAtTime(.0001,t);

      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+.01);
     });
    }else window.deutschLabCorrectChime?.(true);
   }catch(e){window.deutschLabCorrectChime?.(true)}
  }else {try{dlWrongHaptic()}catch(e){}}

}

<script>
const GUIDE={
'A1|Greetings and introductions':['German greetings change with context. Hallo is informal; Guten Tag works in more formal settings. Auf Wiedersehen means goodbye.','Hallo, ich heiße Mia.','Hello, my name is Mia.'],
'A1|Nouns and articles':['German nouns have grammatical gender: der (masculine), die (feminine), das (neuter). Always memorize the article together with the noun. Plural nouns generally use die in the nominative.','der Tisch · die Lampe · das Buch','the table · the lamp · the book'],
'A1|Present-tense verbs':['Regular verbs change endings with the subject: ich -e, du -st, er/sie/es -t, wir/sie/Sie -en, ihr -t. The stem of lernen is lern-.','Ich lerne. Du lernst. Wir lernen.','I learn. You learn. We learn.'],
'A1|Basic word order':['In a German main clause, the conjugated verb is in position TWO. A time expression can come first, but the verb must still come next.','Heute gehe ich einkaufen.','Today I am going shopping.'],
'A2|Accusative articles':['The accusative marks the direct object. Only masculine definite articles change: der → den; die and das stay the same. Masculine ein → einen.','Der Hund schläft. Ich sehe den Hund.','The dog sleeps. I see the dog.'],
'A2|Dative articles':['Dative often marks the recipient or follows verbs such as helfen. Articles change: der → dem, die → der, das → dem; plural die → den.','Ich helfe der Frau.','I help the woman.'],
'A2|Perfect tense':['The spoken past (Perfekt) usually uses haben or sein plus a past participle. Many motion/change-of-state verbs use sein; most other verbs use haben.','Ich habe gekocht. Ich bin gegangen.','I cooked. I went.'],
'A2|Separable verbs':['Some verbs split in a main clause: the conjugated verb goes second and the prefix goes at the end. In an infinitive, the prefix stays attached.','Ich stehe um sieben Uhr auf.','I get up at seven o’clock.'],
'B1|Subordinate clauses':['After subordinating conjunctions like weil, dass and ob, the conjugated verb normally moves to the end of its clause.','Ich bleibe zu Hause, weil ich krank bin.','I stay home because I am sick.'],
'B1|Relative clauses':['A relative pronoun agrees in gender/number with the noun it refers to, but its case depends on its job within the relative clause.','Das ist der Mann, der hier arbeitet.','That is the man who works here.'],
'B1|Konjunktiv II':['Use Konjunktiv II to express wishes, hypotheticals and polite requests. Würde + infinitive is common for many verbs.','Wenn ich Zeit hätte, würde ich reisen.','If I had time, I would travel.'],
'B1|Prepositions and cases':['Certain verbs require a fixed preposition and case. Learn them as chunks: sich interessieren für + accusative; sprechen mit + dative.','Ich interessiere mich für Musik.','I am interested in music.'],
'B2|Passive voice':['The process passive uses werden + past participle. Change werden into the appropriate tense: wird (present), wurde (simple past).','Der Brief wurde gestern geschrieben.','The letter was written yesterday.'],
'B2|Advanced connectors':['Obwohl means although and introduces a subordinate clause with the verb at the end. Dennoch means nevertheless and begins a main clause.','Obwohl es regnete, gingen wir spazieren.','Although it rained, we went for a walk.'],
'B2|Reported speech':['Konjunktiv I is often used in formal reported speech to mark that a statement is being reported, not directly asserted.','Er sagt, er habe keine Zeit.','He says he has no time.'],
'B2|Nuanced vocabulary':['Allerdings can mean indeed (emphasis) or however (contrast), depending on context. Read the surrounding sentence to decide.','Das ist allerdings schwierig.','That is indeed difficult.']
};
function guideHtml(m){

};

 let target=document.getElementById('articleFeedback');if(target)target.insertAdjacentHTML('afterbegin',`<div class="explain-box"><h3>Why?</h3><p>${safeText(reason)}</p></div>`);

"}, {"type": "listen", "prompt": "Du lernst Deutsch", "options": ["You learn German", "We learn German", "He learns German"], "answer": 0, "why": "Du is informal singular you; lernst ends in -st."}], [{"type": "choice", "prompt": "Which is correct?", "options": ["Morgen fahre ich nach Berlin.", "Morgen ich fahre nach Berlin.", "Morgen nach Berlin ich fahre."], "answer": 0, "why": "A time expression can come first, but the verb remains in position two."}, {"type": "fill", "prompt": "Complete: Heute ___ wir Pizza.", "options": ["essen", "esst", "isst"], "answer": 0, "why": "Wir essen is the plural form."}, {"type": "order", "prompt": "Arrange: Today I drink tea.", "options": ["Tee", "trinke", "Heute", "ich"], "answer": ["Heute", "trinke", "ich", "Tee"], "why": "The verb trinke is the second constituent."}, {"type": "listen", "prompt": "Heute gehe ich nach Hause", "options": ["Today I go home", "Tomorrow I go home", "Today I stay home"], "answer": 0, "why": "Heute means today; nach Hause means homeward."}], [{"type": "choice", "prompt": "Choose the accusative: Ich habe ___ Hund.", "options": ["den", "dem", "der"], "answer": 0, "why": "Masculine der becomes den as a direct object."}, {"type": "fill", "prompt": "Complete: Sie kauft ___ Apfel.", "options": ["einen", "ein", "einem"], "answer": 0, "why": "Masculine indefinite accusative is einen."}, {"type": "order", "prompt": "Arrange: I see the cat.", "options": ["Katze", "die", "sehe", "Ich"], "answer": ["Ich", "sehe", "die", "Katze"], "why": "Feminine die does not change in the accusative."}, {"type": "listen", "prompt": "Ich sehe den Hund", "options": ["I see the dog", "The dog sees me", "I help the dog"], "answer": 0, "why": "Sehen takes a direct object, here den Hund."}], [{"type": "choice", "prompt": "Which follows mit?", "options": ["dem", "den (singular masculine)", "der (masculine)"], "answer": 0, "why": "Mit always takes dative; masculine der → dem."}, {"type": "fill", "prompt": "Complete: Ich danke ___ Lehrerin o kaufe ... ein."}], [{"type": "choice", "prompt": "Which is correct?", "options": ["weil ich müde bin", "weil ich bin müde", "weil bin ich müde"], "answer": 0, "why": "Weil introduces a subordinate clause; finite verb goes last."}, {"type": "fill", "prompt": "Complete: Ich glaube, dass er morgen ___.", "options": ["kommt", "kommen", "komme"], "answer": 0, "why": "Dass-clause verb goes at the end."}, {"type": "order", "prompt": "Arrange: because I am tired", "options": ["bin", "weil", "müde", "ich"], "answer": ["weil", "ich", "müde", "bin"], "why": "Subordinating weil sends bin to the end."}, {"type": "listen", "prompt": "Ich bleibe zu Hause, weil es regnet", "options": ["I stay home because it rains", "I leave because it rains", "I stay home although it rains"], "answer": 0, "why": "Weil introduces a reason."}], [{"type": "choice", "prompt": "Which relative pronoun? Die Frau, ___ hier wohnt.", "options": ["die", "der", "den"], "answer": 0, "why": "Die Frau is feminine and the pronoun is the relative-clause subject."}, {"type": "fill", "prompt": "Complete: Das Kind, ___ spielt, ist müde.", "options": ["das", "dem", "den"], "answer": 0, "why": "Neuter nominative relative pronoun is das."}, {"type": "order", "prompt": "Arrange: the man who works here", "options": ["hier", "der", "arbeitet", "Mann,", "der"], "answer": ["der", "Mann,", "der", "hier", "arbeitet"], "why": "Relative clauses end with the finite verb."}, {"type": "listen", "prompt": "Das ist die Frau, die hier arbeitet", "options": ["That is the woman who works here", "That is the woman who lived here", "That is the man who works here"], "answer": 0, "why": "Die refers back to die Frau."}], [{"type": "choice", "prompt": "Which is a polite request?", "options": ["Könnten Sie mir helfen?", "Sie helfen mir!", "Sie geholfen mir?"], "answer": 0, "why": "Könnten is Konjunktiv II, often used for polite requests."}, {"type": "fill", "prompt": "Complete: Wenn ich Geld hätte, ___ ich reisen.", "options": ["würde", "werde", "habe"], "answer": 0, "why": "Würde + infinitive expresses a hypothetical."}, {"type": "order", "prompt": "Arrange: I would like a tea.", "options": ["Tee", "gern", "hätte", "Ich", "einen"], "answer": ["Ich", "hätte", "gern", "einen", "Tee"], "why": "Hätte is Konjunktiv II of haben."}, {"type": "listen", "prompt": "Ich würde gern nach Berlin fahren", "options": ["I would like to go to Berlin", "I went to Berlin", "I must go to Berlin"], "answer": 0, "why": "Würde gern expresses a wish."}], [{"type": "choice", "prompt": "Which phrase is correct?", "options": ["warten auf den Bus", "warten mit den Bus", "warten bei den Bus"], "answer": 0, "why": "Warten auf + accusative."}, {"type": "fill", "prompt": "Complete: Ich spreche ___ meinem Bruder.", "options": ["mit", "für", "auf"], "answer": 0, "why": "Sprechen mit takes dative."}, {"type": "order", "prompt": "Arrange: I am waiting for the bus.", "options": ["Bus", "warte", "Ich", "auf", "den"], "answer": ["Ich", "warte", "auf", "den", "Bus"], "why": "Warten auf + accusative, der Bus → den Bus."}, {"type": "listen", "prompt": "Ich interessiere mich für Musik", "options": ["I am interested in music", "I am waiting for music", "I speak about music"], "answer": 0, "why": "Sich interessieren für means to be interested in."}], [{"type": "choice", "prompt": "Present passive: Der Brief ___ geschrieben.", "options": ["wird", "wurde", "würde"], "answer": 0, "why": "Wird + participle is present process passive."}, {"type": "fill", "prompt": "Complete: Das Auto ___ gestern repariert.", "options": ["wurde", "wird", "werden"], "answer": 0, "why": "Gestern indicates past; wurde is preterite passive."}, {"type": "order", "prompt": "Arrange: The house is being built.", "options": ["gebaut", "wird", "Das", "Haus"], "answer": ["Das", "Haus", "wird", "gebaut"], "why": "Passive: werden + participle."}, {"type": "listen", "prompt": "Das Fenster wurde geöffnet", "options": ["The window was opened", "The window is open", "The window will open"], "answer": 0, "why": "Wurde geöffnet is past passive."}], [{"type": "choice", "prompt": "Which connector means although?", "options": ["obwohl", "weil", "damit"], "answer": 0, "why": "Obwohl introduces a concession."}, {"type": "fill", "prompt": "Complete: ___ er krank ist, arbeitet er.", "options": ["Obwohl", "Weil", "Damit"], "answer": 0, "why": "The contrast is working despite illness."}, {"type": "order", "prompt": "Arrange: although it is cold", "options": ["ist", "obwohl", "kalt", "es"], "answer": ["obwohl", "es", "kalt", "ist"], "why": "Obwohl sends the finite verb to the end."}, {"type": "listen", "prompt": "Es regnet, dennoch gehen wir spazieren", "options": ["It rains; nevertheless we walk", "It rains because we walk", "It rains while we walk"], "answer": 0, "why": "Dennoch signals contrast and introduces a main clause."}], [{"type": "choice", "prompt": "Reported speech: Er sagt, er ___ krank.", "options": ["sei", "ist", "wäre"], "answer": 0, "why": "Sei is Konjunktiv I of sein."}, {"type": "fill", "prompt": "Complete: Sie sagt, sie ___ keine Zeit.", "options": ["habe", "hatte", "hätte"], "answer": 0, "why": "Habe is Konjunktiv I in reported speech."}, {"type": "order", "prompt": "Arrange: He says he has no time.", "options": ["Zeit.", "habe", "er", "Er", "sagt,", "keine"], "answer": ["Er", "sagt,", "er", "habe", "keine", "Zeit."], "why": "Reported speech may use Konjunktiv I."}, {"type": "listen", "prompt": "Er sagt, er sei krank", "options": ["He says he is sick", "He says he was late", "He asks if he is sick"], "answer": 0, "why": "Sei signals reported speech."}], [{"type": "choice", "prompt": "Here 'allerdings' means: Das ist allerdings teuer.", "options": ["indeed", "maybe", "never"], "answer": 0, "why": "Allerdings intensifies teuer here."}, {"type": "fill", "prompt": "Complete: Ich möchte kommen, ___ habe ich keine Zeit.", "options": ["allerdings", "damit", "weil"], "answer": 0, "why": "Allerdings here introduces a contrast: however."}, {"type": "order", "prompt": "Arrange: It is expensive; nevertheless I will buy it.", "options": ["kaufe", "dennoch", "Ich", "es"], "answer": ["Ich", "kaufe", "es", "dennoch"], "why": "Dennoch can appear later in a main clause."}, {"type": "listen", "prompt": "Das ist durchaus möglich", "options": ["That is entirely possible", "That is impossible", "That is probably late"], "answer": 0, "why": "Durchaus adds emphasis: entirely/quite."}]];
let lessonRun=null;
function deepStart(id){
 let m=COURSE[id];if(!m||!m.words.length)return courseMenu();
 lessonRun={id,index:0,correct:0,answers:[],orderPicked:[]};
 deepRender();
}
function deepRender(){
 if(!lessonRun)return;
 let r=lessonRun,m=COURSE[r.id],q=DEEP_EXERCISES[r.id]?.[r.index];
 if(!q)return deepFinish();
 let total=DEEP_EXERCISES[r.id].length;
 let html=illustratedHero('Practice · '+m.title,`${m.level} · Exercise ${r.index+1} of ${total}`,'cafe',r.index%2?'katze.png':'hund.png')
 +`<section class="card"><div class="lesson-progress"><div style="width:${r.index/total*100}%"></div></div><p class="muted">${{choice:'Choose the answer',fill:'Fill in the blank',order:'Build the sentence',listen:'Listen and understand'}[q.type]}</p><h3>${safeText(q.prompt)}</h3>`;
 if(q.type==='listen')html+=`<button onclick="speak(${JSON.stringify(q.prompt).replace(/"/g,'&quot;')})">🔊 Play German audio</button><p class="muted">Listen, then choose the English meaning.</p>`;
 if(q.type==='order'){
   html+=`<div class="lesson-note"><strong>Your sentence:</strong> <span id="deepBuilt">—</span></div><div id="deepChoices">${q.options.map((x,i)=>`<button class="word-chip" id="deepChip${i}" onclick="deepPick(${i})">${safeText(x)}</button>`).join('')}</div><button class="secondary" onclick="deepReset()">Reset words</button><button onclick="deepCheckOrder()">Check sentence</button>`;
 }else html+=q.options.map((x,i)=>`<button class="secondary exercise-option" onclick="deepAnswer(${i})">${safeText(x)}</button>`).join('');
 html+=`<div id="deepFeedback" aria-live="polite"></div><button class="secondary" onclick="courseLesson(${r.id})">Review explanation</button></section>`;
 app.innerHTML=html;
}
function deepPick(i){
 if(!lessonRun)return;
 if(lessonRun.orderPicked.includes(i))return;
 lessonRun.orderPicked.push(i);
 document.getElementById('deepChip'+i).disabled=true;
 document.getElementById('deepBuilt').textContent=lessonRun.orderPicked.map(n=>DEEP_EXERCISES[lessonRun.id][lessonRun.index].options[n]).join(' ');
}
function deepReset(){lessonRun.orderPicked=[];deepRender()}
function deepCheckOrder(){
 let q=DEEP_EXERCISES[lessonRun.id][lessonRun.index],chosen=lessonRun.orderPicked.map(n=>q.options[n]);
 if(chosen.length!==q.answer.length){document.getElementById('deepFeedback').textContent='Use all the words before checking.';return}
 deepResult(JSON.stringify(chosen)===JSON.stringify(q.answer),q.answer.join(' '),q.why);
}
function deepAnswer(i){
 let q=DEEP_EXERCISES[lessonRun.id][lessonRun.index];
 deepResult(i===q.answer,q.options[q.answer],q.why);
}
function deepResult(ok,correct,why){
 let r=lessonRun;if(!r)return;
 r.answers.push(ok);if(ok)r.correct++;
 let m=COURSE[r.id];
 if(typeof recordQuestion==='function')recordQuestion(m,ok);
 app.querySelectorAll('.exercise-option,.word-chip').forEach(b=>b.disabled=true);
 let box=document.getElementById('deepFeedback');
 box.innerHTML=`<div class="explain-box"><h3>${ok?'Correct!':'Not quite'}</h3><p><strong>Correct answer:</strong> ${safeText(correct)}</p><p><strong>Why:</strong> ${safeText(why)}</p></div><button onclick="deepNext()">Next exercise</button>`;
}
function deepNext(){if(!lessonRun)return;lessonRun.index++;deepRender()}
function deepFinish(){
 let r=lessonRun,m=COURSE[r.id],total=DEEP_EXERCISES[r.id].length,pct=r.correct/total;
 ensureLearning();state.learning.lessonScores??={};
 state.learning.lessonScores[r.id]={score:r.correct,total,date:new Date().toISOString()};
 if(pct>=.75&&!state.learning.completed.includes(r.id))state.learning.completed.push(r.id);
 save();
 app.innerHTML=illustratedHero('Lesson complete!',m.title,'village','hund.png')+`<section class="card"><h2>${r.correct}/${total} correct</h2><p>${pct>=.75?'You passed this lesson.':'Review the rule and try again to reach 75%.'}</p><p>Every question includes an explanation. Incorrect answers are saved for review.</p><button onclick="courseLesson(${r.id})">Review lesson</button><button onclick="deepStart(${r.id})">Practice again</button><button class="secondary" onclick="courseMenu('${m.level}')">Learning path</button></section>`;
 lessonRun=null;
}
courseQuiz=deepStart;
const deeperCourseMenu=courseMenu;
courseMenu=function(level){deeperCourseMenu(level);ensureLearning();document.querySelectorAll('.card').forEach(card=>{let b=card.querySelector('button[onclick^="courseLesson("]');if(!b)return;let id=Number((b.getAttribute('onclick').match(/\d+/)||[])[0]);let score=state.learning.lessonScores?.[id];if(score)card.insertAdjacentHTML('beforeend',`<p class="muted">Last score: ${score.score}/${score.total} · ${score.score/score.total>=.75?'Passed':'Needs practice'}</p>`);});};
</script>

<script>
(function(){
 const happy=['Sehr gut! Great job!','Wunderbar!','Richtig! You got it!','Weiter so! Keep going!'];
 const retry=['Almost! Check the explanation.','Try again—you can do it.','Look at the grammar rule.'];
 const greetings=['Hallo! Ready to learn?','Übung macht den Meister!','Tap me anytime!','Los geht’s!'];
 let timer=null,lastFeedback='',lastScene=null;
 function react(kind, message){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');if(!mascot)return;
  mascot.classList.remove('companion-happy','companion-think','companion-wave');
  void mascot.offsetWidth;
  mascot.classList.add(kind==='happy'?'companion-happy':kind==='think'?'companion-think':'companion-wave');
  hero.querySelector('.companion-bubble')?.remove();
  const bubble=document.createElement('div');bubble.className='companion-bubble';bubble.setAttribute('role','status');bubble.textContent=message;hero.appendChild(bubble);
  clearTimeout(timer);timer=setTimeout(()=>{bubble.remove();mascot.classList.remove('companion-happy','companion-think','companion-wave')},2600);
 }
 function check(){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');
  if(mascot&&!mascot.dataset.animated){mascot.dataset.animated='1';mascot.setAttribute('title','Tap for encouragement');mascot.setAttribute('role','button');mascot.setAttribute('tabindex','0');mascot.setAttribute('aria-label','Hear encouragement from your companion');const say=()=>react('wave',greetings[Math.floor(Math.random()*greetings.length)]);mascot.addEventListener('click',say);mascot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say()}})}
  if(hero!==lastScene){lastScene=hero;lastFeedback=''}
  const feedback=document.querySelector('#fullFeedback,#deepFeedback,#courseFeedback,#practiceFeedback,#listenFeedback,#articleFeedback,#sentenceFeedback,#placeFeedback');
  if(!feedback||!feedback.textContent.trim())return;
  const signature=feedback.textContent.trim();if(signature===lastFeedback)return;lastFeedback=signature;
  if(/^(correct|richtig)|correct!|unit passed/i.test(signature)||/Correct answer/i.test(signature)&&/Correct!/i.test(signature))react('happy',happy[Math.floor(Math.random()*happy.length)]);
  else if(/not quite|incorrect|try again|wrong/i.test(signature))react('think',retry[Math.floor(Math.random()*retry.length)]);
 }
 const observer=new MutationObserver(check);observer.observe(document.getElementById('app')||document.body,{subtree:true,childList:true,characterData:true});check();
})();
</script>

<script>
/* Additional open-response practice for every one of the 48 existing course units.
   Exact-answer prompts use supplied examples so feedback remains deterministic offline. */
let intensive=null;
function deepNormalize(t){return String(t).toLocaleLowerCase('de-DE').normalize('NFC').replace(/[.,!?;:„“"'’]/g,'').replace(/\s+/g,' ').trim()}
function intensiveStart(id){if(!FULL_UNITS[id])return;intensive={id,idx:0,correct:0,answers:[],shownHint:false};intensiveRender()}
function intensiveTasks(u){let e=u.examples;return [
 {type:'reading',label:'Reading comprehension',prompt:'Read this German phrase and write its English meaning:',source:e[0][0],expected:e[0][1],explain:'This phrase means “'+e[0][1]+'”. '+u.rule},
 {type:'dictation',label:'Listening dictation',prompt:'Listen and type exactly what you hear in German:',source:e[1][0],expected:e[1][0],explain:'You heard “'+e[1][0]+'”, meaning “'+e[1][1]+'”.'},
 {type:'translation',label:'Write in German',prompt:'Translate this into German:',source:e[2][1],expected:e[2][0],explain:'A model answer is “'+e[2][0]+'”. '+u.rule},
 {type:'grammar',label:'Explain the grammar',prompt:u.checkpoint.prompt,source:'Choose the best completion:',expected:u.checkpoint.options[u.checkpoint.answer],options:u.checkpoint.options,explain:u.checkpoint.why}
]}
function intensiveRender(){let r=intensive;if(!r)return;let u=FULL_UNITS[r.id],q=intensiveTasks(u)[r.idx];if(!q){intensiveFinish();return}
 let body=illustratedHero(u.title,'Extended practice · '+(r.idx+1)+' of 4','forest',r.idx%2?'katze.png':'hund.png')+`<section class="card"><p class="deep-pill">${safeText(q.label)}</p><h3>${safeText(q.prompt)}</h3>`;
 if(q.type==='dictation')body+=`<button onclick="speak(${JSON.stringify(q.source).replace(/"/g,'&quot;')})">🔊 Play audio</button><p class="muted">You can replay as often as needed.</p>`;
 else body+=`<div class="deep-hint">${safeText(q.source)}</div>`;
 if(q.options)body+=q.options.map((o,i)=>`<button class="secondary intensive-choice" onclick="intensiveCheck(${i})">${safeText(o)}</button>`).join('');
 else body+=`<label for="intensiveEntry">Your answer</label><input id="intensiveEntry" class="deep-input" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Type your answer"><button onclick="intensiveCheck()">Check answer</button>`;
 body+=`<div id="intensiveFeedback" aria-live="polite"></div><button class="secondary" onclick="fullStudy(${r.id})">Review lesson</button></section>`;app.innerHTML=body;
 let entry=document.getElementById('intensiveEntry');if(entry)entry.addEventListener('keydown',e=>{if(e.key==='Enter')intensiveCheck()});
}
function intensiveCheck(choice){let r=intensive;if(!r||r.answers.length!==r.idx)return;let q=intensiveTasks(FULL_UNITS[r.id])[r.idx],actual=q.options?q.options[choice]:document.getElementById('intensiveEntry').value;
 if(!actual||!actual.trim()){document.getElementById('intensiveFeedback').textContent='Enter an answer first.';return}
 let ok=deepNormalize(actual)===deepNormalize(q.expected);feedbackSound(ok);r.answers.push(ok);if(ok)r.correct++;

<script>
// The home dashboard replaces earlier stacked cards; older course and practice engines remain intact.
function home(){
 ensureLearning();
 const level=state.learning.placement?.recommended||'A1';
 const units=FULL_UNITS.map((u,id)=>({...u,id})).filter(u=>u.level===level);
 const scores=state.learning.fullScores||{};
 const next=units.findIndex(u=>!scores[u.id]?.passed),idx=next<0?units.length-1:next;
 const done=units.filter(u=>scores[u.id]?.passed).length;
 const title=units[idx]?.title||'Your first lesson';
 const xp=typeof practiceState==='function'?practiceState():null;
 const daily=xp?.activity?.[new Date().toLocaleDateString('en-CA')]||0;
 app.innerHTML=`<section class="dashboard-hero"><img src="hund.png" alt="Fritzi the German shepherd"><div><h2>Willkommen zurück!</h2><p>Ready for a little German today?</p></div></section>
 <section class="dashboard-primary"><div class="path-eyebrow">YOUR LEARNING PATH · ${level}</div><h2>${done===units.length?'Great work! Course complete':`Lesson ${idx+1}: ${safeText(title)}`}</h2><p class="path-small">${done} of ${units.length} lessons completed</p><div class="path-track" role="progressbar" aria-valuemin="0" aria-valuemax="${units.length}" aria-valuenow="${done}"><div style="width:${Math.round(done/units.length*100)}%"></div></div><button class="dashboard-main-btn" onclick="friendlyCourse('${level}')">${done===units.length?'Review your lessons':done?'Continue learning':'Start lesson 1'}</button></section>
 <h3 class="section-label">What would you like to do?</h3><div class="dashboard-shortcuts">
 <button class="secondary" onclick="friendlyCourse('${level}')">📖 My lessons<small>${level} · ${units.length} lessons</small></button>
 
 
 <button class="secondary" onclick="aiTutor()">🎙 AI conversation<small>Speak German</small></button>
 <button class="secondary" onclick="placementResults()">◈ My placement<small>Results and skills</small></button>
 <button class="secondary" onclick="review()">↻ Review mistakes<small>Practice tricky answers</small></button></div>`;
}
// Keep track of the screen the user actually visited, including inline onclick navigation.
const screenHistory=[];
let lastScreenHTML='',screenGuard=false;
function appScreenChanged(){
 if(screenGuard)return;
 // Do not remove/reinsert Back on every mutation: doing so creates
 // an endless MutationObserver cycle that blocks clicks and audio.
 const homeScreen=!!app.querySelector('.dashboard-primary');
 const back=app.querySelector('#screenBack');
 if(homeScreen){
  if(back)back.remove();
  return;
 }
 if(!back){
  const b=document.createElement('button');
  b.id='screenBack';b.type='button';b.setAttribute('aria-label','Go back');b.textContent='Back';
  b.addEventListener('click',goScreenBack);
  app.prepend(b);
 }
}
function goScreenBack(){
 toggleMenu(false);
 // On deep exercise screens, the learning path is a predictable and safe destination.
 const level=state.learning?.placement?.recommended||'A1';
 if(app.innerHTML.includes('Exercise ')||app.innerHTML.includes('Practice ·'))friendlyCourse(level);
 else home();
 window.scrollTo({top:0,behavior:'instant'});
}
const screenObserver=new MutationObserver(()=>{if(screenGuard)return;screenGuard=true;try{appScreenChanged()}finally{screenGuard=false}});
screenObserver.observe(app,{childList:true,subtree:false});
home();appScreenChanged();
</script>
<style>

<script>
(function(){
const oldStudy=fullStudy;
fullStudy=function(id){
 oldStudy(id);
 const u=FULL_UNITS[id],card=app.querySelector('.card');
 if(!u||!card)return;
 // The old rule explained masculine accusative den but omitted an example.
 if(u.title==='Two-way prepositions'){
  const examplesHeading=[...card.querySelectorAll('h3')].find(h=>h.textContent.trim()==='Examples');
  const lastExample=examplesHeading?.nextElementSibling?.nextElementSibling?.nextElementSibling;
  if(lastExample&&lastExample.classList.contains('vocab-row')){
   lastExample.insertAdjacentHTML('afterend',`<div class="vocab-row"><div class="vocab-copy"><strong>Ich lege das Buch auf den Tisch.</strong><span>I put the book onto the table.</span></div><button class="secondary" onclick="speak('Ich lege das Buch auf den Tisch.')">🔊</button></div>`);
  }
 }
 const oldTitle=card.querySelector('h2');
 if(oldTitle)oldTitle.textContent='Let’s learn together';
 const oldButtons=[...card.querySelectorAll('button')].filter(b=>!b.closest('.vocab-row'));
 const main=oldButtons.find(b=>/Start 7 exercises|Try what you learned|Start exercises/i.test(b.textContent));
 if(main){main.textContent='Ready? Let’s practice';main.classList.add('lesson-next');}
 const back=oldButtons.find(b=>/Back to course|Back to my learning path/i.test(b.textContent));
 if(back){back.textContent='My learning path';back.classList.add('secondary');}
 const extra=card.querySelector('.unit-explain:has(button)');
 if(extra&&/Extended skill practice/i.test(extra.textContent)){
  const details=document.createElement('details');details.className='lesson-more';
  details.innerHTML='<summary>Want more practice? ▾</summary>';
  extra.parentNode.insertBefore(details,extra);details.appendChild(extra);
  const h=extra.querySelector('h3');if(h)h.textContent='Practice a little more';
  const btn=extra.querySelector('button');if(btn)btn.textContent='Try extra activities';
 }
 card.insertAdjacentHTML('afterbegin',`<div class="lesson-welcome"><img src="${id%2?'katze.png':'hund.png'}" alt="Your learning companion"><div><h2>Lesson ${FULL_UNITS.filter(x=>x.level===u.level).findIndex(x=>x===u)+1}: ${safeText(u.title)}</h2><p>First, learn the pattern. Then try it yourself.</p></div></div>`);
};
})();
</script>

<script>
(function(){
const NEW_QUESTIONS={"0": [["Meine Schwester ist ___ Jahre alt.", ["zwanzig", "zwanzigste", "zwanziger"], 0, "A person's age uses a cardinal number: zwanzig Jahre alt."], ["Wie alt ___ dein Bruder?", ["ist", "sind", "bist"], 0, "Dein Bruder is third-person singular, so use ist."]], "1": [["Das ist ___ Vater.", ["mein", "meine", "meinen"], 0, "Vater is masculine nominative; use mein."], ["Anna besucht ___ Schwester.", ["ihre", "ihr", "ihren"], 0, "Schwester is feminine accusative, so use ihre."]], "2": [["Ich hätte gern ___ Wasser.", ["ein", "einen", "eine"], 0, "Wasser is neuter: ein Wasser."], ["___ kostet der Kaffee?", ["Wie viel", "Wie viele", "Wo"], 0, "Wie viel asks about a price."]], "3": [["Der Termin ist ___ Montag.", ["am", "um", "im"], 0, "Use am with days of the week."], ["Der Zug fährt ___ acht Uhr.", ["um", "am", "in"], 0, "Use um with a clock time."]], "4": [["___ wohnst du?", ["Wo", "Wer", "Wann"], 0, "Wo asks about location."], ["___ heißt deine Lehrerin?", ["Wie", "Was", "Wohin"], 0, "Wie heißt ... asks for a name."]], "5": [["Ich habe ___ Auto.", ["kein", "nicht", "keine"], 0, "Kein negates an indefinite neuter noun: kein Auto."], ["Heute komme ich ___.", ["nicht", "kein", "keine"], 0, "Nicht negates the action of coming."]], "6": [["Jeden Morgen ___ ich Kaffee.", ["trinke", "trinkst", "trinkt"], 0, "Ich takes the -e verb ending."], ["Sie ___ um sechs Uhr auf.", ["steht", "stehen", "stehe"], 0, "Aufstehen is separable: sie steht ... auf."]], "7": [["Entschuldigung, wo ist ___ Bahnhof?", ["der", "die", "das"], 0, "Bahnhof is masculine: der Bahnhof."], ["Gehen Sie ___ links.", ["nach", "in", "zu"], 0, "Nach links means to the left."]], "8": [["___ Abend, Frau Müller!", ["Guten", "Gute", "Gut"], 0, "The greeting is Guten Abend."], ["Ich ___ aus Kanada.", ["komme", "kommt", "kommen"], 0, "With ich, the verb kommen takes the -e ending: ich komme. Ich komme aus Kanada means I come from Canada."]], "9": [["___ Fenster ist offen.", ["Das", "Der", "Die"], 0, "Fenster is neuter."], ["___ Zeitung liegt hier.", ["Die", "Das", "Der"], 0, "Zeitung is feminine; -ung is a common feminine ending."]], "10": [["Meine Freunde ___ in Hamburg.", ["wohnen", "wohnt", "wohnst"], 0, "Plural Freunde uses wohnen."], ["Du ___ gern Musik.", ["hörst", "hört", "höre"], 0, "Du takes -st."]], "11": [["Morgen ___ wir ins Kino.", ["gehen", "wir gehen", "geht"], 0, "After Morgen, the finite verb must come second."], ["Which sentence is correct?", ["Am Sonntag besuche ich Oma.", "Am Sonntag ich besuche Oma.", "Am Sonntag Oma ich besuche."], 0, "A main-clause finite verb is in second position."]], "12": [["Ich stelle die Tasse auf ___ Tisch.", ["den", "dem", "der"], 0, "Placing the cup answers wohin?; masculine accusative is den."], ["Die Jacke hängt an ___ Tür.", ["der", "die", "den"], 0, "A fixed location answers wo?; feminine dative is der."], ["Wir fahren in ___ Stadt.", ["die", "der", "den"], 0, "Movement toward a destination takes accusative: in die Stadt."]], "13": [["Du ___ hier nicht rauchen.", ["darfst", "dürfen", "darf"], 0, "Du darfst expresses permission/prohibition."], ["Wir ___ morgen früh aufstehen.", ["müssen", "muss", "musst"], 0, "Wir uses müssen."]], "14": [["Dieser Film ist ___ als der andere.", ["spannender", "spannendste", "spannend"], 0, "Comparisons with als use the comparative."], ["Von allen ist Lara ___ .", ["am schnellsten", "schneller", "schnell"], 0, "Am ... -sten expresses the superlative."]], "15": [["Ich ___ mich auf den Urlaub.", ["freue", "freut", "freuen"], 0, "Sich freuen is reflexive; ich freue mich."], ["Er wäscht ___ die Hände.", ["sich", "ihn", "ihm"], 0, "Sich die Hände waschen uses reflexive sich."]], "16": [["___ bitte die Tür!", ["Öffne", "Öffnest", "Öffnen"], 0, "Informal singular imperative: Öffne!"], ["___ Sie bitte hier.", ["Warten", "Wartet", "Warte"], 0, "Formal imperative uses infinitive + Sie."]], "17": [["Ich trage einen ___ Mantel.", ["roten", "roter", "rotes"], 0, "After einen, masculine accusative adjective ends -en."], ["Das ist ein ___ Haus.", ["kleines", "kleine", "kleinen"], 0, "After ein, neuter nominative adjective ends -es."]], "18": [["Nächste Woche ___ ich nach Köln fahren.", ["werde", "wirst", "wird"], 0, "Ich werde + infinitive expresses future."], ["Morgen ___ wir unsere Freunde.", ["besuchen", "besucht", "besuche"], 0, "Present tense can describe a planned future event."]], "19": [["Ich möchte ein Zimmer ___ zwei Nächte.", ["für", "mit", "nach"], 0, "Für introduces a duration or purpose."], ["Wo kann ich ___ einchecken?", ["mich", "mir", "mein"], 0, "Einchecken is often used reflexively: mich einchecken."]], "20": [["Ich sehe ___ Lehrer.", ["den", "dem", "der"], 0, "Lehrer is masculine; direct object takes den."], ["Wir kaufen ___ Banane.", ["eine", "einen", "ein"], 0, "Banane is feminine; accusative eine."]], "21": [["Ich fahre mit ___ Fahrrad.", ["dem", "das", "den"], 0, "Mit always takes dative; das Fahrrad → dem Fahrrad."], ["Sie gibt ___ Kind ein Geschenk.", ["dem", "das", "den"], 0, "Recipient is dative: dem Kind."]], "22": [["Gestern ___ wir viel gelernt.", ["haben", "sind", "werden"], 0, "Lernen forms Perfekt with haben."], ["Sie ist nach München ___.", ["gefahren", "gefährt", "fahren"], 0, "Fahren's past participle is gefahren."]], "23": [["Ich ___ meine Freundin heute ___.", ["rufe ... an", "anrufe ...", "rufe ... auf"], 0, "Anrufen splits: rufe ... an."], ["Wann ___ der Film ___?", ["fängt ... an", "anfängt ...", "fängt ... auf"], 0, "Anfangen splits in a main clause: fängt ... an."]]};
const originalQuestions=fullQuestions;
const seeded=(arr,seed)=>{let copy=[...arr];for(let i=copy.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
fullQuestions=function(u){
 let id=FULL_UNITS.indexOf(u),fresh=NEW_QUESTIONS[id];
 if(!fresh)return originalQuestions(u);
 let n=(state.learning?.fullAttempts?.[id]||0),base=originalQuestions(u);
 let newItems=fresh.map((row,i)=>{
  let [prompt,opts,answer,why]=row,correct=opts[answer],shuffled=seeded(opts,(id+1)*101+(n+1)*67+i*31);
  return {type:'grammar',prompt,options:shuffled,answer:shuffled.indexOf(correct),why};
 });
 // Mix unseen sentences with previously taught material; repeat attempts rotate question order.
 let mixed=[...newItems,...base.filter(q=>q.type==='grammar'||q.type==='order'),...base.filter(q=>q.type==='translate'||q.type==='listen'||q.type==='recall')];
 return seeded(mixed,(id+7)*1231+(n+1)*79).slice(0,7);
};
const originalBegin=fullBegin;
fullBegin=function(id){
 ensureLearning();state.learning.fullAttempts??={};state.learning.fullAttempts[id]=(state.learning.fullAttempts[id]||0)+1;save();
 originalBegin(id);
};
const originalRender=fullRender;
fullRender=function(){
 originalRender();
 if(!fullSession)return;
 let title=app.querySelector('.card .muted');
 if(title)title.insertAdjacentHTML('beforebegin',`<p class="dynamic-progress">Practice new sentences — not just the lesson examples.</p>`);
};
const originalMark=fullMark;
fullMark=function(ok,answer,why){
 originalMark(ok,answer,why);
 let box=document.querySelector('#fullFeedback .unit-explain');
 if(box)box.insertAdjacentHTML('beforeend',`<p class="muted">Focus on the grammar pattern so you can use it in sentences you haven't seen before.</p>`);
};
function fixBack(){
 let b=document.getElementById('screenBack');
 if(!b||b.dataset.fixed)return;
 b.dataset.fixed='yes';
 b.onclick=(e)=>{
  e.preventDefault();e.stopImmediatePropagation();
  let id=fullSession?.id;
  if(id!==undefined&&id!==null){fullStudy(id)}
  else if(app.querySelector('.lesson-welcome')){let title=app.querySelector('.lesson-welcome h2')?.textContent||'';let level=state.learning?.placement?.recommended||'A1';let u=FULL_UNITS.find(x=>title.includes(x.title));friendlyCourse(u?.level||level)}
  else home();
  window.scrollTo(0,0);
 };
}
new MutationObserver(fixBack).observe(app,{childList:true,subtree:false});fixBack();
})();
</script>

<style>
.picture-card{text-align:center;padding:18px 12px;background:linear-gradient(160deg,#244960,#173149);border:1px solid #70bfb9;border-radius:22px;margin:14px 0}
.picture-art{font-size:clamp(6rem,24vw,10rem);line-height:1.5;display:block;filter:drop-shadow(0 12px 12px #0005);user-select:none}
.picture-choices{display:grid;gap:9px}.picture-choices button{width:100%;text-align:left}

.picture-tabs{display:flex;gap:8px;flex-wrap:wrap}.picture-tabs button{flex:1;min-width:110px}

</style>
<script>
const PICTURE_WORDS=[["der Hund", "dog", "🐕", "der", "Hund"], ["die Katze", "cat", "🐈", "die", "Katze"], ["das Haus", "house", "🏠", "das", "Haus"], ["der Apfel", "apple", "🍎", "der", "Apfel"], ["die Banane", "banana", "🍌", "die", "Banane"], ["das Buch", "book", "📕", "das", "Buch"], ["der Tisch", "table", "🪑", "der", "Tisch"], ["die Blume", "flower", "🌻", "die", "Blume"], ["das Auto", "car", "🚗", "das", "Auto"], ["der Baum", "tree", "🌳", "der", "Baum"], ["die Sonne", "sun", "☀️", "die", "Sonne"], ["das Wasser", "water", "💧", "das", "Wasser"], ["der Schlüssel", "key", "🔑", "der", "Schlüssel"], ["die Uhr", "clock", "🕒", "die", "Uhr"], ["das Brot", "bread", "🍞", "das", "Brot"], ["der Zug", "train", "🚆", "der", "Zug"], ["die Schule", "school", "🏫", "die", "Schule"], ["das Fahrrad", "bicycle", "🚲", "das", "Fahrrad"], ["der Schuh", "shoe", "👟", "der", "Schuh"], ["die Tür", "door", "🚪", "die", "Tür"], ["das Fenster", "window", "🪟", "das", "Fenster"], ["der Vogel", "bird", "🐦", "der", "Vogel"], ["die Tasse", "cup", "☕", "die", "Tasse"], ["das Bett", "bed", "🛏️", "das", "Bett"], ["der Käse", "cheese", "🧀", "der", "Käse"], ["die Erdbeere", "strawberry", "🍓", "die", "Erdbeere"], ["das Ei", "egg", "🥚", "das", "Ei"], ["der Fisch", "fish", "🐟", "der", "Fisch"], ["die Gabel", "fork", "🍴", "die", "Gabel"], ["das Messer", "knife", "🔪", "das", "Messer"], ["der Regenschirm", "umbrella", "☂️", "der", "Regenschirm"], ["die Jacke", "jacket", "🧥", "die", "Jacke"]];
let pictureSession=null;
function pictureHome(){
 const saved=state.pictureProgress||{attempts:0,correct:0};
 app.innerHTML=illustratedHero('Picture practice','See it. Name it. Remember the article.','forest','katze.png')
 +`<section class="card"><h2>What do you see?</h2><p>Look at a picture and choose the German word or type it yourself. Practice the article with every noun.</p><p class="muted">${saved.attempts} answers · ${saved.correct} correct</p><div class="picture-tabs"><button onclick="pictureStart('choice')">Choose the word</button><button onclick="pictureStart('type')">Type the word</button></div><p class="muted">32 everyday objects · German nouns with der, die and das.</p></section>`;
 window.scrollTo(0,0);
}
function pictureStart(mode){
 const day=Math.floor(Date.now()/86400000),idx=state.pictureProgress?.attempts||0;
 const shuffled=[...PICTURE_WORDS.keys()].sort((a,b)=>((a*37+day*13)%97)-((b*37+day*13)%97));
 pictureSession={mode,queue:shuffled,index:0,correct:0,answered:false};
 pictureShow();
}
function pictureShow(){
 let s=pictureSession;if(!s)return pictureHome();
 if(s.index>=s.queue.length){app.innerHTML=illustratedHero('Nice work!','You finished this picture round.','village','hund.png')+`<section class="card"><h2>${s.correct} / ${s.queue.length} correct</h2><button onclick="pictureStart('${s.mode}')">Practice again</button><button class="secondary" onclick="pictureHome()">Picture practice home</button></section>`;return}
 let id=s.queue[s.index],w=PICTURE_WORDS[id],choice=s.mode==='choice';
 let options=[id,(id+9)%PICTURE_WORDS.length,(id+17)%PICTURE_WORDS.length,(id+25)%PICTURE_WORDS.length].sort((a,b)=>((a+id*7)%11)-((b+id*7)%11));
 app.innerHTML=`<div class="picture-status"><span>${choice?'Choose the German word':'Write the German word'}</span><span>${s.index+1} / ${s.queue.length}</span></div><section class="card"><div class="picture-card"><span class="picture-art" role="img" aria-label="Picture of ${safeText(w[1])}">${w[2]}</span></div><h2>What is this in German?</h2><p class="muted">Include der, die or das.</p>${choice?`<div class="picture-choices">${options.map(i=>`<button class="secondary" onclick="pictureAnswer(${id},${i})">${safeText(PICTURE_WORDS[i][0])}</button>`).join('')}</div>`:`<form onsubmit="event.preventDefault();pictureTyped(${id})"><input id="pictureInput" class="picture-input" placeholder="e.g. der Hund" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="German word with article"><button type="submit">Check answer</button></form>`}<div id="pictureFeedback" aria-live="polite"></div></section>`;
 window.scrollTo(0,0);
}
function pictureAnswer(correct,chosen){pictureGrade(correct,PICTURE_WORDS[chosen][0])}
function pictureTyped(correct){pictureGrade(correct,document.getElementById('pictureInput').value)}
function pictureGrade(id,submitted){
 let s=pictureSession;if(!s||s.answered)return;
 let w=PICTURE_WORDS[id],norm=t=>t.toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' ').normalize('NFC');
 let ok=norm(submitted)===norm(w[0]);if(!ok)dlWrongHaptic();s.answered=true;try{speak(w[0])}catch(e){}if(ok)s.correct++;
 state.pictureProgress??={attempts:0,correct:0};state.pictureProgress.attempts++;if(ok)state.pictureProgress.correct++;save();
 app.querySelectorAll('.picture-choices button,form button,.picture-input').forEach(b=>b.disabled=true);
 let feedback=document.getElementById('pictureFeedback');
 feedback.innerHTML=`<div class="picture-answer"><h3>${ok?'Richtig! Correct!':'Good try!'}</h3><p><strong>${safeText(w[0])}</strong> — ${safeText(w[1])}</p><p>The noun is <strong>${safeText(w[3])}</strong> + <strong>${safeText(w[4])}</strong>. Learn both together: ${safeText(w[0])}.</p>${!ok?`<p class="muted">You entered: ${safeText(submitted||'(blank)')}</p>`:''}<button onclick="pictureNext()">Next picture</button></div>`;
}
function pictureNext(){if(!pictureSession)return;pictureSession.index++;pictureSession.answered=false;pictureShow()}

const LISTENING_ITEMS=Object.fromEntries(Object.entries(LISTENING_LEVELS).map(([level,rows])=>[level,rows.map(([en,de])=>({en,de,tokens:de.split(' ')}))]));
function listeningLevels(){
 gameSession=null;
 app.innerHTML='<section class="card"><h2>Listening challenge</h2><p>Choose your German level. Listen to a sentence and identify its meaning or its written German form.</p><div class="game-grid">'+Object.keys(LISTENING_ITEMS).map(level=>'<button type="button" data-listening-level="'+level+'">'+level+'<br><small>'+({A1:'Beginner',A2:'Elementary',B1:'Intermediate',B2:'Upper intermediate'}[level])+'</small></button>').join('')+'</div><button class="secondary" onclick="gameHub()">Back to practice games</button></section>';
 window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
 const button=e.target.closest('[data-listening-level]');
 if(!button)return;
 e.preventDefault();
 const level=button.getAttribute('data-listening-level');
 if(LISTENING_ITEMS[level])gameStart('listen',level);
});
function listeningSpeak(t,slow=false){
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=slow?0.7:0.84;u.pitch=1;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase()==='de-de'&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){speak(t)}
}
let gameSession=null;
function gameHub(){
 gameSession=null;
 let stats=state.gameStats||{played:0,correct:0};
 app.innerHTML=illustratedHero('Practice games','Short, varied activities to build German skills.','village','hund.png')+
 `<section class="card"><h2>Choose an activity</h2><p class="muted">${stats.played} answers · ${stats.correct} correct</p><div class="game-grid">
 <button onclick="gameStart(&quot;build&quot;)">🧩 Build a sentence<br><small>Tap words in order</small></button>
 <button onclick="gameStart(&quot;match&quot;)">🔗 Match the pairs<br><small>German ↔ English</small></button>
 <button onclick="listeningLevels()">🔊 Listen and choose<br><small>Hear German phrases</small></button>
 <button onclick="pictureHome()">🖼️ Name the picture<br><small>Choose or type</small></button></div>
 <p class="muted">Exercises use different sentences from the lesson examples.</p></section>`;
 window.scrollTo(0,0);
}
function gameStart(mode,level){
 if(mode==='listen'&&!level)return listeningLevels();
 let seq=[...(mode==='listen'?LISTENING_ITEMS[level]:GAME_ITEMS).keys()];
 if(mode==='listen'){
  // Prioritize unseen questions across rounds, while keeping each round randomized.
  const key='dl-listening-recent-'+level;
  let recent=[];try{recent=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  if(!Array.isArray(recent))recent=[];
  const fresh=seq.filter(i=>!recent.includes(i)),older=seq.filter(i=>recent.includes(i));
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  seq=[...shuffle(fresh),...shuffle(older)];
  const chosen=seq.slice(0,6);
  try{localStorage.setItem(key,JSON.stringify([...recent,...chosen].slice(-24)))}catch(e){}
  seq=chosen;
 }
 for(let i=seq.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}
 gameSession={mode,level:level||null,pool:mode==='listen'?LISTENING_ITEMS[level]:GAME_ITEMS,seq:seq.slice(0,6),idx:0,correct:0,answered:false,picked:[],matches:[],selected:null};
 gameRender();
}
function gameRender(){
 let g=gameSession;if(!g)return gameHub();
 if(g.idx>=g.seq.length){
  app.innerHTML=illustratedHero('Round complete!',`${g.correct} of ${g.seq.length} correct.`,'forest','katze.png')+
  `<section class="card"><h2>${g.correct}/${g.seq.length} correct</h2><button onclick="gameStart('${g.mode}'${g.mode==='listen'?`, '${g.level}'`:''})">Try another round</button><button class="secondary" onclick="gameHub()">All practice games</button></section>`;window.scrollTo(0,0);return;
 }
 g.answered=false;g.picked=[];g.matches=[];g.selected=null;
 let item=g.pool[g.seq[g.idx]],body='';
 if(g.mode==='build'){
 let order=[...item.tokens.keys()].sort(()=>Math.random()-.5);
 g.order=order;
 body=`<p>Build this sentence in German:</p><h3>${safeText(item.en)}</h3><div id="gameBuilt" class="game-built">Tap the words below ↓</div><div id="gameBank" class="game-wordbank">${order.map((n,i)=>`<button class="secondary" id="gb${i}" onclick="gamePick(${i})">${safeText(item.tokens[n].replace(/[.!?]+$/,""))}</button>`).join('')}</div><button class="secondary" onclick="gameRender()">Start over</button><button onclick="gameCheckBuild()">Check sentence</button><button class="secondary" onclick="dlSentenceHelpToggle()">Show grammar help</button><div id="dlSentenceHelp" class="explain-box" hidden></div>`;
 }else if(g.mode==='listen'){
 let other=[...g.pool.keys()].filter(i=>i!==g.seq[g.idx]).sort(()=>Math.random()-.5).slice(0,3);
 let choices=[g.seq[g.idx],...other].sort(()=>Math.random()-.5);g.choices=choices;
 g.listenWritten=(g.idx%2===1);
 body=`<h3>${g.listenWritten?'Which German sentence do you hear?':'What does the German sentence mean?'}</h3><button onclick="listeningSpeak(${JSON.stringify(item.de).replace(/"/g,'&quot;')})">🔊 Play German audio</button><div class="picture-choices">${choices.map((i,n)=>`<button class="secondary" onclick="gameChoose(${n})">${safeText(g.listenWritten?g.pool[i].de:g.pool[i].en)}</button>`).join('')}</div>`;
 }else{
 let pairA=PICTURE_WORDS.slice((g.seq[g.idx]*3)%24,(g.seq[g.idx]*3)%24+4);
 g.pairs=pairA;g.left=pairA.map((w,i)=>i).sort(()=>Math.random()-.5);g.right=pairA.map((w,i)=>i).sort(()=>Math.random()-.5);
 body=`<p>Match each German noun to its English meaning.</p><p id="gameMatched">0 / 4 pairs matched</p><div class="match-columns"><div class="match-column">${g.left.map(i=>`<button class="secondary match-tile" id="gl${i}" onclick="gameMatch('l',${i})">${safeText(pairA[i][0])}</button>`).join('')}</div><div class="match-column">${g.right.map(i=>`<button class="secondary match-tile" id="gr${i}" onclick="gameMatch('r',${i})">${safeText(pairA[i][1])}</button>`).join('')}</div></div>`;
 }
 app.innerHTML=`<section class="card"><p class="muted">${g.mode==='build'?'Sentence builder':g.mode==='listen'?'Listening challenge':'Word matching'} · ${g.idx+1} of ${g.seq.length}</p><div class="game-progress"><div style="width:${g.idx/g.seq.length*100}%"></div></div>${body}<div id="gameFeedback" aria-live="polite"></div></section>`;
 if(g.mode==='listen')listeningSpeak(item.de);
 window.scrollTo(0,0);
}
function gamePick(n){let g=gameSession;if(g.answered||g.picked.includes(n))return;g.picked.push(n);document.getElementById('gb'+n).disabled=true;document.getElementById('gameBuilt').textContent=g.picked.map(i=>GAME_ITEMS[g.seq[g.idx]].tokens[g.order[i]]).join(' ').replace(/[.!?]+(?=\s|$)/g,'')}
function gameCheckBuild(){let g=gameSession;if(g.answered)return;let item=GAME_ITEMS[g.seq[g.idx]],guess=g.picked.map(i=>item.tokens[g.order[i]]).join(' ');if(g.picked.length!==item.tokens.length){document.getElementById('gameFeedback').textContent='Use all the words first.';return}gameMark(guess.replace(/[.!?]+(?=\s|$)/g,'').trim()===item.de.replace(/[.!?]+(?=\s|$)/g,'').trim(),item.de)}
function gameChoose(n){let g=gameSession;if(g.answered)return;let item=g.pool[g.seq[g.idx]];gameMark(g.choices[n]===g.seq[g.idx],item.de+' — '+item.en)}
function dlWrongHaptic(){try{if(navigator.vibrate)navigator.vibrate(110)}catch(e){}}
function gameMatch(side,n){
 let g=gameSession;if(!g||g.answered||g.matches.includes(n))return;
 // Pronounce the German noun whenever its tile is selected, regardless of selection order.
 if(side==='l' && g.pairs && g.pairs[n])speak(g.pairs[n][0]);
 if(g.selected===null){g.selected={side,n};document.getElementById((side==='l'?'gl':'gr')+n).style.outline='3px solid #f4d487';return}
 let a=g.selected;document.getElementById((a.side==='l'?'gl':'gr')+a.n).style.outline='';
 g.selected=null;if(a.side===side){g.selected={side,n};document.getElementById((side==='l'?'gl':'gr')+n).style.outline='3px solid #f4d487';return}
 if(a.n===n){g.matches.push(n);document.getElementById('gl'+n).disabled=true;document.getElementById('gr'+n).disabled=true;document.getElementById('gl'+n).classList.add('match-complete');document.getElementById('gr'+n).classList.add('match-complete');document.getElementById('gameMatched').textContent=g.matches.length+' / 4 pairs matched';if(g.matches.length===4)gameMark(true,'All four pairs matched!')}
 else{dlWrongHaptic();document.getElementById('gameFeedback').textContent='Not a match. Try another pair.'}
}
function dlReverseGrammarNote(de){
 if(/\bdieses\s+(Buch|Kind|Haus|Auto|Mädchen|Zimmer|Wort)\b/i.test(de))return '<p class="dl-reverse-grammar"><strong>Why dieses?</strong> <em>Buch</em> is neuter (<em>das Buch</em>). The ending <em>-es</em> is used with a neuter noun in the nominative or accusative case.</p>';
 return '';
}
function gameMark(ok,answer){
 if(!ok)dlWrongHaptic();
 let g=gameSession;if(!g||g.answered)return;g.answered=true;if(ok)g.correct++;
 state.gameStats??={played:0,correct:0};state.gameStats.played++;if(ok)state.gameStats.correct++;save();
 app.querySelectorAll('.card button').forEach(b=>b.disabled=true);
 document.getElementById('gameFeedback').innerHTML=`<div class="game-feedback"><strong>${ok?'Correct!':'Not quite.'}</strong>${g.mode==='reverse'?(ok?dlReverseGrammarNote(GAME_ITEMS[g.seq[g.idx]].de):`<p>Correct translation: ${safeText(answer)}</p>`):`<p>${safeText(answer)}</p>`}${g.mode==='build'&&ok?'<button class="secondary" onclick="speak(GAME_ITEMS[gameSession.seq[gameSession.idx]].de)">🔊 Replay sentence</button>':''}<button onclick="gameNext()">Next</button></div>`;if(g.mode==='build'&&ok)setTimeout(()=>{if(gameSession===g&&g.answered)speak(GAME_ITEMS[g.seq[g.idx]].de)},350);if(g.mode==='match'){document.getElementById('gameFeedback').scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function gameNext(){if(!gameSession)return;gameSession.idx++;gameRender()}

/* Keep the next action reachable on mobile after checking a reverse translation. */
(function(){
 const style=document.createElement('style');
 style.textContent=`body.dl-reverse-answered #app{padding-bottom:110px!important}
 body.dl-reverse-answered #gameFeedback button[onclick="gameNext()"]{display:none!important}
 #dlReverseNextBar{position:fixed;bottom:env(safe-area-inset-bottom, 0px);left:0;right:0;z-index:9999;padding:10px 18px calc(10px + env(safe-area-inset-bottom, 0px));background:linear-gradient(0deg,#112c38 85%,rgba(17,44,56,.93));box-sizing:border-box}
 #dlReverseNextBar button{display:block;width:min(100%,680px);margin:auto;min-height:54px;background:#68cbbc;color:#102b32;border:0;border-radius:12px;font-size:18px;font-weight:700}`;
 document.head.appendChild(style);
 const originalMark=gameMark;
 gameMark=function(ok,answer){
  originalMark(ok,answer);
  const g=gameSession;
  if(!g||g.mode!=='reverse'||!g.answered)return;
  document.body.classList.add('dl-reverse-answered');
  document.getElementById('dlReverseNextBar')?.remove();
  const bar=document.createElement('div');bar.id='dlReverseNextBar';
  const button=document.createElement('button');button.textContent='Next';
  button.onclick=()=>{bar.remove();document.body.classList.remove('dl-reverse-answered');gameNext()};
  bar.appendChild(button);document.body.appendChild(bar);
 };
 const originalNext=gameNext;
 gameNext=function(){document.getElementById('dlReverseNextBar')?.remove();document.body.classList.remove('dl-reverse-answered');return originalNext()};
 const originalRender=gameRender;
 gameRender=function(){document.getElementById('dlReverseNextBar')?.remove();document.body.classList.remove('dl-reverse-answered');return originalRender()};
})();

const gameHome=home;
home=function(){gameHome();let target=app.querySelector('.card');if(target){let b=document.createElement('section');b.className='card';b.innerHTML='<h3>Practice games</h3><p>Build sentences, match words and practice listening.</p><button onclick="gameHub()">Play practice games</button>';target.after(b)}};
let gameMenu=document.getElementById('sideMenu');if(gameMenu){let b=document.createElement('button');b.textContent='🧩 Practice games';b.onclick=()=>navigateTo('gameHub');gameMenu.appendChild(b)}
// Reuse the app's persistent top back button for the new screens.
const priorFixGameBack=window.setInterval(()=>{
 const b=document.getElementById('screenBack');if(!b)return;
 if(gameSession || app.textContent.includes('Choose an activity')){
  b.style.display='inline-flex';b.onclick=function(e){e.preventDefault();e.stopImmediatePropagation();if(gameSession)gameHub();else home();window.scrollTo(0,0)};
 }
},300);

<script>
/* Ordered progression: foundational skills precede dependent grammar. Existing lesson IDs,
   question banks, progress, and all standalone practice activities are preserved. */
FULL_UNITS.push({level:'A1',title:'Countries, nationalities and languages',rule:'Ask Woher kommst du? (Where are you from?). Say Ich komme aus Deutschland, but Ich komme aus den USA. Nationality nouns are capitalized: Amerikanerin (female), Amerikaner (male), Deutsche (female), Deutscher (male). Language names are capitalized (Deutsch, Englisch); adjectives are lowercase (deutsch, amerikanisch).',examples:[['Woher kommst du?','Where are you from?'],['Ich komme aus den USA.','I am from the USA.'],['Ich spreche Englisch und ein bisschen Deutsch.','I speak English and a little German.']],checkpoint:{prompt:'Ich komme ___ den USA.',options:['aus','aus dem','von'],answer:0,why:'The USA is plural in German: aus den USA. For Germany: aus Deutschland.'}});
const STRUCTURED_PATH={
 A1:[
 {title:'Getting started',goal:'Introduce yourself and ask simple questions.',ids:[8,9,10],context:'Meet someone new. Learn greetings, noun articles, and present-tense verbs.'},
 {title:'Where you’re from and first sentences',goal:'Talk about countries, languages, and make simple sentences.',ids:[48,11,4,5],context:'Introduce your country and language, then talk about what you have, want, and do.'},
 {title:'People and everyday life',goal:'Talk about family, ages, and daily routines.',ids:[1,0,6],context:'Describe your family and a typical day.'},
 {title:'Everyday conversations',goal:'Order food, make plans, and find your way.',ids:[2,3,7],context:'Use German in cafés, appointments, and around town.'}
 ],
 A2:[
 {title:'Objects and recipients',goal:'Use accusative and dative in practical sentences.',ids:[20,21,12],context:'Describe where objects are and where they go.'},
 {title:'Actions and requests',goal:'Express ability, obligation, and instructions.',ids:[13,23,16],context:'Ask for help and explain what needs doing.'},
 {title:'Tell stories and make plans',goal:'Talk about yesterday, tomorrow, and travel.',ids:[22,18,19],context:'Describe a trip and make arrangements.'},
 {title:'Describe things more precisely',goal:'Use comparisons, adjectives, and reflexive verbs.',ids:[14,17,15],context:'Compare options and describe your preferences.'}
 ],
 B1:[
 {title:'Connect your ideas',goal:'Explain reasons, conditions, and consequences.',ids:[32,27,29],context:'Go beyond short sentences and explain why.'},
 {title:'Describe people and events',goal:'Talk about experiences and tell detailed stories.',ids:[28,26,33],context:'Describe something that happened and who was involved.'},
 {title:'Express yourself clearly',goal:'Give opinions, discuss work, and make polite requests.',ids:[30,31,34],context:'Handle realistic discussions and situations.'},
 {title:'Use more complex structures',goal:'Practice cases, genitive, and infinitive clauses.',ids:[35,24,25],context:'Refine your writing and speech with longer sentences.'}
 ]
};
let curriculumSelected='A1';
function curriculumStats(level){
 let groups=STRUCTURED_PATH[level]||[],scores=state.learning?.fullScores||{};
 let all=groups.flatMap(g=>g.ids);
 return {groups,all,done:all.filter(id=>scores[id]?.passed).length,scores};
}
function curriculumNext(level){
 let st=curriculumStats(level);return st.all.find(id=>!st.scores[id]?.passed)??st.all[st.all.length-1];
}
function curriculumView(level){
 ensureLearning();curriculumSelected=STRUCTURED_PATH[level]?level:'A1';
 const st=curriculumStats(curriculumSelected);
 const firstUnfinished=st.groups.findIndex(g=>g.ids.some(id=>!st.scores[id]?.passed));
 const openIndex=firstUnfinished<0?st.groups.length-1:firstUnfinished;
 const next=curriculumNext(curriculumSelected);
 const total=st.all.length;
 app.innerHTML=`
 <section class="curriculum-summary curriculum-path-summary">
  <div class="curriculum-pill">YOUR LEARNING PATH</div>
  <h2>${curriculumSelected} · ${curriculumSelected==='A1'?'Beginner':curriculumSelected==='A2'?'Elementary':'Intermediate'}</h2>
  <p>Choose a level, then work through the numbered lessons in each module.</p>
  <div class="curriculum-levels">${['A1','A2','B1'].map(l=>`<button class="${l===curriculumSelected?'':'secondary'}" onclick="curriculumView('${l}')" aria-pressed="${l===curriculumSelected}">${l}</button>`).join('')}</div>
  <p><strong>${st.done} of ${total} lessons completed</strong></p>
  <div class="unit-progress" role="progressbar" aria-valuenow="${st.done}" aria-valuemin="0" aria-valuemax="${total}"><div style="width:${total?Math.round(st.done/total*100):0}%"></div></div>
  <button onclick="curriculumLesson(${next})">${st.done===total?'Review lessons':'Continue: '+safeText(FULL_UNITS[next]?.title||'next lesson')}</button>
 </section>
 <div class="curriculum-path-label">MODULES &amp; LESSONS</div>
 ${st.groups.map((g,n)=>{
  const done=g.ids.filter(id=>st.scores[id]?.passed).length+(curriculumSelected==='A1'&&n===0&&state.learning?.pronunciationLesson3Completed?1:0);
  const moduleTotal=g.ids.length+(curriculumSelected==='A1'&&n===0?1:0);const complete=done===moduleTotal;
  return `<details class="curriculum-module curriculum-path-module" ${n===openIndex?'open':''}>
   <summary><div class="curriculum-module-heading"><span class="curriculum-module-number">${n+1}</span><div><div class="curriculum-pill">MODULE ${n+1} · ${done}/${moduleTotal} LESSONS</div><h3>${safeText(g.title)}</h3><p>${safeText(g.goal)}</p></div></div><span class="curriculum-chevron" aria-hidden="true">${complete?'✓':'⌄'}</span></summary>
   <div class="curriculum-module-content">
   ${g.ids.map((id,j)=>{const passed=!!st.scores[id]?.passed;const isNext=id===next&&!passed;return `<div class="curriculum-lesson curriculum-path-lesson ${isNext?'curriculum-next-lesson':''}"><div class="curriculum-lesson-number" aria-label="Lesson ${j+1}">${j+1}</div><div class="text"><strong>Lesson ${j+1} · ${safeText(FULL_UNITS[id].title)}</strong><small>${passed?'✓ Completed':isNext?'Up next':'Not completed'}</small></div><button class="${passed?'secondary':''}" onclick="curriculumLesson(${id})">${passed?'Review':'Start'}</button></div>`}).join('')}
   ${curriculumSelected==='A1'&&n===0?`<div class="curriculum-lesson curriculum-path-lesson"><div class="curriculum-lesson-number">3</div><div class="text"><strong>Lesson 3 · German Pronunciation</strong><small>${state.learning?.pronunciationLesson3Completed?'✓ Completed':'15 sounds · Listening and speaking practice'}</small></div><button class="${state.learning?.pronunciationLesson3Completed?'secondary':''}" onclick="dlPronunciationIntro()">${state.learning?.pronunciationLesson3Completed?'Review':'Start'}</button></div>`:''}
   <div class="curriculum-check"><strong>Module ${n+1} review</strong><p>Check what you remember from these lessons.</p><button class="secondary" onclick="curriculumReview('${curriculumSelected}',${n})">Review what you learned</button></div>
   </div>
  </details>`}).join('')}
 <section class="card"><p>Modules organize related lessons. Complete the lessons in order, then use the module review to reinforce what you've learned.</p><button class="secondary" onclick="home()">Home</button></section>`;
 window.scrollTo(0,0);
}
function curriculumModuleIntro(level,n){
 let g=STRUCTURED_PATH[level]?.[n];if(!g)return;
 app.innerHTML=illustratedHero(g.title,level+' · Module '+(n+1),'village','hund.png')+
 `<section class="card"><h2>What you'll learn</h2><p>${safeText(g.context)}</p><h3>Your goal</h3><p>${safeText(g.goal)}</p><h3>Lessons in this module</h3>

function curriculumLesson(id){

 if(!level)return;

let moduleSession=null;
function dlAppConfirm({title,message,cancelText='Cancel',confirmText='Continue',danger=false,onConfirm}){
 if(document.getElementById('dl-review-exit-overlay'))return;
 const overlay=document.createElement('div');overlay.id='dl-review-exit-overlay';
 const dialog=document.createElement('div');dialog.className='dl-review-exit-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','dl-app-confirm-title');
 const heading=document.createElement('h2');heading.id='dl-app-confirm-title';heading.textContent=title;
 const body=document.createElement('p');body.textContent=message;
 const actions=document.createElement('div');actions.className='dl-review-exit-actions';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='secondary';cancel.textContent=cancelText;
 const proceed=document.createElement('button');proceed.type='button';proceed.textContent=confirmText;if(danger)proceed.className='dl-danger-confirm';
 actions.append(cancel,proceed);dialog.append(heading,body,actions);overlay.append(dialog);document.body.append(overlay);
 function close(){overlay.remove();document.removeEventListener('keydown',onKey)}
 function onKey(e){if(e.key==='Escape'){e.preventDefault();close()}}
 cancel.onclick=close;proceed.onclick=()=>{close();onConfirm?.()};
 document.addEventListener('keydown',onKey);cancel.focus();
}
function dlConfirmReviewExit(onLeave){
 if(!moduleSession){onLeave();return}
 if(document.getElementById('dl-review-exit-overlay'))return;
 const overlay=document.createElement('div');overlay.id='dl-review-exit-overlay';
 overlay.innerHTML='<div class="dl-review-exit-dialog" role="dialog" aria-modal="true" aria-labelledby="dl-review-exit-title"><h2 id="dl-review-exit-title">Leave this review?</h2><p>Your current review progress will be lost.</p><div class="dl-review-exit-actions"><button type="button" class="secondary" data-stay>Stay in Review</button><button type="button" data-leave>Leave Review</button></div></div>';
 document.body.appendChild(overlay);
 const stay=overlay.querySelector('[data-stay]'),leave=overlay.querySelector('[data-leave]');
 function close(){overlay.remove();document.removeEventListener('keydown',onKey)}
 function onKey(e){if(e.key==='Escape'){e.preventDefault();close()}}
 stay.onclick=close;
 leave.onclick=()=>{close();moduleSession=null;onLeave()};
 document.addEventListener('keydown',onKey);stay.focus();
}
const dlReviewOldHome=home;
home=function(){const args=arguments,ctx=this;dlConfirmReviewExit(()=>dlReviewOldHome.apply(ctx,args))};
const dlReviewOldCurriculumView=curriculumView;
curriculumView=function(){const args=arguments,ctx=this;dlConfirmReviewExit(()=>dlReviewOldCurriculumView.apply(ctx,args))};
function curriculumReview(level,n){
 let g=STRUCTURED_PATH[level]?.[n];if(!g)return;
 let questions=[];
 g.ids.forEach(id=>{
  let q=fullQuestions(FULL_UNITS[id]).filter(x=>x.options&&x.type!=='listen');
  q.slice(0,3).forEach(x=>questions.push({...x,unitId:id}));
 });
 for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}
 moduleSession={level,n,questions:questions.slice(0,g.ids.length*3),idx:0,score:0};
 curriculumReviewRender();
}
function curriculumReviewRender(){
 let s=moduleSession;if(!s)return;
 if(s.idx>=s.questions.length){
  let total=s.questions.length,passed=s.score>=Math.ceil(total*.8);
  ensureLearning();state.learning.moduleReviews??={};
  let key=s.level+'-'+s.n,old=state.learning.moduleReviews[key];
  state.learning.moduleReviews[key]={best:Math.max(old?.best||0,s.score),total,passed:passed||!!old?.passed};save();
  app.innerHTML=`<section class="card"><h2>Module review complete</h2><p>${s.score} of ${total} correct</p><p>${passed?'Well done. You can move to the next module.':'Review the lessons and try again.'}</p><button onclick="curriculumView('${s.level}')">Learning path</button><button class="secondary" onclick="curriculumReview('${s.level}',${s.n})">Practice again</button></section>`;
  moduleSession=null;return;
 }
 let q=s.questions[s.idx];
 app.innerHTML=`<section class="card"><p class="curriculum-pill">${s.level} · Module review · ${s.idx+1}/${s.questions.length}</p>
 <button class="secondary" onclick="curriculumView(moduleSession.level)">Back to learning path</button>\n <div class="unit-progress"><div style="width:${Math.round(s.idx/s.questions.length*100)}%"></div></div>
 <p class="muted">${safeText(FULL_UNITS[q.unitId].title)}</p><h2>${safeText(q.prompt)}</h2>
 <div class="picture-choices">${q.options.map((o,i)=>`<button class="secondary" onclick="curriculumReviewAnswer(${i})">${safeText(o)}</button>`).join('')}</div>
 <div id="moduleFeedback" aria-live="polite"></div></section>`;
 window.scrollTo(0,0);
}
function curriculumReviewAnswer(i){
 let s=moduleSession;if(!s||s.answered)return;
 let q=s.questions[s.idx],ok=i===q.answer;s.answered=true;if(ok)s.score++;
 app.querySelectorAll('.picture-choices button').forEach(b=>b.disabled=true);
 document.getElementById('moduleFeedback').innerHTML=`<div class="unit-explain"><strong>${ok?'Correct':'Not quite'}</strong><p>${safeText(q.options[q.answer])}</p><p>${safeText(q.why||FULL_UNITS[q.unitId].rule)}</p><button onclick="moduleSession.idx++;moduleSession.answered=false;curriculumReviewRender()">Next question</button></div>`;
}
function curriculumContinueFromHome(){
 curriculumView('A1');
 const target=app.querySelector('.curriculum-next-lesson')||app.querySelector('.curriculum-path-module[open]');
 if(!target)return;
 requestAnimationFrame(()=>{
  const header=document.querySelector('header');
  const headerHeight=header?Math.min(header.getBoundingClientRect().height,160):0;
  const top=Math.max(0,window.scrollY+target.getBoundingClientRect().top-headerHeight-20);
  window.scrollTo({top,behavior:'instant'});
 });
}
const structuredOldHome=home;
home=function(){
 structuredOldHome();
 let main=app.querySelector('.dashboard-primary');
 if(main){
  let st=curriculumStats('A1'),next=curriculumNext('A1');
  let title=main.querySelector('h2');if(title)title.textContent='Lesson '+(st.all.indexOf(next)+1)+': '+FULL_UNITS[next].title;
  let track=main.querySelector('.path-track > div, .unit-progress > div');if(track)track.style.width=Math.round(st.done/st.all.length*100)+'%';
  // Keep placement results separately while offering a foundations-first path.
  main.querySelector('.path-eyebrow').textContent='STRUCTURED LEARNING · A1 TO B1';
  let p=main.querySelector('p.path-small');
  if(p)p.textContent='Build skills in order, with connected modules and reviews.';
  let b=main.querySelector('button.dashboard-main-btn')||main.querySelector('button');
  if(b){b.textContent='Continue learning';b.setAttribute('onclick',"curriculumContinueFromHome()")}
 }
 let shortcuts=app.querySelector('.dashboard-shortcuts');
 if(shortcuts){
  let b=shortcuts.querySelector('button[onclick^="friendlyCourse"]');
  if(b){b.setAttribute('onclick',"curriculumView('A1')");b.innerHTML='My learning path<small>Structured A1 to B1 modules</small>'}
 }

fullMenu=function(level){curriculumView(STRUCTURED_PATH[level]?level:'A1')};
friendlyCourse=curriculumView;

<style>
.sound-setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border:1px solid #496b76;border-radius:14px;background:#203e50;margin:12px 0}

<script>
/* Small synthesized feedback tones. No audio files or network connection required. */
let feedbackAudioContext;
function feedbackEnabled(){return localStorage.getItem('deutschlab-feedback-sounds')!=='off'}
function feedbackSound(correct){
 if(!feedbackEnabled())return;
 try{
  const AudioContextType=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextType)return;
  feedbackAudioContext??=new AudioContextType();
  if(feedbackAudioContext.state==='suspended')feedbackAudioContext.resume();
  const now=feedbackAudioContext.currentTime+.015;
  const notes=correct?[[523.25,0,.11],[659.25,.115,.11],[783.99,.23,.19]]:[[330,0,.13],[261.63,.15,.22]];
  notes.forEach(([freq,delay,duration])=>{
   let osc=feedbackAudioContext.createOscillator(),gain=feedbackAudioContext.createGain();
   osc.type=correct?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+delay);
   gain.gain.setValueAtTime(.0001,now+delay);
   gain.gain.exponentialRampToValueAtTime(correct?.12:.075,now+delay+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,now+delay+duration);
   osc.connect(gain);gain.connect(feedbackAudioContext.destination);
   osc.start(now+delay);osc.stop(now+delay+duration+.02);
  });
 }catch(e){/* Silent fallback if audio is unavailable. */}
}
function soundSettingHTML(){return `<div class="sound-setting"><span>Answer sounds</span><button class="secondary" onclick="toggleFeedbackSound()">${feedbackEnabled()?'On':'Off'}</button></div>`}
function toggleFeedbackSound(){localStorage.setItem('deutschlab-feedback-sounds',feedbackEnabled()?'off':'on');document.querySelectorAll('.sound-setting').forEach(el=>el.outerHTML=soundSettingHTML());if(feedbackEnabled())feedbackSound(true)}
const soundOldFullMark=fullMark;
fullMark=function(ok,answer,why){let s=fullSession;if(!s||s.results.length!==s.idx)return;feedbackSound(ok);return soundOldFullMark(ok,answer,why)};
const soundOldGameMark=gameMark;
gameMark=function(ok,answer){let s=gameSession;if(!s||s.answered)return;feedbackSound(ok);return soundOldGameMark(ok,answer)};
const soundOldPhotoGrade=photoGrade;
photoGrade=function(id,choice){let s=pictureSession;if(!s||s.answered)return;let w=PHOTO_WORDS[id],answer=choice===null?document.getElementById('photoInput')?.value:PHOTO_WORDS[choice]?.[0];if(answer!==undefined)feedbackSound(answer.toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' ')===w[0].toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' '));return soundOldPhotoGrade(id,choice)};
const soundOldPictureGrade=pictureGrade;
pictureGrade=function(...args){let s=pictureSession;if(s?.photo)return soundOldPictureGrade(...args);let before=s?.answered;if(!before){let correct=args[0],chosen=args[1];feedbackSound(String(PICTURE_WORDS[correct]?.[0]||'').toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' ')===String(chosen||'').toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' '))}return soundOldPictureGrade(...args)};
const soundOldReviewAnswer=curriculumReviewAnswer;
curriculumReviewAnswer=function(i){let s=moduleSession;if(s&&!s.answered)feedbackSound(i===s.questions[s.idx].answer);return soundOldReviewAnswer(i)};
const soundOldHome=home;
home=function(){soundOldHome()};
function dlShowSettings(){
 if(typeof toggleMenu==='function')toggleMenu(false);
 app.innerHTML='<section class="card"><h2>Settings</h2><p class="muted">Choose your practice preferences.</p><div id="dlSoundSettings"></div><button class="secondary" onclick="home()">Back to Home</button></section>';
 document.getElementById('dlSoundSettings').innerHTML=soundSettingHTML();
 window.scrollTo(0,0);
}
function dlInstallSettingsMenu(){
 const nav=document.getElementById('sideMenu');
 if(!nav||nav.querySelector('.dl-settings-menu-entry'))return;
 const button=document.createElement('button');
 button.type='button';button.className='dl-settings-menu-entry';
 button.textContent='⚙ Settings';button.addEventListener('click',()=>window.dlShowSettings());
 nav.appendChild(button);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',dlInstallSettingsMenu);else dlInstallSettingsMenu();
</script>
