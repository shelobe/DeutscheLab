<script>
/* Minimum six varied questions in each guided lesson; keep original bank and progress. */
(function(){
 const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
 const previousQuestions=fullQuestions;
 const focused={
  8:[
   ['Wie ___ du?',['heißt','heiße','heißen'],0,'With du, heißen becomes heißt.'],
   ['Ich ___ Lena.',['heiße','heißt','heißen'],0,'With ich, heißen becomes heiße.'],
   ['___ Morgen!',['Guten','Gute','Gutes'],0,'The standard morning greeting is Guten Morgen.'],
   ['Wie geht ___ dir?',['es','du','ich'],0,'The expression is Wie geht es dir? (How are you?)'],
   ['Ich ___ aus Deutschland.',['komme','kommt','kommen'],0,'With ich, kommen becomes komme.'],
   ['Which phrase means “Goodbye”?',['Auf Wiedersehen','Guten Morgen','Bitte'],0,'Auf Wiedersehen means goodbye.']
  ],
  9:[
   ['___ Buch liegt auf dem Tisch.',['Das','Der','Die'],0,'Buch is neuter: das Buch.'],
   ['___ Lampe ist hell.',['Die','Das','Der'],0,'Lampe is feminine: die Lampe.'],
   ['___ Tisch ist groß.',['Der','Die','Das'],0,'Tisch is masculine: der Tisch.'],
   ['___ Kind spielt.',['Das','Die','Der'],0,'Kind is neuter: das Kind.'],
   ['___ Katze schläft.',['Die','Der','Das'],0,'Katze is feminine: die Katze.'],
   ['___ Hund bellt.',['Der','Das','Die'],0,'Hund is masculine: der Hund.'],
   ['Which article is used with most plural nouns in the nominative?',['die','der','das'],0,'The nominative plural definite article is die, regardless of singular gender.']
  ]
 };
 function toQuestion(row){const [prompt,options,answer,why]=row;const correct=options[answer];const shuffled=shuffle(options);return {type:'grammar',prompt,options:shuffled,answer:shuffled.indexOf(correct),why};}
 fullQuestions=function(unit){
  const original=previousQuestions(unit),id=FULL_UNITS.indexOf(unit);
  if(fullSession?.id===id&&fullSession.questions)return fullSession.questions;
  const result=[...original],seen=new Set(result.map(q=>q.prompt));
  const extras=focused[id]||[];
  for(const row of shuffle(extras)){if(!seen.has(row[0])){result.push(toQuestion(row));seen.add(row[0]);}}
  if(result.length<6){
   const examples=unit.examples||[];
   for(let i=0;i<examples.length&&result.length<6;i++){
    const [de,en]=examples[i];
    const alternatives=examples.filter((_,j)=>j!==i).map(x=>x[1]);
    if(alternatives.length<2)continue;
    const prompt='What does “'+de+'” mean?';
    if(!seen.has(prompt)){
     result.push(toQuestion([prompt,[en,...alternatives.slice(0,2)],0,'“'+de+'” means “'+en+'”.']));seen.add(prompt);
    }
   }
   if(result.length<6&&examples.length>=3){
    for(let i=0;i<examples.length&&result.length<6;i++){
     const [de,en]=examples[i],prompt='Choose the German for “'+en+'”.';
     if(seen.has(prompt))continue;
     result.push(toQuestion([prompt,[de,...examples.filter((_,j)=>j!==i).map(x=>x[0]).slice(0,2)],0,'The German expression is “'+de+'”.']));seen.add(prompt);
    }
   }
  }
  return shuffle(result);
 };
 FULL_UNITS[9].rule='German nouns have three grammatical genders: der (masculine), die (feminine), and das (neuter). Learn each noun together with its article. In the nominative plural, the definite article is die.';
 FULL_UNITS[9].checkpoint.why='Tisch is masculine, so its nominative article is der. Compare die Lampe (feminine) and das Buch (neuter).';
 FULL_UNITS[8].rule='Use Hallo for an informal hello, Guten Morgen in the morning, Guten Tag during the day, and Auf Wiedersehen to say goodbye. To introduce yourself, say Ich heiße ... or Ich komme aus ... .';
})();
</script>

 'Die Katze schläft auf dem Sofa':'Die Katze is the subject, followed by schläft. Auf dem Sofa uses dative for a location.',

<script>
/* A1 foundations data pack. Keep the rest of the app and existing lesson IDs unchanged. */
const dlA1Pack = {loaded:false, promise:null, byTitle:new Map()};
async function dlLoadA1Pack(){
 if(dlA1Pack.loaded)return true;
 if(!dlA1Pack.promise)dlA1Pack.promise=fetch('./a1_foundations.json',{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
  .then(data=>{
    if(data.schemaVersion!==1||data.level!=='A1'||!Array.isArray(data.lessons))throw Error('Invalid A1 course data');
    for(const lesson of data.lessons){
      if(!lesson.title||!Array.isArray(lesson.questions)||lesson.questions.length<10)throw Error('Incomplete lesson '+lesson.title);
      for(const q of lesson.questions){if(!Array.isArray(q.options)||q.options.length!==3||!Number.isInteger(q.answer)||q.answer<0||q.answer>2||!q.german||!q.english)throw Error('Invalid question in '+lesson.title)}
      dlA1Pack.byTitle.set(lesson.title,lesson.questions);
    }
    dlA1Pack.loaded=true;return true;
  }).catch(e=>{console.error('A1 data pack failed to load:',e);dlA1Pack.promise=null;return false});
 return dlA1Pack.promise;
}
const dlA1PreviousQuestions=fullQuestions;
fullQuestions=function(unit){
 const bank=unit?.level==='A1'?dlA1Pack.byTitle.get(unit.title):null;
 if(!bank)return dlA1PreviousQuestions(unit);
 const questions=bank.map(q=>{
   const options=[...q.options];
   for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
   return {...q,options,answer:options.indexOf(q.options[q.answer])};
 });
 for(let i=questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}
 return questions.slice(0,12);
};
const dlA1PreviousBegin=fullBegin;
fullBegin=async function(id){
 const unit=FULL_UNITS[id];
 if(unit?.level==='A1' && ['Greetings and introductions','Nouns and articles','Present-tense verbs','Basic word order'].includes(unit.title)){
   const loaded=await dlLoadA1Pack();
   if(!loaded){alert('The new A1 course file is missing. Upload a1_foundations.json alongside index.html to GitHub.');return;}
 }
 return dlA1PreviousBegin(id);
};
const dlA1PreviousCheck=dlCheck;
dlCheck=function(){

 if(!q?.german||!q?.english||!dlAnswered)return;

 feedback.querySelectorAll('.dl-a1-translation,.dl-article-translation').forEach(el=>el.remove());

 const de=document.createElement('p'),en=document.createElement('p');

};

<script>
/* Review snapshots: persist the question, never an unstable shuffled index. */
(function(){
 const previousCheck=dlCheck;
 const stableKey=q=> 'snap:'+encodeURIComponent([q.prompt||'',(q.options||[])[q.answer]||''].join('|'));
 const snapshot=q=>({prompt:q.prompt,options:[...q.options],answer:q.answer,why:q.why||'',german:q.german||'',english:q.english||''});
 function pruneLegacy(p){
   // Legacy full:id:index records cannot be mapped reliably after randomization.
   for(const k of new Set([...Object.keys(p.mistakes||{}),...Object.keys(p.reviews||{})])){
     if(/^full:\d+:\d+$/.test(k)){delete p.mistakes[k];delete p.reviews[k];}
   }
 }
 dlCheck=function(){
   const s=fullSession,q=s?.questions?.[s.idx];
   if(q&&!dlAnswered&&dlSelected!==null){
     const p=practiceState();p.snapshots??={};p.mistakes??={};p.reviews??={};
     pruneLegacy(p);
     const key=stableKey(q),ok=dlSelected===q.answer;
     p.snapshots[key]=snapshot(q);
     if(ok){
       delete p.mistakes[key];
       const step=Math.min((p.reviews[key]?.step||0)+1,5);
       p.reviews[key]={step,due:Date.now()+[0,1,3,7,14,30][step]*86400000};
     }else{
       p.mistakes[key]=(p.mistakes[key]||0)+1;
       p.reviews[key]={step:0,due:Date.now()};
     }
     practiceLog(ok?10:2);
   }
   return previousCheck();
 };
 const oldHub=practiceHub,oldQuiz=practiceQuiz;
 function validKeys(p,mode){return (mode==='mistakes'?Object.keys(p.mistakes):Object.keys(p.reviews).filter(k=>p.reviews[k]?.due<=Date.now())).filter(k=>!k.startsWith('full:'));}
 practiceHub=function(){const p=practiceState();pruneLegacy(p);save();return oldHub();};
 let reviewSession=null;
 practiceQuiz=function(mode){
   const p=practiceState();pruneLegacy(p);save();
   const keys=validKeys(p,mode),key=keys.find(k=>k.startsWith('snap:')&&p.snapshots?.[k]);
   if(!key)return oldQuiz(mode);
   const q=p.snapshots[key];reviewSession={key,mode,q};
   app.innerHTML=illustratedHero('Review a lesson question','Practice the exact question you missed','forest','katze.png')+
    `<section class="card"><h3>${safeText(q.prompt)}</h3>${q.options.map((o,i)=>`<button class="secondary" onclick="dlSnapshotAnswer(${i})">${safeText(o)}</button>`).join('')}<div id="practiceFeedback"></div></section>`;
 };
 window.dlSnapshotAnswer=function(i){
   const r=reviewSession;if(!r)return;
   const {q,key,mode}=r,p=practiceState(),ok=i===q.answer;
   if(ok){delete p.mistakes[key];const step=Math.min((p.reviews[key]?.step||0)+1,5);p.reviews[key]={step,due:Date.now()+[0,1,3,7,14,30][step]*86400000};}
   else{p.mistakes[key]=(p.mistakes[key]||0)+1;p.reviews[key]={step:0,due:Date.now()};}
   practiceLog(ok?10:2);
   app.querySelectorAll('.card button').forEach(b=>b.disabled=true);
   const complete=q.prompt.replace('___',q.options[q.answer]);
   document.getElementById('practiceFeedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct answer: '+safeText(q.options[q.answer])}</p><p>${safeText(q.why)}</p>${q.german||q.english?`<p><strong>German:</strong> ${safeText(q.german||complete)}</p><p><strong>English:</strong> ${safeText(q.english||'')}</p>`:''}<button onclick="practiceQuiz('${mode}')">Next</button><button class="secondary" onclick="practiceHub()">Finish</button>`;
   reviewSession=null;
 };
})();
</script>
<script>
/* Unified review entry: show saved mistakes and direct links to the relevant lesson. */
(function(){
 const priorReview=review;
 review=function(){
   ensureLearning();
   const p=practiceState();
   const snaps=Object.keys(p.mistakes||{}).filter(k=>k.startsWith('snap:')&&p.snapshots?.[k]);
   const legacy=(state.mistakes||[]).filter(x=>x?.question);
   const units=(state.learning.fullMistakes||[]).filter(x=>Number.isInteger(x.unit)&&FULL_UNITS[x.unit]);
   const unitIds=[...new Set(units.map(x=>x.unit))];
   const reviewCount=snaps.length+legacy.length+units.length;
   const snapshotRows=snaps.map((key,i)=>{
     const q=p.snapshots[key];
     const unitId=FULL_UNITS.findIndex(u=>u.title===q.unitTitle&&u.level===q.level);
     return `<div class="card"><p><strong>${safeText(q.prompt)}</strong></p><p>${safeText(q.level||'')} ${safeText(q.unitTitle||'')}</p><button onclick="dlReviewSaved(${i})">Practice missed questions</button>${unitId>=0?` <button class="secondary" onclick="fullStudy(${unitId})">Open lesson</button>`:''}</div>`;
   }).join('');
   const unitRows=unitIds.map(id=>`<div class="card"><strong>${safeText(FULL_UNITS[id].level+' · '+FULL_UNITS[id].title)}</strong><p>${units.filter(x=>x.unit===id).length} missed answer(s)</p><button onclick="fullBegin(${id})">Retake quiz</button> <button class="secondary" onclick="fullStudy(${id})">Review lesson</button></div>`).join('');
   const legacyRow=legacy.length?`<div class="card"><p>${legacy.length} earlier missed question(s)</p><button onclick="dlLegacyReview()">Practice earlier mistakes</button></div>`:'';
   app.innerHTML=`<section class="card"><h2>Review</h2><p>${reviewCount?`${reviewCount} missed answer records`:'No saved mistakes available yet.'}</p><p>Missed questions appear here after you check an answer. You can also retake a lesson directly.</p><button onclick="practiceHub()">Practice Hub</button> <button class="secondary" onclick="courseMenu('A1')">A1 lessons</button></section>`+snapshotRows+unitRows+legacyRow;
 };
 window.dlReviewSaved=function(i){const p=practiceState(),keys=Object.keys(p.mistakes||{}).filter(k=>k.startsWith('snap:')&&p.snapshots?.[k]);const key=keys[i];if(!key)return review();p.reviews[key]={step:0,due:Date.now()};save();practiceQuiz('mistakes');};
 window.dlLegacyReview=function(){priorReview();};
 const oldCheck=dlCheck;
 dlCheck=function(){
   const s=fullSession,q=s?.questions?.[s.idx],isNew=!!(q&&!dlAnswered&&dlSelected!==null);
   if(isNew){const p=practiceState();p.snapshots??={};}
   const result=oldCheck();
   if(isNew&&q){
     const p=practiceState(),key='snap:'+encodeURIComponent([q.prompt||'',(q.options||[])[q.answer]||''].join('|'));
     if(p.snapshots?.[key]){p.snapshots[key].unitTitle=FULL_UNITS[s.id]?.title||'';p.snapshots[key].level=FULL_UNITS[s.id]?.level||'';save();}
   }
   return result;
 };
})();
</script>

<script>
/* Feedback de-duplication: explanations must teach, not restate translations. */
(function(){
  function current(){const s=fullSession;return s?.questions?.[s.idx]||null;}
  function clean(v){return String(v||'').replace(/[“”"'‘’]/g,'').replace(/\s+/g,' ').trim().toLowerCase().replace(/[.!?]+$/,'');}
  function isTranslationOnly(q){
    const why=clean(q?.why),de=clean(q?.german),en=clean(q?.english);
    if(!why)return true;
    if(de&&en&&(why.includes(de)&&why.includes(en)))return true;
    if(/^the correct sentence is\b|^the correct answer is\b|^the sentence means\b|^this means\b|^.+ means .+$/i.test(why))return true;
    return false;
  }
  function explanation(q){
    if(!q)return '';
    const de=String(q.german||'');
    if(/\bnicht\b/i.test(de)){
      if(/\bkomme nicht\b/i.test(de))return 'Nicht negates the action here. In this short main clause it follows the conjugated verb komme.';
      return 'Nicht negates a verb, adjective, or phrase. Its position depends on which part of the sentence is being negated.';
    }
    return isTranslationOnly(q)?'':String(q.why||'').trim();
  }
  function teachingHint(q){
    const prompt=String(q?.prompt||'');
    const options=(q?.options||[]).map(String);
    const all=(prompt+' '+options.join(' ')).toLowerCase();
    // A question asking for the meaning of a German word is vocabulary recognition,
    // not a German question-formation exercise. Inspect the quoted target first.
    const meaningMatch=prompt.match(/what does\s+[“"']([^”"']+)[”"']\s+mean/i);
    if(meaningMatch){
      const term=meaningMatch[1].trim().toLowerCase();
      if(['ich','du','er','sie','es','wir','ihr','sie (plural)','sie (formal)'].includes(term))
        return 'This lesson is about personal pronouns, which replace names. First person refers to the speaker, second person to the listener, and third person to someone else. German also distinguishes talking to one person (singular) from talking to several people (plural). Compare: du lernst (one person) and ihr lernt (several people).';
      if(['wer','was','wo','wann','warum','wie','woher','wohin'].includes(term))
        return 'This is question-word vocabulary. German has different words for asking about a person, a thing, a location, a time, a reason, or a manner. Think about what kind of information the word requests, rather than German sentence order.';
      if(/^(?:\d+|null|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|dreizehn|vierzehn|fünfzehn|sechzehn|siebzehn|achtzehn|neunzehn|zwanzig)$/.test(term))
        return 'This is a number-recognition exercise. Recall the counting sequence and compare nearby numbers; you do not need a sentence grammar rule.';
      return 'This asks for the meaning of a German vocabulary word. Recall where you learned it and compare the meanings of the options; verb endings and question word order are not relevant.';
    }
    // Hints describe transferable grammar, never reveal the selected answer.
    // Classify the actual task before inspecting distractor answers.
    // Vocabulary recognition should not trigger conjugation rules merely because
    // a distractor contains a pronoun or a verb.
    if(/choose the german for|what is the german for|translate (?:the word|\")/i.test(prompt)){
      if(/\b(i|you|he|she|it|we|they)\b[”"'.?! ]*$/i.test(prompt))return 'This is a personal-pronoun question. Pronouns stand in for people or things. German distinguishes the speaker (first person), the person being addressed (second person), and someone being talked about (third person). Match the English pronoun by person and number; no verb ending is needed here.';
      if(/\b(who|what|where|when|why|how)\b[”"'.?! ]*$/i.test(prompt))return 'This is a question-word vocabulary question. Decide whether the English word asks about a person, thing, place, time, reason, or manner. Then choose the corresponding German question word; you do not need to conjugate a verb.';
      if(/\b(?:zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|[0-9]+)\b/i.test(prompt))return 'This is a number-recognition question. Focus on the number itself rather than sentence grammar. German numbers from 13–19 often combine a unit with -zehn; from 21 onward, many numbers place the unit before und and the tens.';
      return 'This is a vocabulary question. Identify what the English word means and compare the meanings of the German choices. No verb conjugation or sentence word-order rule is needed.';
    }
    if(/where do you live|wo wohnst|wo wohnen/i.test(all))return 'Question-word questions use: question word + conjugated verb + subject. Wohnen means “to live.” With du (informal you), regular verbs usually end in -st; with Sie (formal you), they use the infinitive form. Compare: Wo arbeitest du? (Where do you work?)';
    if(/wie heißt|what is your name|heiße|heißen/i.test(all))return 'Heißen means “to be called.” Verb endings change with the subject: ich commonly takes -e, du commonly takes -st (with spelling adjustments), and wir/Sie take -en. In a question, the verb usually comes before the subject.';
    if(/nicht|kein/i.test(all))return 'Nicht negates verbs, adjectives, or a whole statement; kein negates nouns that would otherwise use ein/eine or no article. Compare: Ich komme nicht. (I am not coming.) / Ich habe kein Auto. (I have no car.)';
    if(/\b(der|die|das|ein|eine)\b/i.test(all)&&/___|article|choose/i.test(prompt))return 'German nouns have grammatical gender: der (masculine), die (feminine), das (neuter). The article also changes with grammatical case. Learn the article together with each noun rather than guessing from its English meaning.';
    if(/\b(ich|du|er|sie|wir|ihr)\b/i.test(all)&&/___|correct|choose/i.test(prompt))return 'Look at the subject first, then choose the matching verb ending. For most regular present-tense verbs: ich → -e, du → -st, er/sie/es → -t, wir/sie/Sie → -en. Example: ich lerne, du lernst, er lernt.';
    if(/where|when|what|who|why|how|\bwo\b|\bwann\b|\bwer\b|\bwarum\b/i.test(all))return 'For a German question with a question word, use question word + conjugated verb + subject. For yes/no questions, put the conjugated verb first. Example: Wann kommst du? / Kommst du morgen?';

I am"], ["du bist", "you are"], ["sie ist", "she is"], ["wir sind", "we are"]], "checkpoint": {"prompt": "Complete: Wir ___ hier.", "options": ["ist", "sind", "seid"], "answer": 1, "why": "Wir always uses sind with sein."}}, {"level": "A1", "title": "The verb haben: to have", "rule": "Haben expresses possession and many everyday needs. The forms are ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben. The subject controls the ending.", "examples": [["ich habe", "I have"], ["du hast", "you have"], ["er hat", "he has"], ["wir haben", "we have"]], "checkpoint": {"prompt": "Complete: Du ___ Zeit.", "options": ["habe", "hat", "hast"], "answer": 2, "why": "Du uses hast, not habe or hat."}}, {"level": "A1", "title": "Introducing yourself: heißen and wohnen", "rule": "Heißen tells someone your name; wohnen tells where you live. Ich heiße ... and Ich wohne in ... are useful starter patterns. Du heißt ... and du wohnst ... use -st with du.", "examples": [["Ich heiße Lea.", "My name is Lea."], ["Wie heißt du?", "What is your name?"], ["Ich wohne in Berlin.", "I live in Berlin."], ["Wo wohnst du?", "Where do you live?"]], "checkpoint": {"prompt": "Complete: Ich ___ in Berlin.", "options": ["wohnst", "wohne", "wohnt"], "answer": 1, "why": "Ich uses wohne; du uses wohnst."}}, {"level": "A1", "title": "Question words: who, what, where", "rule": "Wer asks who, was asks what, and wo asks where. In a typical German W-question, the question word comes first, then the conjugated verb, then the subject: Wo wohnst du?", "examples": [["wer", "who"], ["was", "what"], ["wo", "where"], ["Wer ist das?", "Who is that?"]], "checkpoint": {"prompt": "Which word asks “who”?", "options": ["was", "wer", "wo"], "answer": 1, "why": "Wer asks about a person. Was asks about a thing or information."}}, {"level": "A1", "title": "Question words: when, why, how", "rule": "Wann asks when, warum asks why, and wie asks how. Warum questions often invite an answer with weil (because). Wie can ask about a name or condition: Wie heißt du?", "examples": [["wann", "when"], ["warum", "why"], ["wie", "how"], ["Wann kommst du?", "When are you coming?"]], "checkpoint": {"prompt": "Which word asks “why”?", "options": ["wie", "wann", "warum"], "answer": 2, "why": "Warum asks for a reason; wann asks for a time."}}, {"level": "A1", "title": "Question words: where from and where to", "rule": "Wo is where (location); woher is where from (origin); wohin is where to (destination). The distinction helps you ask about travel and hometowns.", "examples": [["Wo bist du?", "Where are you?"], ["Woher kommst du?", "Where are you from?"], ["Wohin gehst du?", "Where are you going?"]], "checkpoint": {"prompt": "Which word asks about origin?", "options": ["wohin", "wo", "woher"], "answer": 2, "why": "Woher asks where someone comes from."}}, {"level": "A1", "title": "Numbers: zero through ten", "rule": "Learn the first numbers as vocabulary before using them in prices and ages. Say them aloud in order and out of order; acht is eight and zehn is ten.", "examples": [["null", "zero"], ["eins", "one"], ["zwei", "two"], ["drei", "three"], ["fünf", "five"], ["acht", "eight"], ["zehn", "ten"]], "checkpoint": {"prompt": "What does acht mean?", "options": ["eight", "six", "ten"], "answer": 0, "why": "Acht is eight. Sechs is six; zehn is ten."}}, {"level": "A1", "title": "Numbers: eleven through twenty", "rule": "Eleven and twelve have special forms: elf and zwölf. From thirteen to nineteen, German usually adds -zehn: dreizehn, vierzehn, fünfzehn. Sixteen is sechzehn and seventeen is siebzehn (shortened stems).", "examples": [["elf", "eleven"], ["zwölf", "twelve"], ["dreizehn", "thirteen"], ["sechzehn", "sixteen"], ["siebzehn", "seventeen"], ["zwanzig", "twenty"]], "checkpoint": {"prompt": "Which number is zwölf?", "options": ["twelve", "twenty", "two"], "answer": 0, "why": "Zwölf means twelve; zwanzig means twenty."}}, {"level": "A1", "title": "Numbers: twenty-one through one hundred", "rule": "German says the ones before the tens for 21–99: ein-und-zwanzig (one-and-twenty), written einundzwanzig. The ones form is ein, not eins, in compounds. Thirty is dreißig; forty is vierzig; one hundred is hundert.", "examples": [["einundzwanzig", "twenty-one"], ["zweiunddreißig", "thirty-two"], ["vierzig", "forty"], ["fünfzig", "fifty"], ["hundert", "one hundred"]], "checkpoint": {"prompt": "Which means twenty-one?", "options": ["zwanzigeins", "einundzwanzig", "einszwanzig"], "answer": 1, "why": "German puts the ones before the tens: ein-und-zwanzig."}}, {"level": "A1", "title": "Greetings and goodbyes", "rule": "Use Hallo for an informal hello; Guten Morgen in the morning; Guten Tag during the day; Guten Abend in the evening. Tschüss is informal goodbye; Auf Wiedersehen is more formal.", "examples": [["Guten Morgen!", "Good morning!"], ["Guten Tag!", "Good day!"], ["Guten Abend!", "Good evening!"], ["Tschüss!", "Bye!"]], "checkpoint": {"prompt": "What would you say in the morning?", "options": ["Guten Abend!", "Guten Morgen!", "Gute Nacht!"], "answer": 1, "why": "Guten Morgen is a greeting used in the morning."}}, {"level": "A1", "title": "Common nouns and their articles", "rule": "German nouns begin with a capital letter and have a grammatical gender. Learn the article with each noun: der (masculine), die (feminine), das (neuter). The article is part of the vocabulary item.", "examples": [["der Tisch", "the table"], ["die Tür", "the door"], ["das Buch", "the book"], ["der Stuhl", "the chair"]], "checkpoint": {"prompt": "Choose the article: ___ Buch", "options": ["der", "die", "das"], "answer": 2, "why": "Buch is neuter, so learn it as das Buch."}}, {"level": "A1", "title": "Colors and describing things", "rule": "Colors are useful adjectives: rot, blau, grün, gelb, schwarz, weiß. After ist, the basic adjective has no ending: Das Auto ist rot. Before nouns, adjective endings are introduced later.", "examples": [["rot", "red"], ["blau", "blue"], ["grün", "green"], ["gelb", "yellow"], ["Das Buch ist blau.", "The book is blue."]], "checkpoint": {"prompt": "What does grün mean?", "options": ["green", "yellow", "red"], "answer": 0, "why": "Grün means green."}}, {"level": "A1", "title": "Family words", "rule": "Learn family nouns with their articles: die Mutter, der Vater, die Schwester, der Bruder, die Eltern. Mein means my before many masculine and neuter nouns; meine appears with feminine and plural nouns.", "examples": [["die Mutter", "mother"], ["der Vater", "father"], ["die Schwester", "sister"], ["der Bruder", "brother"], ["die Eltern", "parents"]], "checkpoint": {"prompt": "Which word means sister?", "options": ["der Bruder", "die Schwester", "die Mutter"], "answer": 1, "why": "Die Schwester means sister."}}, {"level": "A1", "title": "Days of the week", "rule": "Days are nouns and start with capitals: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag, Sonntag. Use am with a day: am Montag (on Monday).", "examples": [["Montag", "Monday"], ["Dienstag", "Tuesday"], ["Mittwoch", "Wednesday"], ["Freitag", "Friday"], ["Sonntag", "Sunday"]], "checkpoint": {"prompt": "How do you say “on Monday”?", "options": ["im Montag", "am Montag", "um Montag"], "answer": 1, "why": "Use am with days of the week."}}, {"level": "A1", "title": "Months and basic dates", "rule": "Months are capitalized: Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember. Use im for months: im Mai. Dates use ordinal numbers, introduced through examples.", "examples": [["Januar", "January"], ["März", "March"], ["Mai", "May"], ["Oktober", "October"], ["im Dezember", "in December"]], "checkpoint": {"prompt": "How do you say “in May”?", "options": ["am Mai", "im Mai", "um Mai"], "answer": 1, "why": "Use im with months."}}, {"level": "A1", "title": "Food and drink vocabulary", "rule": "Learn food nouns together with articles: das Brot, das Wasser, der Kaffee, der Tee, der Apfel, die Milch. You can say Ich möchte ... (I would like ...) when ordering.", "examples": [["das Brot", "bread"], ["das Wasser", "water"], ["der Apfel", "apple"], ["die Milch", "milk"], ["Ich möchte Wasser.", "I would like water."]], "checkpoint": {"prompt": "What does das Brot mean?", "options": ["water", "bread", "milk"], "answer": 1, "why": "Das Brot means bread."}}, {"level": "A1", "title": "Places around town", "rule": "Useful destinations include der Bahnhof, die Schule, der Supermarkt, das Café, das Krankenhaus. Ask Wo ist ...? to find a place.", "examples": [["der Bahnhof", "train station"], ["die Schule", "school"], ["der Supermarkt", "supermarket"], ["das Café", "café"], ["Wo ist der Bahnhof?", "Where is the train station?"]], "checkpoint": {"prompt": "What does der Bahnhof mean?", "options": ["school", "train station", "café"], "answer": 1, "why": "Der Bahnhof is the train station."}}];

 const path=[{"title": "I, you, we: personal pronouns", "goal": "Recognize who is speaking and who is being discussed.", "context": "Start with ich (I) and du (you). Then add er, sie, es, wir, ihr, and formal Sie. Compare singular and plural before conjugating verbs.", "ids": [84, 85, 86]}, {"title": "Essential verbs: be, have, live", "goal": "Say who you are, what you have, and where you live.", "context": "Study sein (to be), haben (to have), heißen (to be called), and wohnen (to live). Watch how each verb changes with ich, du, and wir.", "ids": [87, 88, 89, 10]}, {"title": "Who, what, where, when, why", "goal": "Ask useful questions and understand the answers.", "context": "Learn wer, was, wo, wann, warum, and wie. German W-questions usually put the conjugated verb directly after the question word.", "ids": [90, 91, 92]}, {"title": "Numbers 0–20", "goal": "Count, recognize quantities, and tell your age.", "context": "Learn numbers in small groups. Notice the special forms elf and zwölf and the -zehn pattern in the teens. Practice listening as well as reading.", "ids": [93, 94, 0]}, {"title": "Numbers 21–100", "goal": "Understand prices, ages, and larger quantities.", "context": "For 21–99, German says ones + und + tens: einundzwanzig. Practice this pattern before using it in shopping or appointments.", "ids": [95, 63, 64]}, {"title": "Greetings and introductions", "goal": "Greet people, say goodbye, and introduce yourself.", "context": "Choose greetings for the time of day and level of formality. Practice saying your name and introducing another person.", "ids": [96, 8, 48, 49]}, {"title": "People and family", "goal": "Talk about relatives, friends, and relationships.", "context": "Learn family nouns with der, die, or das. Add mein/meine and other possessives only after you recognize the nouns.", "ids": [99, 1, 50, 69, 70]}, {"title": "Everyday objects and articles", "goal": "Recognize objects and learn noun gender.", "context": "German nouns are capitalized and should be learned with their article. Use common objects and household words before case endings.", "ids": [97, 9, 51, 52, 53]}, {"title": "Days, months, and time", "goal": "Discuss days, dates, and simple schedules.", "context": "Use am for days and im for months. Add clock times and simple appointment phrases once the time vocabulary is familiar.", "ids": [100, 101, 3, 60, 61, 62]}, {"title": "Food and drinks", "goal": "Name foods, describe meals, and order politely.", "context": "Learn common food nouns with their articles, then use ich möchte for polite requests and simple café conversations.", "ids": [102, 2, 54, 55, 56]}, {"title": "Colors and descriptions", "goal": "Describe people, weather, and everyday things.", "context": "Learn colors first, then simple descriptive statements like Das Buch ist blau. Apply the same pattern to weather and clothing.", "ids": [98, 75, 76, 77]}, {"title": "Places and directions", "goal": "Ask where places are and how to get there.", "context": "Learn locations such as der Bahnhof and der Supermarkt. Distinguish wo (where), woher (where from), and wohin (where to).", "ids": [103, 7, 66, 67, 68]}, {"title": "Building German sentences", "goal": "Build statements and use present-tense verbs.", "context": "In ordinary statements, the conjugated verb is in second position. Compare Ich lerne heute with Heute lerne ich.", "ids": [11, 57, 58, 59]}, {"title": "Questions and answers", "goal": "Form yes/no questions and W-questions.", "context": "W-questions begin with a question word; yes/no questions begin with the verb. Practice the difference in short exchanges.", "ids": [4, 65, 71, 72]}, {"title": "Negation and everyday needs", "goal": "Say what you do not have, do not want, or cannot do.", "context": "Use kein with indefinite nouns and nicht with verbs or descriptions. Practice common needs and polite requests.", "ids": [5, 73, 74, 81]}, {"title": "Everyday conversations and review", "goal": "Combine vocabulary and grammar in realistic situations.", "context": "Practice shopping, hobbies, social situations, and polite requests. Revisit weak areas before moving to A2.", "ids": [6, 78, 79, 80, 82, 83]}];

<script>
/* Expanded A1 curriculum: practical vocabulary, grammar, spaced reviews and module guides. */
(function(){
const additions=[{"level": "A1", "title": "Alphabet and spelling", "rule": "German uses the same basic alphabet as English, plus ä, ö, ü and ß. Letters are pronounced differently: J sounds like English y, W like English v, and V often like English f. To spell your name, say each letter separately.", "examples": [["Januar", "January (J sounds like y)"], ["Wasser", "water (W sounds like v)"], ["Vater", "father (V sounds like f)"], ["Wie schreibt man das?", "How do you spell that?"]], "checkpoint": {"prompt": "Which German letter usually sounds like English v?", "options": ["W", "J", "Z"], "answer": 0, "why": "W in Wasser is pronounced like English v. German J usually sounds like y."}}, {"level": "A1", "title": "Umlauts and ß", "rule": "Ä, ö and ü are distinct vowel sounds, not decoration. Try saying e while rounding your lips for ö. ß represents an s sound (like ss) and is not the letter B. These letters can change meaning, so listen carefully.", "examples": [["schön", "beautiful / nice"], ["fünf", "five"], ["Straße", "street"], ["schon", "already (different from schön)"]], "checkpoint": {"prompt": "Which word means “five”?", "options": ["funf", "fünf", "fanf"], "answer": 1, "why": "Fünf contains ü, a separate vowel sound. Listen to the rounded vowel."}}, {"level": "A1", "title": "Formal and informal you", "rule": "Use du with friends, family and many peers. Use Sie (capital S) for polite/formal address; Sie takes the same verb form as sie (they): Sie wohnen. Informal du uses du wohnst. Use ihr when speaking informally to multiple people.", "examples": [["Wo wohnst du?", "Where do you live? (informal)"], ["Wo wohnen Sie?", "Where do you live? (formal)"], ["Wie heißen Sie?", "What is your name? (formal)"], ["Wie heißt du?", "What is your name? (informal)"]], "checkpoint": {"prompt": "Which question is formal?", "options": ["Wie heißt du?", "Wie heißen Sie?", "Wie heißt ihr?"], "answer": 1, "why": "Formal Sie pairs with heißen; du pairs with heißt."}}, {"level": "A1", "title": "Plural nouns", "rule": "German plurals are not made with one universal ending. Common patterns include -e, -en, -er and -s; some nouns change vowels. Learn a noun with its article and plural. All plural nouns use die in the nominative case.", "examples": [["der Tisch → die Tische", "table → tables"], ["die Frau → die Frauen", "woman → women"], ["das Kind → die Kinder", "child → children"], ["das Auto → die Autos", "car → cars"]], "checkpoint": {"prompt": "Which is the plural of “die Frau”?", "options": ["die Frauen", "die Fraus", "der Frauen"], "answer": 0, "why": "Frau forms its plural with -en; plural nouns take die in nominative."}}, {"level": "A1", "title": "Possessives: my and your", "rule": "Mein means my; dein means your (informal). Their endings depend on the noun: mein Bruder but meine Schwester. This is because feminine and plural nouns take -e in these basic subject phrases.", "examples": [["mein Vater", "my father"], ["meine Mutter", "my mother"], ["dein Bruder", "your brother"], ["deine Freunde", "your friends"]], "checkpoint": {"prompt": "Complete: ___ Schwester ist hier. (My sister is here.)", "options": ["Mein", "Meine", "Meinen"], "answer": 1, "why": "Schwester is feminine: die Schwester, so use meine in this sentence."}}, {"level": "A1", "title": "Possessives: his, her, our", "rule": "Sein means his or its, ihr means her or their, and unser means our. The endings change with the noun: sein Vater, seine Mutter, unser Haus, unsere Wohnung. Context tells you which meaning of ihr is intended.", "examples": [["sein Hund", "his dog"], ["ihre Katze", "her cat"], ["unser Haus", "our house"], ["unsere Freunde", "our friends"]], "checkpoint": {"prompt": "Complete: Das ist ___ Haus. (That is our house.)", "options": ["unser", "unsere", "unseren"], "answer": 0, "why": "Haus is neuter, so the basic form is unser Haus."}}, {"level": "A1", "title": "Accusative: direct objects", "rule": "The accusative marks a direct object: the thing receiving an action. Masculine der becomes den, and ein becomes einen. Feminine die/eine and neuter das/ein stay the same in these basic examples.", "examples": [["Der Hund schläft.", "The dog sleeps (subject)."], ["Ich sehe den Hund.", "I see the dog (object)."], ["Ich habe einen Bruder.", "I have a brother."], ["Ich sehe die Katze.", "I see the cat."]], "checkpoint": {"prompt": "Complete: Ich sehe ___ Mann.", "options": ["der", "den", "dem"], "answer": 1, "why": "Mann is masculine and the direct object of sehe, so der changes to den."}}, {"level": "A1", "title": "Accusative pronouns", "rule": "When a pronoun is the direct object, ich becomes mich and du becomes dich. Er becomes ihn, while sie and es stay the same. Compare Ich sehe dich (I see you) with Du siehst mich (You see me).", "examples": [["Kannst du mich hören?", "Can you hear me?"], ["Ich sehe dich.", "I see you."], ["Ich kenne ihn.", "I know him."], ["Sie sieht uns.", "She sees us."]], "checkpoint": {"prompt": "Complete: Ich sehe ___. (I see you.)", "options": ["du", "dich", "dir"], "answer": 1, "why": "Dich is the accusative form of du when you are the direct object."}}, {"level": "A1", "title": "Modal verbs: can and must", "rule": "Können expresses ability; müssen expresses necessity. With a modal verb, the second verb goes to the end in its infinitive form: Ich kann schwimmen. Du musst lernen. Notice kann/kannst and muss/musst.", "examples": [["Ich kann Deutsch sprechen.", "I can speak German."], ["Du kannst kommen.", "You can come."], ["Wir müssen gehen.", "We must go."], ["Musst du arbeiten?", "Do you have to work?"]], "checkpoint": {"prompt": "Complete: Ich ___ heute arbeiten. (I must work today.)", "options": ["muss", "musst", "müssen"], "answer": 0, "why": "Ich uses muss. The action verb arbeiten remains at the end."}}, {"level": "A1", "title": "Wants and polite requests", "rule": "Wollen means to want; möchten is a polite way to say would like. Use möchten for ordering: Ich möchte Wasser. With another verb, put that verb at the end: Wir möchten essen.", "examples": [["Ich will nach Hause.", "I want to go home."], ["Ich möchte einen Tee.", "I would like a tea."], ["Möchtest du kommen?", "Would you like to come?"], ["Wir möchten bezahlen.", "We would like to pay."]], "checkpoint": {"prompt": "Which is the polite way to order water?", "options": ["Ich will Wasser.", "Ich möchte Wasser.", "Du hast Wasser."], "answer": 1, "why": "Ich möchte ... is a standard polite request."}}, {"level": "A1", "title": "Separable verbs: daily routine", "rule": "Some German verbs have a prefix that separates in a main clause. Aufstehen means to get up: Ich stehe um sieben Uhr auf. The prefix goes to the end. In the infinitive, the parts stay together: aufstehen.", "examples": [["Ich stehe früh auf.", "I get up early."], ["Wir kaufen heute ein.", "We shop today."], ["Rufst du mich an?", "Are you calling me?"], ["Ich möchte früh aufstehen.", "I would like to get up early."]], "checkpoint": {"prompt": "Complete: Ich stehe um acht Uhr ___.", "options": ["auf", "an", "ein"], "answer": 0, "why": "Aufstehen splits into stehe ... auf in a main clause."}}, {"level": "A1", "title": "Prepositions: places and movement", "rule": "In means in, auf often means on, an often means at/on, nach is used for many destinations such as cities and countries without an article, and zu for going to a person or place. The case depends on the preposition and context; learn whole phrases first.", "examples": [["Ich bin in Berlin.", "I am in Berlin."], ["Ich fahre nach Berlin.", "I am going to Berlin."], ["Ich gehe zum Arzt.", "I am going to the doctor."], ["Das Buch liegt auf dem Tisch.", "The book is on the table."]], "checkpoint": {"prompt": "Complete: Ich fahre ___ Hamburg.", "options": ["nach", "mit", "auf"], "answer": 0, "why": "Use nach for travel to most cities: nach Hamburg."}}, {"level": "A1", "title": "Dative: with and to", "rule": "The dative often marks the recipient or follows prepositions like mit (with) and zu (to). Der becomes dem, die becomes der, and das becomes dem. Learn phrases such as mit dem Freund and mit der Freundin.", "examples": [["mit dem Mann", "with the man"], ["mit der Frau", "with the woman"], ["mit dem Kind", "with the child"], ["Ich helfe dem Freund.", "I help the friend."]], "checkpoint": {"prompt": "Complete: Ich spreche mit ___ Frau.", "options": ["die", "der", "den"], "answer": 1, "why": "Mit always takes the dative. Feminine die changes to der."}}, {"level": "A1", "title": "Dative pronouns: to me and you", "rule": "Mir means to/for me; dir means to/for you (informal). Compare accusative mich/dich with dative mir/dir. The verb helfen (to help) takes the dative: Kannst du mir helfen?", "examples": [["Kannst du mir helfen?", "Can you help me?"], ["Ich helfe dir.", "I help you."], ["Das gefällt mir.", "I like that (literally: that pleases me)."], ["Wie geht es dir?", "How are you?"]], "checkpoint": {"prompt": "Complete: Kannst du ___ helfen? (Can you help me?)", "options": ["mich", "mir", "ich"], "answer": 1, "why": "Helfen takes dative; the dative form of ich is mir."}}, {"level": "A1", "title": "Shopping: prices and quantities", "rule": "Ask Wie viel kostet das? (How much does that cost?) and use Euro and Cent for prices. German decimal prices are usually written with a comma: 3,50 €. Use ein Kilo, ein Liter and eine Flasche for quantities.", "examples": [["Wie viel kostet das?", "How much does that cost?"], ["Das kostet fünf Euro.", "That costs five euros."], ["Ein Kilo Äpfel, bitte.", "One kilo of apples, please."], ["Ich nehme zwei Flaschen Wasser.", "I will take two bottles of water."]], "checkpoint": {"prompt": "Which phrase asks for a price?", "options": ["Wie heißt du?", "Wie viel kostet das?", "Wo wohnst du?"], "answer": 1, "why": "Wie viel kostet das? asks how much an item costs."}}, {"level": "A1", "title": "Clothes and sizes", "rule": "Common clothing words include die Hose (trousers), das Hemd (shirt), die Jacke (jacket) and die Schuhe (shoes). To shop, ask Haben Sie das in Größe M? or Kann ich das anprobieren? (May I try it on?).", "examples": [["die Hose", "trousers / pants"], ["das Hemd", "shirt"], ["die Jacke", "jacket"], ["Kann ich das anprobieren?", "Can I try that on?"]], "checkpoint": {"prompt": "What does “die Jacke” mean?", "options": ["jacket", "shirt", "shoe"], "answer": 0, "why": "Die Jacke means jacket. Learn the article with the noun."}}, {"level": "A1", "title": "Weather and seasons", "rule": "Ask Wie ist das Wetter? (What is the weather like?). Use Es ist ... for conditions: Es ist kalt, Es ist sonnig. The seasons are Frühling, Sommer, Herbst and Winter.", "examples": [["Es ist warm.", "It is warm."], ["Es regnet.", "It is raining."], ["Es schneit.", "It is snowing."], ["Im Winter ist es kalt.", "In winter it is cold."]], "checkpoint": {"prompt": "Complete: Es ___ heute. (It is raining today.)", "options": ["regnet", "Regen", "regnen"], "answer": 0, "why": "Es regnet is the impersonal verb phrase for it is raining."}}, {"level": "A1", "title": "Health and appointments", "rule": "Use Ich habe ... to describe symptoms and Ich brauche ... for what you need. Common words are Kopfschmerzen (headache), Bauchschmerzen (stomachache) and der Termin (appointment).", "examples": [["Ich habe Kopfschmerzen.", "I have a headache."], ["Ich brauche einen Termin.", "I need an appointment."], ["Mir ist schlecht.", "I feel sick / nauseated."], ["Wo ist die Apotheke?", "Where is the pharmacy?"]], "checkpoint": {"prompt": "Which phrase means “I need an appointment”?", "options": ["Ich habe Zeit.", "Ich brauche einen Termin.", "Ich bin müde."], "answer": 1, "why": "Ich brauche means I need; einen Termin is an appointment as a direct object."}}, {"level": "A1", "title": "Home and furniture", "rule": "Learn rooms with articles: die Küche (kitchen), das Bad (bathroom), das Schlafzimmer (bedroom), das Wohnzimmer (living room). Use es gibt (there is/are) to say what a home contains.", "examples": [["die Küche", "kitchen"], ["das Badezimmer", "bathroom"], ["das Bett", "bed"], ["Es gibt zwei Zimmer.", "There are two rooms."]], "checkpoint": {"prompt": "What is “die Küche”?", "options": ["kitchen", "bedroom", "garden"], "answer": 0, "why": "Die Küche means kitchen. Its article is die."}}, {"level": "A1", "title": "Daily habits and schedules", "rule": "Describe routines with present-tense verbs and time expressions. German main clauses keep the conjugated verb in second position: Ich arbeite morgens. Morgens arbeite ich. Both are correct.", "examples": [["Ich frühstücke um acht.", "I eat breakfast at eight."], ["Abends lese ich.", "In the evenings I read."], ["Ich gehe um zehn ins Bett.", "I go to bed at ten."], ["Am Montag arbeite ich.", "On Monday I work."]], "checkpoint": {"prompt": "Complete: Morgens ___ ich Kaffee.", "options": ["trinke", "trinkst", "trinken"], "answer": 0, "why": "With ich use trinke. After Morgens, the verb remains second and ich follows."}}, {"level": "A1", "title": "Hobbies and interests", "rule": "Use gern with a verb to say you enjoy doing something: Ich lese gern. To say you do not enjoy it, use nicht gern. Spielen covers games and sports; machen is used for many activities.", "examples": [["Ich lese gern.", "I like reading."], ["Wir spielen Fußball.", "We play soccer."], ["Ich höre gern Musik.", "I like listening to music."], ["Ich schwimme nicht gern.", "I do not like swimming."]], "checkpoint": {"prompt": "Which means “I like reading”?", "options": ["Ich lese gern.", "Ich lese nicht.", "Ich bin lesen."], "answer": 0, "why": "Gern after a verb expresses enjoyment of the activity."}}, {"level": "A1", "title": "Work and occupations", "rule": "Ask Was machst du beruflich? (What do you do for work?) or Wo arbeitest du? (Where do you work?). Say Ich arbeite als ... for your role and Ich arbeite bei ... for an employer.", "examples": [["Was machst du beruflich?", "What do you do for work?"], ["Ich arbeite als Lehrer.", "I work as a teacher."], ["Ich arbeite im Büro.", "I work in an office."], ["Ich suche Arbeit.", "I am looking for work."]], "checkpoint": {"prompt": "Which asks about someone’s job?", "options": ["Wie alt bist du?", "Was machst du beruflich?", "Wo ist der Bahnhof?"], "answer": 1, "why": "Beruflich refers to work or occupation."}}, {"level": "A1", "title": "Talking about yesterday: Perfekt", "rule": "In everyday spoken German, past events often use haben or sein plus a past participle. The participle usually goes at the end: Ich habe gelernt. Motion/change-of-place verbs often use sein: Ich bin gegangen.", "examples": [["Ich habe Deutsch gelernt.", "I learned German."], ["Wir haben Pizza gegessen.", "We ate pizza."], ["Ich bin nach Hause gegangen.", "I went home."], ["Hast du gearbeitet?", "Did you work?"]], "checkpoint": {"prompt": "Complete: Ich ___ gestern Deutsch gelernt.", "options": ["habe", "bin", "hat"], "answer": 0, "why": "Lernen forms Perfekt with haben: ich habe gelernt."}}, {"level": "A1", "title": "Past events: common participles", "rule": "Many regular past participles use ge-...-t: machen → gemacht. Many irregular verbs have forms ending in -en: essen → gegessen, gehen → gegangen. Memorize useful forms as phrases, not isolated endings.", "examples": [["Ich habe gekocht.", "I cooked."], ["Sie hat gegessen.", "She ate."], ["Wir sind gefahren.", "We traveled / drove."], ["Er hat das Buch gelesen.", "He read the book."]], "checkpoint": {"prompt": "What is the past participle of essen?", "options": ["geesst", "gegessen", "geessen"], "answer": 1, "why": "Essen is irregular: essen → gegessen."}}, {"level": "A1", "title": "Review: pronouns and questions", "rule": "Recall earlier material without looking at the answers. Ich is I, wir is we, and Sie is formal you. W-questions put the question word first, then the conjugated verb: Wo wohnst du?", "examples": [["Wer bist du?", "Who are you?"], ["Wo wohnen Sie?", "Where do you live? (formal)"], ["Wann kommst du?", "When are you coming?"], ["W <script>
(function(){
 const speechWords=[
  ['ich','I','Focus on the soft ch sound at the end.'],
  ['wir','we','German w sounds like English v.'],
  ['ihr','you (plural)','The vowel is long, like the ee sound.'],
  ['sprechen','to speak','The initial sp sounds like shp.'],
  ['Schule','school','The sch combination sounds like English sh.'],
  ['zwei','two','German z begins with a ts sound.'],
  ['mein','my','The ei combination sounds like English eye.'],
  ['Liebe','love','The ie combination is a long ee sound.'],
  ['Bücher','books','Listen for the ü vowel and the soft ch.'],
  ['Mädchen','girl','The ch here is soft; -chen is a diminutive ending.'],
  ['Wasser','water','German w sounds like v; the first a is short.'],
  ['aufstehen','to get up','Notice the au diphthong and the stressed first syllable.'],
  ['Frühstück','breakfast','Pay attention to ü and the consonant cluster.'],
  ['Entschuldigung','excuse me','Say the word in syllables, then together.'],
  ['Guten Morgen','good morning','Practice the natural rhythm of the greeting.']
 ];
 const previousBegin=fullBegin;
 fullBegin=function(id){
  previousBegin(id);
  const s=fullSession,u=FULL_UNITS[id];
  if(!s||!u||u.level!=='A1'||!/(umlaut|pronunc|sounds? of|alphabet|spelling)/i.test(String(u.title||''))||!Array.isArray(s.questions)||s.questions.some(q=>q.type==='speak-word'))return;
  const n=Math.abs(Number(id)||0)%speechWords.length;
  const [word,meaning,tip]=speechWords[n];
  s.questions.splice(Math.min(4,s.questions.length),0,{type:'speak-word',prompt:'Say this German word aloud',options:['Recognized','Try again'],answer:0,dlSpeakWord:word,dlSpeakMeaning:meaning,why:tip});
  fullRender();
 };
 let currentRecognition=null;
 const previousRender=fullRender;
 fullRender=function(){
  if(currentRecognition){try{currentRecognition.abort()}catch(e){}currentRecognition=null}
  previousRender();
  const s=fullSession,q=s?.questions?.[s.idx];if(!q||q.type!=='speak-word')return;
  const card=document.querySelector('.dl-flow-card');if(!card)return;
  const label=card.querySelector('.dl-flow-label');if(label)label.textContent='SPEAK THE GERMAN WORD';
  const heading=card.querySelector('h2');if(heading)heading.textContent='Pronounce this word:';
  const choices=card.querySelector('.dl-flow-options');if(choices)choices.hidden=true;
  const check=document.getElementById('dl-check');if(check)check.hidden=true;
  const tip=document.getElementById('dl-tip'),help=document.getElementById('dl-help-btn');if(tip)tip.hidden=true;if(help)help.hidden=true;
  const panel=document.createElement('div');panel.className='dl-speak-panel';
  panel.innerHTML='<div class="dl-speak-target"></div><p class="dl-speak-meaning"></p><button class="secondary" id="dl-speak-listen">🔊 Hear it</button><button class="secondary" id="dl-speak-slow">🐢 Hear it slowly</button><button id="dl-speak-start">🎤 Speak now</button><p id="dl-speak-status" class="dl-speak-status" aria-live="polite">Listen to the word, then say it into your microphone.</p><button class="secondary" id="dl-speak-skip">Skip speaking</button>';
  panel.querySelector('.dl-speak-target').textContent=q.dlSpeakWord;
  panel.querySelector('.dl-speak-meaning').textContent=q.dlSpeakMeaning;
  panel.querySelector('#dl-speak-listen').onclick=()=>speak(q.dlSpeakWord);
  panel.querySelector('#dl-speak-slow').onclick=()=>speak(q.dlSpeakWord,0.7);
  panel.querySelector('#dl-speak-skip').onclick=()=>finish(false,true);
  panel.querySelector('#dl-speak-start').onclick=()=>{
   const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
   const status=panel.querySelector('#dl-speak-status');
   if(!Rec){status.textContent='Speech recognition is unavailable in this browser. You can listen and practice, then skip this speaking check.';return}
   if(currentRecognition){try{currentRecognition.stop()}catch(e){}return}
   const rec=new Rec();currentRecognition=rec;rec.lang='de-DE';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=5;
   const start=panel.querySelector('#dl-speak-start');start.textContent='Listening… tap to stop';status.textContent='Listening for German speech…';
   rec.onresult=e=>{
    if(fullSession!==s||s.questions[s.idx]!==q)return;
    const alternatives=Array.from(e.results[0]||[]).map(x=>x.transcript);
    const norm=t=>String(t).toLocaleLowerCase('de').normalize('NFC').replace(/[.,!?„“"']/g,'').replace(/\s+/g,' ').trim();

   };
   rec.onerror=e=>{if(fullSession===s&&s.questions[s.idx]===q)status.textContent='Microphone: '+e.error+'. You can retry or skip.'};
   rec.onend=()=>{if(currentRecognition===rec)currentRecognition=null;if(start.isConnected)start.textContent='🎤 Speak again'};
   try{rec.start()}catch(e){currentRecognition=null;status.textContent='Could not start microphone: '+e.message}
  };
  card.querySelector('.dl-flow-options')?.before(panel);

   panel.querySelector('#dl-speak-status').hidden=true;
   if(result){const wrap=document.createElement('div');wrap.className='dl-flow-feedback';const strong=document.createElement('strong');strong.textContent=skipped?'Practice skipped':matched?'Well done!':'Try again';const p=document.createElement('p');p.textContent=matched?'You said “'+(heard||q.dlSpeakWord)+'” and the microphone understood you. Keep practicing the sound to make it feel natural.':skipped?'You can return to this word later.':q.why;wrap.append(strong,p);result.replaceChildren(wrap)}
   if(check){check.hidden=false;check.disabled=false;check.textContent=s.idx===s.questions.length-1?'Finish lesson':'Continue';check.onclick=()=>{s.idx++;fullRender()}}
  }
 };
})();
</script>

<script>
/* Topic-aware module reviews: recap, a small transfer challenge, and score-based mascot feedback. */
(function(){

 function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 curriculumReview=function(level,n){
  if(level!=='A1')return oldReview(level,n);
  const g=STRUCTURED_PATH[level]?.[n];if(!g)return;
  const core=[];
  for(const id of g.ids){
   const u=FULL_UNITS[id];if(!u)continue;

   // Test meaning, grammar and recall rather than repeating the same prompt three times.
   const chosen=[qs.find(q=>q.type==='grammar'),qs.find(q=>q.type==='recall'),qs.find(q=>q.type==='translate')].filter(Boolean);
   chosen.forEach(q=>core.push({...q,unitId:id}));
  }
  shuffle(core);
  const questions=core.slice(0,7);
  // A small, explicitly labeled transfer challenge uses unfamiliar vocabulary
  // with a pattern already practiced. It is never required for passing.
  const next=STRUCTURED_PATH.A1[n+1];
  let stretch=[];
  if(next){
   for(const id of next.ids){
    const u=FULL_UNITS[id];if(!u?.examples?.length)continue;
    const ex=u.examples.find(x=>Array.isArray(x)&&x[0]&&x[1]);
    if(!ex)continue;
    const distractors=u.examples.filter(x=>Array.isArray(x)&&x[1]!==ex[1]).map(x=>x[1]).slice(0,2);
    if(distractors.length<2)continue;
    const opts=shuffle([ex[1],...distractors]);
    stretch.push({type:'transfer',prompt:'New vocabulary challenge: What does “'+ex[0]+'” mean?',options:opts,answer:opts.indexOf(ex[1]),why:'New word: “'+ex[0]+'” means “'+ex[1]+'”. You can apply the recognition skills you just practiced to unfamiliar German.',unitId:id,dlStretch:true});
   }
  }
  if(stretch.length)questions.push(stretch[0]);

  moduleSession={level,n,questions,idx:0,score:0,answered:false,dlReviewEnhanced:true,dlCoreCount:questions.filter(q=>!q.dlStretch).length,dlCoreScore:0,dlMissed:[]};

 };
 const oldAnswer=curriculumReviewAnswer;
 curriculumReviewAnswer=function(i){

   if(q.dlStretch){
    const title=app.querySelector('.curriculum-pill');if(title)title.textContent='BONUS · Apply what you learned to a new word';
    const prompt=app.querySelector('.card h2');if(prompt)prompt.textContent=q.prompt.replace(/^New vocabulary challenge: /,'');
    const note=document.createElement('p');note.className='muted';note.textContent='This introduces unfamiliar vocabulary using skills you already practiced. It does not affect your pass score.';

   return;
  }
  const g=STRUCTURED_PATH[s.level]?.[s.n],total=s.dlCoreCount,correct=s.dlCoreScore;
  const percent=total?Math.round(correct/total*100):0;
  const passed=percent>=80;
  ensureLearning();state.learning.moduleReviews??={};
  const key=s.level+'-'+s.n,old=state.learning.moduleReviews[key];
  state.learning.moduleReviews[key]={best:Math.max(old?.best||0,correct),total,passed:passed||!!old?.passed};save();
  const mascot=percent===100?'avatar_fox.webp':percent>=80?'avatar_dog.webp':percent>=60?'avatar_owl.webp':'avatar_cat.webp';
  const german=percent===100?'Ausgezeichnet!':percent>=80?'Sehr gut gemacht!':percent>=60?'Gut gemacht!':'Weiter üben!';
  const english=percent===100?'Excellent! A perfect review.':percent>=80?'Very well done! You passed the review.':percent>=60?'Good work! Review the missed answers and try again.':'Keep practicing! Revisit the lessons and try again.';
  const examples=(g?.ids||[]).flatMap(id=>FULL_UNITS[id]?.examples||[]).filter(x=>Array.isArray(x)&&x[0]&&x[1]).slice(0,3);
  app.innerHTML=`<section class="card"><p class="curriculum-pill">${esc(s.level)} · Module ${s.n+1} review</p><h2>Module review complete</h2>
   <div class="dl-review-result"><img src="${mascot}" alt="DeutschLab animal character"><div><h3>${german}</h3><p>${english}</p><p><strong>${percent}%</strong> · ${correct} of ${total} review questions correct</p></div></div>
   <div class="dl-review-summary"><h3>What you practiced</h3><p>${esc(g?.goal||'The key skills from this module.')}</p><p>${esc(g?.context||'')}</p>
   ${examples.length?'<h4>Key examples</h4><ul>'+examples.map(x=>'<li><strong>'+esc(x[0])+'</strong> — '+esc(x[1])+'</li>').join('')+'</ul>':''}
   ${s.dlMissed.length?'<h4>Answers to revisit</h4><ul>'+s.dlMissed.slice(0,4).map(x=>'<li>'+esc(x.prompt)+' — <strong>'+esc(x.correct)+'</strong></li>').join('')+'</ul>':'<p>You answered all the core review questions correctly.</p>'}

   <button onclick="curriculumView('${s.level}')">Learning path</button><button class="secondary" onclick="curriculumReview('${s.level}',${s.n})">Practice again</button></section>`;

<script>
(function(){
 const clips={Mutter:[0,1.46], 'Mütter':[1.96,3.44]};
 // Two clips separated by 0.5 seconds of silence.
 const sprite='deutschlab-native-audio.ogg';
 let active=null;
 const oldSpeak=speak;
 speak=function(text,rate=1){
  const word=String(text||'').trim();
  const range=clips[word];
  if(!range){if(rate===1)return oldSpeak(text);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='de-DE';u.rate=rate;speechSynthesis.speak(u);return}catch(e){return oldSpeak(text)}}
  try{
   if(active){active.pause();active=null;}
   if('speechSynthesis' in window)speechSynthesis.cancel();
   const player=new Audio(sprite);player.playbackRate=rate;active=player;
   player.preload='auto';
   const start=range[0],end=range[1];
   const begin=()=>{player.currentTime=start;player.play().catch(()=>oldSpeak(text));};
   player.addEventListener('loadedmetadata',begin,{once:true});
   player.addEventListener('timeupdate',()=>{if(player.currentTime>=end){player.pause();if(active===player)active=null;}});
   player.addEventListener('error',()=>{if(active===player)active=null;oldSpeak(text);},{once:true});
   player.load();
  }catch(e){oldSpeak(text);}
 };
})();
</script>

<script>
/* Reviews assess taught skills. Transfer questions reuse a taught grammar rule, never next-module vocabulary. */
(function(){
 const prior=curriculumReview;
 function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 function isSoundGloss(x){return /\([^)]*(sounds? like|pronounced|letter|vowel|different from|compare|unlike)[^)]*\)/i.test(String(x));}
 function cleanAnswer(x){return String(x).replace(/\s*\([^)]*\)/g,'').trim();}
 function soundReview(id){
  const make=(prompt,options,correct,why,audio)=>{const opts=shuffle(options.slice());return {type:'grammar',unitId:id,prompt,options:opts,answer:opts.indexOf(correct),why,...(audio?{dlReviewAudio:audio}:{})};};
  return [
   make('Listen to the first sound. Which German letter makes it?',['J','W','V'],'J','Junge begins with J, pronounced like English Y.','Junge'),
   make('You encounter “Wolke” (cloud) for the first time. How is W pronounced?',['Like English V','Like English W','Like English F'],'Like English V','German W sounds like English V.'),
   make('Listen to the vowel sound. Which German letter produces it?',['ö','o','ü'],'ö','Schön uses ö, a rounded front vowel.','schön'),
   make('In the new word “Vogel” (bird), how is the initial V usually pronounced?',['Like English F','Like English V','Like English Y'],'Like English F','Vogel begins with an F sound.'),
   make('Listen to the vowel sound. Which German letter produces it?',['ü','u','ö'],'ü','Fünf contains the vowel ü.','fünf'),
   make('What changes when you write schon as schön?',['The pronunciation and meaning','Only the capitalization','Nothing; they are interchangeable'],'The pronunciation and meaning','Schon means already; schön means beautiful.'),
   make('Listen to the first vowel sound. Which German letter produces it?',['ä','a','ö'],'ä','Mädchen contains ä.','Mädchen'),
   make('You see the unfamiliar word “Fuß” (foot). What sound does ß represent?',['An s sound','A b sound','A z sound'],'An s sound','ß represents a voiceless s sound.'),
   make('Listen to the first sound. Which German letter makes it?',['W','V','J'],'W','Wasser begins with W, pronounced like English V.','Wasser'),
   make('You read the unfamiliar word “grün” (green). Which vowel sound should you apply?',['The German ü sound','The ordinary u sound','The German ö sound'],'The German ü sound','The umlaut changes u into the distinct ü vowel.')
  ];
 }
 curriculumReview=function(level,n){
  prior(level,n);
  const s=moduleSession,g=STRUCTURED_PATH[level]?.[n];
  if(!s||!g||level!=='A1')return;
  // A module review must never draw its bonus from the following module.
  s.questions=s.questions.filter(q=>!q.dlStretch);
  const clean=[];
  const seen=new Set();
  for(const id of g.ids){
   const u=FULL_UNITS[id];if(!u)continue;
   const qs=fullQuestions(u).filter(q=>Array.isArray(q.options)&&q.options.length>=2&&q.answer>=0&&q.answer<q.options.length&&q.type!=='listen'&&!q.options.some(isSoundGloss));

    seen.add(key);

    if(opts.some(x=>!x)||new Set(opts.map(x=>x.toLowerCase())).size!==opts.length)continue;

   }

  const taughtRule=g.ids.some(id=>/regular (?:present|verb)|present.tense (?:verb|ending)|verb endings|conjugat(?:e|ion|ing)/i.test(FULL_UNITS[id]?.rule||''));

   const opts=shuffle(['spiele','spielst','spielt']);
   clean.push({type:'grammar',unitId:g.ids[0],prompt:`Apply the verb ending you learned: ${target.subject} ___ (spielen = to play)`,options:opts,answer:opts.indexOf(target.form),why:`Spielen means “to play.” The subject ${target.subject} takes the regular present-tense ending ${target.ending}, so spiel- becomes ${target.form}.`,dlTransfer:true});
  }

   const isAlphabet=n===0&&/alphabet|spelling/i.test(g.title||'');
   const candidates=isAlphabet?soundReview(g.ids[0]):clean;
   // Interleave different exercise types instead of repeating one prompt pattern.
   const buckets=new Map();
   for(const q of shuffle(candidates)){

   }

   }

  }

 };
})();
</script>

<script>
/* Teach noun-gender patterns inside relevant lessons, then assess transfer to
   unfamiliar nouns. The article-patterns reference page remains available. */
(function(){
 const isGenderLesson=u=>!!u&&u.level==='A1'&&/(nouns? and (their )?articles?|noun gender|gender patterns)/i.test(u.title||'');
 const genderQuestions=[
  {type:'grammar',prompt:'A new German noun ends in -ung: ___ Einladung (invitation). Which article is most likely?',options:['die','der','das'],answer:0,why:'The ending -ung is a strong feminine noun pattern. Einladung is feminine: die Einladung.'},
  {type:'grammar',prompt:'A new noun ends in -chen: ___ Häuschen (little house). Choose the article.',options:['das','die','der'],answer:0,why:'The diminutive ending -chen makes a noun neuter, even when the original noun has another gender: das Häuschen.'},
  {type:'grammar',prompt:'Choose the article for ___ Freiheit (freedom). Use the noun ending.',options:['der','die','das'],answer:1,why:'Nouns ending in -heit are feminine: die Freiheit.'},
  {type:'grammar',prompt:'Which article goes with ___ Museum? Use the -um pattern.',options:['das','der','die'],answer:0,why:'Many German nouns ending in -um are neuter, including das Museum.'},
  {type:'grammar',prompt:'Choose the article for ___ Freundschaft (friendship).',options:['die','das','der'],answer:0,why:'The suffix -schaft forms feminine nouns: die Freundschaft.'},
  {type:'grammar',prompt:'Choose the article for ___ Brötchen (bread roll).',options:['der','das','die'],answer:1,why:'The ending -chen makes a noun neuter: das Brötchen.'},
  {type:'grammar',prompt:'Choose the article for ___ Möglichkeit (possibility).',options:['die','der','das'],answer:0,why:'The ending -keit forms feminine nouns: die Möglichkeit.'},
  {type:'grammar',prompt:'Choose the article for ___ Instrument (instrument).',options:['der','die','das'],answer:2,why:'Many nouns ending in -ment are neuter, including das Instrument. This ending is a clue, not a guarantee.'}
 ];
 const previousQuestions=fullQuestions;
 fullQuestions=function(unit){
  const original=previousQuestions(unit);
  if(!isGenderLesson(unit))return original;
  // Preserve the question set of an active attempt.
  if(fullSession&&fullSession.id===FULL_UNITS.indexOf(unit)&&fullSession.questions)return fullSession.questions;
  const existing=original.filter(q=>Array.isArray(q.options)&&q.options.length>1&&!/sound|listen/i.test(q.type));
  const chosen=[...genderQuestions].sort(()=>Math.random()-.5).slice(0,5);
  const questions=[...chosen,...existing.slice(0,3)];
  return questions.map(q=>{
   const choices=q.options.map((label,i)=>({label,correct:i===q.answer}));
   for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
   return {...q,options:choices.map(x=>x.label),answer:choices.findIndex(x=>x.correct)};
  });
 };
 const previousStudy=fullStudy;
 fullStudy=function(id){

  const u=FULL_UNITS[id];
  if(!isGenderLesson(u))return;

  if(!card)return;

  panel.className='dl-article-teaching';
  panel.innerHTML='<h3>Spot the noun ending</h3>'+
   '<p>German nouns have a grammatical gender. Some endings give you a useful clue about which article to use.</p>'+
   '<div class="dl-article-example"><strong>Usually die (feminine)</strong><p><strong>-ung</strong>: die Zeitung · <strong>-heit</strong>: die Freiheit · <strong>-keit</strong>: die Möglichkeit · <strong>-schaft</strong>: die Freundschaft · <strong>-ion</strong>: die Nation · <strong>-in</strong>: die Lehrerin</p></div>'+
   '<div class="dl-article-example"><strong>Usually das (neuter)</strong><p><strong>-chen</strong>: das Mädchen · <strong>-ment</strong>: das Instrument · <strong>-um</strong>: das Museum</p></div>'+
   '<div class="dl-article-example"><strong>Often der (masculine)</strong><p>Days, months and seasons: der Montag, der Januar, der Winter. Some nouns ending in -er are masculine, but there are exceptions.</p></div>'+
   '<p><strong>Try the pattern:</strong> You will see unfamiliar nouns with these endings. Choose der, die or das using the ending, then read the explanation.</p>'+
   '<p>These are clues, not universal rules. Learn each noun together with its article.</p>';
  const first=card.querySelector('.unit-explain');
  if(first)first.after(panel);else card.prepend(panel);
 };
})();

<script id="dl-a1-alphabet-lesson-one-scope-fix">
(function(){
 const lesson=FULL_UNITS.find(u=>u.level==='A1'&&u.title==='Alphabet and spelling');
 if(!lesson)return;
 lesson.rule='German uses the same 26 basic letters as English, but some are pronounced differently. German J sounds like English Y in yes; W sounds like English V; and V often sounds like English F. Listen to Januar, Wasser and Vater, then practice recognizing those sounds. German also has additional letters, which you will learn in Lesson 2.';
 lesson.examples=[['Januar','January — J sounds like English Y'],['Wasser','water — W sounds like English V'],['Vater','father — V often sounds like English F']];
 lesson.checkpoint={prompt:'In the German word Wasser, which letter makes the English V sound?',options:['W','J','V'],answer:0,why:'German W is pronounced like English V, as in Wasser.'};
 const questions=[
  ['Which letter in German usually sounds like English Y?', ['J','W','V'],0,'German J sounds like English Y, as in Jahr (year).'],
  ['In the new word Jahr (year), how does the first letter sound?', ['Like English Y','Like English J','Like English V'],0,'J in Jahr sounds like English Y.'],
  ['Which German letter usually sounds like English V?', ['W','J','V'],0,'German W sounds like English V.'],
  ['In Winter (winter), how is the first letter pronounced?', ['Like English V','Like English W','Like English F'],0,'W in Winter sounds like English V.'],
  ['Which German letter often sounds like English F?', ['V','W','J'],0,'German V often sounds like English F, as in Vogel (bird).'],
  ['In Vogel (bird), which English sound begins the word?', ['F','V','Y'],0,'The V in Vogel is usually pronounced like English F.'],
  ['Which pair starts with the same German letter sound?', ['Wasser and Winter','Vater and Jahr','Jahr and Wasser'],0,'Wasser and Winter both begin with German W, which sounds like English V.']
 ];
 const speaking=[
  ['Jahr','year','German J sounds like English Y. Listen to Jahr, then say it aloud.'],
  ['Winter','winter','German W sounds like English V. Listen to Winter, then say it aloud.'],
  ['Vogel','bird','German V often sounds like English F. Listen to Vogel, then say it aloud.']
 ];
 const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
 const oldBegin=fullBegin;
 fullBegin=function(id){
  const result=oldBegin.apply(this,arguments);
  if(FULL_UNITS[id]!==lesson||!fullSession)return result;
  const knowledge=shuffle(questions).map(([prompt,choices,right,why])=>{
   const correct=choices[right],options=shuffle(choices);
   return {type:'grammar',prompt,options,answer:options.indexOf(correct),why};
  });

 };

 fullStudy=function(id){

   document.querySelectorAll('.dl-alphabet-audio,.dl-letters-intro').forEach(el=>el.remove());
  }
  return result;
 };
})();
</script>
