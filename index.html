function toggleMenu(open){const nav=document.getElementById('sideMenu'),back=document.getElementById('menuBackdrop'),toggle=document.querySelector('.menu-toggle');nav.classList.toggle('open',open);nav.setAttribute('aria-hidden',String(!open));back.hidden=!open;toggle.setAttribute('aria-expanded',String(open));document.body.classList.toggle('menu-open',open);if(open)nav.querySelector('.menu-close').focus();else toggle.focus()}

const lessons=[{title:'Greetings & introductions',words:[['Hallo','Hello'],['Guten Morgen','Good morning'],['Wie heißt du?','What is your name?'],['Ich heiße…','My name is…'],['Danke','Thank you']],quiz:[['What does “Wie heißt du?” mean?',['Where are you?','What is your name?','How are you?'],1],['Choose “Thank you”',['Bitte','Hallo','Danke'],2],['Translate “Good morning”',['Gute Nacht','Guten Morgen','Guten Tag'],1]]},{title:'Everyday sentences',words:[['Ich habe','I have'],['Ich möchte','I would like'],['Ich brauche','I need'],['Wo ist…?','Where is…?'],['Wie viel kostet das?','How much does that cost?']],quiz:[['“Ich möchte Wasser” means…',['I have water','I would like water','I need water'],1],['How do you ask “Where is…?”',['Wo ist…?','Wer ist…?','Was ist…?'],0],['“Ich brauche” means…',['I know','I need','I buy'],1]]},{title:'Verbs in the present tense',words:[['ich bin','I am'],['du bist','you are (informal)'],['er/sie ist','he/she is'],['wir sind','we are'],['sie sind','they are']],quiz:[['Fill in: “Du ___ müde.”',['bin','bist','sind'],1],['“Wir sind” means…',['We are','They are','We have'],0],['Fill in: “Ich ___ hier.”',['ist','bist','bin'],2]]},{title:'Food & ordering',words:[['das Wasser','water'],['der Kaffee','coffee'],['die Rechnung','the bill'],['ohne','without'],['mit','with']],quiz:[['“Kaffee ohne Milch” means…',['Coffee with milk','Coffee without milk','Cold coffee'],1],['“Die Rechnung, bitte” asks for…',['The menu','The bill','Water'],1],['“mit” means…',['with','without','more'],0]]}];
const placementQs=[['“Ich bin müde” means…',['I am tired','I am hungry','I am late'],0],['Choose the correct form: “Wir ___ Deutsch.”',['lernt','lernen','lerne'],1],['“Gestern” means…',['Tomorrow','Today','Yesterday'],2],['Which is correct?',['Ich habe einen Hund.','Ich habe ein Hund.','Ich habe eine Hund.'],0],['“Wenn ich Zeit hätte, würde ich reisen” means…',['When I have time I travel','If I had time I would travel','I traveled yesterday'],1]];
let state=JSON.parse(localStorage.getItem('deutschlab')||'{"completed":[],"mistakes":[],"placement":null}');let app=document.getElementById('app');function save(){localStorage.setItem('deutschlab',JSON.stringify(state))}function home(){app.innerHTML=`<section class="card"><h2>Welcome back</h2><p>${state.completed.length} of ${lessons.length} lessons completed</p><div id="progress"><div id="bar" style="width:${state.completed.length/lessons.length*100}%"></div></div><p>Placement: ${state.placement===null?'Not taken':state.placement+'/5 correct'}</p><button onclick="placement()">Take placement test</button><button onclick="lessonMenu()">Start learning</button><button onclick="articleHome()">Practice noun articles</button></section>`}function placement(){runQuiz(placementQs,'Placement check',score=>{state.placement=score;save();app.innerHTML=`<div class="card"><h2>Placement result: ${score}/5</h2><p>${score<=1?'Start with greetings and everyday sentences.':score<=3?'You know some fundamentals. Try the verbs lesson and build from there.':'Strong foundation on this short check. Start with the later lessons.'}</p><p class="muted">This is a short orientation check, not a certified CEFR assessment.</p><button onclick="lessonMenu()">Choose lesson</button></div>`})}function lessonMenu(){app.innerHTML='<h2>Lessons</h2>'+lessons.map((l,i)=>`<div class="card"><h3>${i+1}. ${l.title} ${state.completed.includes(i)?'✓':''}</h3><button onclick="openLesson(${i})">Study</button></div>`).join('')}function openLesson(i){
  const l=lessons[i];
  app.innerHTML=`<div class="card"><h2>${l.title}</h2>
    ${l.words.map((w,j)=>`<p><strong>${w[0]}</strong> — ${w[1]} <button class="secondary" onclick="speak(lessons[${i}].words[${j}][0])">🔊</button></p>`).join('')}
    <button onclick="startLessonQuiz(${i})">Practice</button></div>`;
}
function startLessonQuiz(i){
  runQuiz(lessons[i].quiz,lessons[i].title,score=>{
    if(score===lessons[i].quiz.length&&!state.completed.includes(i))state.completed.push(i);
    save();
    app.innerHTML=`<div class="card"><h2>Score: ${score}/${lessons[i].quiz.length}</h2>
      <p>Complete all questions correctly to mark this lesson complete.</p>
      <button onclick="openLesson(${i})">Try again</button>
      <button onclick="lessonMenu()">Lessons</button></div>`;
  });
}
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}function runQuiz(qs,title,done){let n=0,score=0;function show(){if(n===qs.length){done(score);return}let q=qs[n];app.innerHTML=`<div class="card"><h2>${title}</h2><p class="muted">Question ${n+1}/${qs.length}</p><h3>${q[0]}</h3>${q[1].map((a,i)=>`<button class="secondary" onclick="answer(${i})">${a}</button>`).join('')}<div id="feedback"></div></div>`}window.answer=function(i){let q=qs[n],ok=i===q[2];if(ok)score++;else{state.mistakes.push({question:q[0],options:q[1],correct:q[2]});save()}document.querySelectorAll('.card button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct answer: '+q[1][q[2]]}</p><button onclick="nextQuestion()">Next →</button>`};window.nextQuestion=function(){n++;show()};show()}function review(){if(!state.mistakes.length){app.innerHTML='<div class="card"><h2>Review</h2><p>No missed questions yet. Complete a quiz first.</p></div>';return}let unique=[...new Map(state.mistakes.map(x=>[x.question,x])).values()];runQuiz(unique.map(x=>[x.question,x.options,x.correct]),'Review missed questions',score=>{if(score===unique.length){state.mistakes=[];save()}app.innerHTML=`<div class="card"><h2>Review: ${score}/${unique.length}</h2><p>${score===unique.length?'Excellent—missed-question list cleared.':'Try again to clear the review list.'}</p><button onclick="review()">Review again</button></div>`})}let turn=0;let dialogue=[{de:'Hallo! Wie heißt du?',en:'Hello! What is your name?',answers:['Ich heiße Alex.','Ich bin Wasser.'],correct:0},{de:'Freut mich! Wie geht es dir?',en:'Nice to meet you! How are you?',answers:['Mir geht es gut, danke.','Ich heiße Kaffee.'],correct:0},{de:'Möchtest du einen Kaffee?',en:'Would you like a coffee?',answers:['Ja, gerne!','Ich bin gestern.'],correct:0}];function conversation(){turn=0;dialogueStep()}function dialogueStep(){if(turn>=dialogue.length){app.innerHTML='<div class="card"><h2>Dialogue complete!</h2><button onclick="conversation()">Replay</button></div>';return}let d=dialogue[turn];app.innerHTML=`<div class="card"><h2>Conversation practice</h2><p><strong>Partner:</strong> ${d.de} <button class="secondary" onclick="speak('${d.de}')">🔊</button></p><p class="muted">${d.en}</p>${d.answers.map((a,i)=>`<button class="secondary" onclick="dialogueAnswer(${i})">${a}</button>`).join('')}<p id="feedback"></p></div>`}function dialogueAnswer(i){let d=dialogue[turn];if(i===d.correct){turn++;dialogueStep()}else document.getElementById('feedback').textContent='Not quite. Try the other response.'}
let aiHistory=[];
// Noun article curriculum: nominative gender, plural, accusative and dative.
const articleWords=[
['Hund','dog','der','Hunde','🐕'],['Katze','cat','die','Katzen','🐈'],['Haus','house','das','Häuser','🏠'],['Apfel','apple','der','Äpfel','🍎'],['Banane','banana','die','Bananen','🍌'],['Buch','book','das','Bücher','📖'],['Tisch','table','der','Tische','🪑'],['Lampe','lamp','die','Lampen','💡'],['Auto','car','das','Autos','🚗'],['Kaffee','coffee','der','— (usually uncountable)','☕'],['Milch','milk','die','— (usually uncountable)','🥛'],['Wasser','water','das','— (usually uncountable)','💧'],['Käse','cheese','der','— (usually uncountable)','🧀'],['Zeitung','newspaper','die','Zeitungen','📰'],['Mädchen','girl','das','Mädchen','👧'],['Schlüssel','key','der','Schlüssel','🔑'],['Blume','flower','die','Blumen','🌷'],['Fenster','window','das','Fenster','🪟'],['Lehrer','teacher (male)','der','Lehrer','👨‍🏫'],['Lehrerin','teacher (female)','die','Lehrerinnen','👩‍🏫'],['Brötchen','bread roll','das','Brötchen','🥖'],['Computer','computer','der','Computer','💻'],['Schule','school','die','Schulen','🏫'],['Kind','child','das','Kinder','🧒'],['Stuhl','chair','der','Stühle','🪑'],['Tür','door','die','Türen','🚪'],['Bett','bed','das','Betten','🛏️'],['Garten','garden','der','Gärten','🌳'],['Wohnung','apartment','die','Wohnungen','🏢'],['Restaurant','restaurant','das','Restaurants','🍽️']];
const genderColor={der:'#78b8ff',die:'#ff929c',das:'#7de3aa'};
let articleState=JSON.parse(localStorage.getItem('deutschlab_articles_v1')||'{"cards":{},"attempts":0,"correct":0}');
function articleSave(){localStorage.setItem('deutschlab_articles_v1',JSON.stringify(articleState));}
function articleDue(w){return !articleState.cards[w[0]]||articleState.cards[w[0]].due<=Date.now();}
function articleHome(){const due=articleWords.filter(articleDue).length;app.innerHTML=`<section class="card"><h2>🎨 Noun Articles · der / die / das</h2><p>Learn each noun <strong>with its article and plural</strong>, not by itself.</p><p class="muted">${articleWords.length} nouns · ${due} due for review · ${articleState.attempts?Math.round(articleState.correct/articleState.attempts*100)+'% accuracy':'No answers yet'}</p><button onclick="articleFlash(0)">🖼️ Picture flashcards</button><button onclick="articleQuiz('gender')">🎯 Article quiz</button><button onclick="articleQuiz('plural')">🔤 Plural quiz</button><button onclick="articleQuiz('acc')">Accusative</button><button onclick="articleQuiz('dat')">Dative</button><button onclick="articleQuiz('review')">🔁 Due review (${due})</button></section><section class="card"><h3>Article patterns</h3><p><span style="color:${genderColor.der}">● der</span> masculine · <span style="color:${genderColor.die}">● die</span> feminine · <span style="color:${genderColor.das}">● das</span> neuter</p><p><strong>Often feminine:</strong> -ung (die Zeitung), -heit, -keit, -schaft, -ion, -in (die Lehrerin).</p><p><strong>Often neuter:</strong> -chen (das Mädchen, das Brötchen), -ment, -um.</p><p><strong>Often masculine:</strong> days, months, seasons; many nouns ending -er, but there are exceptions.</p><p>Patterns are clues, not universal rules. Memorize the article with the noun.</p><h3>Case changes</h3><p>Nominative: <b>der / die / das / die</b> (plural)</p><p>Accusative: <b>den / die / das / die</b> (only masculine changes)</p><p>Dative: <b>dem / der / dem / den</b> (plural often adds -n)</p><p class="muted">Example: der Hund → Ich sehe <b>den Hund</b> → Ich helfe <b>dem Hund</b>.</p></section>`;}
let flashIndex=0;
function articleFlash(i){flashIndex=(i+articleWords.length)%articleWords.length;let w=articleWords[flashIndex];app.innerHTML=`<section class="card" style="text-align:center"><p class="muted">Card ${flashIndex+1} / ${articleWords.length}</p><div style="font-size:90px" aria-label="${esc(w[1])}">${w[4]}</div><h2 style="color:${genderColor[w[2]]}">${w[2]} ${w[0]}</h2><p>${w[1]}</p><p>Plural: <strong>die ${w[3]}</strong></p><button onclick="speak('${w[2]} ${w[0]}')">🔊 Hear noun</button><br><button class="secondary" onclick="articleFlash(${flashIndex-1})">← Previous</button><button onclick="articleFlash(${flashIndex+1})">Next →</button><br><button class="secondary" onclick="articleHome()">Articles home</button></section>`;}
let articleSession=null;
function articleQuiz(mode){let pool=mode==='review'?articleWords.filter(articleDue):articleWords.slice();if(!pool.length){app.innerHTML='<section class="card"><h2>All caught up!</h2><p>No cards are due right now.</p><button onclick="articleHome()">Back</button></section>';return;}pool.sort(()=>Math.random()-.5);articleSession={mode,pool:pool.slice(0,mode==='review'?10:12),i:0,score:0};articleQuestion();}
function articleQuestion(){const x=articleSession,w=x.pool[x.i],mode=x.mode==='review'?'gender':x.mode;let question,opts,answer;
if(mode==='plural'){question=`Plural of ${w[2]} ${w[0]}?`;answer='die '+w[3];opts=[answer,'die '+w[0]+'s','die '+w[0]+'en'];if(w[3].startsWith('—')){question=`Which statement about “${w[0]}” is correct?`;answer='Usually uncountable';opts=[answer,'Always plural','Always masculine'];}}
else if(mode==='acc'||mode==='dat'){let g=w[2],map=mode==='acc'?{der:'den',die:'die',das:'das'}:{der:'dem',die:'der',das:'dem'};answer=map[g];question=(mode==='acc'?'Ich sehe ___ ':'Ich helfe ___ ')+w[0]+'. (Choose the article; '+(mode==='acc'?'accusative':'dative')+')';opts=mode==='acc'?['den','die','das','der']:['dem','der','den','das'];}
else{question=`${w[4]} ${w[0]} (${w[1]}) — which article?`;answer=w[2];opts=['der','die','das'];}
opts=[...new Set(opts)];if(!opts.includes(answer))opts.unshift(answer);
app.innerHTML=`<section class="card"><p class="muted">${x.mode.toUpperCase()} · ${x.i+1}/${x.pool.length} · Score ${x.score}</p><h2>${esc(question)}</h2>${opts.map(o=>`<button class="secondary" style="border-bottom:4px solid ${genderColor[o]||'#6bcdbb'}" onclick="articleAnswer('${esc(o)}','${esc(answer)}')">${esc(o)}</button>`).join('')}<div id="articleFeedback" aria-live="polite"></div></section>`;}
function articleAnswer(chosen,correct){let x=articleSession,w=x.pool[x.i],ok=chosen===correct;articleState.attempts++;if(ok){x.score++;articleState.correct++;}let card=articleState.cards[w[0]]||{streak:0};card.streak=ok?card.streak+1:0;const days=ok?[1,3,7,14,30][Math.min(card.streak-1,4)]:0;card.due=Date.now()+(ok?days*86400000:0);articleState.cards[w[0]]=card;articleSave();document.querySelectorAll('.card button').forEach(b=>b.disabled=true);document.getElementById('articleFeedback').innerHTML=`<p class="${ok?'correct':'wrong'}">${ok?'Correct!':'Correct: '+esc(correct)}</p><p>${w[2]} ${w[0]} · ${w[1]} · plural: die ${w[3]}</p><button onclick="articleNext()">Next →</button>`;}
function articleNext(){articleSession.i++;if(articleSession.i>=articleSession.pool.length){app.innerHTML=`<section class="card"><h2>Session complete</h2><p>${articleSession.score} / ${articleSession.pool.length} correct</p><p class="muted">Correct answers are scheduled for later review. Missed nouns remain due.</p><button onclick="articleQuiz('${articleSession.mode}')">Try again</button><button onclick="articleHome()">Articles home</button></section>`;}else articleQuestion();}

<script>
const GUIDE={
'A1|Greetings and introductions':['German greetings change with context. Hallo is informal; Guten Tag works in more formal settings. Auf Wiedersehen means goodbye.','Hallo, ich heiße Mia.','Hello, my name is Mia.'],
'A1|Nouns and articles':['German nouns have grammatical gender: der (masculine), die (feminine), das (neuter). Always memorize the article together with the noun. Plural nouns generally use die in the nominative.','der Tisch · die Lampe · das Buch','the table · the lamp · the book'],
'A1|Present-tense verbs':['Regular verbs change endings with the subject: ich -e, du -st, er/sie/es -t, wir/sie/Sie -en, ihr -t. The stem of lernen is lern-.','Ich lerne. Du lernst. Wir lernen.','I learn. You learn. We learn.'],
'A1|Basic word order':['In a German main clause, the conjugated verb is in position TWO. A time expression can come first, but the verb must still come next.','Heute gehe ich einkaufen.','Today I am going shopping.'],
'A2|Accusative articles':['The accusative marks the direct object. Only masculine definite articles change: der → den; die and das stay the same. Masculine ein → einen.','Der Hund schläft. Ich sehe den Hund.','The dog sleeps. I see the dog.'],
'A2|Dative articles':['Dative often marks the recipient or follows verbs such as helfen. Articles change: der → dem, die → der, das → dem; plural die → den.','Ich helfe der Frau.','I help the woman.'],
'A2|Perfect tense':['The spoken past (Perfekt) usually uses haben or sein plus a past participle. Many motion/change-of-state verbs use sein; most other verbs use haben.','Ich habe gekocht. Ich bin gegangen.','I cooked. I went.'],
'A2|Separable verbs':['Some verbs split in a main clause: the conjugated verb goes second and the prefix goes at the end. In an infinitive, the prefix stays attached.','Ich stehe um sieben Uhr auf.','I get up at seven o’clock.'],
'B1|Subordinate clauses':['After subordinating conjunctions like weil, dass and ob, the conjugated verb normally moves to the end of its clause.','Ich bleibe zu Hause, weil ich krank bin.','I stay home because I am sick.'],
'B1|Relative clauses':['A relative pronoun agrees in gender/number with the noun it refers to, but its case depends on its job within the relative clause.','Das ist der Mann, der hier arbeitet.','That is the man who works here.'],
'B1|Konjunktiv II':['Use Konjunktiv II to express wishes, hypotheticals and polite requests. Würde + infinitive is common for many verbs.','Wenn ich Zeit hätte, würde ich reisen.','If I had time, I would travel.'],
'B1|Prepositions and cases':['Certain verbs require a fixed preposition and case. Learn them as chunks: sich interessieren für + accusative; sprechen mit + dative.','Ich interessiere mich für Musik.','I am interested in music.'],
'B2|Passive voice':['The process passive uses werden + past participle. Change werden into the appropriate tense: wird (present), wurde (simple past).','Der Brief wurde gestern geschrieben.','The letter was written yesterday.'],
'B2|Advanced connectors':['Obwohl means although and introduces a subordinate clause with the verb at the end. Dennoch means nevertheless and begins a main clause.','Obwohl es regnete, gingen wir spazieren.','Although it rained, we went for a walk.'],
'B2|Reported speech':['Konjunktiv I is often used in formal reported speech to mark that a statement is being reported, not directly asserted.','Er sagt, er habe keine Zeit.','He says he has no time.'],
'B2|Nuanced vocabulary':['Allerdings can mean indeed (emphasis) or however (contrast), depending on context. Read the surrounding sentence to decide.','Das ist allerdings schwierig.','That is indeed difficult.']
};

"}, {"type": "listen", "prompt": "Du lernst Deutsch", "options": ["You learn German", "We learn German", "He learns German"], "answer": 0, "why": "Du is informal singular you; lernst ends in -st."}], [{"type": "choice", "prompt": "Which is correct?", "options": ["Morgen fahre ich nach Berlin.", "Morgen ich fahre nach Berlin.", "Morgen nach Berlin ich fahre."], "answer": 0, "why": "A time expression can come first, but the verb remains in position two."}, {"type": "fill", "prompt": "Complete: Heute ___ wir Pizza.", "options": ["essen", "esst", "isst"], "answer": 0, "why": "Wir essen is the plural form."}, {"type": "order", "prompt": "Arrange: Today I drink tea.", "options": ["Tee", "trinke", "Heute", "ich"], "answer": ["Heute", "trinke", "ich", "Tee"], "why": "The verb trinke is the second constituent."}, {"type": "listen", "prompt": "Heute gehe ich nach Hause", "options": ["Today I go home", "Tomorrow I go home", "Today I stay home"], "answer": 0, "why": "Heute means today; nach Hause means homeward."}], [{"type": "choice", "prompt": "Choose the accusative: Ich habe ___ Hund.", "options": ["den", "dem", "der"], "answer": 0, "why": "Masculine der becomes den as a direct object."}, {"type": "fill", "prompt": "Complete: Sie kauft ___ Apfel.", "options": ["einen", "ein", "einem"], "answer": 0, "why": "Masculine indefinite accusative is einen."}, {"type": "order", "prompt": "Arrange: I see the cat.", "options": ["Katze", "die", "sehe", "Ich"], "answer": ["Ich", "sehe", "die", "Katze"], "why": "Feminine die does not change in the accusative."}, {"type": "listen", "prompt": "Ich sehe den Hund", "options": ["I see the dog", "The dog sees me", "I help the dog"], "answer": 0, "why": "Sehen takes a direct object, here den Hund."}], [{"type": "choice", "prompt": "Which follows mit?", "options": ["dem", "den (singular masculine)", "der (masculine)"], "answer": 0, "why": "Mit always takes dative; masculine der → dem."}, {"type": "fill", "prompt": "Complete: Ich danke ___ Lehrerin.", "options": ["der", "die", "den"], "answer": 0, "why": "Danken takes dative; feminine die → der."}, {"type": "order", "prompt": "Arrange: I speak with the woman.", "options": ["Frau", "mit", "spreche", "Ich", "der"], "answer": ["Ich", "spreche", "mit", "der", "Frau"], "why": "Mit takes dative; feminine die Frau becomes der Frau."}, {"type": "listen", "prompt": "Ich helfe dem Kind", "options": ["I help the child", "I see the child", "The child helps me"], "answer": 0, "why": "Helfen governs dative; das Kind → dem Kind."}], [{"type": "choice", "prompt": "Which auxiliary fits: Ich ___ nach Hause gegangen.", "options": ["bin", "habe", "werde"], "answer": 0, "why": "Gehen usually forms Perfekt with sein."}, {"type": "fill", "prompt": "Complete: Sie ___ ein Buch gelesen.", "options": ["hat", "ist", "wird"], "answer": 0, "why": "Lesen forms Perfekt with haben."}, {"type": "order", "prompt": "Arrange: We cooked yesterday.", "options": ["gekocht", "Wir", "gestern", "haben"], "answer": ["Wir", "haben", "gestern", "gekocht"], "why": "The participle goes at the end of the main clause."}, {"type": "listen", "prompt": "Ich habe Kaffee getrunken", "options": ["I drank coffee", "I am drinking coffee", "I will drink coffee"], "answer": 0, "why": "Habe + getrunken is Perfekt."}], [{"type": "choice", "prompt": "Where does auf go? Ich stehe früh ___.", "options": ["auf", "an", "mit"], "answer": 0, "why": "The prefix auf separates and moves to the end."}, {"type": "fill", "prompt": "Complete: Ich ___ meine Mutter an.", "options": ["rufe", "anrufe", "rufen"], "answer": 0, "why": "Anrufen separates: ich rufe ... an."}, {"type": "order", "prompt": "Arrange: I get up at seven.", "options": ["um", "auf", "Ich", "sieben", "stehe"], "answer": ["Ich", "stehe", "um", "sieben", "auf"], "why": "Conjugated stem second; prefix at the end."}, {"type": "listen", "prompt": "Ich kaufe heute ein", "options": ["I shop today", "I cook today", "I call today"], "answer": 0, "why": "Einkaufen separates into kaufe ... ein."}], [{"type": "choice", "prompt": "Which is correct?", "options": ["weil ich müde bin", "weil ich bin müde", "weil bin ich müde"], "answer": 0, "why": "Weil introduces a subordinate clause; finite verb goes last."}, {"type": "fill", "prompt": "Complete: Ich glaube, dass er morgen ___.", "options": ["kommt", "kommen", "komme"], "answer": 0, "why": "Dass-clause verb goes at the end."}, {"type": "order", "prompt": "Arrange: because I am tired", "options": ["bin", "weil", "müde", "ich"], "answer": ["weil", "ich", "müde", "bin"], "why": "Subordinating weil sends bin to the end."}, {"type": "listen", "prompt": "Ich bleibe zu Hause, weil es regnet", "options": ["I stay home because it rains", "I leave because it rains", "I stay home although it rains"], "answer": 0, "why": "Weil introduces a reason."}], [{"type": "choice", "prompt": "Which relative pronoun? Die Frau, ___ hier wohnt.", "options": ["die", "der", "den"], "answer": 0, "why": "Die Frau is feminine and the pronoun is the relative-clause subject."}, {"type": "fill", "prompt": "Complete: Das Kind, ___ spielt, ist müde.", "options": ["das", "dem", "den"], "answer": 0, "why": "Neuter nominative relative pronoun is das."}, {"type": "order", "prompt": "Arrange: the man who works here", "options": ["hier", "der", "arbeitet", "Mann,", "der"], "answer": ["der", "Mann,", "der", "hier", "arbeitet"], "why": "Relative clauses end with the finite verb."}, {"type": "listen", "prompt": "Das ist die Frau, die hier arbeitet", "options": ["That is the woman who works here", "That is the woman who lived here", "That is the man who works here"], "answer": 0, "why": "Die refers back to die Frau."}], [{"type": "choice", "prompt": "Which is a polite request?", "options": ["Könnten Sie mir helfen?", "Sie helfen mir!", "Sie geholfen mir?"], "answer": 0, "why": "Könnten is Konjunktiv II, often used for polite requests."}, {"type": "fill", "prompt": "Complete: Wenn ich Geld hätte, ___ ich reisen.", "options": ["würde", "werde", "habe"], "answer": 0, "why": "Würde + infinitive expresses a hypothetical."}, {"type": "order", "prompt": "Arrange: I would like a tea.", "options": ["Tee", "gern", "hätte", "Ich", "einen"], "answer": ["Ich", "hätte", "gern", "einen", "Tee"], "why": "Hätte is Konjunktiv II of haben."}, {"type": "listen", "prompt": "Ich würde gern nach Berlin fahren", "options": ["I would like to go to Berlin", "I went to Berlin", "I must go to Berlin"], "answer": 0, "why": "Würde gern expresses a wish."}], [{"type": "choice", "prompt": "Which phrase is correct?", "options": ["warten auf den Bus", "warten mit den Bus", "warten bei den Bus"], "answer": 0, "why": "Warten auf + accusative."}, {"type": "fill", "prompt": "Complete: Ich spreche ___ meinem Bruder.", "options": ["mit", "für", "auf"], "answer": 0, "why": "Sprechen mit takes dative."}, {"type": "order", "prompt": "Arrange: I am waiting for the bus.", "options": ["Bus", "warte", "Ich", "auf", "den"], "answer": ["Ich", "warte", "auf", "den", "Bus"], "why": "Warten auf + accusative, der Bus → den Bus."}, {"type": "listen", "prompt": "Ich interessiere mich für Musik", "options": ["I am interested in music", "I am waiting for music", "I speak about music"], "answer": 0, "why": "Sich interessieren für means to be interested in."}], [{"type": "choice", "prompt": "Present passive: Der Brief ___ geschrieben.", "options": ["wird", "wurde", "würde"], "answer": 0, "why": "Wird + participle is present process passive."}, {"type": "fill", "prompt": "Complete: Das Auto ___ gestern repariert.", "options": ["wurde", "wird", "werden"], "answer": 0, "why": "Gestern indicates past; wurde is preterite passive."}, {"type": "order", "prompt": "Arrange: The house is being built.", "options": ["gebaut", "wird", "Das", "Haus"], "answer": ["Das", "Haus", "wird", "gebaut"], "why": "Passive: werden + participle."}, {"type": "listen", "prompt": "Das Fenster wurde geöffnet", "options": ["The window was opened", "The window is open", "The window will open"], "answer": 0, "why": "Wurde geöffnet is past passive."}], [{"type": "choice", "prompt": "Which connector means although?", "options": ["obwohl", "weil", "damit"], "answer": 0, "why": "Obwohl introduces a concession."}, {"type": "fill", "prompt": "Complete: ___ er krank ist, arbeitet er.", "options": ["Obwohl", "Weil", "Damit"], "answer": 0, "why": "The contrast is working despite illness."}, {"type": "order", "prompt": "Arrange: although it is cold", "options": ["ist", "obwohl", "kalt", "es"], "answer": ["obwohl", "es", "kalt", "ist"], "why": "Obwohl sends the finite verb to the end."}, {"type": "listen", "prompt": "Es regnet, dennoch gehen wir spazieren", "options": ["It rains; nevertheless we walk", "It rains because we walk", "It rains while we walk"], "answer": 0, "why": "Dennoch signals contrast and introduces a main clause."}], [{"type": "choice", "prompt": "Reported speech: Er sagt, er ___ krank.", "options": ["sei", "ist", "wäre"], "answer": 0, "why": "Sei is Konjunktiv I of sein."}, {"type": "fill", "prompt": "Complete: Sie sagt, sie ___ keine Zeit.", "options": ["habe", "hatte", "hätte"], "answer": 0, "why": "Habe is Konjunktiv I in reported speech."}, {"type": "order", "prompt": "Arrange: He says he has no time.", "options": ["Zeit.", "habe", "er", "Er", "sagt,", "keine"], "answer": ["Er", "sagt,", "er", "habe", "keine", "Zeit."], "why": "Reported speech may use Konjunktiv I."}, {"type": "listen", "prompt": "Er sagt, er sei krank", "options": ["He says he is sick", "He says he was late", "He asks if he is sick"], "answer": 0, "why": "Sei signals reported speech."}], [{"type": "choice", "prompt": "Here 'allerdings' means: Das ist allerdings teuer.", "options": ["indeed", "maybe", "never"], "answer": 0, "why": "Allerdings intensifies teuer here."}, {"type": "fill", "prompt": "Complete: Ich möchte kommen, ___ habe ich keine Zeit.", "options": ["allerdings", "damit", "weil"], "answer": 0, "why": "Allerdings here introduces a contrast: however."}, {"type": "order", "prompt": "Arrange: It is expensive; nevertheless I will buy it.", "options": ["kaufe", "dennoch", "Ich", "es"], "answer": ["Ich", "kaufe", "es", "dennoch"], "why": "Dennoch can appear later in a main clause."}, {"type": "listen", "prompt": "Das ist durchaus möglich", "options": ["That is entirely possible", "That is impossible", "That is probably late"], "answer": 0, "why": "Durchaus adds emphasis: entirely/quite."}]];
let lessonRun=null;
function deepStart(id){
 let m=COURSE[id];if(!m||!m.words.length)return courseMenu();
 lessonRun={id,index:0,correct:0,answers:[],orderPicked:[]};
 deepRender();
}
function deepRender(){
 if(!lessonRun)return;
 let r=lessonRun,m=COURSE[r.id],q=DEEP_EXERCISES[r.id]?.[r.index];
 if(!q)return deepFinish();
 let total=DEEP_EXERCISES[r.id].length;
 let html=illustratedHero('Practice · '+m.title,`${m.level} · Exercise ${r.index+1} of ${total}`,'cafe',r.index%2?'katze.png':'hund.png')
 +`<section class="card"><div class="lesson-progress"><div style="width:${r.index/total*100}%"></div></div><p class="muted">${{choice:'Choose the answer',fill:'Fill in the blank',order:'Build the sentence',listen:'Listen and understand'}[q.type]}</p><h3>${safeText(q.prompt)}</h3>`;
 if(q.type==='listen')html+=`<button onclick="speak(${JSON.stringify(q.prompt).replace(/"/g,'&quot;')})">🔊 Play German audio</button><p class="muted">Listen, then choose the English meaning.</p>`;
 if(q.type==='order'){
   html+=`<div class="lesson-note"><strong>Your sentence:</strong> <span id="deepBuilt">—</span></div><div id="deepChoices">${q.options.map((x,i)=>`<button class="word-chip" id="deepChip${i}" onclick="deepPick(${i})">${safeText(x)}</button>`).join('')}</div><button class="secondary" onclick="deepReset()">Reset words</button><button onclick="deepCheckOrder()">Check sentence</button>`;
 }else html+=q.options.map((x,i)=>`<button class="secondary exercise-option" onclick="deepAnswer(${i})">${safeText(x)}</button>`).join('');
 html+=`<div id="deepFeedback" aria-live="polite"></div><button class="secondary" onclick="courseLesson(${r.id})">Review explanation</button></section>`;
 app.innerHTML=html;
}
function deepPick(i){
 if(!lessonRun)return;
 if(lessonRun.orderPicked.includes(i))return;
 lessonRun.orderPicked.push(i);
 document.getElementById('deepChip'+i).disabled=true;
 document.getElementById('deepBuilt').textContent=lessonRun.orderPicked.map(n=>DEEP_EXERCISES[lessonRun.id][lessonRun.index].options[n]).join(' ');
}
function deepReset(){lessonRun.orderPicked=[];deepRender()}
function deepCheckOrder(){
 let q=DEEP_EXERCISES[lessonRun.id][lessonRun.index],chosen=lessonRun.orderPicked.map(n=>q.options[n]);
 if(chosen.length!==q.answer.length){document.getElementById('deepFeedback').textContent='Use all the words before checking.';return}
 deepResult(JSON.stringify(chosen)===JSON.stringify(q.answer),q.answer.join(' '),q.why);
}
function deepAnswer(i){
 let q=DEEP_EXERCISES[lessonRun.id][lessonRun.index];
 deepResult(i===q.answer,q.options[q.answer],q.why);
}
function deepResult(ok,correct,why){
 let r=lessonRun;if(!r)return;
 r.answers.push(ok);if(ok)r.correct++;
 let m=COURSE[r.id];
 if(typeof recordQuestion==='function')recordQuestion(m,ok);
 app.querySelectorAll('.exercise-option,.word-chip').forEach(b=>b.disabled=true);
 let box=document.getElementById('deepFeedback');
 box.innerHTML=`<div class="explain-box"><h3>${ok?'Correct!':'Not quite'}</h3><p><strong>Correct answer:</strong> ${safeText(correct)}</p><p><strong>Why:</strong> ${safeText(why)}</p></div><button onclick="deepNext()">Next exercise →</button>`;
}
function deepNext(){if(!lessonRun)return;lessonRun.index++;deepRender()}
function deepFinish(){
 let r=lessonRun,m=COURSE[r.id],total=DEEP_EXERCISES[r.id].length,pct=r.correct/total;
 ensureLearning();state.learning.lessonScores??={};
 state.learning.lessonScores[r.id]={score:r.correct,total,date:new Date().toISOString()};
 if(pct>=.75&&!state.learning.completed.includes(r.id))state.learning.completed.push(r.id);
 save();
 app.innerHTML=illustratedHero('Lesson complete!',m.title,'village','hund.png')+`<section class="card"><h2>${r.correct}/${total} correct</h2><p>${pct>=.75?'You passed this lesson.':'Review the rule and try again to reach 75%.'}</p><p>Every question includes an explanation. Incorrect answers are saved for review.</p><button onclick="courseLesson(${r.id})">Review lesson</button><button onclick="deepStart(${r.id})">Practice again</button><button class="secondary" onclick="courseMenu('${m.level}')">Learning path</button></section>`;
 lessonRun=null;
}
courseQuiz=deepStart;
const deeperCourseMenu=courseMenu;
courseMenu=function(level){deeperCourseMenu(level);ensureLearning();document.querySelectorAll('.card').forEach(card=>{let b=card.querySelector('button[onclick^="courseLesson("]');if(!b)return;let id=Number((b.getAttribute('onclick').match(/\d+/)||[])[0]);let score=state.learning.lessonScores?.[id];if(score)card.insertAdjacentHTML('beforeend',`<p class="muted">Last score: ${score.score}/${score.total} · ${score.score/score.total>=.75?'Passed':'Needs practice'}</p>`);});};
</script>

<script>
const FULL_UNITS=[{"level":"A1","title":"Numbers and ages","rule":"Numbers combine into larger numbers; in 21–99, say the ones before the tens. Age uses sein: Ich bin zwanzig Jahre alt.","examples":[["eins","one"],["zwölf","twelve"],["einundzwanzig","twenty-one"]],"checkpoint":{"prompt":"Ich bin ___ Jahre alt.","options":["zwanzig","zwanziger","zwanzigsten"],"answer":0,"why":"Age uses sein plus the cardinal number."}},{"level":"A1","title":"Family and possessives","rule":"Mein, dein, sein and ihr show possession. Their endings depend on the noun’s gender and case.","examples":[["meine Mutter","my mother"],["mein Vater","my father"],["mein Bruder","my brother"]],"checkpoint":{"prompt":"Das ist ___ Mutter.","options":["meine","mein","meinen"],"answer":0,"why":"Mutter is feminine nominative, so mein takes -e."}},{"level":"A1","title":"Food and ordering","rule":"Use ich möchte for polite requests. In cafés, nouns usually function as direct objects.","examples":[["Ich möchte Wasser.","I would like water."],["Ein Kaffee, bitte.","A coffee, please."],["Die Rechnung, bitte.","The bill, please."]],"checkpoint":{"prompt":"Ich ___ einen Tee, bitte.","options":["möchte","möchten","möchtest"],"answer":0,"why":"Ich takes möchte."}},{"level":"A1","title":"Days, dates and time","rule":"Days take am; clock times take um. The verb stays in second position.","examples":[["am Montag","on Monday"],["um acht Uhr","at eight o’clock"],["heute Abend","this evening"]],"checkpoint":{"prompt":"Wir treffen uns ___ Montag.","options":["am","um","im"],"answer":0,"why":"Use am for days of the week."}},{"level":"A1","title":"Questions and answers","rule":"W-questions begin with a question word, then the finite verb. Yes/no questions begin with the verb.","examples":[["Wo wohnst du?","Where do you live?"],["Wie heißt du?","What is your name?"],["Hast du Zeit?","Do you have time?"]],"checkpoint":{"prompt":"___ kommst du?","options":["Woher","Wohin","Wannher"],"answer":0,"why":"Woher asks about origin."}},{"level":"A1","title":"Negation: nicht and kein","rule":"Use kein to negate indefinite nouns; nicht to negate verbs, adjectives, or specific parts of a sentence.","examples":[["Ich habe kein Auto.","I have no car."],["Ich komme nicht.","I am not coming."],["Das ist nicht teuer.","That is not expensive."]],"checkpoint":{"prompt":"Ich habe ___ Hund.","options":["keinen","nicht","kein"],"answer":0,"why":"Hund is masculine accusative: keinen Hund."}},{"level":"A1","title":"Daily routines","rule":"Describe habitual actions with present tense. Time can lead a sentence, with the finite verb second.","examples":[["Ich frühstücke um acht.","I have breakfast at eight."],["Ich arbeite heute.","I work today."],["Abends lese ich.","In the evening I read."]],"checkpoint":{"prompt":"Morgens ___ ich Kaffee.","options":["trinke","trinkst","trinkt"],"answer":0,"why":"Ich requires trinke."}},{"level":"A1","title":"Places and directions","rule":"Use nach with most cities/countries without articles; zu with people or destinations; in with locations.","examples":[["Ich fahre nach Berlin.","I travel to Berlin."],["Wo ist der Bahnhof?","Where is the train station?"],["Gehen Sie geradeaus.","Go straight ahead."]],"checkpoint":{"prompt":"Ich fahre ___ München.","options":["nach","zu dem","in dem"],"answer":0,"why":"Nach is used with cities as destinations."}},{"level":"A1","title":"Greetings and introductions","rule":"Hallo is a greeting.","examples":[["Hallo","Hello"],["Guten Tag","Good day"],["Auf Wiedersehen","Goodbye"]],"checkpoint":{"prompt":"Hallo means…","options":["Hello","Goodbye","Please"],"answer":0,"why":"Hallo is a greeting."}},{"level":"A1","title":"Nouns and articles","rule":"Tisch is masculine: der Tisch.","examples":[["der Tisch","table"],["die Lampe","lamp"],["das Buch","book"]],"checkpoint":{"prompt":"Choose the correct article: ___ Tisch","options":["die","das","der"],"answer":2,"why":"Tisch is masculine: der Tisch."}},{"level":"A1","title":"Present-tense verbs","rule":"Wir takes the -en ending.","examples":[["ich lerne","I learn"],["du lernst","you learn"],["wir lernen","we learn"]],"checkpoint":{"prompt":"Wir ___ Deutsch.","options":["lernen","lernt","lerne"],"answer":0,"why":"Wir takes the -en ending."}},{"level":"A1","title":"Basic word order","rule":"In statements, the conjugated verb stays second.","examples":[["Heute gehe ich.","Today I go."],["Ich gehe heute.","I go today."],["Wo wohnst du?","Where do you live?"]],"checkpoint":{"prompt":"Which sentence is correct?","options":["Heute ich gehe einkaufen.","Heute gehe ich einkaufen.","Heute einkaufen ich gehe."],"answer":1,"why":"In statements, the conjugated verb stays second."}},{"level":"A2","title":"Two-way prepositions","rule":"In, an, auf and other two-way prepositions use accusative for direction and dative for location.","examples":[["Ich gehe in die Küche.","I go into the kitchen."],["Ich bin in der Küche.","I am in the kitchen."],["Das Buch liegt auf dem Tisch.","The book lies on the table."]],"checkpoint":{"prompt":"Ich lege das Buch auf ___ Tisch.","options":["den","dem","der"],"answer":0,"why":"Direction onto a masculine noun uses accusative den."}},{"level":"A2","title":"Modal verbs","rule":"Modal verbs change form with the subject and push the main infinitive to the end.","examples":[["Ich muss arbeiten.","I have to work."],["Du kannst kommen.","You can come."],["Wir dürfen gehen.","We may leave."]],"checkpoint":{"prompt":"Wir ___ heute arbeiten.","options":["müssen","muss","musst"],"answer":0,"why":"Wir takes müssen."}},{"level":"A2","title":"Comparatives and superlatives","rule":"Use -er to compare; am ...-sten for adverbial superlatives. Some forms are irregular.","examples":[["größer als","bigger than"],["besser als","better than"],["am schnellsten","the fastest"]],"checkpoint":{"prompt":"Dieses Auto ist ___ als das andere.","options":["schneller","schnellsten","am schnell"],"answer":0,"why":"Comparative of schnell is schneller."}},{"level":"A2","title":"Reflexive verbs","rule":"Reflexive pronouns refer back to the subject; their case depends on the verb.","examples":[["Ich freue mich.","I am happy."],["Du erinnerst dich.","You remember."],["Wir beeilen uns.","We hurry."]],"checkpoint":{"prompt":"Ich interessiere ___.","options":["mich","mir","dich"],"answer":0,"why":"Sich interessieren takes an accusative reflexive pronoun."}},{"level":"A2","title":"Imperatives and requests","rule":"Commands use different forms for du, ihr and Sie. The polite imperative uses infinitive + Sie.","examples":[["Komm bitte!","Come, please!"],["Kommt bitte!","Come, everyone!"],["Kommen Sie bitte!","Please come!"]],"checkpoint":{"prompt":"___ Sie bitte langsam.","options":["Sprechen","Sprich","Sprecht"],"answer":0,"why":"Formal Sie imperative uses infinitive + Sie."}},{"level":"A2","title":"Adjective endings","rule":"Adjective endings depend on case, gender, and preceding article. After der in nominative masculine, use -e.","examples":[["der kleine Hund","the small dog"],["ein kleiner Hund","a small dog"],["mit dem kleinen Hund","with the small dog"]],"checkpoint":{"prompt":"Das ist der ___ Hund.","options":["kleine","kleiner","kleinen"],"answer":0,"why":"After der in nominative masculine, adjective ends -e."}},{"level":"A2","title":"Future plans","rule":"Present tense with a future time word often expresses plans; werden + infinitive explicitly marks future.","examples":[["Morgen fahre ich weg.","I am leaving tomorrow."],["Ich werde lernen.","I will study."],["Nächste Woche habe ich frei.","I am off next week."]],"checkpoint":{"prompt":"Ich ___ morgen anrufen.","options":["werde","wurde","worden"],"answer":0,"why":"Werden + infinitive forms future tense."}},{"level":"A2","title":"Travel and hotels","rule":"Use polite requests and practical questions when checking in or traveling.","examples":[["Ich habe reserviert.","I have a reservation."],["Wo ist Gleis drei?","Where is platform three?"],["Ein Zimmer für zwei Nächte.","A room for two nights."]],"checkpoint":{"prompt":"Ich habe ein Zimmer ___.","options":["reserviert","reservieren","reserviere"],"answer":0,"why":"Perfekt uses habe + past participle reserviert."}},{"level":"A2","title":"Accusative articles","rule":"Masculine der becomes den in accusative.","examples":[["der Hund → den Hund","the dog (object)"],["einen Apfel","an apple (object)"],["die Katze","the cat (object)"]],"checkpoint":{"prompt":"Ich sehe ___ Hund.","options":["den","dem","der"],"answer":0,"why":"Masculine der becomes den in accusative."}},{"level":"A2","title":"Dative articles","rule":"Helfen takes dative; die Frau becomes der Frau.","examples":[["mit dem Hund","with the dog"],["bei der Frau","at the woman's"],["mit einem Kind","with a child"]],"checkpoint":{"prompt":"Ich helfe ___ Frau.","options":["die","der","den"],"answer":1,"why":"Helfen takes dative; die Frau becomes der Frau."}},{"level":"A2","title":"Perfect tense","rule":"Kochen forms Perfekt with haben.","examples":[["ich habe gelernt","I learned"],["sie ist gefahren","she traveled"],["wir haben gekocht","we cooked"]],"checkpoint":{"prompt":"Gestern ___ ich gekocht.","options":["bin","habe","werde"],"answer":1,"why":"Kochen forms Perfekt with haben."}},{"level":"A2","title":"Separable verbs","rule":"Aufstehen separates in a main clause.","examples":[["ich stehe auf","I get up"],["ich kaufe ein","I shop"],["ich rufe an","I call"]],"checkpoint":{"prompt":"Ich ___ um sieben Uhr ___.","options":["stehe … auf","aufstehe … —","stehe … an"],"answer":0,"why":"Aufstehen separates in a main clause."}},{"level":"B1","title":"Genitive case","rule":"Genitive shows relationships and possession; masculine and neuter articles use des and many nouns take -s/-es.","examples":[["das Auto meines Bruders","my brother’s car"],["wegen des Wetters","because of the weather"],["die Tür des Hauses","the door of the house"]],"checkpoint":{"prompt":"Wegen ___ Wetters bleiben wir zu Hause.","options":["des schlechten","dem schlechten","den schlechten"],"answer":0,"why":"Wegen often takes genitive in formal German."}},{"level":"B1","title":"Infinitive with zu","rule":"Infinitive clauses use zu; with separable verbs, zu goes between prefix and stem.","examples":[["Ich versuche zu lernen.","I try to study."],["Es ist wichtig, pünktlich zu sein.","It is important to be on time."],["Ich plane aufzustehen.","I plan to get up."]],"checkpoint":{"prompt":"Ich versuche, früher ___ gehen.","options":["zu","um","bei"],"answer":0,"why":"Infinitive construction uses zu + infinitive."}},{"level":"B1","title":"Past narratives: Präteritum","rule":"Präteritum is common in writing and with sein, haben and modal verbs in speech.","examples":[["Ich war müde.","I was tired."],["Wir hatten Zeit.","We had time."],["Er ging nach Hause.","He went home."]],"checkpoint":{"prompt":"Gestern ___ ich krank.","options":["war","bin","wäre"],"answer":0,"why":"War is Präteritum of sein."}},{"level":"B1","title":"Giving reasons and consequences","rule":"Weil introduces a subordinate reason clause; deshalb introduces a main clause with inversion.","examples":[["Ich bin müde, weil ich arbeite.","I am tired because I work."],["Es regnet, deshalb bleibe ich hier.","It rains, so I stay here."],["Da es spät ist, gehen wir.","Since it is late, we leave."]],"checkpoint":{"prompt":"Es regnet. Deshalb ___ ich zu Hause.","options":["bleibe","ich bleibe","bleiben"],"answer":0,"why":"After deshalb in first position, the finite verb comes next."}},{"level":"B1","title":"Describing experiences","rule":"Use Perfekt for events and descriptive phrases for reactions. Explain when and why things happened.","examples":[["Ich habe viel gelernt.","I learned a lot."],["Es hat mir gefallen.","I liked it."],["Ich habe mich geärgert.","I was annoyed."]],"checkpoint":{"prompt":"Der Film hat mir ___.","options":["gefallen","gefällt","gefallt"],"answer":0,"why":"Gefallen forms Perfekt with hat + gefallen."}},{"level":"B1","title":"Conditional sentences","rule":"Use wenn + verb-final clause for conditions. Konjunktiv II marks unreal or hypothetical conditions.","examples":[["Wenn ich Zeit habe, komme ich.","If I have time, I will come."],["Wenn ich reich wäre, reiste ich.","If I were rich, I would travel."],["Ich würde gern helfen.","I would like to help."]],"checkpoint":{"prompt":"Wenn ich Zeit hätte, ___ ich kommen.","options":["würde","werde","bin"],"answer":0,"why":"Hypothetical conditional uses würde."}},{"level":"B1","title":"Opinions and discussion","rule":"Support opinions with reasons and contrasting views; achten Sie auf the verb position after dass.","examples":[["Meiner Meinung nach…","In my opinion…"],["Ich stimme dir zu.","I agree with you."],["Ich denke, dass das stimmt.","I think that is correct."]],"checkpoint":{"prompt":"Ich glaube, dass er recht ___.","options":["hat","haben","habe"],"answer":0,"why":"Dass sends the finite verb to the end."}},{"level":"B1","title":"Work and appointments","rule":"Discuss scheduling, workplace requests, and obligations using polite structures.","examples":[["Können wir den Termin verschieben?","Can we reschedule the appointment?"],["Ich bewerbe mich um eine Stelle.","I am applying for a job."],["Ich bin für das Projekt zuständig.","I am responsible for the project."]],"checkpoint":{"prompt":"Ich bewerbe mich ___ die Stelle.","options":["um","für","mit"],"answer":0,"why":"Sich bewerben um + accusative is the fixed phrase."}},{"level":"B1","title":"Subordinate clauses","rule":"After weil, the conjugated verb goes to the end.","examples":[["weil ich müde bin","because I am tired"],["dass er kommt","that he is coming"],["ob sie Zeit hat","whether she has time"]],"checkpoint":{"prompt":"Ich bleibe zu Hause, weil ich krank ___.","options":["bin","sein","ist"],"answer":0,"why":"After weil, the conjugated verb goes to the end."}},{"level":"B1","title":"Relative clauses","rule":"The subject of the relative clause is nominative masculine: der.","examples":[["der Mann, der…","the man who…"],["die Frau, die…","the woman who…"],["das Kind, das…","the child that…"]],"checkpoint":{"prompt":"Das ist der Mann, ___ hier arbeitet.","options":["den","der","dem"],"answer":1,"why":"The subject of the relative clause is nominative masculine: der."}},{"level":"B1","title":"Konjunktiv II","rule":"Hypothetical statements often use würde + infinitive.","examples":[["ich würde gern…","I would like to…"],["wenn ich könnte…","if I could…"],["ich hätte gern…","I would like to have…"]],"checkpoint":{"prompt":"Wenn ich mehr Zeit hätte, ___ ich reisen.","options":["werde","würde","habe"],"answer":1,"why":"Hypothetical statements often use würde + infinitive."}},{"level":"B1","title":"Prepositions and cases","rule":"Sich interessieren für takes accusative.","examples":[["sich interessieren für","to be interested in"],["warten auf","to wait for"],["sprechen mit","to speak with"]],"checkpoint":{"prompt":"Ich interessiere mich ___ Musik.","options":["an","für","mit"],"answer":1,"why":"Sich interessieren für takes accusative."}},{"level":"B2","title":"Nominalization","rule":"Nominalization turns verbs/adjectives into nouns, common in formal German. Infinitive nouns are neuter and capitalized.","examples":[["das Lernen","learning"],["beim Lesen","while reading"],["die Entscheidung","the decision"]],"checkpoint":{"prompt":"___ fällt mir leicht.","options":["Das Lesen","Der Lesen","Die Lesen"],"answer":0,"why":"Nominalized infinitives are neuter."}},{"level":"B2","title":"Participial adjectives","rule":"Present participles describe ongoing action; past participles often describe results. Adjective endings still apply.","examples":[["der wartende Mann","the waiting man"],["die geschlossene Tür","the closed door"],["ein geschriebenes Buch","a written book"]],"checkpoint":{"prompt":"Die ___ Tür ist zu.","options":["geschlossene","schließende","geschlossenes"],"answer":0,"why":"Past participle geschlossen describes a closed state; feminine definite adjective ends -e."}},{"level":"B2","title":"Passive with modal verbs","rule":"Modal passive uses modal verb + past participle + werden; the modal verb is finite.","examples":[["Der Vertrag muss unterschrieben werden.","The contract must be signed."],["Das kann erklärt werden.","That can be explained."],["Die Aufgabe soll erledigt werden.","The task should be completed."]],"checkpoint":{"prompt":"Der Brief muss heute ___ werden.","options":["geschrieben","schreiben","schreibt"],"answer":0,"why":"Passive with modal uses past participle + werden."}},{"level":"B2","title":"Advanced relative clauses","rule":"Relative clauses may use prepositions and genitive pronouns. Prepositions determine the pronoun’s case.","examples":[["der Mann, mit dem ich spreche","the man I speak with"],["die Frau, deren Auto…","the woman whose car…"],["das Thema, über das wir sprechen","the topic we discuss"]],"checkpoint":{"prompt":"Die Frau, mit ___ ich spreche, ist nett.","options":["der","die","den"],"answer":0,"why":"Mit requires dative; feminine relative pronoun is der."}},{"level":"B2","title":"Complex argumentation","rule":"Use concessive and contrasting connectors to organize arguments. Mind verb placement.","examples":[["einerseits … andererseits","on the one hand … on the other"],["im Gegensatz dazu","in contrast"],["dennoch","nevertheless"]],"checkpoint":{"prompt":"___ die Kosten hoch sind, lohnt es sich.","options":["Obwohl","Weil","Damit"],"answer":0,"why":"Obwohl expresses concession, despite high costs."}},{"level":"B2","title":"Konjunktiv I and sources","rule":"Use Konjunktiv I in formal reporting to distinguish a source’s claim from your own assertion.","examples":[["Er sagte, er sei müde.","He said he was tired."],["Sie erklärte, sie habe Zeit.","She stated she had time."],["laut dem Bericht","according to the report"]],"checkpoint":{"prompt":"Die Sprecherin sagt, die Lage ___ stabil.","options":["sei","ist","wäre"],"answer":0,"why":"Konjunktiv I of sein for third-person singular is sei."}},{"level":"B2","title":"Register and politeness","rule":"Choose formal or informal register based on context; indirect questions are more polite and use verb-final order.","examples":[["Könnten Sie mir sagen…?","Could you tell me…?"],["Wäre es möglich…?","Would it be possible…?"],["Ich würde mich freuen.","I would be pleased."]],"checkpoint":{"prompt":"Wissen Sie, wann der Zug ___?","options":["kommt","kommen","komme"],"answer":0,"why":"Indirect question uses verb-final clause."}},{"level":"B2","title":"Text cohesion and precision","rule":"Use references, paraphrases and cohesive adverbs to avoid repetition and show relationships between claims.","examples":[["darüber hinaus","furthermore"],["folglich","consequently"],["hingegen","by contrast"]],"checkpoint":{"prompt":"Er hat wenig gelernt; ___ hat er bestanden.","options":["dennoch","deshalb","folglich"],"answer":0,"why":"Dennoch signals an unexpected result despite little study."}},{"level":"B2","title":"Passive voice","rule":"Past passive uses wurde + past participle.","examples":[["wird gemacht","is being done"],["wurde gemacht","was done"],["ist gemacht worden","has been done"]],"checkpoint":{"prompt":"Der Brief ___ gestern geschrieben.","options":["wird","wurde","würde"],"answer":1,"why":"Past passive uses wurde + past participle."}},{"level":"B2","title":"Advanced connectors","rule":"Obwohl introduces a concession: although.","examples":[["obwohl","although"],["dennoch","nevertheless"],["während","while"]],"checkpoint":{"prompt":"___ es regnete, gingen wir spazieren.","options":["Obwohl","Weil","Damit"],"answer":0,"why":"Obwohl introduces a concession: although."}},{"level":"B2","title":"Reported speech","rule":"Konjunktiv I (er habe) is used for reported speech.","examples":[["er habe gesagt","he reportedly said"],["sie sei gekommen","she reportedly came"],["laut Bericht","according to the report"]],"checkpoint":{"prompt":"Er sagt, er ___ keine Zeit.","options":["habe","hatte","hätte"],"answer":0,"why":"Konjunktiv I (er habe) is used for reported speech."}},{"level":"B2","title":"Nuanced vocabulary","rule":"Here allerdings emphasizes the statement: indeed.","examples":[["allerdings","indeed / however"],["hingegen","by contrast"],["durchaus","certainly / quite"]],"checkpoint":{"prompt":"Was bedeutet „allerdings“ hier: „Das ist allerdings schwierig“?","options":["however","indeed","possibly"],"answer":1,"why":"Here allerdings emphasizes the statement: indeed."}}];
let fullSession=null;
function fullMenu(level){ensureLearning();level=LEVELS.includes(level)?level:(state.learning.placement?.recommended||'A1');let list=FULL_UNITS.map((u,i)=>({...u,id:i})).filter(u=>u.level===level);let completed=state.learning.fullScores||{};app.innerHTML=illustratedHero('Complete '+level+' course','Structured units with teaching, listening, grammar and review.','village','hund.png')+`<section class="card"><label>Level <select onchange="fullMenu(this.value)">${LEVELS.map(l=>`<option ${l===level?'selected':''}>${l}</option>`).join('')}</select></label><p>${list.filter(u=>completed[u.id]?.passed).length}/${list.length} units passed · 75% to pass each unit</p><button class="secondary" onclick="placementResults()">Placement results</button></section>`+list.map((u,i)=>`<section class="unit-card"><div class="unit-badge">${level} · Unit ${i+1} of ${list.length}</div><h3>${safeText(u.title)} ${completed[u.id]?.passed?'✓':''}</h3><p>${safeText(u.rule.slice(0,115))}${u.rule.length>115?'…':''}</p><p class="muted">${completed[u.id]?'Best: '+completed[u.id].best+'/7':''}</p><button onclick="fullStudy(${u.id})">Study unit →</button></section>`).join('');}
function fullStudy(id){let u=FULL_UNITS[id];if(!u)return;app.innerHTML=illustratedHero(u.title,`${u.level} · Guided lesson`,'forest',id%2?'katze.png':'hund.png')+`<section class="card"><h2>Understand the rule</h2><div class="unit-explain">${safeText(u.rule)}</div><h3>Examples</h3>${u.examples.map(([de,en])=>`<div class="vocab-row"><div class="vocab-copy"><strong>${safeText(de)}</strong><span>${safeText(en)}</span></div><button class="secondary" onclick="speak(${JSON.stringify(de).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}<h3>Notice the pattern</h3><p>${safeText(u.checkpoint.why)}</p><button onclick="fullBegin(${id})">Start 7 exercises →</button><button class="secondary" onclick="fullMenu('${u.level}')">Back to course</button></section>`;}
function fullQuestions(u){let es=u.examples;let q=[];for(let i=0;i<3;i++){let wrong=[es[(i+1)%3][1],es[(i+2)%3][1]];q.push({type:'translate',prompt:es[i][0],options:[es[i][1],...wrong],answer:0,why:`“${es[i][0]}” means “${es[i][1]}”. ${u.rule}`});}q.push({type:'grammar',prompt:u.checkpoint.prompt,options:u.checkpoint.options,answer:0,why:u.checkpoint.why});q.push({type:'listen',prompt:es[1][0],options:[es[1][1],es[0][1],es[2][1]],answer:0,why:`Listen for the complete phrase: ${es[1][0]} — ${es[1][1]}.`});let tokens=es[0][0].replace(/[.!?]$/,'').split(/\s+/);q.push({type:'order',prompt:es[0][1],tokens,answer:tokens,why:`The model sentence is “${es[0][0]}”. ${u.rule}`});q.push({type:'recall',prompt:'Which German phrase means: '+es[2][1]+'?',options:[es[2][0],es[0][0],es[1][0]],answer:0,why:`The phrase is “${es[2][0]}”.`});return q;}
function fullBegin(id){fullSession={id,idx:0,score:0,picks:[],results:[]};fullRender()}
function fullRender(){let s=fullSession;if(!s)return;let u=FULL_UNITS[s.id],qs=fullQuestions(u),q=qs[s.idx];if(!q)return fullFinish();s.picks=[];let type={translate:'Translate to English',grammar:'Grammar checkpoint',listen:'Listening comprehension',order:'Build the German sentence',recall:'Recall the German'}[q.type];let html=illustratedHero(u.title,`${type} · ${s.idx+1}/7`,'cafe',s.idx%2?'katze.png':'hund.png')+`<section class="card"><div class="unit-progress"><div style="width:${s.idx/7*100}%"></div></div><p class="muted">${type}</p><h3>${safeText(q.prompt)}</h3>`;if(q.type==='listen')html+=`<button onclick="speak(${JSON.stringify(q.prompt).replace(/"/g,'&quot;')})">🔊 Listen again</button>`;if(q.type==='order'){html+=`<p id="fullBuilt">Your sentence: —</p>`+q.tokens.map((t,i)=>`<button class="unit-chip" id="fullChip${i}" onclick="fullPick(${i})">${safeText(t)}</button>`).join('')+`<br><button class="secondary" onclick="fullRender()">Reset</button><button onclick="fullOrderCheck()">Check</button>`;}else html+=q.options.map((x,i)=>`<button class="secondary unit-choice" onclick="fullAnswer(${i})">${safeText(x)}</button>`).join('');html+=`<div id="fullFeedback" aria-live="polite"></div><button class="secondary" onclick="fullStudy(${s.id})">Review explanation</button></section>`;app.innerHTML=html;if(q.type==='listen')speak(q.prompt)}
function fullPick(i){let s=fullSession,q=fullQuestions(FULL_UNITS[s.id])[s.idx];if(s.picks.includes(i))return;s.picks.push(i);document.getElementById('fullChip'+i).disabled=true;document.getElementById('fullBuilt').textContent='Your sentence: '+s.picks.map(n=>q.tokens[n]).join(' ')}
function fullOrderCheck(){let s=fullSession,q=fullQuestions(FULL_UNITS[s.id])[s.idx];if(s.picks.length!==q.tokens.length){document.getElementById('fullFeedback').textContent='Use every word before checking.';return}fullMark(s.picks.map(n=>q.tokens[n]).join(' ')===q.answer.join(' '),q.answer.join(' '),q.why)}
function fullAnswer(i){let s=fullSession,q=fullQuestions(FULL_UNITS[s.id])[s.idx];fullMark(i===q.answer,q.options[q.answer],q.why)}
function fullMark(ok,answer,why){let s=fullSession;if(!s||s.results.length!==s.idx)return;s.results.push(ok);if(ok)s.score++;app.querySelectorAll('.unit-choice,.unit-chip').forEach(b=>b.disabled=true);document.getElementById('fullFeedback').innerHTML=`<div class="unit-explain"><strong>${ok?'Correct':'Not quite'}</strong><p>Answer: ${safeText(answer)}</p><p>Why: ${safeText(why)}</p></div><button onclick="fullNext()">${s.idx===6?'See results':'Continue →'}</button>`}
function fullNext(){if(!fullSession)return;fullSession.idx++;fullRender()}
function fullFinish(){let s=fullSession,u=FULL_UNITS[s.id],passed=s.score>=6;ensureLearning();state.learning.fullScores??={};let old=state.learning.fullScores[s.id];state.learning.fullScores[s.id]={best:Math.max(old?.best||0,s.score),passed:passed||!!old?.passed,last:s.score,date:new Date().toISOString()};state.learning.fullMistakes??=[];s.results.forEach((ok,i)=>{if(!ok)state.learning.fullMistakes.push({unit:s.id,question:i,date:Date.now()})});state.learning.fullMistakes=state.learning.fullMistakes.slice(-250);save();app.innerHTML=illustratedHero('Unit results',u.title,'village','hund.png')+`<section class="card"><h2>${s.score}/7 correct</h2><p>${passed?'Unit passed.':'Review the explanation and retry. You need 6/7 to pass.'}</p><button onclick="fullStudy(${s.id})">Review unit</button><button onclick="fullBegin(${s.id})">Retry exercises</button><button class="secondary" onclick="fullMenu('${u.level}')">All units</button></section>`;fullSession=null}
function fullMistakeReview(){ensureLearning();let m=state.learning.fullMistakes||[];let unique=[...new Set(m.map(x=>x.unit))];app.innerHTML=illustratedHero('Course mistake review','Revisit units where you missed questions.','forest','katze.png')+`<section class="card"><h2>${m.length} missed answers logged</h2>${unique.length?unique.map(id=>`<p>${safeText(FULL_UNITS[id].title)} <button onclick="fullStudy(${id})">Review</button></p>`).join(''):'No missed answers logged yet.'}<button class="secondary" onclick="fullMenu()">Back to course</button></section>`}
const priorHomeFull=home;home=function(){priorHomeFull();let p=state.learning?.placement;app.insertAdjacentHTML('afterbegin',`<section class="card"><h2>Full German course</h2><p>48 guided units, with seven practice activities per unit. Start at your placement level or choose any level.</p><button onclick="fullMenu('${p?.recommended||'A1'}')">Open full course →</button><button class="secondary" onclick="fullMistakeReview()">Review course mistakes</button></section>`)};
const oldCourseMenuFull=courseMenu;courseMenu=function(level){fullMenu(level)};
const oldCourseLessonFull=courseLesson;courseLesson=function(id){oldCourseLessonFull(id)};
home();
</script>

.companion-bubble{position:absolute;z-index:5;right:8px;top:8px;max-width:180px;padding:9px 12px;border-radius:14px 14px 3px 14px;background:#fffdf4;color:#17334a;box-shadow:0 3px 14px #0003;font-size:13px;font-weight:650;pointer-events:none;animation:bubbleIn .25s ease-out}
.scene-hero{position:relative}
@keyframes companionBreathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes companionCelebrate{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-19px) rotate(-8deg)}55%{transform:translateY(-10px) rotate(9deg)}75%{transform:translateY(-17px) rotate(-4deg)}}
@keyframes companionThink{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}65%{transform:rotate(7deg)}}
@keyframes companionWave{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}65%{transform:rotate(12deg)}}

@media(prefers-reduced-motion:reduce){.hero-mascot,.mascot-line img,.companion-bubble{animation:none!important;transition:none!important}}

<script>
(function(){
 const happy=['Sehr gut! Great job!','Wunderbar!','Richtig! You got it!','Weiter so! Keep going!'];
 const retry=['Almost! Check the explanation.','Try again—you can do it.','Look at the grammar rule.'];
 const greetings=['Hallo! Ready to learn?','Übung macht den Meister!','Tap me anytime!','Los geht’s!'];
 let timer=null,lastFeedback='',lastScene=null;
 function react(kind, message){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');if(!mascot)return;
  mascot.classList.remove('companion-happy','companion-think','companion-wave');
  void mascot.offsetWidth;
  mascot.classList.add(kind==='happy'?'companion-happy':kind==='think'?'companion-think':'companion-wave');
  hero.querySelector('.companion-bubble')?.remove();
  const bubble=document.createElement('div');bubble.className='companion-bubble';bubble.setAttribute('role','status');bubble.textContent=message;hero.appendChild(bubble);
  clearTimeout(timer);timer=setTimeout(()=>{bubble.remove();mascot.classList.remove('companion-happy','companion-think','companion-wave')},2600);
 }
 function check(){
  const hero=document.querySelector('.scene-hero');if(!hero)return;
  const mascot=hero.querySelector('.hero-mascot');
  if(mascot&&!mascot.dataset.animated){mascot.dataset.animated='1';mascot.setAttribute('title','Tap for encouragement');mascot.setAttribute('role','button');mascot.setAttribute('tabindex','0');mascot.setAttribute('aria-label','Hear encouragement from your companion');const say=()=>react('wave',greetings[Math.floor(Math.random()*greetings.length)]);mascot.addEventListener('click',say);mascot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();say()}})}
  if(hero!==lastScene){lastScene=hero;lastFeedback=''}
  const feedback=document.querySelector('#fullFeedback,#deepFeedback,#courseFeedback,#practiceFeedback,#listenFeedback,#articleFeedback,#sentenceFeedback,#placeFeedback');
  if(!feedback||!feedback.textContent.trim())return;
  const signature=feedback.textContent.trim();if(signature===lastFeedback)return;lastFeedback=signature;
  if(/^(correct|richtig)|correct!|unit passed/i.test(signature)||/Correct answer/i.test(signature)&&/Correct!/i.test(signature))react('happy',happy[Math.floor(Math.random()*happy.length)]);
  else if(/not quite|incorrect|try again|wrong/i.test(signature))react('think',retry[Math.floor(Math.random()*retry.length)]);
 }
 const observer=new MutationObserver(check);observer.observe(document.getElementById('app')||document.body,{subtree:true,childList:true,characterData:true});check();
})();
</script>

<script>
/* Additional open-response practice for every one of the 48 existing course units.

let intensive=null;
function deepNormalize(t){return String(t).toLocaleLowerCase('de-DE').normalize('NFC').replace(/[.,!?;:„“"'’]/g,'').replace(/\s+/g,' ').trim()}
function intensiveStart(id){if(!FULL_UNITS[id])return;intensive={id,idx:0,correct:0,answers:[],shownHint:false};intensiveRender()}
function intensiveTasks(u){let e=u.examples;return [
 {type:'reading',label:'Reading comprehension',prompt:'Read this German phrase and write its English meaning:',source:e[0][0],expected:e[0][1],explain:'This phrase means “'+e[0][1]+'”. '+u.rule},
 {type:'dictation',label:'Listening dictation',prompt:'Listen and type exactly what you hear in German:',source:e[1][0],expected:e[1][0],explain:'You heard “'+e[1][0]+'”, meaning “'+e[1][1]+'”.'},
 {type:'translation',label:'Write in German',prompt:'Translate this into German:',source:e[2][1],expected:e[2][0],explain:'A model answer is “'+e[2][0]+'”. '+u.rule},
 {type:'grammar',label:'Explain the grammar',prompt:u.checkpoint.prompt,source:'Choose the best completion:',expected:u.checkpoint.options[u.checkpoint.answer],options:u.checkpoint.options,explain:u.checkpoint.why}
]}

 if(q.type==='dictation')body+=`<button onclick="speak(${JSON.stringify(q.source).replace(/"/g,'&quot;')})">🔊 Play audio</button><p class="muted">You can replay as often as needed.</p>`;
 else body+=`<div class="deep-hint">${safeText(q.source)}</div>`;
 if(q.options)body+=q.options.map((o,i)=>`<button class="secondary intensive-choice" onclick="intensiveCheck(${i})">${safeText(o)}</button>`).join('');

}
function intensiveCheck(choice){let r=intensive;if(!r||r.answers.length!==r.idx)return;let q=intensiveTasks(FULL_UNITS[r.id])[r.idx],actual=q.options?q.options[choice]:document.getElementById('intensiveEntry').value;

 document.getElementById('intensiveFeedback').innerHTML=explanation;
}
function intensiveNext(){if(!intensive)return;intensive.idx++;intensiveRender()}
function intensiveFinish(){let r=intensive,u=FULL_UNITS[r.id];ensureLearning();state.learning.intensiveScores??={};let prev=state.learning.intensiveScores[r.id];state.learning.intensiveScores[r.id]={last:r.correct,best:Math.max(prev?.best||0,r.correct),date:new Date().toISOString()};state.learning.intensiveMisses??=[];r.answers.forEach((ok,i)=>{if(!ok)state.learning.intensiveMisses.push({id:r.id,exercise:i,date:Date.now()})});state.learning.intensiveMisses=state.learning.intensiveMisses.slice(-300);save();app.innerHTML=illustratedHero('Extended practice complete',u.title,'village','hund.png')+`<section class="card"><h2>${r.correct}/4 correct</h2><p>You've practiced reading, listening, writing and grammar. Typed answers use strict matching; review the model responses for alternative wording.</p><button onclick="intensiveStart(${r.id})">Try again</button><button class="secondary" onclick="fullStudy(${r.id})">Review lesson</button><button class="secondary" onclick="fullMenu('${u.level}')">Back to units</button></section>`;intensive=null}
const priorFullStudyIntensive=fullStudy;
fullStudy=function(id){priorFullStudyIntensive(id);let target=app.querySelector('.card');if(target)target.insertAdjacentHTML('beforeend',`<div class="unit-explain"><h3>Extended skill practice</h3><p>Four additional activities: reading comprehension, listening dictation, German writing and grammar, each with an explanation.</p><button onclick="intensiveStart(${id})">Start extended practice →</button></div>`)};
const priorFullMenuIntensive=fullMenu;
fullMenu=function(level){priorFullMenuIntensive(level);let list=app.querySelectorAll('.unit-card');let lv=LEVELS.includes(level)?level:(state.learning?.placement?.recommended||'A1');let ids=FULL_UNITS.map((u,i)=>u.level===lv?i:null).filter(x=>x!==null);list.forEach((card,n)=>{let id=ids[n],score=state.learning?.intensiveScores?.[id];card.insertAdjacentHTML('beforeend',`<p class="muted">Extended practice: ${score?'best '+score.best+'/4':'not attempted'}</p><button class="secondary" onclick="intensiveStart(${id})">Extended practice →</button>`);});};
</script>

let pictureSession=null;
function pictureHome(){
 const saved=state.pictureProgress||{attempts:0,correct:0};
 app.innerHTML=illustratedHero('Picture practice','See it. Name it. Remember the article.','forest','katze.png')
 +`<section class="card"><h2>What do you see?</h2><p>Look at a picture and choose the German word or type it yourself. Practice the article with every noun.</p><p class="muted">${saved.attempts} answers · ${saved.correct} correct</p><div class="picture-tabs"><button onclick="pictureStart('choice')">Choose the word →</button><button onclick="pictureStart('type')">Type the word →</button></div><p class="muted">32 everyday objects · German nouns with der, die and das.</p></section>`;

function pictureStart(mode){
 const day=Math.floor(Date.now()/86400000),idx=state.pictureProgress?.attempts||0;
 const shuffled=[...PICTURE_WORDS.keys()].sort((a,b)=>((a*37+day*13)%97)-((b*37+day*13)%97));
 pictureSession={mode,queue:shuffled,index:0,correct:0,answered:false};

function pictureShow(){
 let s=pictureSession;if(!s)return pictureHome();
 if(s.index>=s.queue.length){app.innerHTML=illustratedHero('Nice work!','You finished this picture round.','village','hund.png')+`<section class="card"><h2>${s.correct} / ${s.queue.length} correct</h2><button onclick="pictureStart('${s.mode}')">Practice again →</button><button class="secondary" onclick="pictureHome()">Picture practice home</button></section>`;return}
 let id=s.queue[s.index],w=PICTURE_WORDS[id],choice=s.mode==='choice';

 window.scrollTo(0,0);

function pictureGrade(id,submitted){
 let s=pictureSession;if(!s||s.answered)return;
 let w=PICTURE_WORDS[id],norm=t=>t.toLocaleLowerCase('de-DE').trim().replace(/\s+/g,' ').normalize('NFC');
 let ok=norm(submitted)===norm(w[0]);s.answered=true;if(ok)s.correct++;
 state.pictureProgress??={attempts:0,correct:0};state.pictureProgress.attempts++;if(ok)state.pictureProgress.correct++;save();
 app.querySelectorAll('.picture-choices button,form button,.picture-input').forEach(b=>b.disabled=true);
 let feedback=document.getElementById('pictureFeedback');
 feedback.innerHTML=`<div class="picture-answer"><h3>${ok?'Richtig! Correct!':'Good try!'}</h3><p><strong>${safeText(w[0])}</strong> — ${safeText(w[1])}</p><p>The noun is <strong>${safeText(w[3])}</strong> + <strong>${safeText(w[4])}</strong>. Learn both together: ${safeText(w[0])}.</p>${!ok?`<p class="muted">You entered: ${safeText(submitted||'(blank)')}</p>`:''}<button class="secondary" onclick="speak('${w[0]}')">🔊 Hear the word</button><button onclick="pictureNext()">Next picture →</button></div>`;
}

const priorHomePictures=home;
home=function(){priorHomePictures();let anchor=app.querySelector('.lesson-grid')||app.querySelector('.card');if(anchor){let card=document.createElement('section');card.className='card';card.innerHTML=`<h3>Picture practice</h3><p>Learn German words by looking at pictures.</p><button onclick="pictureHome()">Try picture practice →</button>`;anchor.after(card)}};

<script>
const GAME_ITEMS=[
{en:'The cat sleeps on the bed.',de:'Die Katze schläft auf dem Bett.',tokens:['Die','Katze','schläft','auf','dem','Bett.']},
{en:'I drink water in the morning.',de:'Ich trinke morgens Wasser.',tokens:['Ich','trinke','morgens','Wasser.']},
{en:'We are going to the train station.',de:'Wir gehen zum Bahnhof.',tokens:['Wir','gehen','zum','Bahnhof.']},
{en:'My brother has a bicycle.',de:'Mein Bruder hat ein Fahrrad.',tokens:['Mein','Bruder','hat','ein','Fahrrad.']},
{en:'Tomorrow I am buying apples.',de:'Morgen kaufe ich Äpfel.',tokens:['Morgen','kaufe','ich','Äpfel.']},
{en:'She is reading a book.',de:'Sie liest ein Buch.',tokens:['Sie','liest','ein','Buch.']},
{en:'The children are playing outside.',de:'Die Kinder spielen draußen.',tokens:['Die','Kinder','spielen','draußen.']},
{en:'I am looking for my keys.',de:'Ich suche meine Schlüssel.',tokens:['Ich','suche','meine','Schlüssel.']},
{en:'We are eating bread and cheese.',de:'Wir essen Brot und Käse.',tokens:['Wir','essen','Brot','und','Käse.']},
{en:'The dog is sitting under the table.',de:'Der Hund sitzt unter dem Tisch.',tokens:['Der','Hund','sitzt','unter','dem','Tisch.']}
];
let gameSession=null;
function gameHub(){
 gameSession=null;
 let stats=state.gameStats||{played:0,correct:0};
 app.innerHTML=illustratedHero('Practice games','Short, varied activities to build German skills.','village','hund.png')+
 `<section class="card"><h2>Choose an activity</h2><p class="muted">${stats.played} answers · ${stats.correct} correct</p><div class="game-grid">
 <button onclick="gameStart('build')">🧩 Build a sentence<br><small>Tap words in order</small></button>
 <button onclick="gameStart('match')">🔗 Match the pairs<br><small>German ↔ English</small></button>
 <button onclick="gameStart('listen')">🔊 Listen and choose<br><small>Hear German phrases</small></button>
 <button onclick="pictureHome()">🖼️ Name the picture<br><small>Choose or type</small></button></div>
 <p class="muted">Exercises use different sentences from the lesson examples.</p></section>`;
 window.scrollTo(0,0);
}
function gameStart(mode){
 let seq=[...GAME_ITEMS.keys()];
 for(let i=seq.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}
 gameSession={mode,seq:seq.slice(0,6),idx:0,correct:0,answered:false,picked:[],matches:[],selected:null};
 gameRender();
}
function gameRender(){
 let g=gameSession;if(!g)return gameHub();
 if(g.idx>=g.seq.length){
  app.innerHTML=illustratedHero('Round complete!',`${g.correct} of ${g.seq.length} correct.`,'forest','katze.png')+
  `<section class="card"><h2>${g.correct}/${g.seq.length} correct</h2><button onclick="gameStart('${g.mode}')">Try another round →</button><button class="secondary" onclick="gameHub()">All practice games</button></section>`;window.scrollTo(0,0);return;
 }
 g.answered=false;g.picked=[];g.matches=[];g.selected=null;
 let item=GAME_ITEMS[g.seq[g.idx]],body='';
 if(g.mode==='build'){
 let order=[...item.tokens.keys()].sort(()=>Math.random()-.5);
 g.order=order;
 body=`<p>Build this sentence in German:</p><h3>${safeText(item.en)}</h3><div id="gameBuilt" class="game-built">Tap the words below ↓</div><div id="gameBank" class="game-wordbank">${order.map((n,i)=>`<button class="secondary" id="gb${i}" onclick="gamePick(${i})">${safeText(item.tokens[n])}</button>`).join('')}</div><button class="secondary" onclick="gameRender()">Start over</button><button onclick="gameCheckBuild()">Check sentence →</button>`;
 }else if(g.mode==='listen'){
 let other=[...GAME_ITEMS.keys()].filter(i=>i!==g.seq[g.idx]).sort(()=>Math.random()-.5).slice(0,3);
 let choices=[g.seq[g.idx],...other].sort(()=>Math.random()-.5);g.choices=choices;
 body=`<h3>What do you hear?</h3><button onclick="speak(${JSON.stringify(item.de).replace(/"/g,'&quot;')})">🔊 Play German audio</button><div class="picture-choices">${choices.map((i,n)=>`<button class="secondary" onclick="gameChoose(${n})">${safeText(GAME_ITEMS[i].en)}</button>`).join('')}</div>`;
 }else{
 let pairA=PICTURE_WORDS.slice((g.seq[g.idx]*3)%24,(g.seq[g.idx]*3)%24+4);
 g.pairs=pairA;g.left=pairA.map((w,i)=>i).sort(()=>Math.random()-.5);g.right=pairA.map((w,i)=>i).sort(()=>Math.random()-.5);
 body=`<p>Match each German noun to its English meaning.</p><p id="gameMatched">0 / 4 pairs matched</p><div class="game-grid"><div>${g.left.map(i=>`<button class="secondary" id="gl${i}" onclick="gameMatch('l',${i})">${safeText(pairA[i][0])}</button>`).join('')}</div><div>${g.right.map(i=>`<button class="secondary" id="gr${i}" onclick="gameMatch('r',${i})">${safeText(pairA[i][1])}</button>`).join('')}</div></div>`;
 }
 app.innerHTML=`<section class="card"><p class="muted">${g.mode==='build'?'Sentence builder':g.mode==='listen'?'Listening challenge':'Word matching'} · ${g.idx+1} of ${g.seq.length}</p><div class="game-progress"><div style="width:${g.idx/g.seq.length*100}%"></div></div>${body}<div id="gameFeedback" aria-live="polite"></div></section>`;
 if(g.mode==='listen')speak(item.de);
 window.scrollTo(0,0);
}
function gamePick(n){let g=gameSession;if(g.answered||g.picked.includes(n))return;g.picked.push(n);document.getElementById('gb'+n).disabled=true;document.getElementById('gameBuilt').textContent=g.picked.map(i=>GAME_ITEMS[g.seq[g.idx]].tokens[g.order[i]]).join(' ')}
function gameCheckBuild(){let g=gameSession;if(g.answered)return;let item=GAME_ITEMS[g.seq[g.idx]],guess=g.picked.map(i=>item.tokens[g.order[i]]).join(' ');if(g.picked.length!==item.tokens.length){document.getElementById('gameFeedback').textContent='Use all the words first.';return}gameMark(guess===item.de,item.de)}
function gameChoose(n){let g=gameSession;if(g.answered)return;let item=GAME_ITEMS[g.seq[g.idx]];gameMark(g.choices[n]===g.seq[g.idx],item.de+' — '+item.en)}

 else{document.getElementById('gameFeedback').textContent='Not a match. Try another pair.'}
}
function gameMark(ok,answer){
 let g=gameSession;if(!g||g.answered)return;g.answered=true;if(ok)g.correct++;
 state.gameStats??={played:0,correct:0};state.gameStats.played++;if(ok)state.gameStats.correct++;save();

 document.getElementById('gameFeedback').innerHTML=`<div class="game-feedback"><strong>${ok?'Correct!':'Not quite.'}</strong><p>${safeText(answer)}</p><button onclick="gameNext()">Next →</button></div>`;
}
function gameNext(){if(!gameSession)return;gameSession.idx++;gameRender()}
const gameHome=home;
home=function(){gameHome();let target=app.querySelector('.card');if(target){let b=document.createElement('section');b.className='card';b.innerHTML='<h3>Practice games</h3><p>Build sentences, match words and practice listening.</p><button onclick="gameHub()">Play practice games →</button>';target.after(b)}};
let gameMenu=document.getElementById('sideMenu');if(gameMenu){let b=document.createElement('button');b.textContent='🧩 Practice games';b.onclick=gameHub;gameMenu.appendChild(b)}
// Reuse the app's persistent top back button for the new screens.
const priorFixGameBack=window.setInterval(()=>{

 }
},300);
</script>
